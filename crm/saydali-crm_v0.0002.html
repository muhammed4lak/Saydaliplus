/* ==========================================================================
   7. HOME
   Re-pointed at operations. The old dashboard measured a sales pipeline; the
   module list is now users, orders and master data, so the numbers are the
   ones an operator acts on before lunch.
   ========================================================================== */

function kpi(label, value, delta, spark, onClick) {
  const d = delta ? '<div class="kpi-d ' + delta.cls + '">' + (delta.ico ? icon(delta.ico) : '') +
    esc(delta.text) + '</div>' : '';
  const inner = '<div class="kpi-k">' + esc(label) + '</div>' +
    '<div class="kpi-v">' + esc(value) + '</div>' + d +
    (spark ? sparkline(spark) : '');
  return onClick
    ? '<button class="kpi as-link" onclick="' + onClick + '">' + inner + '</button>'
    : '<div class="kpi">' + inner + '</div>';
}

function homeView() {
  const orders = DATA.orders;
  const today = orders.filter(isToday);
  const open = orders.filter(o => o.status === 'open');
  const unclaimed = orders.filter(isUnclaimed);
  const shifts = orders.filter(o => o.type === 'shift');
  const completed = shifts.filter(o => o.status === 'completed').length;
  const decided = shifts.filter(o => ['completed','cancelled'].includes(o.status)).length;
  const fill = decided ? Math.round(completed / decided * 100) : null;
  const pendingUsers = DATA.users.filter(u => u.verification === 'pending');
  const activePh = DATA.pharmacies.filter(isActivePharmacy);
  const noMatch = DATA.users.filter(u => u.type === 'pharmacist' && syndicateMatch(u).key !== 'matched');
  const dormant = DATA.pharmacies.filter(isDormant);
  const noBrands = DATA.drugs.filter(d => brandsOf(d.sci).length === 0);

  const daily = ORDERS_PER_DAY.map(x => x.n);

  const kpis = '<div class="kpis">' +
    kpi(t('k.ordersToday'), fmt(today.length), null, daily, "goView('orders','today')") +
    kpi(t('k.openNow'), fmt(open.length), null, null, "goView('orders','open')") +
    kpi(t('k.fillRateK'), fill === null ? '—' : pct(fill),
        { cls:'kpi-up', ico:'up', text:'+4% ' + t('k.vsLast') }) +
    kpi(t('k.activePh'), fmt(activePh.length), null, null, "goView('pharmacies','all')") +
    /* Two tiles that are calls to action rather than scores. Status colour plus
       an icon plus a word — never colour alone. */
    kpi(t('k.unclaimed'), fmt(unclaimed.length),
        unclaimed.length ? { cls:'kpi-down', ico:'alert', text:t('k.needsCall') } : null,
        null, "goView('orders','unclaimed')") +
    kpi(t('k.pendingVerif'), fmt(pendingUsers.length),
        pendingUsers.length ? { cls:'kpi-down', ico:'alert', text:t('k.needsCall') } : null,
        null, "goView('users','pending')") +
  '</div>';

  const trend = ORDERS_PER_DAY.map(x => {
    const d = new Date(x.d + 'T00:00:00');
    return { n:x.n, label:fmtDate(x.d), short:String(d.getDate()) };
  });

  /* What is stuck, in one panel, each row a link to the view that holds it.
     A dashboard that reports a problem without a route to it is a poster. */
  const items = [
    { n:unclaimed.length,    key:'at.unclaimed',    go:"goView('orders','unclaimed')",  tone:'chip-bad' },
    { n:pendingUsers.length, key:'at.pendingUsers', go:"goView('users','pending')",     tone:'chip-warn' },
    { n:dormant.length,      key:'at.dormantPh',    go:"goView('pharmacies','dormant')",tone:'chip-bad' },
    { n:noMatch.length,      key:'at.noMatch',      go:"goView('users','noMatch')",     tone:'chip-warn' },
    { n:noBrands.length,     key:'at.noBrands',     go:"goView('drugs','noBrands')",    tone:'chip-mute' }
  ].filter(x => x.n > 0);

  const attention = '<section class="panel">' +
    '<div class="panel-h">' + icon('alert') + esc(t('ch.attention')) +
      '<span class="spacer"></span><span class="chip chip-mute figure">' + fmt(items.length) + '</span></div>' +
    (items.length
      ? '<div class="panel-b flush">' + items.map(x =>
          '<button class="task-row" style="width:100%;text-align:start;" onclick="' + x.go + '">' +
            '<span class="chip ' + x.tone + ' figure">' + fmt(x.n) + '</span>' +
            '<div style="flex:1;min-width:0;"><div class="task-t">' + esc(t(x.key, {n:x.n})) + '</div></div>' +
            icon('chevron', 'go-chevron') + '</button>').join('') + '</div>'
      : '<div class="empty" style="padding:26px;font-size:12.5px;">' + esc(t('ch.nothingUp')) + '</div>') +
  '</section>';

  const myTasks = DATA.tasks.filter(x => x.owner === ME && !x.done && x.due <= ISO_TODAY)
    .sort((a, b) => a.due.localeCompare(b.due));
  const tasksPanel = '<section class="panel">' +
    '<div class="panel-h">' + icon('check-circle') + esc(t('ch.tasks')) +
      '<span class="spacer"></span><span class="chip chip-mute figure">' + fmt(myTasks.length) + '</span></div>' +
    (myTasks.length
      ? '<div class="panel-b flush">' + myTasks.map(x =>
          '<div class="task-row"><input type="checkbox" onchange="toggleTask(' + attr(x.id) + ')" style="margin-top:2px;">' +
            '<div style="flex:1;min-width:0;"><div class="task-t">' + esc(L(x.subject)) + '</div>' +
            '<div class="task-m">' + priorityChip(x.priority) +
              '<span' + (x.due < ISO_TODAY ? ' style="color:var(--critical);font-weight:600"' : '') + '>' +
              esc(relDays(x.due)) + '</span>' +
              (x.related ? '<span>·</span><button class="cell-link" style="font-size:11px;" onclick="openRecord(' +
                attr(x.related.kind) + ',' + attr(x.related.id) + ')">' +
                esc(recordName(x.related.kind, x.related.id)) + '</button>' : '') +
            '</div></div></div>').join('') + '</div>'
      : '<div class="empty" style="padding:26px;font-size:12.5px;">' + esc(t('ch.noTasks')) + '</div>') +
  '</section>';

  const recent = DATA.activity.slice().sort((a, b) => b.when.localeCompare(a.when)).slice(0, 6);
  const recentPanel = '<section class="panel">' +
    '<div class="panel-h">' + icon('clock') + esc(t('ch.recent')) + '</div>' +
    '<div class="panel-b flush"><div class="timeline">' + recent.map(e =>
      '<div class="tl-item"><span class="tl-dot">' +
        icon({ call:'phone', visit:'pin', note:'note' }[e.type] || 'note') + '</span>' +
        '<div style="flex:1;min-width:0;">' +
          '<button class="cell-link" style="font-size:12px;" onclick="openRecord(' + attr(e.kind) + ',' + attr(e.id2) + ')">' +
            esc(recordName(e.kind, e.id2)) + '</button>' +
          '<div class="tl-title" style="font-size:12px;color:var(--ink-soft);margin-top:2px;">' + esc(L(e.text)) + '</div>' +
          '<div class="tl-meta">' + esc(L(USERS[e.owner].name)) + ' · ' + esc(relDays(e.when)) + '</div>' +
        '</div></div>').join('') + '</div></div></section>';

  const byType = ORDER_TYPES.map(ty => ({
    label:t('ot.' + ty), n:orders.filter(o => o.type === ty).length
  }));

  return '<div class="dash">' + kpis +
    '<div class="charts c32">' +
      trendChart(trend, { title:t('ch.orders'), sub:t('ch.ordersSub'), unit:t('ch.orderCount'), id:'orders-trend' }) +
      funnelChart(orderStatusRows(), { title:t('ch.byStatus'), sub:t('ch.byStatusSub'), id:'by-status' }) +
    '</div>' +
    '<div class="charts c2">' + attention + tasksPanel + '</div>' +
    '<div class="charts c2">' +
      barChart(byType, { title:t('ch.byType'), sub:t('ch.byStatusSub'), id:'by-type',
                         catCol:t('c.orderType'), unit:t('ch.orderCount') }) +
      recentPanel +
    '</div>' +
  '</div>';
}

/* ==========================================================================
   13. CSV IMPORT
   Two things use it: the drug list, which arrives from a company as a
   spreadsheet, and the Syndicate roster, which arrives from the Syndicate the
   same way. Both are bulk, both are somebody else's file, and both will have
   mistakes in them — so the import parses, validates, and shows what it WOULD
   do, and writes nothing until that preview has been read.
   ========================================================================== */

/* A real CSV parser rather than split(','): a drug note containing a comma, or
   a quoted field with a line break in it, is the normal case in a file a
   pharmacist typed, and splitting on commas silently corrupts those rows. */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  const s = String(text).replace(/\r\n?/g, '\n');

  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (quoted) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; }   // "" is a literal quote
        else quoted = false;
      } else field += c;
    } else if (c === '"') { quoted = true; }
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

const splitList = v => String(v || '').split(/[|;]/).map(x => x.trim()).filter(Boolean);

/* Each importer declares its key column, the columns it needs, and how one row
   becomes a record. Validation returns a message rather than throwing, so one
   bad row is one skipped row and not a failed file. */
const IMPORTERS = {
  drugs: {
    module:'drugs',
    key:'scientific_name',
    required:['scientific_name'],
    columns:['scientific_name','arabic_name','atc','form','doses','notes','interactions','contraindications'],
    sample:[
      ['scientific_name','arabic_name','atc','form','doses','notes','interactions','contraindications'],
      ['Ibuprofen','إيبوبروفين','M01AE01','tablet','200 mg|400 mg|600 mg',
       'Take with food.','Warfarin:warning:May raise bleeding risk|Lisinopril:warning:Blunts the antihypertensive effect',
       'Active peptic ulcer|Third trimester of pregnancy'],
      ['Cetirizine','سيتيريزين','R06AE07','tablet','5 mg|10 mg','Non-sedating at standard doses.','','Severe renal impairment']
    ],
    parse(cells, head) {
      const g = k => String(cells[head.indexOf(k)] || '').trim();
      const sci = g('scientific_name');
      if (!sci) return { error:t('imp.missingKey') };

      const form = (g('form') || 'tablet').toLowerCase();
      const FORMS_OK = ['tablet','capsule','syrup','injection','cream'];

      const interactions = splitList(g('interactions')).map(x => {
        const [w, sev, ...rest] = x.split(':');
        const severity = ['warning','serious','critical'].includes((sev || '').trim())
          ? sev.trim() : 'warning';
        const note = rest.join(':').trim();
        return { with:(w || '').trim(), severity, note:{ ar:note, en:note } };
      }).filter(i => i.with);

      const rec = {
        sci,
        ar: g('arabic_name') || sci,
        atc: g('atc'),
        form: FORMS_OK.includes(form) ? form : 'tablet',
        doses: splitList(g('doses')),
        notes: { ar:g('notes'), en:g('notes') },
        interactions,
        contraindications: splitList(g('contraindications')).map(c => ({ ar:c, en:c }))
      };
      const existing = DATA.drugs.find(d => d.sci.toLowerCase() === sci.toLowerCase());
      return { rec, key:sci, mode: existing ? 'update' : 'new' };
    },
    apply(p) {
      const i = DATA.drugs.findIndex(d => d.sci.toLowerCase() === p.key.toLowerCase());
      if (i >= 0) Object.assign(DATA.drugs[i], p.rec); else DATA.drugs.push(p.rec);
    }
  },

  syndicate: {
    module:'syndicate',
    key:'syndicate_no',
    required:['syndicate_no','name'],
    columns:['syndicate_no','name','graduation_year','status'],
    sample:[
      ['syndicate_no','name','graduation_year','status'],
      ['IQ-PH-015001','سيف الدين محمد الجبوري','2024','active'],
      ['IQ-PH-015002','دعاء عبد الكريم الزاملي','2024','active']
    ],
    parse(cells, head) {
      const g = k => String(cells[head.indexOf(k)] || '').trim();
      const no = g('syndicate_no');
      const name = g('name');
      if (!no) return { error:t('imp.missingKey') };
      if (!name) return { error:t('n.required') };
      const year = parseInt(g('graduation_year'), 10);
      const rec = {
        no, name:{ ar:name, en:name },
        gradYear: Number.isFinite(year) ? year : null,
        status: g('status').toLowerCase() === 'suspended' ? 'suspended' : 'active',
        batch: ISO_TODAY
      };
      const existing = DATA.syndicate.find(r => r.no.toLowerCase() === no.toLowerCase());
      return { rec, key:no, mode: existing ? 'update' : 'new' };
    },
    apply(p) {
      const i = DATA.syndicate.findIndex(r => r.no.toLowerCase() === p.key.toLowerCase());
      if (i >= 0) Object.assign(DATA.syndicate[i], p.rec); else DATA.syndicate.push(p.rec);
    }
  }
};

function openImport(which) {
  S.modal = { kind:'import', which, text:'', parsed:null };
  renderModal();
}

function importTemplate(which) {
  const I = IMPORTERS[which];
  const csv = I.sample.map(r => r.map(c =>
    /[",\n]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(',')).join('\n');
  // A local file can hand the browser a download; an artifact cannot. This one
  // is opened from disk, so the anchor works.
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent(csv);
  a.download = 'saydali-' + which + '-template.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function readImportFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    S.modal.text = String(r.result || '');
    S.modal.parsed = null;
    renderModal();
    parseImport();
  };
  r.readAsText(f);
}

function setImportText(v) { S.modal.text = v; S.modal.parsed = null; }

function parseImport() {
  const I = IMPORTERS[S.modal.which];
  const text = (S.modal.text || '').trim();
  if (!text) { S.modal.parsed = { fatal:t('imp.noFile') }; renderModal(); return; }

  const rows = parseCSV(text);
  const head = (rows[0] || []).map(h => String(h).trim().toLowerCase().replace(/^﻿/, ''));
  const missing = I.required.filter(c => !head.includes(c));
  if (missing.length) {
    S.modal.parsed = { fatal:t('imp.badHeader', { cols:missing.join(', ') }) };
    renderModal(); return;
  }

  const seen = new Set();
  const items = rows.slice(1).map((cells, i) => {
    const out = I.parse(cells, head);
    if (out.error) return { line:i + 2, mode:'error', message:out.error };
    // A file that lists the same key twice is a mistake worth surfacing, not
    // something to silently resolve by letting the last row win.
    const k = String(out.key).toLowerCase();
    if (seen.has(k)) return { line:i + 2, mode:'error', message:'Duplicated in the file: ' + out.key };
    seen.add(k);
    return { line:i + 2, mode:out.mode, key:out.key, rec:out.rec };
  });

  S.modal.parsed = {
    items,
    counts:{
      new:    items.filter(x => x.mode === 'new').length,
      update: items.filter(x => x.mode === 'update').length,
      error:  items.filter(x => x.mode === 'error').length
    }
  };
  renderModal();
}

function applyImport() {
  const I = IMPORTERS[S.modal.which];
  const good = (S.modal.parsed.items || []).filter(x => x.mode !== 'error');
  good.forEach(p => I.apply(p));
  const n = good.length;
  S.modal = null;
  toast(t('imp.done', { n }));
  render();
}

function importModal() {
  const I = IMPORTERS[S.modal.which];
  const p = S.modal.parsed;

  const preview = !p ? '' : p.fatal
    ? '<div class="imp-fatal">' + icon('alert') + esc(p.fatal) + '</div>'
    : '<div class="imp-summary">' +
        '<span class="chip chip-good">' + esc(t('imp.new')) + ' ' + fmt(p.counts.new) + '</span>' +
        '<span class="chip chip-info">' + esc(t('imp.update')) + ' ' + fmt(p.counts.update) + '</span>' +
        '<span class="chip ' + (p.counts.error ? 'chip-bad' : 'chip-mute') + '">' +
          esc(t('imp.error')) + ' ' + fmt(p.counts.error) + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<span class="inline-note">' + esc(t('imp.rowsFound', { n:p.items.length })) + '</span>' +
      '</div>' +
      '<div class="imp-rows">' + p.items.map(x =>
        '<div class="imp-row ' + x.mode + '">' +
          '<span class="imp-line figure">' + x.line + '</span>' +
          '<span class="chip ' + (x.mode === 'new' ? 'chip-good' : x.mode === 'update' ? 'chip-info' : 'chip-bad') + '">' +
            esc(t('imp.' + x.mode)) + '</span>' +
          '<span class="imp-key" dir="ltr">' + esc(x.key || '') + '</span>' +
          (x.message ? '<span class="imp-msg">' + esc(x.message) + '</span>' : '') +
        '</div>').join('') + '</div>' +
      (p.counts.error ? '<p class="inline-note">' + esc(t('imp.errorsBlock')) + '</p>' : '');

  const applicable = p && !p.fatal ? p.counts.new + p.counts.update : 0;

  return '<div class="modal-h"><span class="modal-t">' + esc(t('imp.title')) + ' — ' + esc(t('mod.' + I.module)) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b">' +
      '<div class="imp-head">' +
        '<label class="btn"><input type="file" accept=".csv,text/csv" style="display:none" onchange="readImportFile(this)">' +
          icon('upload') + esc(t('imp.pick')) + '</label>' +
        '<button class="btn" onclick="importTemplate(' + attr(S.modal.which) + ')">' + icon('download') +
          esc(t('imp.template')) + '</button>' +
      '</div>' +
      '<div class="fld" style="margin-top:12px;"><label>' + esc(t('imp.or')) + '</label>' +
        '<textarea id="imp-text" dir="ltr" class="figure" style="min-height:110px;font-size:11.5px;" ' +
          'oninput="setImportText(this.value)" placeholder="' + esc(I.columns.join(',')) + '">' +
          esc(S.modal.text || '') + '</textarea>' +
        '<div class="hint">' + esc(I.columns.join(' · ')) + '</div></div>' +
      '<button class="btn" onclick="parseImport()">' + icon('check-circle') + esc(t('imp.parse')) + '</button>' +
      preview +
      '<p class="inline-note" style="margin-top:12px;">' + esc(t('imp.previewNote')) + '</p>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn primary" onclick="applyImport()"' + (applicable ? '' : ' disabled') + '>' +
        esc(t('imp.apply', { n:applicable })) + '</button></div>';
}

/* ==========================================================================
   14. THE QUERY ENGINE
   Reports are SQL, and the dashboard is built from reports. That is the whole
   design: one place where a number is defined, and a dashboard that cannot
   invent a figure the reports module could not reproduce.

   This runs a SUBSET of SQL over the in-memory tables. What it supports:

     SELECT  col | tbl.col | * | COUNT(*) | COUNT|SUM|AVG|MIN|MAX(col) [AS alias]
     FROM    table [alias]
     JOIN    table [alias] ON a.col = b.col        (inner, equality only)
     WHERE   comparisons joined by AND / OR, with ( ) grouping
             =  !=  <>  <  <=  >  >=  IN (...)  LIKE 'x%'  IS [NOT] NULL
     GROUP BY col[, col]
     ORDER BY col|alias [ASC|DESC]
     LIMIT   n

   What it does not: subqueries, UNION, HAVING, OUTER JOIN, DISTINCT,
   expressions in SELECT. It refuses those by name rather than guessing —
   an engine that quietly ignores half a clause is worse than one that cannot
   run it, because the number comes out wrong and looks right.
   ========================================================================== */

/* The tables a report can read. Flattened views of DATA: bilingual fields split
   into plain columns so SQL sees scalars, and the derived facts the team
   actually filters on (dormant, unclaimed, roster match) are columns here
   rather than something every query has to recompute. */
function sqlTables() {
  return {
    users: DATA.users.map(u => ({
      id:u.id, name:L(u.name), name_ar:AR(u.name), type:u.type, verification:u.verification,

    })),

    })),

    })),

      city:L(c.city), reg:c.reg, status:c.status, owner:c.owner,

    })),

    })),

    })),

    }))
  };
}

class SqlError extends Error {}

function sqlTokens(text) {
  const out = [];
  const re = /\s+|--[^\n]*|('(?:[^']|'')*')|([A-Za-z_][A-Za-z0-9_.]*)|(\d+\.?\d*)|(<=|>=|<>|!=|=|<|>|\(|\)|,|\*)/g;
  let m, last = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index !== last) throw new SqlError('Unexpected character at ' + last + ': ' + text.slice(last, m.index));
    last = re.lastIndex;
    if (m[1] !== undefined) out.push({ t:'str', v:m[1].slice(1, -1).split("''").join("'") });
    else if (m[2] !== undefined) out.push({ t:'word', v:m[2] });
    else if (m[3] !== undefined) out.push({ t:'num', v:Number(m[3]) });
    else if (m[4] !== undefined) out.push({ t:'op', v:m[4] });
  }
  if (last !== text.length) throw new SqlError('Unexpected character at ' + last);
  return out;
}

const SQL_KEYWORDS = ['SELECT','FROM','JOIN','INNER','ON','WHERE','GROUP','ORDER','BY','LIMIT',
                      'AND','OR','NOT','IN','LIKE','IS','NULL','AS','ASC','DESC'];
const SQL_REFUSED = { UNION:'UNION', HAVING:'HAVING', DISTINCT:'DISTINCT',
                      LEFT:'OUTER JOIN', RIGHT:'OUTER JOIN', FULL:'OUTER JOIN' };

function runSQL(text) {
  const raw = String(text || '').trim().replace(/;+\s*$/, '');
  if (!raw) throw new SqlError('Empty query.');

  const upper = raw.toUpperCase();
  for (const k in SQL_REFUSED) {
    if (new RegExp('\\b' + k + '\\b').test(upper))
      throw new SqlError('Not supported: ' + SQL_REFUSED[k] + '. This engine runs a documented subset.');
  }
  if (/\(\s*SELECT\b/i.test(raw)) throw new SqlError('Not supported: subqueries.');
  if (!/^SELECT\b/i.test(raw)) throw new SqlError('Only SELECT is supported. Reports read; they never write.');

  const toks = sqlTokens(raw);
  let i = 0;
  const peek = () => toks[i];
  const isKw = k => peek() && peek().t === 'word' && peek().v.toUpperCase() === k;
  const eat = k => { if (!isKw(k)) throw new SqlError('Expected ' + k); return toks[i++]; };
  const eatOp = o => { if (!(peek() && peek().t === 'op' && peek().v === o)) throw new SqlError('Expected ' + o); return toks[i++]; };
  const maybe = k => { if (isKw(k)) { i++; return true; } return false; };
  const isPlainWord = () => peek() && peek().t === 'word' && !SQL_KEYWORDS.includes(peek().v.toUpperCase());

  function inList(ref, neg) {
    eatOp('(');
    const vals = [];
    do { const v = toks[i++]; if (!v || v.t === 'op') throw new SqlError('Expected a value inside IN ( )'); vals.push(v.v); }
    while (peek() && peek().t === 'op' && peek().v === ',' && ++i);
    eatOp(')');
    return { in:ref, vals, neg };
  }
  function parseCmp() {
    if (peek() && peek().t === 'op' && peek().v === '(') { i++; const e = parseOr(); eatOp(')'); return e; }
    const lhs = toks[i++];
    if (!lhs) throw new SqlError('Unfinished WHERE clause');
    if (isKw('IS')) { i++; const neg = maybe('NOT'); eat('NULL'); return { isNull:lhs.v, neg }; }
    if (isKw('NOT') && toks[i + 1] && String(toks[i + 1].v).toUpperCase() === 'IN') { i += 2; return inList(lhs.v, true); }
    if (isKw('IN')) { i++; return inList(lhs.v, false); }
    if (isKw('LIKE')) { i++; const p = toks[i++];
      if (!p || p.t !== 'str') throw new SqlError('LIKE needs a quoted pattern');
      return { like:lhs.v, pattern:p.v }; }
    const op = toks[i++];
    if (!op || op.t !== 'op') throw new SqlError('Expected a comparison after ' + lhs.v);
    const rhs = toks[i++];
    if (!rhs) throw new SqlError('Expected a value after ' + op.v);
    return { cmp:op.v, lhs, rhs };
  }
  function parseAnd() { let l = parseCmp(); while (isKw('AND')) { i++; l = { and:[l, parseCmp()] }; } return l; }
  function parseOr()  { let l = parseAnd(); while (isKw('OR'))  { i++; l = { or:[l, parseAnd()] }; } return l; }

  eat('SELECT');
  const cols = [];
  do {
    if (peek() && peek().t === 'op' && peek().v === '*') { i++; cols.push({ star:true }); }
    else {
      const first = peek();
      if (!first || first.t !== 'word') throw new SqlError('Expected a column name after SELECT');
      const AGGS = ['COUNT','SUM','AVG','MIN','MAX'];
      let col;
      if (AGGS.includes(first.v.toUpperCase()) && toks[i + 1] && toks[i + 1].v === '(') {
        const fn = first.v.toUpperCase(); i += 2;
        let arg;
        if (peek() && peek().t === 'op' && peek().v === '*') { arg = '*'; i++; }
        else { if (!peek() || peek().t !== 'word') throw new SqlError('Expected a column inside ' + fn + '()'); arg = toks[i++].v; }
        eatOp(')');
        col = { agg:fn, arg, name:fn.toLowerCase() + '_' + String(arg).replace(/[^A-Za-z0-9_]/g, '') };
      } else { i++; col = { ref:first.v, name:first.v.includes('.') ? first.v.split('.')[1] : first.v }; }
      if (maybe('AS')) {
        if (!peek() || peek().t !== 'word') throw new SqlError('Expected an alias after AS');
        col.name = toks[i++].v;
      }
      cols.push(col);
    }
  } while (peek() && peek().t === 'op' && peek().v === ',' && ++i);

  eat('FROM');
  if (!isPlainWord()) throw new SqlError('Expected a table name after FROM');
  const base = { table:toks[i++].v };
  base.alias = isPlainWord() ? toks[i++].v : base.table;

  const joins = [];
  while (isKw('JOIN') || isKw('INNER')) {
    if (isKw('INNER')) i++;
    eat('JOIN');
    if (!isPlainWord()) throw new SqlError('Expected a table name after JOIN');
    const j = { table:toks[i++].v };
    j.alias = isPlainWord() ? toks[i++].v : j.table;
    eat('ON');
    const lhs = toks[i++], op = toks[i++], rhs = toks[i++];
    if (!lhs || !op || !rhs || op.v !== '=')
      throw new SqlError('JOIN ... ON supports equality only, as in ON a.id = b.a_id');
    j.on = [lhs.v, rhs.v];
    joins.push(j);
  }

  let where = null;
  if (maybe('WHERE')) where = parseOr();

  const groupBy = [];
  if (isKw('GROUP')) { i++; eat('BY');
    do { if (!peek() || peek().t !== 'word') throw new SqlError('Expected a column after GROUP BY');
         groupBy.push(toks[i++].v); }
    while (peek() && peek().t === 'op' && peek().v === ',' && ++i); }

  let orderBy = null;
  if (isKw('ORDER')) { i++; eat('BY');
    if (!peek() || peek().t !== 'word') throw new SqlError('Expected a column after ORDER BY');
    orderBy = { col:toks[i++].v, dir:'asc' };
    if (maybe('DESC')) orderBy.dir = 'desc'; else maybe('ASC'); }

  let limit = null;
  if (maybe('LIMIT')) {
    if (!peek() || peek().t !== 'num') throw new SqlError('Expected a number after LIMIT');
    limit = toks[i++].v; }

  if (i < toks.length) throw new SqlError('Unexpected trailing input: ' + toks.slice(i).map(x => x.v).join(' '));

  const tables = sqlTables();
  const src = tables[base.table];
  if (!src) throw new SqlError('No such table: ' + base.table + '. Tables: ' + Object.keys(tables).join(', '));

  /* Rows are namespaced by alias so a.col and b.col stay distinct; a bare
     column name resolves against whichever table actually has it. */
  let rows = src.map(r => { const o = {}; o[base.alias] = r; return o; });
  for (const j of joins) {
    const other = tables[j.table];
    if (!other) throw new SqlError('No such table: ' + j.table);
    const out = [];
    for (const row of rows) for (const o of other) {
      const cand = Object.assign({}, row); cand[j.alias] = o;
      if (String(resolve(cand, j.on[0])) === String(resolve(cand, j.on[1]))) out.push(cand);
    }
    rows = out;
  }

  function resolve(row, ref) {
    const s = String(ref);
    if (s.indexOf('.') >= 0) { const parts = s.split('.'); return row[parts[0]] ? row[parts[0]][parts[1]] : undefined; }
    for (const a of Object.keys(row)) if (row[a] && s in row[a]) return row[a][s];
    return undefined;
  }
  const num = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
  function valueOf(row, tok) {
    if (tok.t === 'str' || tok.t === 'num') return tok.v;
    const up = String(tok.v).toUpperCase();
    if (up === 'NULL') return null;
    if (up === 'TRUE') return 1;
    if (up === 'FALSE') return 0;
    return resolve(row, tok.v);
  }
  function test(row, e) {
    if (!e) return true;
    if (e.and) return test(row, e.and[0]) && test(row, e.and[1]);
    if (e.or) return test(row, e.or[0]) || test(row, e.or[1]);
    if (e.isNull) { const v = resolve(row, e.isNull);
      const isN = (v === null || v === undefined); return e.neg ? !isN : isN; }
    if (e.in) { const v = resolve(row, e.in);
      const hit = e.vals.some(x => String(x) === String(v)); return e.neg ? !hit : hit; }
    if (e.like) {
      const v = resolve(row, e.like);
      if (v === null || v === undefined) return false;
      const rx = new RegExp('^' + String(e.pattern)
        .replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i');
      return rx.test(String(v));
    }
    const a = valueOf(row, e.lhs), b = valueOf(row, e.rhs);
    switch (e.cmp) {
      case '=': return String(a) === String(b);
      case '!=': case '<>': return String(a) !== String(b);
      case '<': return num(a) < num(b);
      case '<=': return num(a) <= num(b);
      case '>': return num(a) > num(b);
      case '>=': return num(a) >= num(b);
      default: throw new SqlError('Unsupported comparison: ' + e.cmp);
    }
  }

  rows = rows.filter(r => test(r, where));

  /* An aggregate with no GROUP BY is one row over everything — what SQL does,
     and what a KPI tile wants. */
  const hasAgg = cols.some(c => c.agg);
  let groups;
  if (groupBy.length) {
    const map = new Map();
    for (const r of rows) {
      const key = groupBy.map(g => String(resolve(r, g))).join('\u0000');
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    }
    groups = Array.from(map.values());
  } else if (hasAgg) { groups = [rows]; }
  else { groups = rows.map(r => [r]); }

  function agg(fn, arg, bucket) {
    if (fn === 'COUNT') return arg === '*' ? bucket.length
      : bucket.filter(r => { const v = resolve(r, arg); return v !== null && v !== undefined; }).length;
    const nums = bucket.map(r => Number(resolve(r, arg))).filter(n => Number.isFinite(n));
    if (!nums.length) return null;
    if (fn === 'SUM') return nums.reduce((a, b) => a + b, 0);
    if (fn === 'AVG') return Math.round(nums.reduce((a, b) => a + b, 0) / nums.length * 100) / 100;
    if (fn === 'MIN') return Math.min.apply(null, nums);
    if (fn === 'MAX') return Math.max.apply(null, nums);
    throw new SqlError('Unsupported function: ' + fn);
  }

  let out = groups.map(bucket => {
    const first = bucket[0];
    const row = {};
    for (const c of cols) {
      if (c.star) { Object.keys(first).forEach(a => Object.assign(row, first[a])); continue; }
      row[c.name] = c.agg ? agg(c.agg, c.arg, bucket) : resolve(first, c.ref);
    }
    return row;
  });

  const columns = out.length ? Object.keys(out[0]) : cols.filter(c => !c.star).map(c => c.name);

  if (orderBy) {
    const k = orderBy.col.indexOf('.') >= 0 ? orderBy.col.split('.')[1] : orderBy.col;
    out.sort((x, y) => {
      const a = x[k], b = y[k];
      const c = (typeof a === 'number' && typeof b === 'number')
        ? a - b : String(a == null ? '' : a).localeCompare(String(b == null ? '' : b));
      return orderBy.dir === 'desc' ? -c : c;
    });
  }
  if (limit !== null) out = out.slice(0, limit);

  return { columns, rows:out };
}

/* ==========================================================================
   15. REPORTS
   A report is a name, a SQL query, and how to draw the result. The dashboard
   is built only from these, so every number on it can be traced to the query
   that produced it — and changing the query changes the tile.
   ========================================================================== */

const VIZ = ['number', 'bar', 'line', 'table'];

const REPORTS = [
  { id:'R1', name:'Orders by status', viz:'bar',
    sql:"SELECT status, COUNT(*) AS orders\nFROM orders\nGROUP BY status\nORDER BY orders DESC" },
  { id:'R2', name:'Open orders with no applicants', viz:'number',
    sql:"SELECT COUNT(*) AS unclaimed\nFROM orders\nWHERE status = 'open' AND applicants = 0" },
  { id:'R3', name:'Users awaiting verification', viz:'number',
    sql:"SELECT COUNT(*) AS pending\nFROM users\nWHERE verification = 'pending'" },
  { id:'R4', name:'Commission by pharmacy', viz:'bar',
    sql:"SELECT name, commission\nFROM pharmacies\nWHERE commission > 0\nORDER BY commission DESC" },
  { id:'R5', name:'Verified pharmacies that never posted', viz:'table',
    sql:"SELECT name, district, trial_left, signed_up\nFROM pharmacies\nWHERE dormant = 1\nORDER BY signed_up" },
  { id:'R6', name:'Pharmacists with no roster match', viz:'table',
    sql:"SELECT name, syndicate_no, roster_match\nFROM users\nWHERE type = 'pharmacist' AND roster_match != 'matched'" },
  { id:'R7', name:'Orders per pharmacy', viz:'bar',
    sql:"SELECT p.name, COUNT(*) AS orders\nFROM orders o\nJOIN pharmacies p ON o.pharmacy_id = p.id\nGROUP BY p.name\nORDER BY orders DESC" },
  { id:'R8', name:'Drugs with no brand listed', viz:'number',
    sql:"SELECT COUNT(*) AS drugs\nFROM drugs\nWHERE brands = 0" },
  { id:'R9', name:'Total commission this month', viz:'number',
    sql:"SELECT SUM(commission) AS iqd\nFROM pharmacies" },
  { id:'R10', name:'Brands by company', viz:'bar',
    sql:"SELECT c.name, COUNT(*) AS brands\nFROM brands b\nJOIN companies c ON b.company_id = c.id\nGROUP BY c.name\nORDER BY brands DESC" }
];

const reportById = id => REPORTS.find(r => r.id === id) || null;

/* Runs a report and turns the rows into whatever the tile needs to draw. A
   report that fails returns the error rather than an empty chart, because a
   tile silently showing zero is how a broken query survives for a month. */
function runReport(rep) {
  try {
    const res = runSQL(rep.sql);
    return { ok:true, columns:res.columns, rows:res.rows };
  } catch (e) {
    return { ok:false, error:(e && e.message) || String(e) };
  }
}

/* A result becomes {label, n} pairs by convention: first text column labels,
   first numeric column measures. Stated rather than guessed, so a report author
   knows how to shape a query for a chart. */
function resultSeries(res) {
  if (!res.ok || !res.rows.length) return [];
  const cols = res.columns;
  const numeric = cols.filter(c => res.rows.every(r => r[c] === null || typeof r[c] === 'number'));
  const measure = numeric[0] || cols[cols.length - 1];
  const label = cols.find(c => c !== measure) || measure;
  return res.rows.map(r => ({ label:String(r[label] == null ? '—' : r[label]), n:Number(r[measure]) || 0 }));
}
function resultScalar(res) {
  if (!res.ok || !res.rows.length) return null;
  const c = res.columns[0];
  return res.rows[0][c];
}

function resultTable(res, limit) {
  const rows = limit ? res.rows.slice(0, limit) : res.rows;
  return '<div style="overflow-x:auto"><table class="mini"><thead><tr>' +
    res.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    (rows.length
      ? rows.map(r => '<tr>' + res.columns.map(c => {
          const v = r[c];
          return '<td' + (typeof v === 'number' ? ' class="n"' : '') + '>' +
            esc(v === null || v === undefined ? '—' : v) + '</td>';
        }).join('') + '</tr>').join('')
      : '<tr><td colspan="' + res.columns.length + '" style="text-align:center;color:var(--ink-faint)">' +
        esc(t('rep.noRows')) + '</td></tr>') +
    '</tbody></table></div>';
}

/* ---------- The reports module ---------- */

function reportsHead() {
  return '<div class="work-head">' +
      '<span class="view-select">' + esc(t('mod.reports')) + '</span>' +
      '<span class="chip chip-mute figure">' + fmt(REPORTS.length) + '</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn primary" onclick="openReport(null)">' + icon('plus') + esc(t('rep.new')) + '</button>' +
    '</div>';
}

function reportsBody() {
  if (S.report) return reportEditor(S.report);

  return '<div class="dash"><div class="charts c2">' + REPORTS.map(rep => {
    const res = runReport(rep);
    return '<section class="panel">' +
      '<div class="chart-h"><span class="chart-t">' + esc(rep.name) + '</span>' +
        '<span class="chart-s">' + esc(t('viz.' + rep.viz)) + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="table-toggle" onclick="openReport(' + attr(rep.id) + ')">' + esc(t('a.edit')) + '</button>' +
        '<button class="table-toggle" style="margin-inline-start:10px;" onclick="pinReport(' + attr(rep.id) + ')">' +
          esc(t('rep.pin')) + '</button></div>' +
      '<div class="chart-wrap">' + reportViz(rep, res, true) + '</div>' +
    '</section>';
  }).join('') + '</div></div>';
}

function reportViz(rep, res, compact) {
  if (!res.ok) return '<div class="imp-fatal">' + icon('alert') + esc(res.error) + '</div>';

  if (rep.viz === 'number') {
    const v = resultScalar(res);
    return '<div class="kpi-v" style="font-size:34px;">' + esc(v === null ? '—' : fmt(v)) + '</div>' +
      '<div class="inline-note">' + esc(res.columns[0]) + '</div>';
  }
  if (rep.viz === 'table') return resultTable(res, compact ? 5 : null);

  const series = resultSeries(res);
  if (!series.length) return '<p class="empty" style="padding:20px;">' + esc(t('rep.noRows')) + '</p>';
  if (rep.viz === 'line') {
    return trendChart(series.map(s => ({ n:s.n, label:s.label, short:s.label.slice(0, 6) })),
      { title:'', sub:'', id:'rep-' + rep.id, bare:true });
  }
  return barRows(series);
}

/* The bar marks, without the card around them — the report card supplies that.
   One colour for every bar: these are nominal categories, and shading them by
   size would double-encode the length the bar already shows. */
function barRows(series) {
  const max = Math.max(1, ...series.map(s => s.n));
  return series.map(s =>
    '<div class="funnel-row">' +
      '<span class="funnel-label">' + esc(s.label) + '</span>' +
      '<span class="funnel-track" style="height:16px;"><span class="funnel-bar" tabindex="0" role="img" ' +
        'aria-label="' + esc(s.label + ': ' + s.n) + '" data-tip="' + esc(s.label + '<br><b>' + fmt(s.n) + '</b>') + '" ' +
        'style="width:' + Math.max(2, s.n / max * 100) + '%;background:var(--series);height:16px;"></span></span>' +
      '<span class="funnel-n">' + fmt(s.n) + '</span>' +
    '</div>').join('');
}

/* ---------- The editor: write SQL, run it, see it ---------- */

function reportEditor(id) {
  const rep = id === 'new'
    ? (S.draft || { id:'new', name:'', viz:'table', sql:'SELECT * FROM orders LIMIT 10' })
    : reportById(id);
  if (!rep) return '<div class="empty">' + esc(t('e.noRecords')) + '</div>';
  S.draft = S.draft || Object.assign({}, rep);

  const res = d.sql ? runReport(d) : { ok:true, columns:[], rows:[] };

  const tables = Object.keys(sqlTables());

    return '<div class="schema-t"><button class="schema-name" onclick="insertSql(' + attr(tb) + ')">' +
      esc(tb) + '</button><div class="schema-cols">' +
      Object.keys(one).map(c => '<button class="schema-col" onclick="insertSql(' + attr(c) + ')">' +
        esc(c) + '</button>').join('') + '</div></div>';
  }).join('');

  return '<div class="rep-edit">' +
    '<div class="rep-main">' +
      '<div class="form-grid two" style="margin-bottom:12px;">' +
        '<div class="fld"><label for="rep-name">' + esc(t('rep.name')) + '</label>' +
          '<input id="rep-name" value="' + esc(d.name) + '" oninput="setDraft(\'name\', this.value)"></div>' +
        '<div class="fld"><label for="rep-viz">' + esc(t('rep.viz')) + '</label>' +
          '<select id="rep-viz" onchange="setDraft(\'viz\', this.value); render()">' +
            VIZ.map(v => '<option value="' + v + '"' + (d.viz === v ? ' selected' : '') + '>' +
              esc(t('viz.' + v)) + '</option>').join('') + '</select></div>' +
      '</div>' +
      '<div class="fld"><label for="rep-sql">' + esc(t('rep.sql')) + '</label>' +
        '<textarea id="rep-sql" class="sql" dir="ltr" spellcheck="false" ' +
          'oninput="setDraft(\'sql\', this.value)">' + esc(d.sql) + '</textarea>' +
        '<div class="hint">' + esc(t('rep.subsetNote')) + '</div></div>' +
      '<div style="display:flex;gap:9px;flex-wrap:wrap;">' +
        '<button class="btn primary" onclick="render()">' + icon('refresh') + esc(t('rep.run')) + '</button>' +
        '<button class="btn" onclick="saveReport()">' + esc(t('a.save')) + '</button>' +
        '<button class="btn" onclick="closeReport()">' + esc(t('a.cancel')) + '</button>' +
        (id !== 'new' ? '<button class="btn danger" onclick="deleteReport(' + attr(id) + ')">' +
          icon('trash') + esc(t('a.delete')) + '</button>' : '') +
      '</div>' +
      '<div class="rep-result">' +
        (res.ok
          ? '<div class="rep-meta">' + esc(t('rep.rows', { n:res.rows.length })) + '</div>' +
            reportViz(d, res, false)
          : '<div class="imp-fatal">' + icon('alert') + esc(res.error) + '</div>') +
      '</div>' +
    '</div>' +
    '<aside class="rep-schema"><div class="rail-h">' + esc(t('rep.schema')) + '</div>' + schema +
      '<p class="inline-note" style="margin-top:12px;">' + esc(t('rep.schemaNote')) + '</p></aside>' +
  '</div>';
}

/* ==========================================================================
   16. THE DASHBOARD
   Tiles, not a fixed layout. Every tile names a report, so the dashboard holds
   no numbers of its own — it cannot show a figure the Reports module could not
   reproduce, and editing the query moves the tile with it.
   ========================================================================== */

/* What the dashboard opens with. A layout, not data. */
const DEFAULT_TILES = [
  { report:'R2', w:'s' },
  { report:'R3', w:'s' },
  { report:'R8', w:'s' },
  { report:'R9', w:'s' },
  { report:'R1', w:'m' },
  { report:'R7', w:'m' },
  { report:'R5', w:'l' }
];

function tileCard(tile, idx) {
  const rep = reportById(tile.report);
  if (!rep) {
    return '<section class="panel tile w-' + tile.w + '">' +
      '<div class="chart-wrap"><div class="imp-fatal">' + icon('alert') +
      esc(t('dash.missingReport', { id:tile.report })) + '</div></div></section>';
  }
  const res = runReport(rep);
  const editing = S.dashEdit;

  return '<section class="panel tile w-' + tile.w + '">' +
    '<div class="chart-h">' +
      '<span class="chart-t">' + esc(rep.name) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      (editing
        ? '<span class="tile-tools">' +
            '<button class="btn-icon sm" onclick="moveTile(' + idx + ',-1)" title="' + esc(t('dash.moveUp')) + '"' +
              (idx === 0 ? ' disabled' : '') + '>' + icon('up') + '</button>' +
            '<button class="btn-icon sm" onclick="moveTile(' + idx + ',1)" title="' + esc(t('dash.moveDown')) + '"' +
              (idx === S.tiles.length - 1 ? ' disabled' : '') + '>' + icon('down') + '</button>' +
            '<select class="tile-size" onchange="setTileWidth(' + idx + ', this.value)">' +
              ['s','m','l'].map(w => '<option value="' + w + '"' + (tile.w === w ? ' selected' : '') + '>' +
                esc(t('dash.w' + w)) + '</option>').join('') + '</select>' +
            '<button class="btn-icon sm danger" onclick="removeTile(' + idx + ')" title="' + esc(t('a.delete')) + '">' +
              icon('x') + '</button>' +
          '</span>'
        : '<button class="table-toggle" onclick="goReport(' + attr(rep.id) + ')">' + esc(t('dash.source')) + '</button>') +
    '</div>' +
    '<div class="chart-wrap">' + reportViz(rep, res, true) + '</div>' +
  '</section>';
}

function dashHead() {
  return '<div class="work-head">' +
    '<span class="view-select">' + esc(t('h.greeting', { name:L(USERS[ME].name) })) + '</span>' +
    '<span class="spacer"></span>' +
    (S.dashEdit
      ? '<button class="btn" onclick="resetDash()">' + icon('refresh') + esc(t('dash.reset')) + '</button>' +
        '<button class="btn" onclick="openAddTile()">' + icon('plus') + esc(t('dash.add')) + '</button>' +
        '<button class="btn primary" onclick="toggleDashEdit()">' + esc(t('dash.done')) + '</button>'
      : '<button class="btn" onclick="toggleDashEdit()">' + icon('edit') + esc(t('dash.customise')) + '</button>') +
  '</div>' +
  (S.dashEdit ? '<div class="mod-note">' + icon('alert') + '<span>' + esc(t('dash.editNote')) + '</span></div>' : '');
}

function dashBody() {
  if (!S.tiles.length) {
    return '<div class="empty">' + icon('chart') + '<div>' + esc(t('dash.empty')) + '</div>' +
      '<button class="btn primary" style="margin-top:12px;" onclick="openAddTile()">' +
        esc(t('dash.add')) + '</button></div>';
  }
  return '<div class="dash"><div class="tiles">' +
    S.tiles.map(tileCard).join('') + '</div></div>';
}

function addTileModal() {
  const used = new Set(S.tiles.map(x => x.report));
  return '<div class="modal-h"><span class="modal-t">' + esc(t('dash.add')) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +

      '<p class="inline-note" style="margin-bottom:12px;">' + esc(t('dash.addNote')) + '</p>' +
      REPORTS.map(r =>
        '<button class="account-btn" onclick="addTile(' + attr(r.id) + ')"' +
          (used.has(r.id) ? ' disabled style="opacity:.5"' : '') + '>' +
          '<span class="avatar">' + esc(t('viz.' + r.viz).slice(0, 2)) + '</span>' +
          '<span style="min-width:0;"><span class="account-name">' + esc(r.name) + '</span>' +
          '<span class="account-mail" dir="ltr">' + esc(r.sql.split('\n')[0]) + '…</span></span>' +
          (used.has(r.id) ? '<span class="account-tag chip-mute">' + esc(t('dash.onBoard')) + '</span>' : '') +
        '</button>').join('') +

    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.close')) + '</button></div>';
}

/* ---------- Actions ---------- */

function toggleDashEdit() { S.dashEdit = !S.dashEdit; render(); }
function moveTile(i, d) {
  const j = i + d;
  if (j < 0 || j >= S.tiles.length) return;
  const t0 = S.tiles[i]; S.tiles[i] = S.tiles[j]; S.tiles[j] = t0;
  render();
}
function setTileWidth(i, w) { S.tiles[i].w = w; render(); }
function removeTile(i) { S.tiles.splice(i, 1); render(); }
function openAddTile() { S.modal = { kind:'addTile' }; renderModal(); }
function addTile(id) {
  const rep = reportById(id);
  S.tiles.push({ report:id, w:rep && rep.viz === 'number' ? 's' : 'm' });
  S.modal = null;
  toast(t('dash.added'));
  render();
}
function resetDash() { S.tiles = DEFAULT_TILES.map(x => Object.assign({}, x)); toast(t('dash.reset')); render(); }
function goReport(id) { S.tab = 'reports'; S.report = id; S.draft = null; render(); }

function openReport(id) { S.tab = 'reports'; S.report = id || 'new'; S.draft = null; render(); }
function closeReport() { S.report = null; S.draft = null; render(); }
function setDraft(k, v) { S.draft = S.draft || {}; S.draft[k] = v; }
function insertSql(text) {
  const box = document.getElementById('rep-sql');
  if (!box) return;
  const at = box.selectionStart || box.value.length;
  box.value = box.value.slice(0, at) + text + box.value.slice(box.selectionEnd || at);
  setDraft('sql', box.value);
  box.focus();
  box.selectionStart = box.selectionEnd = at + text.length;
}
function saveReport() {
  const d = S.draft;
  if (!d || !String(d.name || '').trim()) { toast(t('n.required')); return; }
  const res = runReport(d);
  // A report that does not run is not saved. Saving a broken query is how a
  // dashboard tile ends up permanently red with nobody owning it.
  if (!res.ok) { toast(res.error); return; }
  if (S.report === 'new') {
    REPORTS.push({ id:'R' + Date.now().toString().slice(-6), name:d.name, viz:d.viz, sql:d.sql });
  } else {
    Object.assign(reportById(S.report), { name:d.name, viz:d.viz, sql:d.sql });
  }
  S.report = null; S.draft = null;
  toast(t('rec.saved'));
  render();
}
function deleteReport(id) {
  const i = REPORTS.findIndex(r => r.id === id);
  if (i >= 0) REPORTS.splice(i, 1);
  // Tiles pointing at it say so rather than vanishing, so the dashboard cannot
  // quietly lose a number somebody was relying on.
  S.report = null; S.draft = null;
  toast(t('rec.deleted'));
  render();
}
function pinReport(id) {
  if (S.tiles.some(x => x.report === id)) { toast(t('dash.onBoard')); return; }
  const rep = reportById(id);
  S.tiles.push({ report:id, w:rep && rep.viz === 'number' ? 's' : 'm' });
  toast(t('dash.added'));
}

   8. STATE & RENDER

  picked:{ orders:[], users:[], pharmacies:[], companies:[],
           universities:[], syndicate:[], drugs:[] },

  /* The dashboard is a list of tiles, each naming a report. Nothing on it holds

  tiles:DEFAULT_TILES.map(x => Object.assign({}, x)),

      (n !== null ? '<span class="tab-count">' + fmt(n) + '</span>' : '') + '</button>';
  }).join('');

  const rail = document.getElementById('rail');
  const head = document.getElementById('work-head');
  const body = document.getElementById('work-body');

  if (S.record) {
    rail.classList.add('hidden');
    head.innerHTML = '';
    body.innerHTML = recordPage(S.record.mod, S.record.id);
  } else if (S.tab === 'home') {
    rail.classList.add('hidden');
    head.innerHTML = dashHead();
    body.innerHTML = dashBody();
  } else if (S.tab === 'reports') {
    rail.classList.add('hidden');

    body.innerHTML = reportsBody();
  } else {
    rail.classList.remove('hidden');
    rail.innerHTML = listRail(S.tab);
    head.innerHTML = listHead(S.tab);
    body.innerHTML = listBody(S.tab);

/* The two halves are one product: this hands off to the app, and an account
   row hands off to that pharmacy's own account inside it. */
/* The sibling build. Files carry their version in the name, so this is the one
   thing a version bump can silently break — which is why crm/check.mjs asserts
   the file named here exists on disk. Bump the app, change this line. */
const PEER_APP = '../demo/saydali-plus_v0.0002.html';
function openApp(asEmail) {
  const url = PEER_APP + (asEmail ? '#as=' + encodeURIComponent(asEmail) : '');

}

function toggleViewMenu(mod) { S.viewMenu = S.viewMenu === mod ? null : mod; render(); }
function pickView(mod, k) { S.view[mod] = k; S.viewMenu = null; S.picked[mod] = []; render(); }
function setFilter(mod, facet, v) {
  S.filters[mod] = S.filters[mod] || {};
  if (v === null) delete S.filters[mod][facet]; else S.filters[mod][facet] = v;
  S.picked[mod] = [];
  render();
}
function resetFilters(mod) { S.filters[mod] = {}; S.picked[mod] = []; render(); }
function sortBy(mod, key) {
  const cur = S.sort[mod];
  S.sort[mod] = (cur && cur.key === key)
    ? { key, dir: cur.dir === 'asc' ? 'desc' : 'asc' }
    : { key, dir:'asc' };
  render();
}
function pickOne(mod, id, on) {
  const set = new Set(S.picked[mod] || []);
  if (on) set.add(id); else set.delete(id);
  S.picked[mod] = [...set];
  render();
}
function pickAll(mod, on) {
  S.picked[mod] = on ? visibleRows(mod).map(r => r.id) : [];
  render();
}
function clearPicked(mod) { S.picked[mod] = []; render(); }

function bulkDelete(mod) {
  const ids = (S.picked[mod] || []).map(String);
  DATA[mod] = DATA[mod].filter(r => !ids.includes(String(idOf(mod, r))));
  S.picked[mod] = [];
  toast(t('rec.deleted'));

}

function search(q) {
  S.query = q;
  const box = document.getElementById('q-results');
  const term = q.trim().toLowerCase();
  if (!term) { box.innerHTML = ''; return; }

  const hits = [];
  TABS.filter(k => MODULES[k]).forEach(mod => {
    MODULES[mod].data().forEach(r => {
      const hay = [recordName(mod, idOf(mod, r)), L(r.name || ''), r.sci || '', r.no || '',
                   r.phone || '', r.email || '', r.licence || '', r.reg || '', r.domain || '', r.id || '']
        .join(' ').toLowerCase();
      if (hay.includes(term)) hits.push({ mod, r });
    });
  });

  box.innerHTML = '<div class="tb-results">' + (hits.length
    ? hits.slice(0, 8).map(h =>
        '<button class="tb-result" onclick="pickSearch(' + attr(h.mod) + ',' + attr(idOf(h.mod, h.r)) + ')">' +
          icon(MODULES[h.mod].icon) +
          '<span style="flex:1;min-width:0;text-align:start;"><span style="display:block;font-weight:600;font-size:12.5px;">' +
            esc(recordName(h.mod, idOf(h.mod, h.r))) + '</span>' +
          '<span class="tb-result-sub" style="display:block;">' + esc(t('mod.' + h.mod)) + '</span></span></button>').join('')
    : '<div class="tb-empty">' + esc(t('searchEmpty')) + '</div>') + '</div>';
}
function pickSearch(mod, id) {
  document.getElementById('q').value = '';
  document.getElementById('q-results').innerHTML = '';
  openRecord(mod, id);
}

function startEdit(el, path, type) {
  const [mod, id, field] = path.split('.');
  const rec = findRecord(mod, id);
  if (!rec) return;

  let input;
  if (type === 'owner') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      Object.keys(USERS).map(u => '<option value="' + u + '"' + (rec.owner === u ? ' selected' : '') + '>' +
        esc(L(USERS[u].name)) + '</option>').join('') + '</select>';
  } else if (type === 'district') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      DISTRICTS.map(d => '<option value="' + d.key + '"' + (rec.district === d.key ? ' selected' : '') + '>' +
        esc(L(d)) + '</option>').join('') + '</select>';
  } else if (type === 'stage') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      STAGES.map(s => '<option value="' + s.key + '"' + (rec.stage === s.key ? ' selected' : '') + '>' +
        esc(t('st.' + s.key)) + '</option>').join('') + '</select>';
  } else if (type === 'priority') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      ['high','normal','low'].map(p => '<option value="' + p + '"' + (rec.priority === p ? ' selected' : '') + '>' +
        esc(t('pr.' + p)) + '</option>').join('') + '</select>';
  } else {
    const raw = typeof rec[field] === 'object' ? L(rec[field]) : rec[field];
    input = '<input type="' + (type === 'number' ? 'number' : type === 'date' ? 'date' : 'text') + '" ' +
      'value="' + attr(raw == null ? '' : raw) + '" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){this.dataset.abort=1;this.blur();}" ' +
      'onblur="commitEdit(this,' + attr(path) + ')">';
  }
  el.innerHTML = input;
  const f = el.querySelector('input,select');
  f.focus();
  if (f.select) f.select();
}

function commitEdit(el, path) {
  if (el.dataset.abort) { render(); return; }
  const [mod, id, field] = path.split('.');
  const rec = findRecord(mod, id);
  if (!rec) { render(); return; }

  let v = el.value;
  if (field === 'value') v = Number(v) || 0;
  // A bilingual field keeps both scripts: overwriting one language's copy with
  // the other's text is how a record ends up Latin-only on an Arabic screen.
  if (typeof rec[field] === 'object' && rec[field] !== null) rec[field] = { ar:v, en:v };
  else rec[field] = v;

  toast(t('rec.saved'));
  render();
}

function addNote(kind, id) {
  const box = document.getElementById('note-input');
  const text = (box.value || '').trim();
  if (!text) return;
  DATA.activity.push({ id:'E' + (DATA.activity.length + 1), kind, id2:id, type:'note',
    when:ISO_TODAY, owner:ME, text:{ ar:text, en:text } });
  touch(kind, id);
  toast(t('rec.noteAdded'));
  render();
}
function logCall(kind, id) {
  DATA.activity.push({ id:'E' + (DATA.activity.length + 1), kind, id2:id, type:'call',
    when:ISO_TODAY, owner:ME,
    text:{ ar:'مكالمة مسجّلة من قبل ' + L(USERS[ME].name) + '.', en:'Call logged by ' + L(USERS[ME].name) + '.' } });
  touch(kind, id);
  toast(t('rec.saved'));

}
function touch(kind, id) {
  if (kind !== 'leads') return;
  const l = DATA.leads.find(r => r.id === id);
  if (l) l.lastTouch = ISO_TODAY;
}

function toggleTask(id) {

  if (x) x.done = !x.done;
  render();
}
function toggleTaskFromRecord(id) { toggleTask(id); }

function setOrderStatus(id, status) {
  const o = DATA.orders.find(r => r.id === id);
  if (!o) return;
  o.status = status;
  // Assigning without a person, or completing an order nobody took, is a state
  // the real database refuses; refuse it here too rather than showing a row
  // that could not exist.
  if (['assigned','in_progress','completed'].includes(status) && !o.assignee) {
    const pool = DATA.users.filter(u => u.verification === 'verified' &&
      u.type === (o.type === 'training' ? 'student' : 'pharmacist'));
    o.assignee = pool.length ? pool[0].id : null;
    if (o.applicants === 0) o.applicants = 1;
  }
  if (status === 'open') o.assignee = null;
  toast(t('d.moveTo', { stage:t('os.' + status) }));
  render();
}

function verifyUser(id) {
  const u = DATA.users.find(r => r.id === id);
  if (!u) return;
  u.verification = 'verified';
  DATA.activity.push({ id:'E' + (DATA.activity.length + 1), kind:'users', id2:id, type:'note',
    when:ISO_TODAY, owner:ME,
    text:{ ar:'وُثّق الحساب بعد مطابقة كشف النقابة.', en:'Account verified after checking the Syndicate roster.' } });
  toast(t('rec.saved'));
  render();
}

function saveBrand() {
  const v = {
    brand:  (document.getElementById('b-brand').value || '').trim(),
    company:(document.getElementById('b-company').value || '').trim(),
    doses:  (document.getElementById('b-doses').value || '').trim(),

  };

      notes:{ ar:v.notes, en:v.notes } });

      company:v.company, dosesOverride:doses, notes:{ ar:v.notes, en:v.notes } });

/* Read every control into S.modal.values before anything can re-render. A form
   that empties itself because one field was wrong is the fastest way to make
   someone stop using a CRM. */
function captureForm() {
  const F = FORMS[S.modal.mod];
  S.modal.values = S.modal.values || {};
  F.fields.forEach(f => {
    const el = document.getElementById('f-' + f.k);
    if (el) S.modal.values[f.k] = el.value;
  });
}
function closeModal() { S.modal = null; renderModal(); }

function renderModal() {
  const root = document.getElementById('overlay');
  if (!S.modal) { root.innerHTML = ''; return; }

  if (S.modal.kind === 'import') {
    root.innerHTML = '<div class="scrim center" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal wide" role="dialog" aria-modal="true">' + importModal() + '</div></div>';
    return;
  }
  if (S.modal.kind === 'addTile') {
    root.innerHTML = '<div class="scrim center" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" role="dialog" aria-modal="true">' + addTileModal() + '</div></div>';
    return;
  }
  if (S.modal.kind === 'brand') {
    root.innerHTML = '<div class="scrim center" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" role="dialog" aria-modal="true">' + brandModal() + '</div></div>';
    return;
  }

  const F = FORMS[S.modal.mod];
  const errs = S.modal.errors || {};
  const vals = S.modal.values || {};

  const body = F.fields.map(f => {
    const id = 'f-' + f.k;
    const v = vals[f.k] == null ? '' : String(vals[f.k]);
    let control;
    if (f.opts) {
      control = '<select id="' + id + '"' + (errs[f.k] ? ' class="bad"' : '') + '>' +
        (f.req ? '' : '<option value=""></option>') +
        f.opts().map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === v ? ' selected' : '') + '>' +
          esc(o.n) + '</option>').join('') + '</select>';
    } else {
      control = '<input id="' + id + '" type="' + (f.date ? 'date' : f.num ? 'number' : 'text') + '"' +
        ' value="' + esc(v) + '"' +
        (f.ltr ? ' dir="ltr" class="figure' + (errs[f.k] ? ' bad' : '') + '"' : (errs[f.k] ? ' class="bad"' : '')) + '>';
    }
    return '<div class="fld"><label for="' + id + '">' + esc(t(f.l)) +
      (f.req ? ' <span class="req">*</span>' : '') + '</label>' + control +
      (f.hint ? '<div class="hint">' + esc(t(f.hint)) + '</div>' : '') +
      (errs[f.k] ? '<div class="err">' + esc(errs[f.k]) + '</div>' : '') + '</div>';
  }).join('');

  root.innerHTML = '<div class="scrim center" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><span class="modal-t">' + esc(t(F.title)) + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
      '<div class="modal-b"><div class="form-grid two">' + body + '</div></div>' +
      '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
        '<button class="btn primary" onclick="submitNew()">' + esc(t('a.save')) + '</button></div>' +
    '</div></div>';
}

function submitNew() {
  captureForm();
  const mod = S.modal.mod;
  const F = FORMS[mod];
  const rec = {};
  const errors = {};

  F.fields.forEach(f => {
    let v = (S.modal.values[f.k] || '').trim();

    if (f.req && !v) { errors[f.k] = t('n.required'); return; }
    if (f.phone && v && !IQ_PHONE.test(v)) { errors[f.k] = t('n.badPhone'); return; }
    if (f.unique && v && DATA[mod].some(r => String(r[f.unique]).toLowerCase() === v.toLowerCase())) {
      errors[f.k] = t('n.duplicate', { v }); return;
    }
    if (f.num) v = Number(v) || 0;
    if (f.list) { rec[f.k] = v ? v.split(/[|;,]/).map(x => x.trim()).filter(Boolean) : []; return; }
    // A name typed in one language is stored for both rather than left blank in
    // the other — a record with an empty Arabic name renders as "—" on the
    // screen most of this team actually uses.
    rec[f.k] = f.bi ? { ar:v, en:v } : v;
  });

  if (Object.keys(errors).length) { S.modal.errors = errors; renderModal(); return; }

  const prefix = { users:'U', orders:'O-', pharmacies:'P', companies:'CO', universities:'V' }[mod];
  if (prefix) rec.id = prefix + Date.now().toString().slice(-6);
  if (!rec.owner) rec.owner = ME;

  if (mod === 'users') Object.assign(rec, {
    verification:'pending', joined:ISO_TODAY, orders:0, rating:null, reliability:null,
    gradYear:null, pharmacy:null, university:null,
    syndicateNo: rec.syndicateNo || null
  });
  if (mod === 'pharmacies') Object.assign(rec, {
    user:null, verification:'pending', signedUp:ISO_TODAY, trialDays:30, trialUsed:0,
    orders:0, filled:0, lastOrder:null, commission:0
  });
  if (mod === 'companies') rec.status = 'review';
  if (mod === 'universities') rec.students = 0;
  if (mod === 'orders') {
    const ph = pharmacyOf(rec.pharmacy);
    Object.assign(rec, {
      district: ph ? ph.district : 'karrada',
      status:'open', assignee:null, applicants:0, controlled:false,
      hours: (rec.start && rec.end) ? shiftHours(rec.start, rec.end) : 0,
      rateType:'hourly'
    });
    // The total is derived from the rate and the hours, never typed. A CRM that
    // lets someone key a total that disagrees with the rate has invented a
    // second source of truth for money.
    rec.total = rec.type === 'training' ? 0 : Math.round((rec.rate || 0) * rec.hours);
  }
  if (mod === 'drugs') {
    rec.interactions = [];
    rec.contraindications = [];
    rec.doses = rec.doses || [];
  }

  DATA[mod].push(rec);
  S.modal = null;
  toast(t('n.created'));
  render();
}

function brandModal() {
  const v = S.modal.values || {};
  const e = S.modal.errors || {};
  const drug = drugOf(S.modal.sci);
  const fld = (id, label, control, err, hint) =>
    '<div class="fld"><label for="' + id + '">' + esc(label) + '</label>' + control +
    (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') + '</div>';

  return '<div class="modal-h"><span class="modal-t">' +
      esc(S.modal.editing ? t('a.edit') : t('dr.addBrand')) + ' — ' + esc(S.modal.sci) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b"><div class="form-grid two">' +
      fld('b-brand', t('c.brand'),
        '<input id="b-brand" dir="ltr"' + (e.brand ? ' class="bad"' : '') + ' value="' + esc(v.brand || '') + '">', e.brand) +
      fld('b-company', t('c.company'),
        '<select id="b-company"' + (e.company ? ' class="bad"' : '') + '>' +
        DATA.companies.map(c => '<option value="' + esc(c.id) + '"' +
          (v.company === c.id ? ' selected' : '') + '>' + esc(L(c.name)) + '</option>').join('') + '</select>', e.company) +
      fld('b-doses', t('c.override'),
        '<input id="b-doses" dir="ltr" class="figure" value="' + esc(v.doses || '') + '" placeholder="' +
          esc((drug ? drug.doses : []).join(' | ')) + '">', null,
        t('dr.hintOverride')) +
      fld('b-notes', t('c.notesF'),
        '<textarea id="b-notes">' + esc(v.notes || '') + '</textarea>', null) +
    '</div></div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn primary" onclick="saveBrand()">' + esc(t('a.save')) + '</button></div>';
}

/* The shift-hours rule, ported from src/lib/time.ts, so an overnight order
   here reads 8 hours rather than minus sixteen. */
function shiftHours(startTime, endTime) {
  const m = x => { const [h, mi] = String(x).split(':').map(Number); return h * 60 + mi; };
  let mins = m(endTime) - m(startTime);
  if (mins <= 0) mins += 24 * 60;
  return Math.round(mins / 60 * 100) / 100;
}

render();
</script>
