<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2D2A6E">
<title>Saydali+ CRM</title>
<meta name="version" content="CRM_v0.0002">
<!--
  Saydali+ CRM — the operator's side of the marketplace, in one file.
  Open it in a browser: no server, no build.

  ENGLISH ONLY, deliberately. The app is Arabic-first and stays that way; its
  users are pharmacists and owners across Iraq. This is the back office, used
  by one team, so a second language would buy nothing and cost a permanent risk
  of half-translated screens. Arabic still appears as DATA — a pharmacy is
  really called صيدلية الرحمة, a drug really has an Arabic name — and those are
  fields on the record, not translations of the interface.

  WHAT THIS IS FOR. The app at demo/saydali-plus.html is what a pharmacy and a
  pharmacist see. This is what the team in Baghdad sees: the pharmacies not yet
  signed up, the ones signed up but not yet posting, the trials about to expire,
  and who owes whom a phone call. The brief's premise is that pharmacist supply
  is abundant and pharmacy demand is scarce, so the work that decides whether
  this business exists is pharmacy acquisition and activation — which is what a
  CRM is for.

  SHAPE. Modelled on Zoho CRM, because that is the tool the founder already
  reads fluently: module tabs across the top, a saved-view selector and filter
  rail on every list, records with a summary panel and a timeline, a kanban
  pipeline, and a reports module. The palette is Saydali+'s rather than Zoho's,
  so the two halves read as one company's product.

  STATE. Fixture data, held in memory, gone on refresh. Edits, filters, stage
  moves and new records all work; nothing persists and there is no server.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Saydali+'s palette, so the CRM and the app read as one product. */
    --ink:#1A1826; --ink-soft:#57536E; --ink-faint:#8B87A3;
    --indigo:#2D2A6E; --indigo-dark:#191735; --indigo-tint:#E7E6F4; --indigo-tint-2:#F2F1FA;
    --amber:#B8791F; --amber-tint:#F5E6C8;
    --palm:#4F7A47; --palm-tint:#E7EFE3;
    --page:#F4F4F8; --card:#FFFFFF; --border:#E2E0EC; --border-soft:#EDECF3;
    --row-hover:#F7F7FB;

    /* ---- Chart tokens ----
       Ordinal indigo ramp, validated with the data-viz validator against this
       page's #FFFFFF chart surface: monotone lightness, every adjacent gap
       >= 0.06, light end 2.69:1 against the surface, hue spread 6deg. Used for
       ORDERED categories only (funnel stages, tiers). Never for nominal ones —
       colouring bars darker-where-bigger burns the free channel on information
       the bar length already carries. */
    --ord-1:#9C98CE; --ord-2:#7A74BC; --ord-3:#574FA3; --ord-4:#37327A; --ord-5:#201C4A;
    /* Single-series magnitude and trend both use slot 3, the mid step. */
    --series:#574FA3;
    --series-soft:#E7E6F4;
    /* Status is reserved: it means good/bad, never "series 4", and always ships
       with an icon and a word beside it. Fixed steps from the data-viz skill. */
    --good:#0CA30C; --warning:#FAB219; --serious:#EC835A; --critical:#D03B3B;
    --grid:#EAE9F2; --axis:#D4D2E0; --muted-ink:#8B87A3;

    --font-display:'Space Grotesk',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --font-ar:'Noto Kufi Arabic','IBM Plex Sans',sans-serif;
    --rail:216px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body); background:var(--page); color:var(--ink);
    font-size:13px; -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:none; }
  a{ color:var(--indigo); }
  :focus-visible{ outline:2px solid var(--indigo); outline-offset:1px; border-radius:3px; }
  .figure{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .hidden{ display:none !important; }
  .ico{ width:15px; height:15px; flex:none; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#D2D0DF; border-radius:10px; border:3px solid var(--page); }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ======================================================================
     CHROME — the Zoho shape: a slim brand bar, module tabs beneath it, and
     everything else inside the module.
     ====================================================================== */
  #shell{ display:flex; flex-direction:column; height:100%; }

  .topbar{
    flex:none; height:46px; background:var(--indigo-dark); color:#fff;
    display:flex; align-items:center; gap:12px; padding:0 14px; position:relative; overflow:hidden;
  }
  .topbar > *{ position:relative; }
  .tb-brand{ font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:-.01em; }
  .tb-suite{
    font-size:10.5px; font-family:var(--font-mono); letter-spacing:.1em; text-transform:uppercase;
    color:rgba(255,255,255,.62); border-inline-start:1px solid rgba(255,255,255,.24);
    padding-inline-start:10px; margin-inline-start:2px;
  }
  .tb-search{
    flex:1; max-width:400px; margin-inline:auto; position:relative;
  }
  .tb-search input{
    width:100%; height:29px; border-radius:7px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.1); color:#fff; padding-inline:30px 11px; font-size:12.5px; outline:none;
  }
  .tb-search input::placeholder{ color:rgba(255,255,255,.52); }
  .tb-search input:focus{ background:rgba(255,255,255,.17); border-color:rgba(255,255,255,.4); }
  .tb-search .ico{ position:absolute; inset-inline-start:9px; top:7px; color:rgba(255,255,255,.6); }
  .tb-results{
    position:absolute; top:34px; inset-inline-start:0; width:100%; background:var(--card);
    border:1px solid var(--border); border-radius:9px; box-shadow:0 14px 34px -12px rgba(20,18,40,.34);
    overflow:hidden; z-index:60; max-height:320px; overflow-y:auto;
  }
  .tb-result{ display:flex; gap:9px; align-items:center; width:100%; text-align:start; padding:9px 11px; color:var(--ink); }
  .tb-result:hover{ background:var(--indigo-tint-2); }
  .tb-result .ico{ position:static; color:var(--ink-faint); }
  .tb-result-sub{ font-size:11px; color:var(--ink-faint); }
  .tb-empty{ padding:13px; font-size:12px; color:var(--ink-faint); text-align:center; }

  .tb-btn{
    height:29px; padding:0 11px; border-radius:7px; color:#fff; font-size:12.5px; font-weight:500;
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12);
  }
  .tb-btn:hover{ background:rgba(255,255,255,.22); }
  .tb-btn.ghost{ background:none; border:1px solid rgba(255,255,255,.22); }
  .tb-btn.ghost:hover{ background:rgba(255,255,255,.14); }
  .tb-avatar{
    width:28px; height:28px; border-radius:50%; background:var(--amber); color:#2A1C05;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:none;
  }

  /* Module tabs */
  .tabs{
    flex:none; background:var(--card); border-bottom:1px solid var(--border);
    display:flex; align-items:stretch; gap:0; padding-inline:8px; overflow-x:auto;
  }
  .tabs::-webkit-scrollbar{ height:0; }
  .tab{
    padding:0 15px; height:41px; display:flex; align-items:center; gap:7px; white-space:nowrap;
    font-size:13px; font-weight:500; color:var(--ink-soft); border-bottom:2.5px solid transparent;
  }
  .tab:hover{ color:var(--indigo); background:var(--indigo-tint-2); }
  .tab.active{ color:var(--indigo); border-bottom-color:var(--indigo); font-weight:600; }
  .tab .ico{ width:14px; height:14px; }
  .tab-count{
    font-family:var(--font-mono); font-size:10.5px; background:var(--indigo-tint); color:var(--indigo);
    border-radius:100px; padding:1px 6px; font-weight:600;
  }

  #main{ flex:1; min-height:0; display:flex; }
  .rail{
    width:var(--rail); flex:none; background:var(--card); border-inline-end:1px solid var(--border);
    overflow-y:auto; padding:14px 12px 24px;
  }
  .work{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .work-head{
    flex:none; background:var(--card); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .work-body{ flex:1; min-height:0; overflow:auto; }

  @media (max-width:1000px){
    .rail{ display:none; }
    .tb-search{ display:none; }
  }
  /* ======================================================================
     LIST VIEWS
     ====================================================================== */
  .view-select{
    display:flex; align-items:center; gap:7px; font-family:var(--font-display);
    font-weight:700; font-size:16px; color:var(--ink);
  }
  .view-select .ico{ width:16px; height:16px; color:var(--ink-faint); }
  .view-menu{
    position:absolute; top:38px; inset-inline-start:0; min-width:230px; background:var(--card);
    border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 34px -12px rgba(20,18,40,.3);
    z-index:50; overflow:hidden; padding:4px;
  }
  .view-opt{
    display:flex; align-items:center; gap:8px; width:100%; text-align:start; padding:8px 10px;
    border-radius:7px; font-size:12.5px; color:var(--ink-soft);
  }
  .view-opt:hover{ background:var(--indigo-tint-2); }
  .view-opt.on{ background:var(--indigo-tint); color:var(--indigo); font-weight:600; }
  .view-opt .count{ margin-inline-start:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .spacer{ flex:1; }

  .btn{
    height:31px; padding:0 13px; border-radius:7px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
    background:var(--card); color:var(--ink-soft); white-space:nowrap;
  }
  .btn:hover{ background:var(--row-hover); border-color:var(--ink-faint); }
  .btn.primary{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .btn.primary:hover{ background:var(--indigo-dark); border-color:var(--indigo-dark); }
  .btn.danger{ color:var(--critical); border-color:#E8C3C3; }
  .btn.danger:hover{ background:#FCF2F2; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-icon{
    width:31px; height:31px; border-radius:7px; border:1px solid var(--border); background:var(--card);
    display:inline-flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:none;
  }
  .btn-icon:hover{ background:var(--row-hover); }
  .btn-icon.on{ background:var(--indigo-tint); border-color:var(--indigo-tint); color:var(--indigo); }

  table.grid{ width:100%; border-collapse:collapse; background:var(--card); }
  table.grid th{
    position:sticky; top:0; z-index:5; background:var(--card); text-align:start;
    font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint);
    padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; user-select:none;
  }
  table.grid th.sortable{ cursor:pointer; }
  table.grid th.sortable:hover{ color:var(--indigo); }
  table.grid th .ico{ width:11px; height:11px; vertical-align:-1px; margin-inline-start:3px; }
  table.grid td{
    padding:11px 12px; border-bottom:1px solid var(--border-soft); font-size:12.5px; vertical-align:middle;
  }
  table.grid tr:hover td{ background:var(--row-hover); }
  table.grid tr.picked td{ background:var(--indigo-tint-2); }
  .col-check{ width:34px; padding-inline-end:0 !important; }
  .cell-link{ font-weight:600; color:var(--indigo); text-align:start; }
  .cell-link:hover{ text-decoration:underline; }
  .cell-sub{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
  input[type="checkbox"]{ width:14px; height:14px; accent-color:var(--indigo); cursor:pointer; }

  .bulkbar{
    display:flex; align-items:center; gap:10px; padding:9px 18px; background:var(--indigo-tint);
    border-bottom:1px solid var(--border); font-size:12.5px; color:var(--indigo-dark); font-weight:500;
  }

  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:100px; white-space:nowrap;
  }
  .chip .ico{ width:11px; height:11px; }
  .chip-good{ background:var(--palm-tint); color:#3D6136; }
  .chip-warn{ background:var(--amber-tint); color:#8A5610; }
  .chip-bad{ background:#FBE9E9; color:#9E2B2B; }
  .chip-info{ background:var(--indigo-tint); color:var(--indigo); }
  .chip-mute{ background:#EFEEF4; color:var(--ink-faint); }

  .avatar{
    width:28px; height:28px; border-radius:8px; background:var(--indigo-tint); color:var(--indigo-dark);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:none;
  }
  .avatar{ font-family:var(--font-display); }
  .avatar.lg{ width:46px; height:46px; border-radius:13px; font-size:16px; }
  .avatar.amber{ background:var(--amber-tint); color:#8A5610; }
  .with-avatar{ display:flex; align-items:center; gap:9px; }

  /* Filter rail */
  .rail-h{
    font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-faint); margin:16px 0 7px;
  }
  .rail-h:first-child{ margin-top:0; }
  .rail-opt{
    display:flex; align-items:center; gap:8px; width:100%; text-align:start; padding:6px 8px;
    border-radius:7px; font-size:12.5px; color:var(--ink-soft);
  }
  .rail-opt:hover{ background:var(--indigo-tint-2); }
  .rail-opt.on{ background:var(--indigo-tint); color:var(--indigo); font-weight:600; }
  .rail-opt .count{ margin-inline-start:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .rail-opt.on .count{ color:var(--indigo); }
  .rail-clear{ font-size:11.5px; color:var(--indigo); text-decoration:underline; margin-top:10px; }

  .empty{
    text-align:center; color:var(--ink-faint); font-size:13px; padding:48px 20px; line-height:1.8;
  }
  .empty .ico{ width:26px; height:26px; opacity:.45; margin-bottom:8px; }

  /* ======================================================================
     RECORD PAGE
     ====================================================================== */
  .rec-head{
    background:var(--card); border-bottom:1px solid var(--border); padding:14px 18px;
    display:flex; align-items:flex-start; gap:13px; flex-wrap:wrap;
  }
  .rec-title{ font-family:var(--font-display); font-weight:700; font-size:18px; }
  .rec-sub{ font-size:12px; color:var(--ink-faint); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .rec-tabs{ display:flex; gap:2px; padding:0 18px; background:var(--card); border-bottom:1px solid var(--border); }
  .rec-tab{
    padding:9px 13px; font-size:12.5px; font-weight:500; color:var(--ink-soft);
    border-bottom:2.5px solid transparent; margin-bottom:-1px;
  }
  .rec-tab.active{ color:var(--indigo); border-bottom-color:var(--indigo); font-weight:600; }
  .rec-body{ padding:18px; display:grid; gap:16px; align-items:start; }
  @media (min-width:1080px){ .rec-body{ grid-template-columns:1fr 340px; } }

  .panel{ background:var(--card); border:1px solid var(--border); border-radius:11px; }
  .panel-h{
    padding:11px 14px; border-bottom:1px solid var(--border-soft);
    font-size:12px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px;
  }
  .panel-h .spacer{ flex:1; }
  .panel-b{ padding:14px; }
  .panel-b.flush{ padding:0; }

  .fields{ display:grid; gap:1px 18px; }
  @media (min-width:640px){ .fields.two{ grid-template-columns:1fr 1fr; } }
  .field-row{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); align-items:baseline; }
  .field-row:last-child{ border-bottom:none; }
  .field-k{ width:44%; flex:none; font-size:11.5px; color:var(--ink-faint); }
  .field-v{ flex:1; font-size:12.5px; font-weight:500; min-width:0; word-break:break-word; }
  .field-v.editable{ cursor:text; border-radius:5px; padding:2px 4px; margin:-2px -4px; }
  .field-v.editable:hover{ background:var(--indigo-tint-2); box-shadow:inset 0 0 0 1px var(--border); }
  .field-v input, .field-v select{
    width:100%; border:1px solid var(--indigo); border-radius:5px; padding:3px 5px; font-size:12.5px; outline:none;
  }

  .timeline{ padding:4px 0; }
  .tl-item{ display:flex; gap:11px; padding:11px 14px; border-bottom:1px solid var(--border-soft); }
  .tl-item:last-child{ border-bottom:none; }
  .tl-dot{
    width:26px; height:26px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--indigo-tint); color:var(--indigo);
  }
  .tl-dot .ico{ width:13px; height:13px; }
  .tl-dot.good{ background:var(--palm-tint); color:#3D6136; }
  .tl-dot.warn{ background:var(--amber-tint); color:#8A5610; }
  .tl-title{ font-size:12.5px; line-height:1.5; }
  .tl-meta{ font-size:11px; color:var(--ink-faint); margin-top:2px; }

  .note-box{ display:flex; gap:9px; padding:12px 14px; border-bottom:1px solid var(--border-soft); }
  .note-box textarea{
    flex:1; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12.5px;
    resize:none; min-height:38px; outline:none;
  }
  .note-box textarea:focus{ border-color:var(--indigo); }

  /* ======================================================================
     KANBAN
     ====================================================================== */
  .kanban{ display:flex; gap:12px; padding:16px 18px; align-items:flex-start; min-height:100%; }
  .kcol{ width:262px; flex:none; display:flex; flex-direction:column; max-height:100%; }
  .kcol-h{
    display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:9px 9px 0 0;
    background:var(--card); border:1px solid var(--border); border-bottom:none;
  }
  .kcol-swatch{ width:9px; height:9px; border-radius:3px; flex:none; }
  .kcol-name{ font-size:12px; font-weight:600; }
  .kcol-n{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .kcol-sum{ margin-inline-start:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); font-weight:600; }
  .kcol-b{
    background:var(--card); border:1px solid var(--border); border-radius:0 0 9px 9px; padding:8px;
    display:flex; flex-direction:column; gap:8px; overflow-y:auto; min-height:90px;
  }
  .kcol-b.over{ background:var(--indigo-tint-2); border-color:var(--indigo); }
  .kcard{
    border:1px solid var(--border); border-radius:9px; padding:10px 11px; background:var(--card);
    cursor:grab; text-align:start; width:100%;
  }
  .kcard:hover{ border-color:var(--indigo); box-shadow:0 4px 12px -6px rgba(20,18,40,.2); }
  .kcard.dragging{ opacity:.45; }
  .kcard-t{ font-size:12.5px; font-weight:600; line-height:1.4; }
  .kcard-m{ font-size:11px; color:var(--ink-faint); margin-top:3px; }
  .kcard-f{ display:flex; align-items:center; gap:6px; margin-top:9px; }
  .kcard-v{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--indigo); }
  .kcard-owner{ margin-inline-start:auto; width:21px; height:21px; border-radius:6px; font-size:9px; }
  /* ======================================================================
     DASHBOARD & CHARTS
     Marks are thin, grid and axes are recessive hairlines, and every chart
     carries a hover layer and a table twin — a tooltip never gates a value.
     ====================================================================== */
  .dash{ padding:16px 18px 30px; display:flex; flex-direction:column; gap:14px; }
  .kpis{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); }
  .kpi{ background:var(--card); border:1px solid var(--border); border-radius:11px; padding:14px 15px; }
  .kpi-k{ font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; }
  /* Proportional figures on a display-size number: tabular digits make a large
     value look loose. tabular-nums is for columns that align. */
  .kpi-v{ font-family:var(--font-body); font-size:27px; font-weight:600; letter-spacing:-.02em; margin-top:5px; line-height:1.1; }
  .kpi-d{ font-size:11.5px; margin-top:5px; display:flex; align-items:center; gap:5px; }
  .kpi-d .ico{ width:12px; height:12px; }
  .kpi-up{ color:#0A7D0A; } .kpi-down{ color:#A32E2E; } .kpi-flat{ color:var(--ink-faint); }
  .kpi-spark{ margin-top:9px; height:26px; display:block; width:100%; }

  .charts{ display:grid; gap:14px; }
  @media (min-width:1080px){ .charts.c2{ grid-template-columns:1fr 1fr; } }
  @media (min-width:1080px){ .charts.c32{ grid-template-columns:1.4fr 1fr; } }

  .chart-h{ display:flex; align-items:baseline; gap:9px; padding:13px 15px 0; }
  .chart-t{ font-size:13px; font-weight:600; }
  .chart-s{ font-size:11.5px; color:var(--ink-faint); }
  .chart-wrap{ padding:10px 15px 15px; position:relative; }
  .chart-svg{ display:block; width:100%; overflow:visible; }
  .grid-line{ stroke:var(--grid); stroke-width:1; }
  .axis-line{ stroke:var(--axis); stroke-width:1; }
  .axis-text{ font-family:var(--font-mono); font-size:10px; fill:var(--muted-ink); }
  .val-text{ font-family:var(--font-mono); font-size:10.5px; fill:var(--ink-soft); font-weight:600; }
  .cat-text{ font-size:11px; fill:var(--ink-soft); }

  .tip{
    position:absolute; z-index:30; pointer-events:none; background:var(--ink); color:#fff;
    font-size:11.5px; line-height:1.55; padding:7px 10px; border-radius:7px; white-space:nowrap;
    opacity:0; transform:translate(-50%,-100%); transition:opacity .1s;
    box-shadow:0 8px 22px -8px rgba(20,18,40,.5);
  }
  .tip.on{ opacity:1; }
  .tip b{ font-family:var(--font-mono); font-weight:600; }

  /* The funnel is an ordered scale, so it takes the ordinal ramp. */
  .funnel-row{ display:flex; align-items:center; gap:11px; padding:6px 0; }
  .funnel-label{ display:block; width:132px; flex:none; font-size:12px; color:var(--ink-soft); line-height:1.35; }
  /* These are spans inside a flex row: inline boxes ignore width and height, so
     without display:block the bar has no geometry and never paints. */
  .funnel-track{ display:block; flex:1; height:22px; position:relative; background:var(--grid); border-radius:3px; }
  .funnel-bar{
    display:block; height:100%; border-radius:0; position:relative;
    /* 4px rounded data-end, square against the baseline */
    border-start-end-radius:4px; border-end-end-radius:4px;
  }
  .funnel-bar:hover{ filter:brightness(1.08); }
  .funnel-n{ display:block; font-family:var(--font-mono); font-size:12px; font-weight:600; width:38px; flex:none; text-align:end; }
  .funnel-pct{ display:block; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); width:44px; flex:none; text-align:end; }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; padding:0 15px 13px; }
  .legend-i{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .legend-sw{ width:10px; height:10px; border-radius:3px; flex:none; }

  .table-toggle{ font-size:11.5px; color:var(--indigo); text-decoration:underline; }
  table.mini{ width:100%; border-collapse:collapse; font-size:12px; }
  table.mini th{
    text-align:start; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-faint); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--border);
  }
  table.mini td{ padding:7px 10px; border-bottom:1px solid var(--border-soft); }
  table.mini td.n{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:end; }
  table.mini tr:last-child td{ border-bottom:none; }

  .task-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border-soft); }
  .task-row:last-child{ border-bottom:none; }
  .task-row:hover{ background:var(--row-hover); }
  .task-t{ font-size:12.5px; line-height:1.45; }
  .task-m{ font-size:11px; color:var(--ink-faint); margin-top:2px; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .task-done .task-t{ text-decoration:line-through; color:var(--ink-faint); }

  /* ======================================================================
     MODAL / DRAWER / TOAST
     ====================================================================== */
  .scrim{ position:fixed; inset:0; background:rgba(20,18,40,.42); z-index:70; display:flex; }
  .scrim.center{ align-items:center; justify-content:center; padding:20px; }
  .modal{
    background:var(--card); border-radius:13px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    box-shadow:0 30px 70px -20px rgba(20,18,40,.5);
  }
  .modal-h{ padding:15px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .modal-t{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .modal-b{ padding:18px; }
  .modal-f{ padding:13px 18px; border-top:1px solid var(--border); display:flex; gap:9px; justify-content:flex-end; }

  .form-grid{ display:grid; gap:13px; }
  @media (min-width:520px){ .form-grid.two{ grid-template-columns:1fr 1fr; } }
  .fld label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .fld label .req{ color:var(--critical); }
  .fld input, .fld select, .fld textarea{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12.5px; outline:none;
    background:var(--card);
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus{ border-color:var(--indigo); }
  .fld textarea{ resize:none; min-height:70px; }
  .fld .hint{ font-size:11px; color:var(--ink-faint); margin-top:4px; line-height:1.5; }
  .fld .err{ font-size:11px; color:var(--critical); margin-top:4px; }
  .fld input.bad, .fld select.bad{ border-color:var(--critical); }

  .toast{
    position:fixed; bottom:22px; inset-inline-start:50%; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:#fff; font-size:12.5px; padding:10px 17px; border-radius:9px;
    opacity:0; pointer-events:none; z-index:90; transition:opacity .16s,transform .16s; max-width:90vw;
  }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

  .build-tag{
    font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,.42);
    letter-spacing:.04em; white-space:nowrap;
  }

  /* ---------- Dashboard tiles ---------- */
  .tiles{ display:grid; gap:14px; grid-template-columns:repeat(12, 1fr); align-items:start; }
  .tile{ grid-column:span 12; }
  @media (min-width:760px){
    .tile.w-s{ grid-column:span 6; }
    .tile.w-m{ grid-column:span 6; }
    .tile.w-l{ grid-column:span 12; }
  }
  @media (min-width:1180px){
    .tile.w-s{ grid-column:span 3; }
    .tile.w-m{ grid-column:span 6; }
    .tile.w-l{ grid-column:span 12; }
  }
  .tile-tools{ display:flex; align-items:center; gap:5px; }
  .btn-icon.sm{ width:24px; height:24px; border-radius:6px; }
  .btn-icon.sm .ico{ width:12px; height:12px; }
  .btn-icon.sm:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-icon.sm.danger{ color:var(--critical); }
  .tile-size{
    height:24px; border:1px solid var(--border); border-radius:6px; font-size:11px;
    padding:0 4px; background:var(--card); color:var(--ink-soft);
  }

  /* ---------- Report editor ---------- */
  .rep-edit{ display:grid; gap:16px; padding:16px 18px 30px; align-items:start; }
  @media (min-width:1080px){ .rep-edit{ grid-template-columns:1fr 260px; } }
  .rep-main{ min-width:0; }
  textarea.sql{
    font-family:var(--font-mono); font-size:12.5px; line-height:1.65; min-height:150px;
    tab-size:2; white-space:pre; overflow-x:auto;
  }
  .rep-result{
    margin-top:16px; background:var(--card); border:1px solid var(--border);
    border-radius:11px; padding:14px;
  }
  .rep-meta{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
    margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border-soft);
  }
  .rep-schema{
    background:var(--card); border:1px solid var(--border); border-radius:11px;
    padding:13px; max-height:70vh; overflow-y:auto;
  }
  .schema-t{ margin-bottom:11px; }
  .schema-name{
    font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--indigo);
    display:block; text-align:start; margin-bottom:3px;
  }
  .schema-name:hover{ text-decoration:underline; }
  .schema-cols{ display:flex; flex-wrap:wrap; gap:3px; }
  .schema-col{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);
    padding:1px 5px; border-radius:4px; background:var(--mist);
  }
  .schema-col:hover{ background:var(--indigo-tint); color:var(--indigo); }

  /* ---------- Module notes & the importer ---------- */
  .mod-note{
    display:flex; gap:9px; align-items:flex-start; padding:10px 18px; font-size:12px; line-height:1.65;
    background:var(--indigo-tint-2); border-bottom:1px solid var(--border); color:var(--ink-soft);
  }
  .mod-note .ico{ color:var(--indigo); margin-top:1px; }
  .mod-note.stage{ background:var(--amber-tint); border-bottom-color:#E3CE9E; color:#8A5610; }
  .mod-note.stage .ico{ color:var(--amber); }

  .kpi.as-link{ text-align:start; width:100%; transition:border-color .12s, box-shadow .12s; }
  .kpi.as-link:hover{ border-color:var(--indigo); box-shadow:0 4px 14px -8px rgba(20,18,40,.25); }
  .go-chevron{ color:var(--ink-faint); align-self:center; }

  .modal.wide{ max-width:680px; }
  .imp-head{ display:flex; gap:9px; flex-wrap:wrap; }
  .imp-summary{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:16px; }
  .imp-fatal{
    display:flex; gap:9px; align-items:flex-start; margin-top:16px; padding:11px 13px; border-radius:9px;
    background:#FBE9E9; border:1px solid #E8C3C3; color:#9E2B2B; font-size:12.5px; line-height:1.6;
  }
  .imp-rows{
    margin-top:10px; border:1px solid var(--border); border-radius:9px; overflow:hidden;
    max-height:230px; overflow-y:auto;
  }
  .imp-row{
    display:flex; align-items:center; gap:9px; padding:7px 11px; font-size:12px;
    border-bottom:1px solid var(--border-soft);
  }
  .imp-row:last-child{ border-bottom:none; }
  .imp-row.error{ background:#FDF4F4; }
  .imp-line{ width:26px; flex:none; color:var(--ink-faint); font-size:11px; text-align:end; }
  .imp-key{ flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .imp-msg{ color:#9E2B2B; font-size:11.5px; }
</style>
</head>
<body>

<div id="shell">
  <header class="topbar">
    <svg class="header-pattern" style="position:absolute;inset:0;width:100%;height:100%;opacity:.5">
      <rect width="100%" height="100%" fill="url(#starTile)"/></svg>
    <!-- dir="ltr" on the Latin wordmark: in an RTL page the bidi algorithm
         treats the trailing "+" as neutral and renders "+Saydali". -->
    <span class="tb-brand" dir="ltr">Saydali+</span>
    <span class="tb-suite" id="tb-suite">CRM</span>
    <span class="build-tag" id="build-tag"></span>

    <div class="tb-search">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="q" autocomplete="off" oninput="search(this.value)" onfocus="search(this.value)">
      <div id="q-results"></div>
    </div>

    <button class="tb-btn ghost" onclick="openApp()" id="btn-app">
      <svg class="ico"><use href="#i-grid"/></svg><span></span></button>
    <div class="tb-avatar" id="me-avatar"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div id="main">
    <aside class="rail" id="rail"></aside>
    <div class="work">
      <div id="work-head"></div>
      <div class="work-body" id="work-body"></div>
    </div>
  </div>
</div>

<div id="overlay"></div>
<div class="toast" id="toast"></div>

   two characters gave every avatar in the CRM the same two letters. Drop the
   generic word and take one letter from each of the first two that are left. */
const GENERIC_WORDS = /^(صيدلية|صيدليه|pharmacy|dr|د\.|al|the)$/i;
function initialsOf(text) {
  const words = String(text || '').split(/[\s—·-]+/).filter(w => w && !GENERIC_WORDS.test(w));
  if (!words.length) return String(text || '?').trim().slice(0, 2);
  return words.slice(0, 2).map(w => w[0]).join('');
}

const TODAY = new Date(2026, 8, 11); // the demo's "now" — 11 September 2026

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function relDays(iso) {
  const n = daysBetween(iso, TODAY.toISOString().slice(0, 10));
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n > 0) return n + ' days ago';
  if (n === -1) return 'Tomorrow';
  return 'in ' + (-n) + ' days';
}

/* ==========================================================================
   3. CHARTS
   Rules this file holds itself to, from the data-viz method:
     - Ordered categories (the funnel) take the ordinal indigo ramp, validated.
     - Nominal categories (districts, lead sources) take ONE colour for every
       bar. Colouring them darker-where-bigger would double-encode the bar's
       own length and burn the only free channel.
     - Thin marks, hairline grid, 4px rounded data-ends against a square
       baseline, 2px lines, >=8px end markers with a 2px surface ring.
     - Every chart has a hover layer AND a table twin. A tooltip enhances; it
       never gates a value.
     - Time axes render dir="ltr" in both languages: an Arabic chart still
       reads earliest-to-latest left to right, and mirroring it is the kind of
       cleverness that makes a reader distrust the numbers.
   ========================================================================== */

const CHART_SURFACE = '#FFFFFF';
let tipEl = null;

function ensureTip() {
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.className = 'tip';
    document.body.appendChild(tipEl);
  }
  return tipEl;
}
function showTip(html, x, y) {
  const el = ensureTip();
  el.innerHTML = html;
  el.style.left = x + 'px';
  el.style.top = (y - 8) + 'px';
  el.classList.add('on');
}
function hideTip() { if (tipEl) tipEl.classList.remove('on'); }

/* Wires hover + keyboard focus to the same tooltip, so a keyboard reader gets
   what a mouse reader gets. */
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    const show = () => {
      const r = el.getBoundingClientRect();
      showTip(el.dataset.tip, r.left + r.width / 2, r.top);
    };
    el.addEventListener('mouseenter', show);
    el.addEventListener('focus', show);
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('blur', hideTip);
  });
}

/* ---------- Funnel: ordered stages, ordinal ramp ---------- */

function funnelChart(rows, opts) {
  opts = opts || {};
  const max = Math.max(1, ...rows.map(r => r.n));
  const totalValue = rows.reduce((n, r) => n + r.value, 0) || 1;
  const body = rows.map((r, i) => {
    const w = Math.max(2, r.n / max * 100);
    const share = Math.round(r.value / totalValue * 100);
    const tip = esc(r.label) + '<br><b>' + fmt(r.n) + '</b> ' + esc(t('ch.pharmacies')) +
      '<br><b>' + esc(iqd(r.value)) + '</b>' + esc(t('mo')) +
      '<br>' + esc(t('ch.share')) + ' <b>' + share + '%</b>';
    return '<div class="funnel-row">' +
      '<span class="funnel-label">' + esc(r.label) + '</span>' +
      '<span class="funnel-track"><span class="funnel-bar" tabindex="0" role="img" ' +
        'aria-label="' + esc(r.label + ': ' + r.n) + '" data-tip="' + esc(tip) + '" ' +
        'style="width:' + w + '%;background:' + r.color + '"></span></span>' +
      '<span class="funnel-n">' + fmt(r.n) + '</span>' +
      '<span class="funnel-pct">' + share + '%</span>' +
    '</div>';
  }).join('');

  const table = '<table class="mini"><thead><tr>' +
    '<th>' + esc(t('ch.stageCol')) + '</th><th style="text-align:end">' + esc(t('ch.count')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.valueCol')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.share')) + '</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.label) + '</td><td class="n">' + fmt(r.n) + '</td>' +
      '<td class="n">' + fmt(r.value) + '</td>' +
      '<td class="n">' + Math.round(r.value / totalValue * 100) + '%</td></tr>').join('') +
    '</tbody></table>';

  return chartCard(opts.title, opts.sub, body, table, 'funnel');
}

/* ---------- Single-series trend: 2px line, end marker, crosshair ---------- */

function trendChart(points, opts) {
  opts = opts || {};
  const W = 100, H = 42, padT = 4, padB = 12;
  const max = Math.max(1, ...points.map(p => p.n));
  const stepX = points.length > 1 ? W / (points.length - 1) : 0;
  const yOf = n => padT + (1 - n / max) * (H - padT - padB);
  const xOf = i => i * stepX;

  const line = points.map((p, i) => (i ? 'L' : 'M') + xOf(i).toFixed(2) + ' ' + yOf(p.n).toFixed(2)).join(' ');
  const area = line + ' L' + xOf(points.length - 1).toFixed(2) + ' ' + (H - padB) + ' L0 ' + (H - padB) + ' Z';
  const last = points[points.length - 1];

  // Gridlines are solid hairlines, one shade off the surface — never dashed.
  const grid = [0, 0.5, 1].map(f => {
    const y = padT + f * (H - padT - padB);
    return '<line class="grid-line" x1="0" y1="' + y.toFixed(2) + '" x2="' + W + '" y2="' + y.toFixed(2) +
      '" vector-effect="non-scaling-stroke"/>';
  }).join('');

  // One hit band per point, wide enough to land on without aiming.
  const bands = points.map((p, i) => {
    const bw = stepX || W;
    const bx = Math.max(0, xOf(i) - bw / 2);
    const tip = esc(p.label) + '<br><b>' + fmt(p.n) + '</b> ' + esc(t('ch.pharmacies'));
    return '<rect x="' + bx.toFixed(2) + '" y="0" width="' + Math.min(bw, W - bx).toFixed(2) + '" height="' + H + '" ' +
      'fill="transparent" tabindex="0" role="img" aria-label="' + esc(p.label + ': ' + p.n) + '" ' +
      'data-tip="' + esc(tip) + '"/>';
  }).join('');

  const dots = points.map((p, i) =>
    '<circle cx="' + xOf(i).toFixed(2) + '" cy="' + yOf(p.n).toFixed(2) + '" r="1.4" fill="var(--series)" ' +
    'stroke="' + CHART_SURFACE + '" stroke-width="0.9" vector-effect="non-scaling-stroke"/>').join('');

  const body =
    '<div dir="ltr">' +
    '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:132px">' +
      grid +
      '<path d="' + area + '" fill="var(--series-soft)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--series)" stroke-width="2" ' +
        'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      dots +
      /* The end marker is the one direct label: the latest value is the point
         of a trend, and a number on every dot is chaos. */
      '<circle cx="' + xOf(points.length - 1).toFixed(2) + '" cy="' + yOf(last.n).toFixed(2) + '" r="2.6" ' +
        'fill="var(--series)" stroke="' + CHART_SURFACE + '" stroke-width="1.4" vector-effect="non-scaling-stroke"/>' +
      '<line class="axis-line" x1="0" y1="' + (H - padB) + '" x2="' + W + '" y2="' + (H - padB) + '" ' +
        'vector-effect="non-scaling-stroke"/>' +
      bands +
    '</svg>' +
    '<div style="display:flex;justify-content:space-between;margin-top:2px;">' +
      points.map(p => '<span class="axis-text" style="font-size:10px;">' + esc(p.short) + '</span>').join('') +
    '</div></div>';

  const table = '<table class="mini"><thead><tr><th>' + esc(t('ch.month')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.count')) + '</th></tr></thead><tbody>' +
    points.map(p => '<tr><td>' + esc(p.label) + '</td><td class="n">' + fmt(p.n) + '</td></tr>').join('') +
    '</tbody></table>';

  return chartCard(opts.title, opts.sub, body, table, 'trend');
}

/* ---------- Nominal magnitude: one colour for every bar ---------- */

function barChart(rows, opts) {
  opts = opts || {};
  const max = Math.max(1, ...rows.map(r => r.n));
  const body = rows.map(r => {
    const w = Math.max(2, r.n / max * 100);
    const tip = esc(r.label) + '<br><b>' + fmt(r.n) + '</b>' + (opts.unit ? ' ' + esc(opts.unit) : '');
    return '<div class="funnel-row">' +
      '<span class="funnel-label">' + esc(r.label) + '</span>' +
      '<span class="funnel-track" style="height:16px;"><span class="funnel-bar" tabindex="0" role="img" ' +
        'aria-label="' + esc(r.label + ': ' + r.n) + '" data-tip="' + esc(tip) + '" ' +
        'style="width:' + w + '%;background:var(--series);height:16px;"></span></span>' +
      '<span class="funnel-n">' + fmt(r.n) + '</span>' +
    '</div>';
  }).join('');

  const table = '<table class="mini"><thead><tr><th>' + esc(opts.catCol || t('ch.districtCol')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.count')) + '</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.label) + '</td><td class="n">' + fmt(r.n) + '</td></tr>').join('') +
    '</tbody></table>';

  return chartCard(opts.title, opts.sub, body, table, opts.id || 'bar');
}

/* A chart and its table twin share one card; the toggle swaps which is shown.
   The table is not a fallback — it is the WCAG-clean equivalent, always one
   click away. */
const tableOpen = {};
function chartCard(title, sub, chartBody, tableBody, id) {
  const showing = !!tableOpen[id];
  return '<section class="panel">' +
    '<div class="chart-h"><span class="chart-t">' + esc(title) + '</span>' +
      (sub ? '<span class="chart-s">' + esc(sub) + '</span>' : '') +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="table-toggle" onclick="toggleTable(' + attr(id) + ')">' +
        esc(showing ? t('a.viewChart') : t('a.viewTable')) + '</button></div>' +
    '<div class="chart-wrap">' + (showing ? tableBody : chartBody) + '</div>' +
  '</section>';
}
function toggleTable(id) { tableOpen[id] = !tableOpen[id]; render(); }

/* Sparkline for a stat tile. No tooltip: a stat tile's value is the text
   beside it, and the spark is context, not a plot to interrogate. */
function sparkline(values, tone) {
  const W = 100, H = 26;
  const max = Math.max(1, ...values), min = Math.min(...values);
  const span = (max - min) || 1;
  const d = values.map((v, i) =>
    (i ? 'L' : 'M') + (i / (values.length - 1) * W).toFixed(2) + ' ' +
    (H - 3 - ((v - min) / span) * (H - 8)).toFixed(2)).join(' ');
  return '<svg class="kpi-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + '" fill="none" stroke="' + (tone || 'var(--series)') + '" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="0.85"/></svg>';
}

/* ==========================================================================
   4. DERIVED FACTS
   Conclusions, not columns — computed so they cannot go stale. The ones that
   matter are the silent failures: an order nobody applied for, a pharmacy
   verified weeks ago that has never posted, and a pharmacist whose Syndicate
   number does not appear in the roster we were given.
   ========================================================================== */

const ISO_TODAY = TODAY.toISOString().slice(0, 10);
const DORMANT_AFTER_DAYS = 10;
const AT_RISK_QUIET_DAYS = 30;
const TRIAL_ENDING_WITHIN = 7;

const trialLeft = p => Math.max(0, p.trialDays - p.trialUsed);
const daysSinceSignup = p => daysBetween(p.signedUp, ISO_TODAY);
const fillRate = p => p.orders ? Math.round(p.filled / p.orders * 100) : null;

const isDormant = p => p.verification === 'verified' && p.orders === 0 && daysSinceSignup(p) >= DORMANT_AFTER_DAYS;
const isAtRisk = p => p.orders > 0 && p.lastOrder && daysBetween(p.lastOrder, ISO_TODAY) >= AT_RISK_QUIET_DAYS;
const isTrialEnding = p => p.verification !== 'rejected' && trialLeft(p) > 0 && trialLeft(p) <= TRIAL_ENDING_WITHIN;
const isActivePharmacy = p => p.orders > 0 && !isAtRisk(p);

/* An order that is open and nobody has applied for is the one the team has to
   act on today: the rate is wrong, the district is thin, or the notice is too
   short. All three are fixable, and only while the order is still open. */
const isUnclaimed = o => o.status === 'open' && o.applicants === 0;
const isToday = o => o.date === ISO_TODAY;

function pharmacyHealth(p) {
  if (p.verification === 'pending')  return { key:'pending',  chip:'chip-warn', ico:'clock',        label:t('vs.pending') };
  if (p.verification === 'rejected') return { key:'rejected', chip:'chip-bad',  ico:'x',            label:t('vs.rejected') };
  if (isDormant(p))                  return { key:'dormant',  chip:'chip-bad',  ico:'alert',        label:t('v.dormant') };
  if (isAtRisk(p))                   return { key:'atrisk',   chip:'chip-warn', ico:'alert',        label:t('v.atRisk') };
  return { key:'ok', chip:'chip-good', ico:'check-circle', label:t('vs.verified') };
}

/* ---------- The Syndicate match ----------
   The roster is a spreadsheet somebody sent us, so a match is a suggestion,
   never a decision. Three outcomes worth telling apart: the number is absent
   (we cannot verify this person at all), the number is there and the name
   agrees (a reviewer can approve in seconds), and the number is there but the
   name does not (which is either a transliteration or a problem, and only a
   person can say which). */
function normaliseName(s) {
  return String(s || '')
    .replace(/[ً-ْٰ]/g, '')   // Arabic diacritics
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[^\p{L}\s]/gu, ' ')
    .toLowerCase().split(/\s+/).filter(Boolean);
}
function namesAgree(a, b) {
  const x = normaliseName(a), y = normaliseName(b);
  if (!x.length || !y.length) return false;
  // A roster carries the full tribal name; a sign-up often carries three parts
  // of it. Agreement means the shorter name's words all appear in the longer.
  const [short, long] = x.length <= y.length ? [x, y] : [y, x];
  const hits = short.filter(w => long.includes(w)).length;
  return hits >= Math.min(2, short.length) && hits / short.length >= 0.6;
}
function syndicateMatch(user) {
  /* Owners are pharmacists with a shop, so they are matched against the roster
     on the same terms — their licence rests on the same registration. */
  const isPharmacist = user.type === 'pharmacist' || user.type === 'owner';
  if (!isPharmacist || !user.syndicateNo) return { key:'notLinked', chip:'chip-mute', row:null };
  const row = DATA.syndicate.find(r => r.no.toLowerCase() === String(user.syndicateNo).toLowerCase());
  if (!row) return { key:'unmatched', chip:'chip-bad', ico:'alert', row:null };
  if (!namesAgree(L(user.name), L(row.name))) return { key:'nameDiff', chip:'chip-warn', ico:'alert', row };
  return { key:'matched', chip:'chip-good', ico:'check-circle', row };
}
/* The mirror: for a roster row, which platform user claims it. */
function rosterUser(row) {
  return DATA.users.find(u => u.syndicateNo && u.syndicateNo.toLowerCase() === row.no.toLowerCase()) || null;
}

/* ---------- Drugs ---------- */
const brandsOf = sci => DATA.brands.filter(b => b.sci === sci);
const brandsOfCompany = co => DATA.brands.filter(b => b.company === co);
const drugOf = sci => DATA.drugs.find(d => d.sci === sci) || null;
/* A brand's real doses: its own if it overrides, otherwise the molecule's. */
const brandDoses = b => (b.dosesOverride && b.dosesOverride.length) ? b.dosesOverride : (drugOf(b.sci) || {doses:[]}).doses;
const SEV_RANK = { critical:3, serious:2, warning:1 };
/* The seed is '', whose rank is undefined — and every comparison with undefined
   is false, so `rank[sev] > rank[seed]` never fired and every drug reported no
   interaction at all. Coerce both sides. */
const worstInteraction = d => (d.interactions || [])
  .reduce((w, i) => ((SEV_RANK[i.severity] || 0) > (SEV_RANK[w] || 0) ? i.severity : w), '');

/* ---------- Cross-module lookups ---------- */
const ordersOfPharmacy = pid => DATA.orders.filter(o => o.pharmacy === pid);
const ordersOfUser = uid => DATA.orders.filter(o => o.assignee === uid);
const usersOfUniversity = vid => DATA.users.filter(u => u.university === vid);
const pharmacyOf = pid => DATA.pharmacies.find(p => p.id === pid) || null;
const userOf = uid => DATA.users.find(u => u.id === uid) || null;
const companyOf = cid => DATA.companies.find(c => c.id === cid) || null;

const tasksFor = (kind, id) => DATA.tasks.filter(x => x.related && x.related.kind === kind && x.related.id === id);
const activityFor = (kind, id) => DATA.activity
  .filter(e => e.kind === kind && e.id2 === id)
  .slice().sort((a, b) => b.when.localeCompare(a.when));

/* Records are keyed differently per module — drugs by scientific name, syndicate
   rows by number — so one lookup knows where each module's identity lives. */
const ID_FIELD = { drugs:'sci', syndicate:'no' };
const idOf = (mod, r) => r[ID_FIELD[mod] || 'id'];
function findRecord(mod, id) {
  const set = DATA[mod] || [];
  return set.find(r => String(idOf(mod, r)) === String(id)) || null;
}
function recordName(kind, id) {
  const r = findRecord(kind, id);
  if (!r) return String(id);
  if (kind === 'drugs') return r.sci;
  if (kind === 'syndicate') return L(r.name);
  if (kind === 'orders') return r.id;
  return L(r.name || r.subject);
}

function orderStatusRows() {
  return ORDER_STATUS.map(s => {
    const os = DATA.orders.filter(o => o.status === s);
    return {
      key:s, label:t('os.' + s), n:os.length,
      value:os.reduce((n, o) => n + o.total, 0),
      color:ORDER_STATUS_COLOR[s]
    };
  });
}

function visibleRows(mod) {
  const M = MODULES[mod];
  const view = M.views[S.view[mod]] || M.views.all;
  let rows = M.data().filter(view.fn);

  const f = S.filters[mod] || {};
  Object.keys(f).forEach(facet => { if (f[facet]) rows = rows.filter(r => FACETS[facet].of(r) === f[facet]); });

  const sort = S.sort[mod];
  if (sort) {
    const col = M.columns.find(c => c.key === sort.key);
    if (col) {
      const val = r => col.sortAs ? col.sortAs(r) : (col.get ? col.get(r) : L(r[col.key]) || r[col.key] || '');
      rows = rows.slice().sort((a, b) => {
        const x = val(a), y = val(b);
        const c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y));
        return sort.dir === 'desc' ? -c : c;
      });
    }
  }
  return rows;
}

function listHead(mod) {
  const M = MODULES[mod];
  const cur = S.view[mod];
  const menu = S.viewMenu === mod
    ? '<div class="view-menu">' + Object.keys(M.views).map(k => {
        const n = M.data().filter(M.views[k].fn).length;
        return '<button class="view-opt' + (k === cur ? ' on' : '') + '" onclick="pickView(' + attr(mod) + ',' + attr(k) + ')">' +
          esc(t(M.views[k].label)) + '<span class="count">' + fmt(n) + '</span></button>';
      }).join('') + '</div>'
    : '';
  const picked = (S.picked[mod] || []).length;

  return '<div class="work-head">' +
      '<div style="position:relative;">' +
        '<button class="view-select" onclick="toggleViewMenu(' + attr(mod) + ')">' +
          esc(t(M.views[cur].label)) + icon('caret') + '</button>' + menu +
      '</div>' +
      '<span class="chip chip-mute figure">' + fmt(visibleRows(mod).length) + '</span>' +
      '<span class="spacer"></span>' +
      (M.importer
        ? '<button class="btn" onclick="openImport(' + attr(M.importer) + ')">' + icon('upload') +
          esc(t('imp.title')) + '</button>'
        : '') +
      '<button class="btn" onclick="resetFilters(' + attr(mod) + ')">' + icon('refresh') + esc(t('a.refresh')) + '</button>' +
      (FORMS[mod] ? '<button class="btn primary" onclick="openNew(' + attr(mod) + ')">' + icon('plus') + esc(t('a.new')) + '</button>' : '') +
    '</div>' +
    (M.note ? '<div class="mod-note">' + icon('alert') + '<span>' + esc(t(M.note)) + '</span></div>' : '') +
    (M.placeholder ? '<div class="mod-note stage">' + icon('flag') + '<span>' + esc(t(M.placeholder)) + '</span></div>' : '') +
    (picked
      ? '<div class="bulkbar">' + esc(t('a.selected', {n:picked})) +
          '<span class="spacer" style="flex:1"></span>' +
          '<button class="btn danger" onclick="bulkDelete(' + attr(mod) + ')">' + icon('trash') + esc(t('a.delete')) + '</button>' +
          '<button class="btn" onclick="clearPicked(' + attr(mod) + ')">' + esc(t('a.clear')) + '</button>' +
        '</div>'
      : '');
}

function listRail(mod) {
  const M = MODULES[mod];
  const all = M.data();
  const f = S.filters[mod] || {};
  let html = '<div class="rail-h">' + esc(t('f.filters')) + '</div>';

  M.facets.forEach(facet => {
    const F = FACETS[facet];
    const values = [...new Set(all.map(F.of))].filter(v => v != null);
    if (!values.length) return;
    html += '<div class="rail-h">' + esc(t(F.label)) + '</div>' +
      '<button class="rail-opt' + (!f[facet] ? ' on' : '') + '" onclick="setFilter(' + attr(mod) + ',' + attr(facet) + ',null)">' +
        esc(t('f.all')) + '<span class="count">' + fmt(all.length) + '</span></button>' +
      values.map(v =>
        '<button class="rail-opt' + (f[facet] === v ? ' on' : '') + '" onclick="setFilter(' + attr(mod) + ',' + attr(facet) + ',' + attr(v) + ')">' +
          esc(F.name(v)) + '<span class="count">' + fmt(all.filter(r => F.of(r) === v).length) + '</span></button>').join('');
  });

  if (Object.keys(f).some(k => f[k]))
    html += '<button class="rail-clear" onclick="resetFilters(' + attr(mod) + ')">' + esc(t('f.clear')) + '</button>';
  return html;
}

function listBody(mod) {
  const M = MODULES[mod];
  const rows = visibleRows(mod);
  const picked = S.picked[mod] || [];
  const sort = S.sort[mod];

  if (!rows.length) {
    return '<div class="empty">' + icon('search') + '<div>' + esc(t('e.noRecords')) + '</div>' +
      '<div style="font-size:12px;">' + esc(t('e.tryClearing')) + '</div></div>';
  }

  const allPicked = rows.every(r => picked.includes(idOf(mod, r)));
  const head = '<tr><th class="col-check"><input type="checkbox"' + (allPicked ? ' checked' : '') +
      ' onchange="pickAll(' + attr(mod) + ', this.checked)"></th>' +
    M.columns.map(c =>
      '<th class="sortable"' + (c.num ? ' style="text-align:end"' : '') + ' onclick="sortBy(' + attr(mod) + ',' + attr(c.key) + ')">' +
        esc(t(c.label)) +
        (sort && sort.key === c.key ? icon(sort.dir === 'asc' ? 'up' : 'down') : icon('sort')) +
      '</th>').join('') + '</tr>';

  const body = rows.map(r => {
    const rid = idOf(mod, r);
    const on = picked.includes(rid);
    return '<tr class="' + (on ? 'picked' : '') + '">' +
      '<td class="col-check"><input type="checkbox"' + (on ? ' checked' : '') +
        ' onchange="pickOne(' + attr(mod) + ',' + attr(rid) + ', this.checked)"></td>' +
      M.columns.map(c => {
        if (c.chip) { const v = c.chip(r); return '<td>' + (typeof v === 'string' ? v : '') + '</td>'; }
        const raw = c.get ? c.get(r) : (L(r[c.key]) || r[c.key] || '—');
        const tone = c.tone && c.tone(r);
        if (c.main) return '<td><button class="cell-link' + (c.mono ? ' figure' : '') + '" onclick="openRecord(' +
          attr(mod) + ',' + attr(rid) + ')">' + esc(raw) + '</button></td>';
        return '<td' + (c.num ? ' class="figure" style="text-align:end"' : c.mono ? ' class="figure" dir="ltr"' : '') +
          (tone ? ' style="color:' + tone + ';font-weight:600"' : '') + '>' + esc(raw) + '</td>';
      }).join('') + '</tr>';
  }).join('');

  return '<table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

function fieldRow(label, value, edit) {

      (edit ? ' onclick="startEdit(this,' + attr(edit.path) + ',' + attr(edit.type || 'text') + ')"' : '') +
      '>' + (value === '' || value == null ? '—' : value) + '</span></div>';
}

function timelinePanel(kind, id) {
  const items = activityFor(kind, id);
  const icons = { call:'phone', visit:'pin', note:'note', followup:'clock', demo:'cap' };
  return '<section class="panel">' +
    '<div class="panel-h">' + icon('clock') + esc(t('rec.timeline')) + '</div>' +
    '<div class="note-box">' +
      '<textarea id="note-input" placeholder="' + esc(t('a.addNote')) + '"></textarea>' +
      '<button class="btn primary" onclick="addNote(' + attr(kind) + ',' + attr(id) + ')">' + esc(t('a.post')) + '</button>' +
    '</div>' +
    (items.length
      ? '<div class="timeline">' + items.map(e =>
          '<div class="tl-item"><span class="tl-dot">' + icon(icons[e.type] || 'note') + '</span>' +
          '<div style="flex:1;min-width:0;"><div class="tl-title">' + esc(L(e.text)) + '</div>' +
          '<div class="tl-meta">' + esc(t('ty.' + e.type)) + ' · ' + esc(L(USERS[e.owner].name)) +

function relatedPanel(title, rows, onOpen, extraHead) {

      (extraHead || '') +

      ? '<div class="panel-b flush">' + rows.map(r =>
          '<button class="task-row" style="width:100%;text-align:start;" onclick="' + onOpen(r) + '">' +
            '<div style="flex:1;min-width:0;"><div class="task-t">' + esc(r._t) + '</div>' +
            '<div class="task-m">' + r._m + '</div></div></button>').join('') + '</div>'
      : '<div class="empty" style="padding:22px;font-size:12px;">' + esc(t('rec.noneYet')) + '</div>') +

function recordPage(mod, id) {
  const rec = findRecord(mod, id);
  if (!rec) return '<div class="empty">' + esc(t('e.noRecords')) + '</div>';

  const kv = (ic, label, value) =>
    '<div class="kv">' + icon(ic) + '<div><div class="kv-label">' + esc(label) + '</div>' +
    '<div class="kv-value">' + value + '</div></div></div>';
  const P = mod + '.' + id + '.';

  let title = recordName(mod, id), sub = '', actions = '', details = '', side = '', main = '';

  /* ---------- User ---------- */
  if (mod === 'users') {
    const m = syndicateMatch(rec);
    sub = typeChip(rec.type) + verifChip(rec.verification) +
      '<span>' + esc(districtName(rec.district)) + '</span>';
    actions =
      '<button class="btn" onclick="logCall(' + attr(mod) + ',' + attr(id) + ')">' + icon('phone') + esc(t('a.call')) + '</button>' +
      (rec.verification === 'pending'
        ? '<button class="btn primary" onclick="verifyUser(' + attr(id) + ')">' + icon('check-circle') + esc(t('a.verify')) + '</button>'
        : '');
    details =
      fieldRow(t('c.nameAr'), '<span dir="rtl">' + esc(AR(rec.name)) + '</span>') +
      fieldRow(t('c.userType'), typeChip(rec.type)) +
      fieldRow(t('c.phone'), '<span class="figure" dir="ltr">' + esc(rec.phone) + '</span>', { path:P + 'phone' }) +
      fieldRow(t('c.email'), '<span class="figure" dir="ltr">' + esc(rec.email) + '</span>', { path:P + 'email' }) +
      fieldRow(t('c.district'), esc(districtName(rec.district)), { path:P + 'district', type:'district' }) +
      fieldRow(t('c.joined'), esc(fmtDate(rec.joined))) +
      /* An owner is a pharmacist too, so they carry the pharmacist fields AND
         the pharmacy link — the record shows both rather than picking one. */
      (rec.type === 'pharmacist' || rec.type === 'owner'
        ? fieldRow(t('c.syndicateNo'), '<span class="figure" dir="ltr">' + esc(rec.syndicateNo || '') + '</span>', { path:P + 'syndicateNo' }) +
          fieldRow(t('c.gradYear'), esc(String(rec.gradYear || ''))) +
          fieldRow(t('c.reliability'), rec.reliability === null
            ? '<span class="no-record">' + esc(t('app.noRecord')) + '</span>'
            : '<span class="figure">' + pct(rec.reliability) + '</span>') +
          fieldRow(t('c.ratingV'), rec.rating === null
            ? '<span class="no-record">' + esc(t('app.noRecord')) + '</span>'
            : '<span class="figure">' + rec.rating + '</span>')
        : '') +
      (rec.type === 'owner' && rec.pharmacy
        ? fieldRow(t('c.pharmacy'), '<button class="cell-link" onclick="openRecord(' + attr('pharmacies') + ',' + attr(rec.pharmacy) + ')">' +
            esc(recordName('pharmacies', rec.pharmacy)) + '</button>') : '') +
      (rec.type === 'student' && rec.university
        ? fieldRow(t('c.university'), '<button class="cell-link" onclick="openRecord(' + attr('universities') + ',' + attr(rec.university) + ')">' +
            esc(recordName('universities', rec.university)) + '</button>') : '');

    /* The verification panel. It says out loud what the check actually is —
       a person comparing a card against a list someone emailed us. */
    if (rec.type === 'pharmacist' || rec.type === 'owner') {
      side += '<section class="panel">' +
        '<div class="panel-h">' + icon('badge') + esc(t('mod.syndicate')) + '<span class="spacer"></span>' +
          chip(m.chip, m.ico, t('mt.' + m.key)) + '</div>' +
        '<div class="panel-b">' +
          fieldRow(t('c.syndicateNo'), '<span class="figure" dir="ltr">' + esc(rec.syndicateNo || '—') + '</span>') +
          (m.row
            ? fieldRow('Name on the roster',
                '<button class="cell-link" onclick="openRecord(' + attr('syndicate') + ',' + attr(m.row.no) + ')">' +
                esc(L(m.row.name)) + '</button>') +
              fieldRow(t('c.syndStatus'), chip(m.row.status === 'active' ? 'chip-good' : 'chip-bad',
                m.row.status === 'active' ? 'check-circle' : 'x', t('ss.' + m.row.status))) +
              fieldRow(t('c.batch'), esc(fmtDate(m.row.batch)))
            : '') +
          '<p class="inline-note" style="margin-top:10px;">' + esc(t('sy.note')) + '</p>' +
        '</div></section>';
    }

    const mine = ordersOfUser(id);
    side += relatedPanel(t('c.orders'), mine.map(o => ({
      _t:o.id + ' · ' + recordName('pharmacies', o.pharmacy),
      _m:orderStatusChip(o.status) + ' ' + esc(orderWhen(o)), id:o.id
    })), r => 'openRecord(' + attr('orders') + ',' + attr(r.id) + ')');

  /* ---------- Order ---------- */
  } else if (mod === 'orders') {
    const ph = pharmacyOf(rec.pharmacy);
    sub = orderTypeChip(rec.type) + orderStatusChip(rec.status) +
      '<span>' + esc(districtName(rec.district)) + '</span>';
    actions = ORDER_STATUS.filter(s => s !== rec.status).slice(0, 3).map(s =>
      '<button class="btn" onclick="setOrderStatus(' + attr(id) + ',' + attr(s) + ')">' + esc(t('os.' + s)) + '</button>').join('') +
      (ph ? '<button class="btn primary" onclick="openRecord(' + attr('pharmacies') + ',' + attr(ph.id) + ')">' +
        icon('building') + esc(L(ph.name)) + '</button>' : '');
    details =
      fieldRow(t('c.orderType'), orderTypeChip(rec.type)) +
      fieldRow(t('c.pharmacy'), ph ? '<button class="cell-link" onclick="openRecord(' + attr('pharmacies') + ',' + attr(ph.id) + ')">' +
        esc(L(ph.name)) + '</button>' : '—') +
      fieldRow(t('c.when'), esc(orderWhen(rec))) +
      (rec.type === 'shift'
        ? fieldRow(t('c.hours'), '<span class="figure">' + rec.hours + '</span>') +
          fieldRow(t('c.rate'), '<span class="figure">' + esc(iqd(rec.rate)) + '</span>' +
            (rec.rateType === 'hourly' ? '/hour' : '')) +
          fieldRow(t('c.total'), '<span class="figure">' + esc(iqd(rec.total)) + '</span>') +
          fieldRow(t('c.controlled'), rec.controlled

  /* ---------- Drug ---------- */
  } else if (mod === 'drugs') {
