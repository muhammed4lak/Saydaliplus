/* ==========================================================================
   3. CHARTS
   Rules this file holds itself to, from the data-viz method:
     - Ordered categories (the funnel) take the ordinal indigo ramp, validated.
     - Nominal categories (districts, lead sources) take ONE colour for every
       bar. Colouring them darker-where-bigger would double-encode the bar's
       own length and burn the only free channel.
     - Thin marks, hairline grid, 4px rounded data-ends against a square
       baseline, 2px lines, >=8px end markers with a 2px surface ring.
     - Every chart has a hover layer AND a table twin. A tooltip enhances; it
       never gates a value.
     - Time axes render dir="ltr" in both languages: an Arabic chart still
       reads earliest-to-latest left to right, and mirroring it is the kind of
       cleverness that makes a reader distrust the numbers.
   ========================================================================== */

const CHART_SURFACE = '#FFFFFF';
let tipEl = null;

function ensureTip() {
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.className = 'tip';
    document.body.appendChild(tipEl);
  }
  return tipEl;
}
function showTip(html, x, y) {
  const el = ensureTip();
  el.innerHTML = html;
  el.style.left = x + 'px';
  el.style.top = (y - 8) + 'px';
  el.classList.add('on');
}
function hideTip() { if (tipEl) tipEl.classList.remove('on'); }

/* Wires hover + keyboard focus to the same tooltip, so a keyboard reader gets
   what a mouse reader gets. */
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    const show = () => {
      const r = el.getBoundingClientRect();
      showTip(el.dataset.tip, r.left + r.width / 2, r.top);
    };
    el.addEventListener('mouseenter', show);
    el.addEventListener('focus', show);
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('blur', hideTip);
  });
}

/* ---------- Funnel: ordered stages, ordinal ramp ---------- */

function funnelChart(rows, opts) {
  opts = opts || {};
  const max = Math.max(1, ...rows.map(r => r.n));
  const totalValue = rows.reduce((n, r) => n + r.value, 0) || 1;
  const body = rows.map((r, i) => {
    const w = Math.max(2, r.n / max * 100);
    const share = Math.round(r.value / totalValue * 100);
    const tip = esc(r.label) + '<br><b>' + fmt(r.n) + '</b> ' + esc(t('ch.pharmacies')) +
      '<br><b>' + esc(iqd(r.value)) + '</b>' + esc(t('mo')) +
      '<br>' + esc(t('ch.share')) + ' <b>' + share + '%</b>';
    return '<div class="funnel-row">' +
      '<span class="funnel-label">' + esc(r.label) + '</span>' +
      '<span class="funnel-track"><span class="funnel-bar" tabindex="0" role="img" ' +
        'aria-label="' + esc(r.label + ': ' + r.n) + '" data-tip="' + esc(tip) + '" ' +
        'style="width:' + w + '%;background:' + r.color + '"></span></span>' +
      '<span class="funnel-n">' + fmt(r.n) + '</span>' +
      '<span class="funnel-pct">' + share + '%</span>' +
    '</div>';
  }).join('');

  const table = '<table class="mini"><thead><tr>' +
    '<th>' + esc(t('ch.stageCol')) + '</th><th style="text-align:end">' + esc(t('ch.count')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.valueCol')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.share')) + '</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.label) + '</td><td class="n">' + fmt(r.n) + '</td>' +
      '<td class="n">' + fmt(r.value) + '</td>' +
      '<td class="n">' + Math.round(r.value / totalValue * 100) + '%</td></tr>').join('') +
    '</tbody></table>';

  return chartCard(opts.title, opts.sub, body, table, 'funnel');
}

/* ---------- Single-series trend: 2px line, end marker, crosshair ---------- */

function trendChart(points, opts) {
  opts = opts || {};
  const W = 100, H = 42, padT = 4, padB = 12;
  const max = Math.max(1, ...points.map(p => p.n));
  const stepX = points.length > 1 ? W / (points.length - 1) : 0;
  const yOf = n => padT + (1 - n / max) * (H - padT - padB);
  const xOf = i => i * stepX;

  const line = points.map((p, i) => (i ? 'L' : 'M') + xOf(i).toFixed(2) + ' ' + yOf(p.n).toFixed(2)).join(' ');
  const area = line + ' L' + xOf(points.length - 1).toFixed(2) + ' ' + (H - padB) + ' L0 ' + (H - padB) + ' Z';
  const last = points[points.length - 1];

  // Gridlines are solid hairlines, one shade off the surface — never dashed.
  const grid = [0, 0.5, 1].map(f => {
    const y = padT + f * (H - padT - padB);
    return '<line class="grid-line" x1="0" y1="' + y.toFixed(2) + '" x2="' + W + '" y2="' + y.toFixed(2) +
      '" vector-effect="non-scaling-stroke"/>';
  }).join('');

  // One hit band per point, wide enough to land on without aiming.
  const bands = points.map((p, i) => {
    const bw = stepX || W;
    const bx = Math.max(0, xOf(i) - bw / 2);
    const tip = esc(p.label) + '<br><b>' + fmt(p.n) + '</b> ' + esc(t('ch.pharmacies'));
    return '<rect x="' + bx.toFixed(2) + '" y="0" width="' + Math.min(bw, W - bx).toFixed(2) + '" height="' + H + '" ' +
      'fill="transparent" tabindex="0" role="img" aria-label="' + esc(p.label + ': ' + p.n) + '" ' +
      'data-tip="' + esc(tip) + '"/>';
  }).join('');

  const dots = points.map((p, i) =>
    '<circle cx="' + xOf(i).toFixed(2) + '" cy="' + yOf(p.n).toFixed(2) + '" r="1.4" fill="var(--series)" ' +
    'stroke="' + CHART_SURFACE + '" stroke-width="0.9" vector-effect="non-scaling-stroke"/>').join('');

  const body =
    '<div dir="ltr">' +
    '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:132px">' +
      grid +
      '<path d="' + area + '" fill="var(--series-soft)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--series)" stroke-width="2" ' +
        'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      dots +
      /* The end marker is the one direct label: the latest value is the point
         of a trend, and a number on every dot is chaos. */
      '<circle cx="' + xOf(points.length - 1).toFixed(2) + '" cy="' + yOf(last.n).toFixed(2) + '" r="2.6" ' +
        'fill="var(--series)" stroke="' + CHART_SURFACE + '" stroke-width="1.4" vector-effect="non-scaling-stroke"/>' +
      '<line class="axis-line" x1="0" y1="' + (H - padB) + '" x2="' + W + '" y2="' + (H - padB) + '" ' +
        'vector-effect="non-scaling-stroke"/>' +
      bands +
    '</svg>' +
    '<div style="display:flex;justify-content:space-between;margin-top:2px;">' +
      points.map(p => '<span class="axis-text" style="font-size:10px;">' + esc(p.short) + '</span>').join('') +
    '</div></div>';

  const table = '<table class="mini"><thead><tr><th>' + esc(t('ch.month')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.count')) + '</th></tr></thead><tbody>' +
    points.map(p => '<tr><td>' + esc(p.label) + '</td><td class="n">' + fmt(p.n) + '</td></tr>').join('') +
    '</tbody></table>';

  return chartCard(opts.title, opts.sub, body, table, 'trend');
}

/* ---------- Nominal magnitude: one colour for every bar ---------- */

function barChart(rows, opts) {
  opts = opts || {};
  const max = Math.max(1, ...rows.map(r => r.n));
  const body = rows.map(r => {
    const w = Math.max(2, r.n / max * 100);
    const tip = esc(r.label) + '<br><b>' + fmt(r.n) + '</b>' + (opts.unit ? ' ' + esc(opts.unit) : '');
    return '<div class="funnel-row">' +
      '<span class="funnel-label">' + esc(r.label) + '</span>' +
      '<span class="funnel-track" style="height:16px;"><span class="funnel-bar" tabindex="0" role="img" ' +
        'aria-label="' + esc(r.label + ': ' + r.n) + '" data-tip="' + esc(tip) + '" ' +
        'style="width:' + w + '%;background:var(--series);height:16px;"></span></span>' +
      '<span class="funnel-n">' + fmt(r.n) + '</span>' +
    '</div>';
  }).join('');

  const table = '<table class="mini"><thead><tr><th>' + esc(opts.catCol || t('ch.districtCol')) + '</th>' +
    '<th style="text-align:end">' + esc(t('ch.count')) + '</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.label) + '</td><td class="n">' + fmt(r.n) + '</td></tr>').join('') +
    '</tbody></table>';

  return chartCard(opts.title, opts.sub, body, table, opts.id || 'bar');
}

/* A chart and its table twin share one card; the toggle swaps which is shown.
   The table is not a fallback — it is the WCAG-clean equivalent, always one
   click away. */
const tableOpen = {};
function chartCard(title, sub, chartBody, tableBody, id) {
  const showing = !!tableOpen[id];
  return '<section class="panel">' +
    '<div class="chart-h"><span class="chart-t">' + esc(title) + '</span>' +
      (sub ? '<span class="chart-s">' + esc(sub) + '</span>' : '') +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="table-toggle" onclick="toggleTable(' + attr(id) + ')">' +
        esc(showing ? t('a.viewChart') : t('a.viewTable')) + '</button></div>' +
    '<div class="chart-wrap">' + (showing ? tableBody : chartBody) + '</div>' +
  '</section>';
}
function toggleTable(id) { tableOpen[id] = !tableOpen[id]; render(); }

/* Sparkline for a stat tile. No tooltip: a stat tile's value is the text
   beside it, and the spark is context, not a plot to interrogate. */
function sparkline(values, tone) {
  const W = 100, H = 26;
  const max = Math.max(1, ...values), min = Math.min(...values);
  const span = (max - min) || 1;
  const d = values.map((v, i) =>
    (i ? 'L' : 'M') + (i / (values.length - 1) * W).toFixed(2) + ' ' +
    (H - 3 - ((v - min) / span) * (H - 8)).toFixed(2)).join(' ');
  return '<svg class="kpi-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + '" fill="none" stroke="' + (tone || 'var(--series)') + '" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="0.85"/></svg>';
}

/* ==========================================================================
   4. DERIVED FACTS
   Conclusions, not columns — computed so they cannot go stale. The ones that
   matter are the silent failures: an order nobody applied for, a pharmacy
   verified weeks ago that has never posted, and a pharmacist whose Syndicate
   number does not appear in the roster we were given.
   ========================================================================== */

const ISO_TODAY = TODAY.toISOString().slice(0, 10);
const DORMANT_AFTER_DAYS = 10;
const AT_RISK_QUIET_DAYS = 30;
const TRIAL_ENDING_WITHIN = 7;

const trialLeft = p => Math.max(0, p.trialDays - p.trialUsed);
const daysSinceSignup = p => daysBetween(p.signedUp, ISO_TODAY);
const fillRate = p => p.orders ? Math.round(p.filled / p.orders * 100) : null;

const isDormant = p => p.verification === 'verified' && p.orders === 0 && daysSinceSignup(p) >= DORMANT_AFTER_DAYS;
const isAtRisk = p => p.orders > 0 && p.lastOrder && daysBetween(p.lastOrder, ISO_TODAY) >= AT_RISK_QUIET_DAYS;
const isTrialEnding = p => p.verification !== 'rejected' && trialLeft(p) > 0 && trialLeft(p) <= TRIAL_ENDING_WITHIN;
const isActivePharmacy = p => p.orders > 0 && !isAtRisk(p);

/* An order that is open and nobody has applied for is the one the team has to
   act on today: the rate is wrong, the district is thin, or the notice is too
   short. All three are fixable, and only while the order is still open. */
const isUnclaimed = o => o.status === 'open' && o.applicants === 0;
const isToday = o => o.date === ISO_TODAY;

function pharmacyHealth(p) {
  if (p.verification === 'pending')  return { key:'pending',  chip:'chip-warn', ico:'clock',        label:t('vs.pending') };
  if (p.verification === 'rejected') return { key:'rejected', chip:'chip-bad',  ico:'x',            label:t('vs.rejected') };
  if (isDormant(p))                  return { key:'dormant',  chip:'chip-bad',  ico:'alert',        label:t('v.dormant') };
  if (isAtRisk(p))                   return { key:'atrisk',   chip:'chip-warn', ico:'alert',        label:t('v.atRisk') };
  return { key:'ok', chip:'chip-good', ico:'check-circle', label:t('vs.verified') };
}

/* A pharmacy owner is a pharmacist with an ownership link. Derived, never
   stored — there is no `owner` type to fall out of step with the link. */
/* Ownership is a LIST of links: none, one, or — for the pharmacists who own
   more than one pharmacy — several. "Owner" is derived from it, never stored. */
const ownedIds = u => (u && u.pharmacies) || [];
const isOwner = u => !!(u && u.type === 'pharmacist' && ownedIds(u).length);

/* ---------- The Syndicate match ----------
   The roster is a spreadsheet somebody sent us, so a match is a suggestion,
   never a decision. Three outcomes worth telling apart: the number is absent
   (we cannot verify this person at all), the number is there and the name
   agrees (a reviewer can approve in seconds), and the number is there but the
   name does not (which is either a transliteration or a problem, and only a
   person can say which). */
function normaliseName(s) {
  return String(s || '')
    .replace(/[ً-ْٰ]/g, '')   // Arabic diacritics
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[^\p{L}\s]/gu, ' ')
    .toLowerCase().split(/\s+/).filter(Boolean);
}
function namesAgree(a, b) {
  const x = normaliseName(a), y = normaliseName(b);
  if (!x.length || !y.length) return false;
  // A roster carries the full tribal name; a sign-up often carries three parts
  // of it. Agreement means the shorter name's words all appear in the longer.
  const [short, long] = x.length <= y.length ? [x, y] : [y, x];
  const hits = short.filter(w => long.includes(w)).length;
  return hits >= Math.min(2, short.length) && hits / short.length >= 0.6;
}
function syndicateMatch(user) {
  /* Owners are pharmacists with a shop, so they are matched against the roster
     on the same terms — their licence rests on the same registration. */
  const isPharmacist = user.type === 'pharmacist';
  if (!isPharmacist || !user.syndicateNo) return { key:'notLinked', chip:'chip-mute', row:null };
  const row = DATA.syndicate.find(r => r.no.toLowerCase() === String(user.syndicateNo).toLowerCase());
  if (!row) return { key:'unmatched', chip:'chip-bad', ico:'alert', row:null };
  if (!namesAgree(L(user.name), L(row.name))) return { key:'nameDiff', chip:'chip-warn', ico:'alert', row };
  return { key:'matched', chip:'chip-good', ico:'check-circle', row };
}
/* The mirror: for a roster row, which platform user claims it. */
function rosterUser(row) {
  return DATA.users.find(u => u.syndicateNo && u.syndicateNo.toLowerCase() === row.no.toLowerCase()) || null;
}

/* ---------- Externals ---------- */
const hasRole = (c, r) => !!(c && c.roles && c.roles.indexOf(r) >= 0);
/* Who this bureau speaks for, and who speaks for this principal. */
const principalsOf = c => (c.represents || []).map(companyOf).filter(Boolean);
const bureauxFor = id => DATA.companies.filter(c => (c.represents || []).indexOf(id) >= 0);
/* Products where this external appears in ANY of the three roles a brand
   records — the question "what does Acino have in Iraq?" that the old single
   type could not answer. */
const brandsInvolving = id => DATA.brands.filter(b =>
  b.company === id || b.registrationHolder === id || b.bureau === id);

/* ---------- Drugs ---------- */
const brandsOf = sci => DATA.brands.filter(b => b.sci === sci);
const brandsOfCompany = co => DATA.brands.filter(b => b.company === co);
const drugOf = sci => DATA.drugs.find(d => d.sci === sci) || null;
/* A brand's real doses: its own if it overrides, otherwise the molecule's. */
const brandDoses = b => (b.dosesOverride && b.dosesOverride.length) ? b.dosesOverride : (drugOf(b.sci) || {doses:[]}).doses;
/* Seeds three weeks of tallies across the pharmacies. Deterministic: a fixture
   that reshuffles on every reload makes a report look broken when it is only
   the data that moved. */
(function seedDispensing() {
  const pharmacies = DATA.pharmacies.map(p => p.id);
  const staff = ['u1', 'u2', 'u3'];
  // Weighted towards what a community pharmacy actually turns over, so a
  // consumption report reads like a pharmacy rather than a random sample.
  const common = ['Paracetamol', 'Amoxicillin', 'Ibuprofen', 'Metformin', 'Omeprazole',
                  'Amoxicillin/Clavulanic acid', 'Azithromycin', 'Amlodipine', 'Atorvastatin',
                  'Cetirizine', 'Diclofenac', 'Ciprofloxacin', 'Salbutamol', 'Losartan',
                  'Ferrous sulfate', 'Cholecalciferol', 'Pantoprazole', 'Gliclazide',
                  'Bisoprolol', 'Levothyroxine', 'Metronidazole', 'Loratadine'];
  let seed = 20260918;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  let id = 1;
  for (let back = 0; back < 21; back++) {
    const date = new Date(TODAY.getTime() - back * 864e5).toISOString().slice(0, 10);
    pharmacies.forEach(ph => {
      const rows = 3 + Math.floor(rnd() * 6);
      for (let i = 0; i < rows; i++) {
        const sci = common[Math.floor(rnd() * common.length)];
        const who = staff[Math.floor(rnd() * staff.length)];
        const hit = DATA.dispensing.find(r =>
          r.pharmacy === ph && r.date === date && r.sci === sci && r.pharmacist === who);
        if (hit) { hit.n += 1; continue; }
        DATA.dispensing.push({ id:'D' + (id++), pharmacy:ph, pharmacist:who, date, sci,
                               n:1 + Math.floor(rnd() * 4) });
      }
    });
  }
})();

/* Seeds the billing ledger from the orders already in the fixture, so the
   numbers a report produces reconcile with the orders a person can open. Three
   kinds of row, and the distinction between the last two is the whole reason
   the ledger records a reason:
     commission   — an ordinary chargeable shift
     subscription — the monthly fee
     covered      — a shift the plan's allowance absorbed, charged zero ON PURPOSE */
(function seedLedger() {
  const COMMISSION = 0.10, PHARMACY_SHARE = 0.7, FLOOR = 2500;
  /* W7 — who actually pays. Commission arises at a pharmacy and stays there;
     the subscription belongs to whoever bought the plan, and for a pharmacist
     who owns several that is the OWNER, once, for all of them. Rolling the
     commission up too would lose which pharmacy generated it — the one number
     an owner of several argues about. */
  const holderOf = p => DATA.users.find(u => u.id === p.user) || null;
  const ownedBy  = uid => DATA.pharmacies.filter(x => x.user === uid);
  /* An owner of several is billed as one payer; anyone else by pharmacy. */
  const payerOf  = p => { const h = holderOf(p); return h && ownedBy(h.id).length > 1 ? h.id : null; };
  /* The plan a pharmacy sits under, and the pot its covered shifts come out
     of: the owner's, shared across all their pharmacies, when they have
     several. The owner's pharmacies share one plan — see Part 0. */
  const planFor = p => {
    const uid = payerOf(p);
    return uid ? subscriptionCharge(p.plan, ownedBy(uid).length) : planOf(p);
  };
  const potOf = p => payerOf(p) || p.id;
  let id = 1;
  const row = r => DATA.ledger.push(Object.assign({ id:'L' + (id++) }, r));
  const month = back => {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - back, 1);
    return d.toISOString().slice(0, 8);
  };
  const fee = total => {
    const full = Math.max(total * COMMISSION, FLOOR);
    return Math.round(full) - Math.round(total * COMMISSION * (1 - PHARMACY_SHARE));
  };

  /* THE CURRENT MONTH comes from the orders in this fixture, so a figure in a
     report reconciles with an order somebody can open. */
  const used = {};
  DATA.orders
    .filter(o => o.type === 'shift' && ['completed', 'in_progress', 'assigned'].includes(o.status))
    .slice().sort((a, b) => a.date.localeCompare(b.date))
    .forEach(o => {
      // Looked up directly rather than through pharmacyOf(): this runs while
      // the module is still initialising and that helper is not defined yet.
      const p = DATA.pharmacies.find(x => x.id === o.pharmacy);
      if (!p) return;
      const plan = planFor(p);
      const pot = potOf(p);
      const n = used[pot] || 0;
      const within = plan.monthlyFeeIQD > 0 && n < plan.includedShifts;
      used[pot] = n + 1;
      row({ pharmacy:p.id, payer:payerOf(p), date:o.date,
            kind:within ? 'covered' : 'commission',
            amount:within ? 0 : fee(o.total),
            reason:within ? (plan.id || plan.plan) : 'commission', order:o.id });
    });

  /* THE TWO MONTHS BEFORE are synthetic history. The fixture holds a fortnight
     of orders, which is not enough for any pharmacy to exhaust an allowance, so
     a ledger built only from it would never show a commission row beside a
     covered one — and those two rows are the entire point of the design.
     Deterministic, and not tied to any order: these months' orders are not in
     the fixture, which is also true of a real system three months in. */
  let seed = 20260918;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  [2, 1].forEach(back => {
    const ym = month(back);
    const spent = {};
    DATA.pharmacies.forEach(p => {
      const plan = planFor(p);
      const pot = potOf(p);
      const shifts = 2 + Math.floor(rnd() * 12);
      for (let k = 0; k < shifts; k++) {
        const n = spent[pot] || 0;
        const within = plan.monthlyFeeIQD > 0 && n < plan.includedShifts;
        spent[pot] = n + 1;
        const total = 20000 + Math.floor(rnd() * 5) * 8000;
        row({ pharmacy:p.id, payer:payerOf(p),
              date:ym + String(2 + Math.floor(rnd() * 26)).padStart(2, '0'),
              kind:within ? 'covered' : 'commission',
              amount:within ? 0 : fee(total),
              reason:within ? (plan.id || plan.plan) : 'commission', order:null });
      }
    });
  });

  /* Subscriptions: one row per paying BILL-PAYER per month — a pharmacy
     whose owner has only it, or an owner of several, never both. A pharmacy
     whose owner has others raises no subscription row of its own: its fee is
     inside the owner's. */
  [2, 1, 0].forEach(back => {
    const billed = new Set();
    DATA.pharmacies.forEach(p => {
      const uid = payerOf(p);
      if (uid) {
        if (billed.has(uid)) return;
        billed.add(uid);
        const charge = subscriptionCharge(p.plan, ownedBy(uid).length);
        if (!charge.monthlyFeeIQD) return;
        row({ pharmacy:null, payer:uid, date:month(back) + '01', kind:'subscription',
              amount:charge.monthlyFeeIQD, reason:charge.plan, order:null });
        return;
      }
      const plan = planOf(p);
      if (!plan.monthlyFeeIQD) return;
      row({ pharmacy:p.id, payer:null, date:month(back) + '01', kind:'subscription',
            amount:plan.monthlyFeeIQD, reason:plan.id, order:null });
    });
  });

  DATA.ledger.sort((a, b) => a.date.localeCompare(b.date));
})();

/* One invoice per pharmacy per month, totalling that month's ledger rows. The
   invoice is what a person chases; the ledger is what it is made of. States are
   walked deliberately so the dunning queue has something in every rung. */
(function seedInvoices() {
  /* W7 — one invoice per BILL-PAYER per month. A pharmacist who owns three
     pharmacies gets one invoice covering them, not three: three invoices for
     one person is what they complain about before they complain about the
     price. The per-pharmacy ledger rows underneath are untouched, so "which
     pharmacy cost what" is still answerable. */
  const byKey = {};
  DATA.ledger.forEach(r => {
    const payer = r.payer || r.pharmacy;
    const k = payer + '|' + r.date.slice(0, 7);
    byKey[k] = (byKey[k] || 0) + r.amount;
  });
  const months = [...new Set(DATA.ledger.map(r => r.date.slice(0, 7)))].sort();
  const current = months[months.length - 1];
  let n = 1;
  Object.entries(byKey).forEach(([k, amount]) => {
    if (!amount) return;
    const [payer, month] = k.split('|');
    const isOwnerPayer = payer.charAt(0) === 'U';
    const age = months.length - 1 - months.indexOf(month);
    // Older months are settled; the current one is where the work is.
    const state = age >= 2 ? 'paid'
      : age === 1 ? (payer === 'P4' ? 'overdue' : 'paid')
      : (payer === 'U14' ? 'paid' : payer === 'P4' ? 'grace' : 'due');
    DATA.invoices.push({
      id:'INV-' + String(n++).padStart(4, '0'),
      pharmacy: isOwnerPayer ? null : payer,
      payer: isOwnerPayer ? payer : null,
      month, amount, state,
      issued: month + '-01',
      dueOn: month + '-15',
      collectedOn: state === 'paid' ? month + '-09' : null,
      collectedBy: state === 'paid' ? ['u1', 'u2', 'u3'][n % 3] : null,
      method: state === 'paid' ? ['cash', 'transfer', 'zaincash'][n % 3] : null
    });
  });
})();

/* The two state machines this build adds, and the chips that draw them. Order
   matters: it is what a column sorts by, so a list sorted by status walks the
   workflow rather than the alphabet. */
const LISTING_STATES = ['draft', 'in_review', 'live', 'ended', 'refused'];
const INVOICE_STATES = ['open', 'due', 'overdue', 'grace', 'suspended', 'paid'];

/* ==========================================================================
   THE PRODUCT CATALOGUE (v0.0009, W17)

   Products are what a till scans; molecules are what the Dispensing Helper
   checks. The catalogue is the link, and each product says how far it is
   known. The mapping QUEUE is every product not linked yet — including
   barcodes a pharmacy scanned that matched nothing — most-scanned first,
   because the fleet deciding the order is how the catalogue fills without
   anyone mapping thirty thousand rows on faith.
   ========================================================================== */
(function seedCatalogue() {
  const ph = DATA.pharmacies.map(p => p.id);
  let seed = 20260925;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  DATA.catalogue = PRODUCTS.map(p => Object.assign({}, p, {
    molecules: p.molecules.map(m => Object.assign({}, m)),
    source: 'catalogue',
    scannedBy: ph.filter(() => rnd() < 0.5),
    firstSeen: '2026-08-14',
    /* Fixture: the verified links were checked before the curator role existed,
       which is exactly the gap W19 closes. */
    mappedBy: (p.mapping === 'verified' || p.mapping === 'auto') ? 'u2' : null,
    mappedOn: (p.mapping === 'verified' || p.mapping === 'auto') ? '2026-08-20' : null
  }));
  /* Barcodes scanned at a till that matched nothing. Fictional codes with valid
     check digits, like every barcode in this build. */
  [
    { barcode:'8695400123453', scannedBy:['P1', 'P2', 'P4', 'P7', 'P8'], firstSeen:'2026-09-03' },
    { barcode:'8902200456781', scannedBy:['P2', 'P6', 'P9'],             firstSeen:'2026-09-09' },
    { barcode:'6221000774218', scannedBy:['P4', 'P5'],                   firstSeen:'2026-09-15' },
    { barcode:'6253300188068', scannedBy:['P3'],                         firstSeen:'2026-09-17' }
  ].forEach(r => DATA.catalogue.push({
    barcode:r.barcode, name:null, form:null, strength:'', pack:null, price:null,
    mapping:'unmapped', molecules:[], source:'scan', scannedBy:r.scannedBy,
    firstSeen:r.firstSeen, mappedBy:null, mappedOn:null
  }));
  DATA.catalogue.sort((a, b) =>
    ((a.mapping === 'unmapped' ? 0 : 1) - (b.mapping === 'unmapped' ? 0 : 1)) ||
    (b.scannedBy.length - a.scannedBy.length));
})();

/* Same rule as the app: do we know what is in it, and is what is in it in the
   reference? The two are folded together because an operator triaging the
   queue cares about the answer. */
function productCoverage(p) {
  if (p.mapping === 'nondrug')  return { kind:'nondrug',  outside:[] };
  if (p.mapping === 'unmapped') return { kind:'unmapped', outside:[] };
  const outside = p.molecules.filter(m => m.ref === false);
  const inside  = p.molecules.filter(m => m.ref !== false);
  return { kind: !outside.length ? 'full' : inside.length ? 'partial' : 'none', outside };
}
const MAPPING_CHIP = { verified:['chip-good', 'check-circle'], auto:['chip-warn', null],
                       unmapped:['chip-bad', 'alert'], nondrug:['chip-mute', null] };
const mappingChip = m => chip(MAPPING_CHIP[m][0], MAPPING_CHIP[m][1], t('map.' + m));
const COVERAGE_CHIP = { full:'chip-info', partial:'chip-warn', none:'chip-bad', unmapped:'chip-bad', nondrug:'chip-mute' };
const coverageChip = p => { const k = productCoverage(p).kind; return chip(COVERAGE_CHIP[k], null, t('covc.' + k)); };

/* W7 — an invoice is addressed to a pharmacy, or to the pharmacist who owns
   several, never to both. */
const pharmaciesOf = uid => DATA.pharmacies.filter(p => p.user === uid);
const holderOf     = p => p && p.user ? DATA.users.find(u => u.id === p.user) || null : null;
const ownsSeveral  = p => { const h = holderOf(p); return !!h && pharmaciesOf(h.id).length > 1; };
const billedTo = i => i.payer
  ? recordName('users', i.payer) + ' · ' + t('own.pharmacies', { n:pharmaciesOf(i.payer).length })
  : recordName('pharmacies', i.pharmacy);

const listingStateChip = st => chip(
  st === 'live' ? 'chip-good' : st === 'refused' ? 'chip-bad' :
  st === 'in_review' ? 'chip-warn' : 'chip-mute',
  st === 'live' ? 'check-circle' : st === 'refused' ? 'x' : st === 'draft' ? 'phone' : 'clock',
  t('ls.' + st));

/* The dunning ladder, drawn so a queue reads at a glance: paid is quiet, and
   the further down the ladder a pharmacy has gone the louder it gets. */
const invoiceStateChip = st => chip(
  st === 'paid' ? 'chip-good' : st === 'suspended' ? 'chip-bad' :
  st === 'grace' || st === 'overdue' ? 'chip-warn' : 'chip-mute',
  st === 'paid' ? 'check-circle' : st === 'suspended' ? 'x' : 'clock',
  t('inv.' + st));

const SEV_RANK = { critical:3, serious:2, warning:1 };
/* The seed is '', whose rank is undefined — and every comparison with undefined
   is false, so `rank[sev] > rank[seed]` never fired and every drug reported no
   interaction at all. Coerce both sides. */
const worstInteraction = d => (d.interactions || [])
  .reduce((w, i) => ((SEV_RANK[i.severity] || 0) > (SEV_RANK[w] || 0) ? i.severity : w), '');

/* ---------- Cross-module lookups ---------- */
const ordersOfPharmacy = pid => DATA.orders.filter(o => o.pharmacy === pid);

const usersOfUniversity = vid => DATA.users.filter(u => u.university === vid);

const userOf = uid => DATA.users.find(u => u.id === uid) || null;
const companyOf = cid => DATA.companies.find(c => c.id === cid) || null;

const tasksFor = (kind, id) => DATA.tasks.filter(x => x.related && x.related.kind === kind && x.related.id === id);
const activityFor = (kind, id) => DATA.activity
  .filter(e => e.kind === kind && e.id2 === id)
  .slice().sort((a, b) => b.when.localeCompare(a.when));

/* Records are keyed differently per module — drugs by scientific name, syndicate
   rows by number — so one lookup knows where each module's identity lives. */
const ID_FIELD = { drugs:'sci', syndicate:'no', catalogue:'barcode' };
const idOf = (mod, r) => r[ID_FIELD[mod] || 'id'];
function findRecord(mod, id) {
  const set = DATA[mod] || [];
  return set.find(r => String(idOf(mod, r)) === String(id)) || null;
}
function recordName(kind, id) {
  const r = findRecord(kind, id);
  if (!r) return String(id);
  if (kind === 'drugs') return r.sci;
  if (kind === 'catalogue') return r.name ? L(r.name) : t('cat.unknown') + ' · ' + r.barcode;
  if (kind === 'syndicate') return L(r.name);
  if (kind === 'orders') return r.id;
  return L(r.name || r.subject);
}

function orderStatusRows() {
  return ORDER_STATUS.map(s => {
    const os = DATA.orders.filter(o => o.status === s);
    return {
      key:s, label:t('os.' + s), n:os.length,
      value:os.reduce((n, o) => n + o.total, 0),
      color:ORDER_STATUS_COLOR[s]
    };
  });
}

const chip = (cls, ico, label) =>
  '<span class="chip ' + cls + '">' + (ico ? icon(ico) : '') + esc(label) + '</span>';
const priorityChip = p => chip(p === 'high' ? 'chip-bad' : 'chip-mute', null, t('pr.' + p));
const healthChip = p => { const h = pharmacyHealth(p); return chip(h.chip, h.ico, h.label); };
const verifChip = v => chip(
  v === 'verified' ? 'chip-good' : v === 'rejected' ? 'chip-bad' : 'chip-warn',
  v === 'verified' ? 'check-circle' : v === 'rejected' ? 'x' : 'clock', t('vs.' + v));
/* An owner reads as "Pharmacist · Owner" — the type and the link, because the
   link is the thing that is not obvious from the type. */
const typeChip = u => chip('chip-info', null, t('ut1.' + u.type)) +
  (isOwner(u) ? ' ' + chip('chip-good', 'building', t('ut1.owner')) : '');
const orderTypeChip = ty => chip(ty === 'training' ? 'chip-mute' : 'chip-info',
  ty === 'training' ? 'cap' : 'clock', t('ot.' + ty));
const orderStatusChip = s => chip(
  s === 'completed' ? 'chip-good' : s === 'cancelled' ? 'chip-mute' :
  s === 'open' ? 'chip-warn' : 'chip-info', null, t('os.' + s));
const matchChip = u => { const m = syndicateMatch(u); return chip(m.chip, m.ico, t('mt.' + m.key)); };
const roleChips = c => (c.roles && c.roles.length)
  ? c.roles.map(r => chip('chip-mute', null, t('role.' + r))).join(' ')
  : chip('chip-info', 'globe', t('ext.noIraqiLicence'));
const sevChip = s => chip(
  s === 'critical' ? 'chip-bad' : s === 'serious' ? 'chip-warn' : 'chip-mute',
  s === 'critical' ? 'alert' : null, t('sev.' + s));

function visibleRows(mod) {
  const M = MODULES[mod];
  const view = M.views[S.view[mod]] || M.views.all;
  let rows = M.data().filter(view.fn);

  const f = S.filters[mod] || {};
  Object.keys(f).forEach(facet => {
    if (!f[facet]) return;
    const F = FACETS[facet];
    rows = rows.filter(r => F.multi
      ? (F.of(r) || []).indexOf(f[facet]) >= 0
      : F.of(r) === f[facet]);
  });

  const sort = S.sort[mod];
  if (sort) {
    const col = M.columns.find(c => c.key === sort.key);
    if (col) {
      const val = r => col.sortAs ? col.sortAs(r) : (col.get ? col.get(r) : L(r[col.key]) || r[col.key] || '');
      rows = rows.slice().sort((a, b) => {
        const x = val(a), y = val(b);
        const c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y));
        return sort.dir === 'desc' ? -c : c;
      });
    }
  }
  return rows;
}

function listHead(mod) {
  const M = MODULES[mod];
  const cur = S.view[mod];
  const menu = S.viewMenu === mod
    ? '<div class="view-menu">' + Object.keys(M.views).map(k => {
        const n = M.data().filter(M.views[k].fn).length;
        return '<button class="view-opt' + (k === cur ? ' on' : '') + '" onclick="pickView(' + attr(mod) + ',' + attr(k) + ')">' +
          esc(t(M.views[k].label)) + '<span class="count">' + fmt(n) + '</span></button>';
      }).join('') + '</div>'
    : '';
  const picked = (S.picked[mod] || []).length;

  return '<div class="work-head">' +
      '<div style="position:relative;">' +
        '<button class="view-select" onclick="toggleViewMenu(' + attr(mod) + ')">' +
          esc(t(M.views[cur].label)) + icon('caret') + '</button>' + menu +
      '</div>' +
      '<span class="chip chip-mute figure">' + fmt(visibleRows(mod).length) + '</span>' +
      '<span class="spacer"></span>' +
      (M.importer && can('import')
        ? '<button class="btn" onclick="openImport(' + attr(M.importer) + ')">' + icon('upload') +
          esc(t('imp.title')) + '</button>'
        : '') +
      '<button class="btn" onclick="resetFilters(' + attr(mod) + ')">' + icon('refresh') + esc(t('a.refresh')) + '</button>' +
      (FORMS[mod] ? '<button class="btn primary" onclick="openNew(' + attr(mod) + ')">' + icon('plus') + esc(t('a.new')) + '</button>' : '') +
    '</div>' +
    (M.note ? '<div class="mod-note">' + icon('alert') + '<span>' + esc(t(M.note)) + '</span></div>' : '') +
    (M.placeholder ? '<div class="mod-note stage">' + icon('flag') + '<span>' + esc(t(M.placeholder)) + '</span></div>' : '') +
    (picked
      ? '<div class="bulkbar">' + esc(t('a.selected', {n:picked})) +
          '<span class="spacer" style="flex:1"></span>' +
          (can('delete')
            ? '<button class="btn danger" onclick="bulkDelete(' + attr(mod) + ')">' + icon('trash') + esc(t('a.delete')) + '</button>'
            : '<span class="cell-sub">' + esc(t('perm.noDelete')) + '</span>') +
          '<button class="btn" onclick="clearPicked(' + attr(mod) + ')">' + esc(t('a.clear')) + '</button>' +
        '</div>'
      : '');
}

function listRail(mod) {
  const M = MODULES[mod];
  const all = M.data();
  const f = S.filters[mod] || {};
  let html = '<div class="rail-h">' + esc(t('f.filters')) + '</div>';

  M.facets.forEach(facet => {
    const F = FACETS[facet];
    const values = F.multi
      ? [...new Set(all.flatMap(r => F.of(r) || []))]
      : [...new Set(all.map(F.of))].filter(v => v != null);
    if (!values.length) return;
    html += '<div class="rail-h">' + esc(t(F.label)) + '</div>' +
      '<button class="rail-opt' + (!f[facet] ? ' on' : '') + '" onclick="setFilter(' + attr(mod) + ',' + attr(facet) + ',null)">' +
        esc(t('f.all')) + '<span class="count">' + fmt(all.length) + '</span></button>' +
      values.map(v =>
        '<button class="rail-opt' + (f[facet] === v ? ' on' : '') + '" onclick="setFilter(' + attr(mod) + ',' + attr(facet) + ',' + attr(v) + ')">' +
          esc(F.name(v)) + '<span class="count">' +
          fmt(all.filter(r => F.multi ? (F.of(r) || []).indexOf(v) >= 0 : F.of(r) === v).length) +
          '</span></button>').join('');
  });

  if (Object.keys(f).some(k => f[k]))
    html += '<button class="rail-clear" onclick="resetFilters(' + attr(mod) + ')">' + esc(t('f.clear')) + '</button>';
  return html;
}

function listBody(mod) {
  const M = MODULES[mod];
  const rows = visibleRows(mod);
  const picked = S.picked[mod] || [];
  const sort = S.sort[mod];

  if (!rows.length) {
    return '<div class="empty">' + icon('search') + '<div>' + esc(t('e.noRecords')) + '</div>' +
      '<div style="font-size:12px;">' + esc(t('e.tryClearing')) + '</div></div>';
  }

  const allPicked = rows.every(r => picked.includes(idOf(mod, r)));
  const head = '<tr><th class="col-check"><input type="checkbox"' + (allPicked ? ' checked' : '') +
      ' onchange="pickAll(' + attr(mod) + ', this.checked)"></th>' +
    M.columns.map(c =>
      '<th class="sortable"' + (c.num ? ' style="text-align:end"' : '') + ' onclick="sortBy(' + attr(mod) + ',' + attr(c.key) + ')">' +
        esc(t(c.label)) +
        (sort && sort.key === c.key ? icon(sort.dir === 'asc' ? 'up' : 'down') : icon('sort')) +
      '</th>').join('') + '</tr>';

  const body = rows.map(r => {
    const rid = idOf(mod, r);
    const on = picked.includes(rid);
    return '<tr class="' + (on ? 'picked' : '') + '">' +
      '<td class="col-check"><input type="checkbox"' + (on ? ' checked' : '') +
        ' onchange="pickOne(' + attr(mod) + ',' + attr(rid) + ', this.checked)"></td>' +
      M.columns.map(c => {
        if (c.chip) { const v = c.chip(r); return '<td>' + (typeof v === 'string' ? v : '') + '</td>'; }
        const raw = c.get ? c.get(r) : (L(r[c.key]) || r[c.key] || '—');
        const tone = c.tone && c.tone(r);
        if (c.main) return '<td><button class="cell-link' + (c.mono ? ' figure' : '') + '" onclick="openRecord(' +
          attr(mod) + ',' + attr(rid) + ')">' + esc(raw) + '</button></td>';
        return '<td' + (c.num ? ' class="figure" style="text-align:end"' : c.mono ? ' class="figure" dir="ltr"' : '') +
          (tone ? ' style="color:' + tone + ';font-weight:600"' : '') + '>' + esc(raw) + '</td>';
      }).join('') + '</tr>';
  }).join('');

  return '<table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

/* ==========================================================================
   6. RECORD PAGES
   ========================================================================== */

function fieldRow(label, value, edit) {
  return '<div class="field-row"><span class="field-k">' + esc(label) + '</span>' +
    '<span class="field-v' + (edit ? ' editable' : '') + '"' +
      (edit ? ' onclick="startEdit(this,' + attr(edit.path) + ',' + attr(edit.type || 'text') + ')"' : '') +
      '>' + (value === '' || value == null ? '—' : value) + '</span></div>';
}

function timelinePanel(kind, id) {
  const items = activityFor(kind, id);
  const icons = { call:'phone', visit:'pin', note:'note', followup:'clock', demo:'cap' };
  return '<section class="panel">' +
    '<div class="panel-h">' + icon('clock') + esc(t('rec.timeline')) + '</div>' +
    '<div class="note-box">' +
      '<textarea id="note-input" placeholder="' + esc(t('a.addNote')) + '"></textarea>' +
      '<button class="btn primary" onclick="addNote(' + attr(kind) + ',' + attr(id) + ')">' + esc(t('a.post')) + '</button>' +
    '</div>' +
    (items.length
      ? '<div class="timeline">' + items.map(e =>
          '<div class="tl-item"><span class="tl-dot">' + icon(icons[e.type] || 'note') + '</span>' +
          '<div style="flex:1;min-width:0;"><div class="tl-title">' + esc(L(e.text)) + '</div>' +
          '<div class="tl-meta">' + esc(t('ty.' + e.type)) + ' · ' + esc(L(USERS[e.owner].name)) +
            ' · ' + esc(relDays(e.when)) + '</div></div></div>').join('') + '</div>'
      : '<div class="empty" style="padding:26px;">' + esc(t('rec.noTimeline')) + '</div>') +
  '</section>';
}

function relatedPanel(title, rows, onOpen, extraHead) {
  return '<section class="panel">' +
    '<div class="panel-h">' + esc(title) + '<span class="spacer"></span>' +
      (extraHead || '') +
      '<span class="chip chip-mute figure">' + fmt(rows.length) + '</span></div>' +
    (rows.length
      ? '<div class="panel-b flush">' + rows.map(r =>
          '<button class="task-row" style="width:100%;text-align:start;" onclick="' + onOpen(r) + '">' +
            '<div style="flex:1;min-width:0;"><div class="task-t">' + esc(r._t) + '</div>' +
            '<div class="task-m">' + r._m + '</div></div></button>').join('') + '</div>'
      : '<div class="empty" style="padding:22px;font-size:12px;">' + esc(t('rec.noneYet')) + '</div>') +
  '</section>';
}

function chainLine(labelKey, companyId) {
  const co = companyId ? companyOf(companyId) : null;
  return '<div class="chain-line"><span class="chain-k">' + esc(t(labelKey)) + '</span>' +
    (co
      ? '<button class="cell-link chain-v" onclick="openRecord(' + attr('companies') + ',' + attr(co.id) + ')">' +
        esc(L(co.name)) + '</button>'
      : '<span class="chain-v muted">—</span>') + '</div>';
}

function recordPage(mod, id) {
  const rec = findRecord(mod, id);
  if (!rec) return '<div class="empty">' + esc(t('e.noRecords')) + '</div>';

  const kv = (ic, label, value) =>
    '<div class="kv">' + icon(ic) + '<div><div class="kv-label">' + esc(label) + '</div>' +
    '<div class="kv-value">' + value + '</div></div></div>';
  const P = mod + '.' + id + '.';

  let title = recordName(mod, id), sub = '', actions = '', details = '', side = '', main = '';

  /* ---------- User ---------- */
  if (mod === 'users') {
    const m = syndicateMatch(rec);
    sub = typeChip(rec) + verifChip(rec.verification) +
      '<span>' + esc(districtName(rec.district)) + '</span>';
    actions =
      '<button class="btn" onclick="logCall(' + attr(mod) + ',' + attr(id) + ')">' + icon('phone') + esc(t('a.call')) + '</button>' +
      (rec.verification === 'pending'
        ? '<button class="btn primary" onclick="verifyUser(' + attr(id) + ')">' + icon('check-circle') + esc(t('a.verify')) + '</button>'
        : '');
    details =
      fieldRow(t('c.nameAr'), '<span dir="rtl">' + esc(AR(rec.name)) + '</span>') +
      fieldRow(t('c.userType'), typeChip(rec)) +
      fieldRow(t('c.phone'), '<span class="figure" dir="ltr">' + esc(rec.phone) + '</span>', { path:P + 'phone' }) +
      fieldRow(t('c.email'), '<span class="figure" dir="ltr">' + esc(rec.email) + '</span>', { path:P + 'email' }) +
      fieldRow(t('c.district'), esc(districtName(rec.district)), { path:P + 'district', type:'district' }) +
      fieldRow(t('c.joined'), esc(fmtDate(rec.joined))) +
      /* An owner is a pharmacist too, so they carry the pharmacist fields AND
         the pharmacy link — the record shows both rather than picking one. */
      (rec.type === 'pharmacist'
        ? fieldRow(t('c.syndicateNo'), '<span class="figure" dir="ltr">' + esc(rec.syndicateNo || '') + '</span>', { path:P + 'syndicateNo' }) +
          fieldRow(t('c.gradYear'), esc(String(rec.gradYear || ''))) +
          fieldRow(t('c.reliability'), rec.reliability === null
            ? '<span class="no-record">' + esc(t('app.noRecord')) + '</span>'
            : '<span class="figure">' + pct(rec.reliability) + '</span>') +
          fieldRow(t('c.ratingV'), rec.rating === null
            ? '<span class="no-record">' + esc(t('app.noRecord')) + '</span>'
            : '<span class="figure">' + rec.rating + '</span>')
        : '') +
      /* One row per pharmacy owned: an owner of three is shown owning three,
         not a group. */
      (isOwner(rec)
        ? fieldRow(t(ownedIds(rec).length > 1 ? 'c.pharmacies' : 'c.pharmacy'), ownedIds(rec).map(pid =>
            '<button class="cell-link" onclick="openRecord(' + attr('pharmacies') + ',' + attr(pid) + ')">' +
            esc(recordName('pharmacies', pid)) + '</button>').join('<br>')) : '') +
      (rec.type === 'student' && rec.university
        ? fieldRow(t('c.university'), '<button class="cell-link" onclick="openRecord(' + attr('universities') + ',' + attr(rec.university) + ')">' +
            esc(recordName('universities', rec.university)) + '</button>') : '');

    /* The verification panel. It says out loud what the check actually is —
       a person comparing a card against a list someone emailed us. */
    if (rec.type === 'pharmacist') {
      side += '<section class="panel">' +
        '<div class="panel-h">' + icon('badge') + esc(t('mod.syndicate')) + '<span class="spacer"></span>' +
          chip(m.chip, m.ico, t('mt.' + m.key)) + '</div>' +
        '<div class="panel-b">' +
          fieldRow(t('c.syndicateNo'), '<span class="figure" dir="ltr">' + esc(rec.syndicateNo || '—') + '</span>') +
          (m.row
            ? fieldRow('Name on the roster',
                '<button class="cell-link" onclick="openRecord(' + attr('syndicate') + ',' + attr(m.row.no) + ')">' +
                esc(L(m.row.name)) + '</button>') +
              fieldRow(t('c.syndStatus'), chip(m.row.status === 'active' ? 'chip-good' : 'chip-bad',
                m.row.status === 'active' ? 'check-circle' : 'x', t('ss.' + m.row.status))) +
              fieldRow(t('c.batch'), esc(fmtDate(m.row.batch)))
            : '') +
          '<p class="inline-note" style="margin-top:10px;">' + esc(t('sy.note')) + '</p>' +
        '</div></section>';
    }

    const mine = ordersOfUser(id);
    side += relatedPanel(t('c.orders'), mine.map(o => ({
      _t:o.id + ' · ' + recordName('pharmacies', o.pharmacy),
      _m:orderStatusChip(o.status) + ' ' + esc(orderWhen(o)), id:o.id
    })), r => 'openRecord(' + attr('orders') + ',' + attr(r.id) + ')');

  /* ---------- Order ---------- */
  } else if (mod === 'orders') {
    const ph = pharmacyOf(rec.pharmacy);
    sub = orderTypeChip(rec.type) + orderStatusChip(rec.status) +
      '<span>' + esc(districtName(rec.district)) + '</span>';
    actions = ORDER_STATUS.filter(s => s !== rec.status).slice(0, 3).map(s =>
      '<button class="btn" onclick="setOrderStatus(' + attr(id) + ',' + attr(s) + ')">' + esc(t('os.' + s)) + '</button>').join('') +
      (ph ? '<button class="btn primary" onclick="openRecord(' + attr('pharmacies') + ',' + attr(ph.id) + ')">' +
        icon('building') + esc(L(ph.name)) + '</button>' : '');
    details =
      fieldRow(t('c.orderType'), orderTypeChip(rec.type)) +
      fieldRow(t('c.pharmacy'), ph ? '<button class="cell-link" onclick="openRecord(' + attr('pharmacies') + ',' + attr(ph.id) + ')">' +
        esc(L(ph.name)) + '</button>' : '—') +
      fieldRow(t('c.when'), esc(orderWhen(rec))) +
      (rec.type === 'shift'
        ? fieldRow(t('c.hours'), '<span class="figure">' + rec.hours + '</span>') +
          fieldRow(t('c.rate'), '<span class="figure">' + esc(iqd(rec.rate)) + '</span>' +
            (rec.rateType === 'hourly' ? '/hour' : '')) +
          fieldRow(t('c.total'), '<span class="figure">' + esc(iqd(rec.total)) + '</span>') +
          fieldRow(t('c.controlled'), rec.controlled
            ? chip('chip-warn', 'alert', 'Yes')
            : chip('chip-mute', null, 'No'))
        : fieldRow(t('c.weeks'), '<span class="figure">' + (rec.weeksApproved || 0) + ' / ' + (rec.weeks || 12) + '</span>')) +
      fieldRow(t('c.status'), orderStatusChip(rec.status), { path:P + 'status', type:'orderStatus' }) +
      fieldRow(t('c.assignee'), rec.assignee
        ? '<button class="cell-link" onclick="openRecord(' + attr('users') + ',' + attr(rec.assignee) + ')">' +
          esc(recordName('users', rec.assignee)) + '</button>' : '—') +
      fieldRow(t('c.applicants'), isUnclaimed(rec)
        ? chip('chip-bad', 'alert', t('v.unclaimed'))
        : '<span class="figure">' + fmt(rec.applicants) + '</span>');

  /* ---------- Pharmacy ---------- */
  } else if (mod === 'pharmacies') {
    const acct = rec.user ? userOf(rec.user) : null;
    const left = trialLeft(rec);
    sub = healthChip(rec) + '<span>' + esc(districtName(rec.district)) + '</span>' +
      '<span class="figure" dir="ltr">' + esc(rec.licence) + '</span>';
    actions =
      '<button class="btn" onclick="logCall(' + attr(mod) + ',' + attr(id) + ')">' + icon('phone') + esc(t('a.call')) + '</button>' +
      (acct ? '<button class="btn primary" onclick="openApp(' + attr(acct.email) + ')">' + icon('external') +
        esc(t('a.openInApp')) + '</button>' : '');
    details =
      fieldRow(t('c.nameAr'), '<span dir="rtl">' + esc(AR(rec.name)) + '</span>') +
      fieldRow(t('c.licence'), '<span class="figure" dir="ltr">' + esc(rec.licence) + '</span>') +
      fieldRow(t('c.district'), esc(districtName(rec.district)), { path:P + 'district', type:'district' }) +
      fieldRow(t('pr.address'), esc(L(rec.address))) +
      fieldRow(t('c.owner'), esc(L(USERS[rec.owner].name)), { path:P + 'owner', type:'owner' }) +
      fieldRow(t('c.created'), esc(fmtDate(rec.signedUp))) +
      fieldRow(t('c.platformAccount'), acct
        ? '<button class="cell-link" onclick="openRecord(' + attr('users') + ',' + attr(acct.id) + ')">' +
          esc(L(acct.name)) + '</button>'
        : chip('chip-mute', null, t('mt.notLinked')));
    side = '<section class="panel">' +
      '<div class="panel-h">' + icon('grid') + esc(t('rec.platform')) + '</div>' +
      '<div class="panel-b">' +
        fieldRow(t('c.verification'), healthChip(rec)) +
        fieldRow(t('c.trial'), left > 0
          ? esc(t('rec.trialDay', {a:rec.trialUsed, b:rec.trialDays})) +
            (isTrialEnding(rec) ? ' ' + chip('chip-warn', 'clock', t('rec.daysLeft', {n:left})) : '')
          : '—') +
        fieldRow(t('c.orders'), rec.orders ? '<span class="figure">' + fmt(rec.orders) + '</span>'
          : chip('chip-bad', 'alert', t('rec.noShifts'))) +
        fieldRow(t('c.fillRate'), fillRate(rec) === null ? '—' : '<span class="figure">' + pct(fillRate(rec)) + '</span>') +
        fieldRow(t('c.lastShift'), rec.lastOrder ? esc(relDays(rec.lastOrder)) : '—') +
        fieldRow(t('c.commission'), '<span class="figure">' + esc(iqd(rec.commission)) + '</span>') +
      '</div></section>' +
      relatedPanel(t('c.orders'), ordersOfPharmacy(id).map(o => ({
        _t:o.id + ' · ' + t('ot.' + o.type),
        _m:orderStatusChip(o.status) + ' ' + esc(orderWhen(o)), id:o.id
      })), r => 'openRecord(' + attr('orders') + ',' + attr(r.id) + ')');

  /* ---------- External ---------- */
  } else if (mod === 'companies') {
    const principals = principalsOf(rec);
    const bureaux = bureauxFor(id);
    const involved = brandsInvolving(id);

    sub = roleChips(rec) + '<span>' + esc(L(rec.city)) + ', ' + esc(L(rec.country)) + '</span>';
    actions = '<button class="btn" onclick="logCall(' + attr(mod) + ',' + attr(id) + ')">' + icon('phone') + esc(t('a.call')) + '</button>';
    details =
      fieldRow(t('c.nameAr'), '<span dir="rtl">' + esc(AR(rec.name)) + '</span>') +
      fieldRow(t('c.roles'), roleChips(rec), { path:P + 'roles', type:'roles' }) +
      fieldRow(t('c.reg'), '<span class="figure" dir="ltr">' + esc(rec.reg) + '</span>', { path:P + 'reg' }) +
      fieldRow(t('c.country'), esc(L(rec.country))) +
      fieldRow(t('c.city'), esc(L(rec.city))) +
      fieldRow(t('c.contactName'), esc(L(rec.contact)), { path:P + 'contact' }) +
      fieldRow(t('c.phone'), '<span class="figure" dir="ltr">' + esc(rec.phone) + '</span>', { path:P + 'phone' }) +
      fieldRow(t('c.email'), '<span class="figure" dir="ltr">' + esc(rec.email) + '</span>', { path:P + 'email' }) +
      fieldRow(t('c.status'), chip(rec.status === 'active' ? 'chip-good' : 'chip-warn',
        rec.status === 'active' ? 'check-circle' : 'clock', t('cs.' + rec.status)), { path:P + 'status', type:'companyStatus' }) +
      fieldRow(t('c.owner'), esc(L(USERS[rec.owner].name)), { path:P + 'owner', type:'owner' });

    /* A foreign principal holds no Iraqi licence. Saying so, and naming who
       does, is the single most useful line on the record. */
    if (!(rec.roles || []).length) {
      main = '<div class="mod-note">' + icon('globe') + '<span>' +
        esc(bureaux.length
          ? t('ext.reachedVia', { who:bureaux.map(b => L(b.name)).join(', ') })
          : t('ext.noBureau')) + '</span></div>';
    }

    side =
      (principals.length
        ? relatedPanel(t('c.represents'), principals.map(x => ({
            _t:L(x.name), _m:esc(L(x.country)) + ' · ' + fmt(brandsInvolving(x.id).length) + ' ' + esc(t('c.brands')),
            id:x.id })), r => 'openRecord(' + attr('companies') + ',' + attr(r.id) + ')')
        : '') +
      (bureaux.length
        ? relatedPanel(t('c.representedBy'), bureaux.map(x => ({
            _t:L(x.name), _m:roleChips(x), id:x.id })),
            r => 'openRecord(' + attr('companies') + ',' + attr(r.id) + ')')
        : '') +
      relatedPanel(t('c.brands'), involved.map(b => ({
        _t:b.brand,
        _m:esc(b.sci) + ' · ' + [
             b.company === id ? t('role.manufacturer') : null,
             b.registrationHolder === id ? t('c.registrationHolder') : null,
             b.bureau === id ? t('role.bureau') : null
           ].filter(Boolean).map(x => esc(x)).join(' · '),
        sci:b.sci
      })), r => 'openRecord(' + attr('drugs') + ',' + attr(r.sci) + ')');

  /* ---------- University ---------- */
  } else if (mod === 'universities') {
    sub = chip(rec.agreement === 'signed' ? 'chip-good' : rec.agreement === 'talks' ? 'chip-warn' : 'chip-mute',
      rec.agreement === 'signed' ? 'check-circle' : null, t('ag.' + rec.agreement)) +
      '<span>' + esc(L(rec.city)) + '</span>';
    actions = '<button class="btn" onclick="logCall(' + attr(mod) + ',' + attr(id) + ')">' + icon('phone') + esc(t('a.call')) + '</button>';
    details =
      fieldRow(t('c.city'), esc(L(rec.city))) +
      /* The email domain is not decoration: it is the rule that makes student
         verification automatic, so getting it wrong locks a whole college out. */
      fieldRow(t('c.domain'), '<span class="figure" dir="ltr">' + esc(rec.domain) + '</span>', { path:P + 'domain' }) +
      fieldRow(t('c.agreement'), chip(rec.agreement === 'signed' ? 'chip-good' : 'chip-warn', null, t('ag.' + rec.agreement)),
        { path:P + 'agreement', type:'agreement' }) +
      fieldRow(t('c.contactName'), esc(L(rec.contact)), { path:P + 'contact' }) +
      fieldRow(t('c.phone'), '<span class="figure" dir="ltr">' + esc(rec.phone) + '</span>', { path:P + 'phone' }) +
      fieldRow(t('c.email'), '<span class="figure" dir="ltr">' + esc(rec.email) + '</span>', { path:P + 'email' }) +

function kpi(label, value, delta, spark, onClick) {
  const d = delta ? '<div class="kpi-d ' + delta.cls + '">' + (delta.ico ? icon(delta.ico) : '') +
    esc(delta.text) + '</div>' : '';
  const inner = '<div class="kpi-k">' + esc(label) + '</div>' +
    '<div class="kpi-v">' + esc(value) + '</div>' + d +
    (spark ? sparkline(spark) : '');
  return onClick
    ? '<button class="kpi as-link" onclick="' + onClick + '">' + inner + '</button>'
    : '<div class="kpi">' + inner + '</div>';
}

      recentPanel +
    '</div>' +
  '</div>';
}

/* ==========================================================================
   13. CSV IMPORT
   Two things use it: the drug list, which arrives from a company as a
   spreadsheet, and the Syndicate roster, which arrives from the Syndicate the
   same way. Both are bulk, both are somebody else's file, and both will have
   mistakes in them — so the import parses, validates, and shows what it WOULD
   do, and writes nothing until that preview has been read.
   ========================================================================== */

/* A real CSV parser rather than split(','): a drug note containing a comma, or
   a quoted field with a line break in it, is the normal case in a file a
   pharmacist typed, and splitting on commas silently corrupts those rows. */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  const s = String(text).replace(/\r\n?/g, '\n');

  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (quoted) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; }   // "" is a literal quote
        else quoted = false;
      } else field += c;
    } else if (c === '"') { quoted = true; }
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

const splitList = v => String(v || '').split(/[|;]/).map(x => x.trim()).filter(Boolean);

/* Each importer declares its key column, the columns it needs, and how one row
   becomes a record. Validation returns a message rather than throwing, so one
   bad row is one skipped row and not a failed file. */
const IMPORTERS = {
  drugs: {
    module:'drugs',
    key:'scientific_name',
    required:['scientific_name'],
    columns:['scientific_name','arabic_name','atc','form','doses','notes','interactions','contraindications'],
    sample:[
      ['scientific_name','arabic_name','atc','form','doses','notes','interactions','contraindications'],
      ['Ibuprofen','إيبوبروفين','M01AE01','tablet','200 mg|400 mg|600 mg',
       'Take with food.','Warfarin:warning:May raise bleeding risk|Lisinopril:warning:Blunts the antihypertensive effect',
       'Active peptic ulcer|Third trimester of pregnancy'],
      ['Cetirizine','سيتيريزين','R06AE07','tablet','5 mg|10 mg','Non-sedating at standard doses.','','Severe renal impairment']
    ],
    parse(cells, head) {
      const g = k => String(cells[head.indexOf(k)] || '').trim();
      const sci = g('scientific_name');
      if (!sci) return { error:t('imp.missingKey') };

      const form = (g('form') || 'tablet').toLowerCase();
      /* The forms the reference recognises, taken from the embedded list so a
         new form is added in data/drugs.mjs and nowhere else. */
      const FORMS_OK = DRUG_FORMS;

      const interactions = splitList(g('interactions')).map(x => {
        const [w, sev, ...rest] = x.split(':');
        const severity = ['warning','serious','critical'].includes((sev || '').trim())
          ? sev.trim() : 'warning';
        const note = rest.join(':').trim();
        return { with:(w || '').trim(), severity, note:{ ar:note, en:note } };
      }).filter(i => i.with);

      const rec = {
        sci,
        ar: g('arabic_name') || sci,
        atc: g('atc'),
        form: FORMS_OK.includes(form) ? form : 'tablet',
        doses: splitList(g('doses')),
        notes: { ar:g('notes'), en:g('notes') },
        interactions,
        contraindications: splitList(g('contraindications')).map(c => ({ ar:c, en:c }))
      };
      const existing = DATA.drugs.find(d => d.sci.toLowerCase() === sci.toLowerCase());
      return { rec, key:sci, mode: existing ? 'update' : 'new' };
    },
    apply(p) {
      const i = DATA.drugs.findIndex(d => d.sci.toLowerCase() === p.key.toLowerCase());
      if (i >= 0) Object.assign(DATA.drugs[i], p.rec); else DATA.drugs.push(p.rec);
    }
  },

  syndicate: {
    module:'syndicate',
    key:'syndicate_no',
    required:['syndicate_no','name'],
    columns:['syndicate_no','name','graduation_year','status'],
    sample:[
      ['syndicate_no','name','graduation_year','status'],
      ['IQ-PH-015001','سيف الدين محمد الجبوري','2024','active'],
      ['IQ-PH-015002','دعاء عبد الكريم الزاملي','2024','active']
    ],
    parse(cells, head) {
      const g = k => String(cells[head.indexOf(k)] || '').trim();
      const no = g('syndicate_no');
      const name = g('name');
      if (!no) return { error:t('imp.missingKey') };
      if (!name) return { error:t('n.required') };
      const year = parseInt(g('graduation_year'), 10);
      const rec = {
        no, name:{ ar:name, en:name },
        gradYear: Number.isFinite(year) ? year : null,
        status: g('status').toLowerCase() === 'suspended' ? 'suspended' : 'active',
        batch: ISO_TODAY
      };
      const existing = DATA.syndicate.find(r => r.no.toLowerCase() === no.toLowerCase());
      return { rec, key:no, mode: existing ? 'update' : 'new' };
    },
    apply(p) {
      const i = DATA.syndicate.findIndex(r => r.no.toLowerCase() === p.key.toLowerCase());
      if (i >= 0) Object.assign(DATA.syndicate[i], p.rec); else DATA.syndicate.push(p.rec);
    }
  }
};

function openImport(which) {
  /* CSV import writes hundreds of rows at once. It is the one action where a
     mistake is not one bad record but a bad table, so it sits with delete. */
  if (!can('import')) return deny();
  S.modal = { kind:'import', which, text:'', parsed:null };
  renderModal();
}

function importTemplate(which) {
  const I = IMPORTERS[which];
  const csv = I.sample.map(r => r.map(c =>
    /[",\n]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(',')).join('\n');
  // A local file can hand the browser a download; an artifact cannot. This one
  // is opened from disk, so the anchor works.
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent(csv);
  a.download = 'saydali-' + which + '-template.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function readImportFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    S.modal.text = String(r.result || '');
    S.modal.parsed = null;
    renderModal();
    parseImport();
  };
  r.readAsText(f);
}

function setImportText(v) { S.modal.text = v; S.modal.parsed = null; }

function parseImport() {
  const I = IMPORTERS[S.modal.which];
  const text = (S.modal.text || '').trim();
  if (!text) { S.modal.parsed = { fatal:t('imp.noFile') }; renderModal(); return; }

  const rows = parseCSV(text);
  const head = (rows[0] || []).map(h => String(h).trim().toLowerCase().replace(/^﻿/, ''));
  const missing = I.required.filter(c => !head.includes(c));
  if (missing.length) {
    S.modal.parsed = { fatal:t('imp.badHeader', { cols:missing.join(', ') }) };
    renderModal(); return;
  }

  const seen = new Set();
  const items = rows.slice(1).map((cells, i) => {
    const out = I.parse(cells, head);
    if (out.error) return { line:i + 2, mode:'error', message:out.error };
    // A file that lists the same key twice is a mistake worth surfacing, not
    // something to silently resolve by letting the last row win.
    const k = String(out.key).toLowerCase();
    if (seen.has(k)) return { line:i + 2, mode:'error', message:'Duplicated in the file: ' + out.key };
    seen.add(k);
    return { line:i + 2, mode:out.mode, key:out.key, rec:out.rec };
  });

  S.modal.parsed = {
    items,
    counts:{
      new:    items.filter(x => x.mode === 'new').length,
      update: items.filter(x => x.mode === 'update').length,
      error:  items.filter(x => x.mode === 'error').length
    }
  };
  renderModal();
}

function applyImport() {
  const I = IMPORTERS[S.modal.which];
  const good = (S.modal.parsed.items || []).filter(x => x.mode !== 'error');
  good.forEach(p => I.apply(p));
  const n = good.length;
  S.modal = null;
  toast(t('imp.done', { n }));
  render();
}

function importModal() {
  const I = IMPORTERS[S.modal.which];
  const p = S.modal.parsed;

  const preview = !p ? '' : p.fatal
    ? '<div class="imp-fatal">' + icon('alert') + esc(p.fatal) + '</div>'
    : '<div class="imp-summary">' +
        '<span class="chip chip-good">' + esc(t('imp.new')) + ' ' + fmt(p.counts.new) + '</span>' +
        '<span class="chip chip-info">' + esc(t('imp.update')) + ' ' + fmt(p.counts.update) + '</span>' +
        '<span class="chip ' + (p.counts.error ? 'chip-bad' : 'chip-mute') + '">' +
          esc(t('imp.error')) + ' ' + fmt(p.counts.error) + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<span class="inline-note">' + esc(t('imp.rowsFound', { n:p.items.length })) + '</span>' +
      '</div>' +
      '<div class="imp-rows">' + p.items.map(x =>
        '<div class="imp-row ' + x.mode + '">' +
          '<span class="imp-line figure">' + x.line + '</span>' +
          '<span class="chip ' + (x.mode === 'new' ? 'chip-good' : x.mode === 'update' ? 'chip-info' : 'chip-bad') + '">' +
            esc(t('imp.' + x.mode)) + '</span>' +
          '<span class="imp-key" dir="ltr">' + esc(x.key || '') + '</span>' +
          (x.message ? '<span class="imp-msg">' + esc(x.message) + '</span>' : '') +
        '</div>').join('') + '</div>' +
      (p.counts.error ? '<p class="inline-note">' + esc(t('imp.errorsBlock')) + '</p>' : '');

  const applicable = p && !p.fatal ? p.counts.new + p.counts.update : 0;

  return '<div class="modal-h"><span class="modal-t">' + esc(t('imp.title')) + ' — ' + esc(t('mod.' + I.module)) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b">' +
      '<div class="imp-head">' +
        '<label class="btn"><input type="file" accept=".csv,text/csv" style="display:none" onchange="readImportFile(this)">' +
          icon('upload') + esc(t('imp.pick')) + '</label>' +
        '<button class="btn" onclick="importTemplate(' + attr(S.modal.which) + ')">' + icon('download') +
          esc(t('imp.template')) + '</button>' +
      '</div>' +
      '<div class="fld" style="margin-top:12px;"><label>' + esc(t('imp.or')) + '</label>' +
        '<textarea id="imp-text" dir="ltr" class="figure" style="min-height:110px;font-size:11.5px;" ' +
          'oninput="setImportText(this.value)" placeholder="' + esc(I.columns.join(',')) + '">' +
          esc(S.modal.text || '') + '</textarea>' +
        '<div class="hint">' + esc(I.columns.join(' · ')) + '</div></div>' +
      '<button class="btn" onclick="parseImport()">' + icon('check-circle') + esc(t('imp.parse')) + '</button>' +
      preview +
      '<p class="inline-note" style="margin-top:12px;">' + esc(t('imp.previewNote')) + '</p>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn primary" onclick="applyImport()"' + (applicable ? '' : ' disabled') + '>' +
        esc(t('imp.apply', { n:applicable })) + '</button></div>';
}

/* ==========================================================================
   14. THE QUERY ENGINE
   Reports are SQL, and the dashboard is built from reports. That is the whole
   design: one place where a number is defined, and a dashboard that cannot
   invent a figure the reports module could not reproduce.

   This runs a SUBSET of SQL over the in-memory tables. What it supports:

     SELECT  col | tbl.col | * | COUNT(*) | COUNT|SUM|AVG|MIN|MAX(col) [AS alias]
     FROM    table [alias]
     JOIN    table [alias] ON a.col = b.col        (inner, equality only)
     WHERE   comparisons joined by AND / OR, with ( ) grouping
             =  !=  <>  <  <=  >  >=  IN (...)  LIKE 'x%'  IS [NOT] NULL
     GROUP BY col[, col]
     ORDER BY col|alias [ASC|DESC]
     LIMIT   n

   What it does not: subqueries, UNION, HAVING, OUTER JOIN, DISTINCT,
   expressions in SELECT. It refuses those by name rather than guessing —
   an engine that quietly ignores half a clause is worse than one that cannot
   run it, because the number comes out wrong and looks right.
   ========================================================================== */

/* The tables a report can read. Flattened views of DATA: bilingual fields split
   into plain columns so SQL sees scalars, and the derived facts the team
   actually filters on (dormant, unclaimed, roster match) are columns here
   rather than something every query has to recompute. */
function sqlTables() {
  return {
