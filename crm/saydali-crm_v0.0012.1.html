class SqlError extends Error {}

function sqlTokens(text) {
  const out = [];
  const re = /\s+|--[^\n]*|('(?:[^']|'')*')|([A-Za-z_][A-Za-z0-9_.]*)|(\d+\.?\d*)|(<=|>=|<>|!=|=|<|>|\(|\)|,|\*)/g;
  let m, last = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index !== last) throw new SqlError('Unexpected character at ' + last + ': ' + text.slice(last, m.index));
    last = re.lastIndex;
    if (m[1] !== undefined) out.push({ t:'str', v:m[1].slice(1, -1).split("''").join("'") });
    else if (m[2] !== undefined) out.push({ t:'word', v:m[2] });
    else if (m[3] !== undefined) out.push({ t:'num', v:Number(m[3]) });
    else if (m[4] !== undefined) out.push({ t:'op', v:m[4] });
  }
  if (last !== text.length) throw new SqlError('Unexpected character at ' + last);
  return out;
}

const SQL_KEYWORDS = ['SELECT','FROM','JOIN','INNER','ON','WHERE','GROUP','ORDER','BY','LIMIT',
                      'AND','OR','NOT','IN','LIKE','IS','NULL','AS','ASC','DESC'];
const SQL_REFUSED = { UNION:'UNION', HAVING:'HAVING', DISTINCT:'DISTINCT',
                      LEFT:'OUTER JOIN', RIGHT:'OUTER JOIN', FULL:'OUTER JOIN' };

function runSQL(text) {
  const raw = String(text || '').trim().replace(/;+\s*$/, '');
  if (!raw) throw new SqlError('Empty query.');

  const upper = raw.toUpperCase();
  for (const k in SQL_REFUSED) {
    if (new RegExp('\\b' + k + '\\b').test(upper))
      throw new SqlError('Not supported: ' + SQL_REFUSED[k] + '. This engine runs a documented subset.');
  }
  if (/\(\s*SELECT\b/i.test(raw)) throw new SqlError('Not supported: subqueries.');
  if (!/^SELECT\b/i.test(raw)) throw new SqlError('Only SELECT is supported. Reports read; they never write.');

  const toks = sqlTokens(raw);
  let i = 0;
  const peek = () => toks[i];
  const isKw = k => peek() && peek().t === 'word' && peek().v.toUpperCase() === k;
  const eat = k => { if (!isKw(k)) throw new SqlError('Expected ' + k); return toks[i++]; };
  const eatOp = o => { if (!(peek() && peek().t === 'op' && peek().v === o)) throw new SqlError('Expected ' + o); return toks[i++]; };
  const maybe = k => { if (isKw(k)) { i++; return true; } return false; };
  const isPlainWord = () => peek() && peek().t === 'word' && !SQL_KEYWORDS.includes(peek().v.toUpperCase());

  function inList(ref, neg) {
    eatOp('(');
    const vals = [];
    do { const v = toks[i++]; if (!v || v.t === 'op') throw new SqlError('Expected a value inside IN ( )'); vals.push(v.v); }
    while (peek() && peek().t === 'op' && peek().v === ',' && ++i);
    eatOp(')');
    return { in:ref, vals, neg };
  }
  function parseCmp() {
    if (peek() && peek().t === 'op' && peek().v === '(') { i++; const e = parseOr(); eatOp(')'); return e; }
    const lhs = toks[i++];
    if (!lhs) throw new SqlError('Unfinished WHERE clause');
    if (isKw('IS')) { i++; const neg = maybe('NOT'); eat('NULL'); return { isNull:lhs.v, neg }; }
    if (isKw('NOT') && toks[i + 1] && String(toks[i + 1].v).toUpperCase() === 'IN') { i += 2; return inList(lhs.v, true); }
    if (isKw('IN')) { i++; return inList(lhs.v, false); }
    if (isKw('LIKE')) { i++; const p = toks[i++];
      if (!p || p.t !== 'str') throw new SqlError('LIKE needs a quoted pattern');
      return { like:lhs.v, pattern:p.v }; }
    const op = toks[i++];
    if (!op || op.t !== 'op') throw new SqlError('Expected a comparison after ' + lhs.v);
    const rhs = toks[i++];
    if (!rhs) throw new SqlError('Expected a value after ' + op.v);
    return { cmp:op.v, lhs, rhs };
  }
  function parseAnd() { let l = parseCmp(); while (isKw('AND')) { i++; l = { and:[l, parseCmp()] }; } return l; }
  function parseOr()  { let l = parseAnd(); while (isKw('OR'))  { i++; l = { or:[l, parseAnd()] }; } return l; }

  eat('SELECT');
  const cols = [];
  do {
    if (peek() && peek().t === 'op' && peek().v === '*') { i++; cols.push({ star:true }); }
    else {
      const first = peek();
      if (!first || first.t !== 'word') throw new SqlError('Expected a column name after SELECT');
      const AGGS = ['COUNT','SUM','AVG','MIN','MAX'];
      let col;
      if (AGGS.includes(first.v.toUpperCase()) && toks[i + 1] && toks[i + 1].v === '(') {
        const fn = first.v.toUpperCase(); i += 2;
        let arg;
        if (peek() && peek().t === 'op' && peek().v === '*') { arg = '*'; i++; }
        else { if (!peek() || peek().t !== 'word') throw new SqlError('Expected a column inside ' + fn + '()'); arg = toks[i++].v; }
        eatOp(')');
        col = { agg:fn, arg, name:fn.toLowerCase() + '_' + String(arg).replace(/[^A-Za-z0-9_]/g, '') };
      } else { i++; col = { ref:first.v, name:first.v.includes('.') ? first.v.split('.')[1] : first.v }; }
      if (maybe('AS')) {
        if (!peek() || peek().t !== 'word') throw new SqlError('Expected an alias after AS');
        col.name = toks[i++].v;
      }
      cols.push(col);
    }
  } while (peek() && peek().t === 'op' && peek().v === ',' && ++i);

  eat('FROM');
  if (!isPlainWord()) throw new SqlError('Expected a table name after FROM');
  const base = { table:toks[i++].v };
  base.alias = isPlainWord() ? toks[i++].v : base.table;

  const joins = [];
  while (isKw('JOIN') || isKw('INNER')) {
    if (isKw('INNER')) i++;
    eat('JOIN');
    if (!isPlainWord()) throw new SqlError('Expected a table name after JOIN');
    const j = { table:toks[i++].v };
    j.alias = isPlainWord() ? toks[i++].v : j.table;
    eat('ON');
    const lhs = toks[i++], op = toks[i++], rhs = toks[i++];
    if (!lhs || !op || !rhs || op.v !== '=')
      throw new SqlError('JOIN ... ON supports equality only, as in ON a.id = b.a_id');
    j.on = [lhs.v, rhs.v];
    joins.push(j);
  }

  let where = null;
  if (maybe('WHERE')) where = parseOr();

  const groupBy = [];
  if (isKw('GROUP')) { i++; eat('BY');
    do { if (!peek() || peek().t !== 'word') throw new SqlError('Expected a column after GROUP BY');
         groupBy.push(toks[i++].v); }
    while (peek() && peek().t === 'op' && peek().v === ',' && ++i); }

  let orderBy = null;
  if (isKw('ORDER')) { i++; eat('BY');
    if (!peek() || peek().t !== 'word') throw new SqlError('Expected a column after ORDER BY');
    orderBy = { col:toks[i++].v, dir:'asc' };
    if (maybe('DESC')) orderBy.dir = 'desc'; else maybe('ASC'); }

  let limit = null;
  if (maybe('LIMIT')) {
    if (!peek() || peek().t !== 'num') throw new SqlError('Expected a number after LIMIT');
    limit = toks[i++].v; }

  if (i < toks.length) throw new SqlError('Unexpected trailing input: ' + toks.slice(i).map(x => x.v).join(' '));

  const tables = sqlTables();
  const src = tables[base.table];
  if (!src) throw new SqlError('No such table: ' + base.table + '. Tables: ' + Object.keys(tables).join(', '));

  /* Rows are namespaced by alias so a.col and b.col stay distinct; a bare
     column name resolves against whichever table actually has it. */
  let rows = src.map(r => { const o = {}; o[base.alias] = r; return o; });
  for (const j of joins) {
    const other = tables[j.table];
    if (!other) throw new SqlError('No such table: ' + j.table);
    const out = [];
    for (const row of rows) for (const o of other) {
      const cand = Object.assign({}, row); cand[j.alias] = o;
      if (String(resolve(cand, j.on[0])) === String(resolve(cand, j.on[1]))) out.push(cand);
    }
    rows = out;
  }

  function resolve(row, ref) {
    const s = String(ref);
    if (s.indexOf('.') >= 0) { const parts = s.split('.'); return row[parts[0]] ? row[parts[0]][parts[1]] : undefined; }
    for (const a of Object.keys(row)) if (row[a] && s in row[a]) return row[a][s];
    return undefined;
  }
  const num = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
  function valueOf(row, tok) {
    if (tok.t === 'str' || tok.t === 'num') return tok.v;
    const up = String(tok.v).toUpperCase();
    if (up === 'NULL') return null;
    if (up === 'TRUE') return 1;
    if (up === 'FALSE') return 0;
    return resolve(row, tok.v);
  }
  function test(row, e) {
    if (!e) return true;
    if (e.and) return test(row, e.and[0]) && test(row, e.and[1]);
    if (e.or) return test(row, e.or[0]) || test(row, e.or[1]);
    if (e.isNull) { const v = resolve(row, e.isNull);
      const isN = (v === null || v === undefined); return e.neg ? !isN : isN; }
    if (e.in) { const v = resolve(row, e.in);
      const hit = e.vals.some(x => String(x) === String(v)); return e.neg ? !hit : hit; }
    if (e.like) {
      const v = resolve(row, e.like);
      if (v === null || v === undefined) return false;
      const rx = new RegExp('^' + String(e.pattern)
        .replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i');
      return rx.test(String(v));
    }
    const a = valueOf(row, e.lhs), b = valueOf(row, e.rhs);
    switch (e.cmp) {
      case '=': return String(a) === String(b);
      case '!=': case '<>': return String(a) !== String(b);
      case '<': return num(a) < num(b);
      case '<=': return num(a) <= num(b);
      case '>': return num(a) > num(b);
      case '>=': return num(a) >= num(b);
      default: throw new SqlError('Unsupported comparison: ' + e.cmp);
    }
  }

  rows = rows.filter(r => test(r, where));

  /* An aggregate with no GROUP BY is one row over everything — what SQL does,
     and what a KPI tile wants. */
  const hasAgg = cols.some(c => c.agg);
  let groups;
  if (groupBy.length) {
    const map = new Map();
    for (const r of rows) {
      const key = groupBy.map(g => String(resolve(r, g))).join('\u0000');
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    }
    groups = Array.from(map.values());
  } else if (hasAgg) { groups = [rows]; }
  else { groups = rows.map(r => [r]); }

  function agg(fn, arg, bucket) {
    if (fn === 'COUNT') return arg === '*' ? bucket.length
      : bucket.filter(r => { const v = resolve(r, arg); return v !== null && v !== undefined; }).length;
    const nums = bucket.map(r => Number(resolve(r, arg))).filter(n => Number.isFinite(n));
    if (!nums.length) return null;
    if (fn === 'SUM') return nums.reduce((a, b) => a + b, 0);
    if (fn === 'AVG') return Math.round(nums.reduce((a, b) => a + b, 0) / nums.length * 100) / 100;
    if (fn === 'MIN') return Math.min.apply(null, nums);
    if (fn === 'MAX') return Math.max.apply(null, nums);
    throw new SqlError('Unsupported function: ' + fn);
  }

  let out = groups.map(bucket => {
    const first = bucket[0];
    const row = {};
    for (const c of cols) {
      if (c.star) { Object.keys(first).forEach(a => Object.assign(row, first[a])); continue; }
      row[c.name] = c.agg ? agg(c.agg, c.arg, bucket) : resolve(first, c.ref);
    }
    return row;
  });

  const columns = out.length ? Object.keys(out[0]) : cols.filter(c => !c.star).map(c => c.name);

  if (orderBy) {
    const k = orderBy.col.indexOf('.') >= 0 ? orderBy.col.split('.')[1] : orderBy.col;
    out.sort((x, y) => {
      const a = x[k], b = y[k];
      const c = (typeof a === 'number' && typeof b === 'number')
        ? a - b : String(a == null ? '' : a).localeCompare(String(b == null ? '' : b));
      return orderBy.dir === 'desc' ? -c : c;
    });
  }
  if (limit !== null) out = out.slice(0, limit);

  return { columns, rows:out };
}

const reportById = id => REPORTS.find(r => r.id === id) || null;

/* Runs a report and turns the rows into whatever the tile needs to draw. A
   report that fails returns the error rather than an empty chart, because a
   tile silently showing zero is how a broken query survives for a month. */
function runReport(rep) {
  try {
    const res = runSQL(rep.sql);
    return { ok:true, columns:res.columns, rows:res.rows };
  } catch (e) {
    return { ok:false, error:(e && e.message) || String(e) };
  }
}

/* A result becomes {label, n} pairs by convention: first text column labels,
   first numeric column measures. Stated rather than guessed, so a report author
   knows how to shape a query for a chart. */
function resultSeries(res) {
  if (!res.ok || !res.rows.length) return [];
  const cols = res.columns;
  const numeric = cols.filter(c => res.rows.every(r => r[c] === null || typeof r[c] === 'number'));
  const measure = numeric[0] || cols[cols.length - 1];
  const label = cols.find(c => c !== measure) || measure;
  return res.rows.map(r => ({ label:String(r[label] == null ? '—' : r[label]), n:Number(r[measure]) || 0 }));
}
function resultScalar(res) {
  if (!res.ok || !res.rows.length) return null;
  const c = res.columns[0];
  return res.rows[0][c];
}

function resultTable(res, limit) {
  const rows = limit ? res.rows.slice(0, limit) : res.rows;
  return '<div style="overflow-x:auto"><table class="mini"><thead><tr>' +
    res.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    (rows.length
      ? rows.map(r => '<tr>' + res.columns.map(c => {
          const v = r[c];
          return '<td' + (typeof v === 'number' ? ' class="n"' : '') + '>' +
            esc(v === null || v === undefined ? '—' : v) + '</td>';
        }).join('') + '</tr>').join('')
      : '<tr><td colspan="' + res.columns.length + '" style="text-align:center;color:var(--ink-faint)">' +
        esc(t('rep.noRows')) + '</td></tr>') +
    '</tbody></table></div>';
}

function reportsBody() {
  if (S.report) return reportEditor(S.report);

  return '<div class="dash"><div class="charts c2">' + REPORTS.map(rep => {
    const res = runReport(rep);
    return '<section class="panel">' +
      '<div class="chart-h"><span class="chart-t">' + esc(rep.name) + '</span>' +
        '<span class="chart-s">' + esc(t('viz.' + rep.viz)) + '</span>' +

          ? '<button class="table-toggle" onclick="openReport(' + attr(rep.id) + ')">' + esc(t('a.edit')) + '</button>'

  }).join('') + '</div></div>';

function reportViz(rep, res, compact) {
  if (!res.ok) return '<div class="imp-fatal">' + icon('alert') + esc(res.error) + '</div>';

  if (rep.viz === 'number') {
    const v = resultScalar(res);
    return '<div class="kpi-v" style="font-size:34px;">' + esc(v === null ? '—' : fmt(v)) + '</div>' +
      '<div class="inline-note">' + esc(res.columns[0]) + '</div>';
  }
  if (rep.viz === 'table') return resultTable(res, compact ? 5 : null);

  const series = resultSeries(res);
  if (!series.length) return '<p class="empty" style="padding:20px;">' + esc(t('rep.noRows')) + '</p>';
  if (rep.viz === 'line') {
    return trendChart(series.map(s => ({ n:s.n, label:s.label, short:s.label.slice(0, 6) })),
      { title:'', sub:'', id:'rep-' + rep.id, bare:true });
  }
  return barRows(series);
}

/* The bar marks, without the card around them — the report card supplies that.
   One colour for every bar: these are nominal categories, and shading them by
   size would double-encode the length the bar already shows. */
function barRows(series) {
  const max = Math.max(1, ...series.map(s => s.n));
  return series.map(s =>
    '<div class="funnel-row">' +
      '<span class="funnel-label">' + esc(s.label) + '</span>' +
      '<span class="funnel-track" style="height:16px;"><span class="funnel-bar" tabindex="0" role="img" ' +
        'aria-label="' + esc(s.label + ': ' + s.n) + '" data-tip="' + esc(s.label + '<br><b>' + fmt(s.n) + '</b>') + '" ' +
        'style="width:' + Math.max(2, s.n / max * 100) + '%;background:var(--series);height:16px;"></span></span>' +
      '<span class="funnel-n">' + fmt(s.n) + '</span>' +
    '</div>').join('');
}

}

/* ==========================================================================
   16. THE DASHBOARD
   Tiles, not a fixed layout. Every tile names a report, so the dashboard holds
   no numbers of its own — it cannot show a figure the Reports module could not
   reproduce, and editing the query moves the tile with it.
   ========================================================================== */

/* What the dashboard opens with. A layout, not data. */

  { report:'R9', w:'s' },

  { report:'R7', w:'m' },

function tileCard(tile, idx) {
  const rep = reportById(tile.report);
  if (!rep) {
    return '<section class="panel tile w-' + tile.w + '">' +
      '<div class="chart-wrap"><div class="imp-fatal">' + icon('alert') +
      esc(t('dash.missingReport', { id:tile.report })) + '</div></div></section>';

  return '<section class="panel tile w-' + tile.w + '">' +

      '<span class="spacer" style="flex:1"></span>' +

        ? '<span class="tile-tools">' +

}

/* ---------- Actions ---------- */

function toggleDashEdit() { S.dashEdit = !S.dashEdit; render(); }
function moveTile(i, d) {
  const j = i + d;
  if (j < 0 || j >= S.tiles.length) return;
  const t0 = S.tiles[i]; S.tiles[i] = S.tiles[j]; S.tiles[j] = t0;
  render();
}
function setTileWidth(i, w) { S.tiles[i].w = w; render(); }
function removeTile(i) { S.tiles.splice(i, 1); render(); }
function openAddTile() { S.modal = { kind:'addTile' }; renderModal(); }
function addTile(id) {
  const rep = reportById(id);
  S.tiles.push({ report:id, w:rep && rep.viz === 'number' ? 's' : 'm' });
  S.modal = null;
  toast(t('dash.added'));
  render();
}
function resetDash() { S.tiles = DEFAULT_TILES.map(x => Object.assign({}, x)); toast(t('dash.reset')); render(); }
function goReport(id) { S.tab = 'reports'; S.report = id; S.draft = null; render(); }

function openReport(id) {
  if (!can('reports.edit')) return deny();
  S.tab = 'reports'; S.report = id || 'new'; S.draft = null; render();
}
function closeReport() { S.report = null; S.draft = null; render(); }
function setDraft(k, v) { S.draft = S.draft || {}; S.draft[k] = v; }
function insertSql(text) {
  const box = document.getElementById('rep-sql');
  if (!box) return;
  const at = box.selectionStart || box.value.length;
  box.value = box.value.slice(0, at) + text + box.value.slice(box.selectionEnd || at);
  setDraft('sql', box.value);
  box.focus();
  box.selectionStart = box.selectionEnd = at + text.length;
}
function saveReport() {
  if (!can('reports.edit')) return deny();
  const d = S.draft;
  if (!d || !String(d.name || '').trim()) { toast(t('n.required')); return; }
  const res = runReport(d);
  // A report that does not run is not saved. Saving a broken query is how a
  // dashboard tile ends up permanently red with nobody owning it.
  if (!res.ok) { toast(res.error); return; }
  if (S.report === 'new') {
    REPORTS.push({ id:'R' + Date.now().toString().slice(-6), name:d.name, viz:d.viz, sql:d.sql });
  } else {
    Object.assign(reportById(S.report), { name:d.name, viz:d.viz, sql:d.sql });
  }
  S.report = null; S.draft = null;
  toast(t('rec.saved'));
  render();
}
function deleteReport(id) {
  if (!can('reports.edit')) return deny();
  const i = REPORTS.findIndex(r => r.id === id);
  if (i >= 0) REPORTS.splice(i, 1);
  // Tiles pointing at it say so rather than vanishing, so the dashboard cannot
  // quietly lose a number somebody was relying on.
  S.report = null; S.draft = null;
  toast(t('rec.deleted'));
  render();
}
function pinReport(id) {
  if (S.tiles.some(x => x.report === id)) { toast(t('dash.onBoard')); return; }
  const rep = reportById(id);
  S.tiles.push({ report:id, w:rep && rep.viz === 'number' ? 's' : 'm' });
  toast(t('dash.added'));
}

/* ==========================================================================
   17. TEAM & ACCESS
   Who is signed in, what that lets them do, and what happens to the work when
   someone leaves. Three levels: one owner admin (this account, transferred
   rather than deleted), admins who run the operation, and employees who work
   in it. The matrix itself lives in CAPS, next to the data it protects.
   ========================================================================== */

/* Every gated button is hidden AND every gated function refuses. Hiding alone
   is decoration — the handler is a global on a page anyone with the file can
   open — and refusing alone leaves a button that does nothing. */

const ROLE_CHIP = { owner_admin:'chip-info', admin:'chip-good', employee:'chip-mute' };

/* The collections that carry an `owner`. Named once here so that adding a
   module and forgetting to reassign its records cannot happen quietly: the
   deactivate dialog counts from this list and so does the reassignment. */
const OWNED = ['users', 'orders', 'pharmacies', 'companies', 'universities', 'tasks', 'activity'];

const ownedBy = id => OWNED.reduce((n, k) => n + DATA[k].filter(r => r.owner === id).length, 0);

function reassign(from, to) {
  let n = 0;
  OWNED.forEach(k => DATA[k].forEach(r => { if (r.owner === from) { r.owner = to; n++; } }));
  return n;
}

/* ---------- The account menu ---------- */

function toggleAccountMenu() { S.accountMenu = !S.accountMenu; S.viewMenu = null; render(); }

/* A fixture-file stand-in for signing out and back in. A real build reads the

function teamHead() {

function teamBody() {

        '<span class="cell-sub figure" dir="ltr">' + esc(s.email) + '</span></span></span></td>' +

/* The matrix, drawn from CAPS rather than retyped. If the two ever disagree it

function matrixPanel() {

/* ---------- Creating an account ---------- */

function openNewStaff() {
  if (!can('staff.employee')) return deny();
  S.modal = { kind:'staff', errors:{}, values:{ role:'employee' } };
  renderModal();
}

/* An admin may create employees; only the owner admin may create an admin. The
   dropdown is built from what this account can actually do, so the refusal is
   not a surprise at the end of a filled-in form. */
function rolesICanGrant() {
  const out = [];
  if (can('staff.employee')) out.push('employee');
  if (can('staff.admin')) out.push('admin');
  return out;
}

function staffModal() {
  const v = S.modal.values || {};
  const e = S.modal.errors || {};
  const grantable = rolesICanGrant();
  const fld = (id, label, control, err, hint) =>
    '<div class="fld"><label for="' + id + '">' + esc(label) + '</label>' + control +
    (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') + '</div>';

  return '<div class="modal-h"><span class="modal-t">' + esc(t('team.new')) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b"><div class="form-grid two">' +
      fld('s-name', t('c.name'),
        '<input id="s-name"' + (e.name ? ' class="bad"' : '') + ' value="' + esc(v.name || '') + '">', e.name) +
      fld('s-email', t('c.email'),
        '<input id="s-email" dir="ltr"' + (e.email ? ' class="bad"' : '') + ' value="' + esc(v.email || '') + '">', e.email) +
      fld('s-role', t('c.role'),
        '<select id="s-role">' + grantable.map(r => '<option value="' + r + '"' +
          (v.role === r ? ' selected' : '') + '>' + esc(t('sr.' + r)) + '</option>').join('') + '</select>',
        null, t('team.roleHint')) +
    '</div>' +
    '<p class="inline-note">' + esc(t('team.grantNote', { caps:capsLine(v.role || 'employee') })) + '</p>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn primary" onclick="saveStaff()">' + esc(t('a.save')) + '</button></div>';
}

function saveStaff() {
  const v = {
    name: (document.getElementById('s-name').value || '').trim(),
    email:(document.getElementById('s-email').value || '').trim(),
    role: document.getElementById('s-role').value
  };
  S.modal.values = v;
  const errors = {};
  if (!v.name) errors.name = t('n.required');
  if (!v.email) errors.email = t('n.required');
  else if (!/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(v.email)) errors.email = t('n.badEmail');
  else if (STAFF.some(s => s.email.toLowerCase() === v.email.toLowerCase()))
    errors.email = t('n.duplicate', { v:v.email });
  // Checked here as well as in the dropdown: the form is not the boundary.
  if (rolesICanGrant().indexOf(v.role) < 0) errors.role = t('perm.cannotGrant');
  if (Object.keys(errors).length) { S.modal.errors = errors; renderModal(); return; }

  const initials = L({ en:v.name }).split(/\s+/).filter(Boolean).slice(0, 2)
    .map(w => w[0].toUpperCase()).join('');
  const s = { id:'u' + (STAFF.length + 1), name:{ ar:v.name, en:v.name },
    initials:{ ar:initials, en:initials }, email:v.email, role:v.role, active:true, since:ISO_TODAY };
  STAFF.push(s);
  USERS[s.id] = s;
  S.modal = null;
  S.tab = 'team';
  toast(t('team.created', { name:v.name }));
  render();
}

/* ---------- Changing a role ---------- */

function openRole(id) {
  if (!can('staff.admin')) return deny();
  const s = staffById(id);
  if (!s || s.role === 'owner_admin') return deny();
  S.modal = { kind:'role', id, values:{ role:s.role }, errors:{} };
  renderModal();
}

function roleModal() {
  const s = staffById(S.modal.id);
  const v = S.modal.values || {};
  return '<div class="modal-h"><span class="modal-t">' + esc(t('team.changeRole')) + ' — ' + esc(L(s.name)) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b">' +
      '<div class="fld"><label for="r-role">' + esc(t('c.role')) + '</label>' +
        '<select id="r-role" onchange="S.modal.values.role=this.value; renderModal();">' +
        ['employee', 'admin'].map(r => '<option value="' + r + '"' + (v.role === r ? ' selected' : '') + '>' +
          esc(t('sr.' + r)) + '</option>').join('') + '</select></div>' +
      '<p class="inline-note">' + esc(t('team.grantNote', { caps:capsLine(v.role) })) + '</p>' +
    '</div>' +

      '<button class="btn primary" onclick="saveRole()">' + esc(t('a.save')) + '</button></div>';
}

function saveRole() {
  if (!can('staff.admin')) return deny();
  const s = staffById(S.modal.id);
  const role = S.modal.values.role;
  if (!s || s.role === 'owner_admin' || ['employee', 'admin'].indexOf(role) < 0) return deny();
  s.role = role;
  S.modal = null;
  toast(t('team.roleChanged', { name:L(s.name), role:t('sr.' + role) }));
  render();
}

/* ---------- Deactivating, and the records left behind ----------
   BACKLOG W5 left this open: what happens to records owned by a deleted
   employee. Settled here — an account is deactivated rather than deleted, and
   the dialog will not close until the work has a new owner. A pharmacy that
   stops being anybody's job is how a customer stops being called. */

function openDeactivate(id) {
  const s = staffById(id);
  if (!s) return;
  if (s.role === 'owner_admin') return deny();
  if (!(s.role === 'admin' ? can('staff.admin') : can('staff.employee'))) return deny();
  if (id === ME) { toast(t('team.notYourself')); return; }
  const successor = STAFF.find(x => x.active && x.id !== id);
  S.modal = { kind:'deactivate', id, values:{ to: successor ? successor.id : '' }, errors:{} };
  renderModal();
}

function deactivateModal() {
  const s = staffById(S.modal.id);
  const n = ownedBy(s.id);
  const others = STAFF.filter(x => x.active && x.id !== s.id);
  const v = S.modal.values || {};
  return '<div class="modal-h"><span class="modal-t">' + esc(t('team.deactivate')) + ' — ' + esc(L(s.name)) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b">' +
      '<p class="inline-note">' + esc(t('team.deactivateNote', { n:fmt(n), name:L(s.name) })) + '</p>' +
      (n
        ? '<div class="fld"><label for="d-to">' + esc(t('team.handTo')) + ' <span class="req">*</span></label>' +
            '<select id="d-to" onchange="S.modal.values.to=this.value;">' +
            others.map(x => '<option value="' + x.id + '"' + (v.to === x.id ? ' selected' : '') + '>' +
              esc(L(x.name)) + ' — ' + esc(t('sr.' + x.role)) + '</option>').join('') + '</select>' +
            '<div class="hint">' + esc(t('team.handToHint')) + '</div></div>'
        : '<p class="inline-note">' + esc(t('team.ownsNothing')) + '</p>') +
    '</div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn danger" onclick="confirmDeactivate()">' + esc(t('team.deactivate')) + '</button></div>';
}

function confirmDeactivate() {
  const s = staffById(S.modal.id);
  if (!s || s.role === 'owner_admin') return deny();
  if (!(s.role === 'admin' ? can('staff.admin') : can('staff.employee'))) return deny();

  const n = ownedBy(s.id);
  const to = (document.getElementById('d-to') || {}).value || S.modal.values.to;
  if (n && !staffById(to)) { toast(t('team.needSuccessor')); return; }

  const moved = n ? reassign(s.id, to) : 0;
  s.active = false;
  S.modal = null;
  toast(moved
    ? t('team.deactivatedWith', { name:L(s.name), n:fmt(moved), to:L(staffById(to).name) })
    : t('team.deactivated', { name:L(s.name) }));
  render();
}

function reactivate(id) {
  const s = staffById(id);
  if (!s) return;
  if (!(s.role === 'admin' ? can('staff.admin') : can('staff.employee'))) return deny();
  s.active = true;
  toast(t('team.reactivated', { name:L(s.name) }));
  render();
}

/* ---------- Transferring the owner admin ----------
   There is exactly one, and it moves rather than disappears. The account
   handing it over becomes an admin, so the operation never has zero owners and
   never has two. */

function openTransfer() {
  if (!can('staff.admin')) return deny();
  const first = STAFF.find(x => x.active && x.id !== ME);
  S.modal = { kind:'transfer', values:{ to: first ? first.id : '' }, errors:{} };
  renderModal();
}

function transferModal() {
  const others = STAFF.filter(x => x.active && x.id !== ME);
  const v = S.modal.values || {};
  return '<div class="modal-h"><span class="modal-t">' + esc(t('team.transfer')) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b">' +
      '<p class="inline-note">' + esc(t('team.transferNote')) + '</p>' +
      '<div class="fld"><label for="x-to">' + esc(t('team.transferTo')) + ' <span class="req">*</span></label>' +
        '<select id="x-to" onchange="S.modal.values.to=this.value;">' +
        others.map(x => '<option value="' + x.id + '"' + (v.to === x.id ? ' selected' : '') + '>' +
          esc(L(x.name)) + ' — ' + esc(t('sr.' + x.role)) + '</option>').join('') + '</select></div>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn primary" onclick="confirmTransfer()">' + esc(t('team.transfer')) + '</button></div>';
}

function confirmTransfer() {
  if (!can('staff.admin')) return deny();
  const to = staffById((document.getElementById('x-to') || {}).value || S.modal.values.to);
  if (!to || !to.active) { toast(t('team.needSuccessor')); return; }
  const from = me();
  to.role = 'owner_admin';
  from.role = 'admin';
  S.modal = null;
  toast(t('team.transferred', { name:L(to.name) }));
  render();
}

/* ==========================================================================
   8. STATE & RENDER
   ========================================================================== */

const TABS = ['home', 'orders', 'users', 'pharmacies', 'companies', 'listings', 'invoices', 'universities', 'syndicate', 'drugs', 'catalogue', 'reports'];

/* Team sits outside TABS on purpose: it is who may do what, not a pile of
   records the team works through. It is reached from the account menu, the
   place anyone already looks for "who am I signed in as". */

const S = {
  tab:'home',
  record:null,              // { mod, id }
  view:{ listings:'all', invoices:'all', orders:'all', users:'all', pharmacies:'all', companies:'all',
         universities:'all', syndicate:'all', drugs:'all', catalogue:'all' },
  filters:{ listings:{}, invoices:{}, orders:{}, users:{}, pharmacies:{}, companies:{},
            universities:{}, syndicate:{}, drugs:{}, catalogue:{} },
  sort:{},
  picked:{ listings:[], invoices:[], orders:[], users:[], pharmacies:[], companies:[],
           universities:[], syndicate:[], drugs:[], catalogue:[] },
  viewMenu:null,

  /* The dashboard is a list of tiles, each naming a report. Nothing on it holds
     a number of its own. */
  tiles:DEFAULT_TILES.map(x => Object.assign({}, x)),
  dashEdit:false,
  report:null,
  draft:null,

  modal:null,
  query:'',
  accountMenu:false,
  drag:null
};

function render() {
  document.getElementById('tb-suite').textContent = t('suite');
  document.getElementById('build-tag').textContent = VERSION;
  document.querySelector('#btn-app span').textContent = t('openApp');
  document.getElementById('q').placeholder = t('search');
  document.getElementById('me-avatar').textContent = L(me().initials);
  document.getElementById('me-avatar').setAttribute('aria-label', L(me().name) + ' — ' + t('sr.' + me().role));
  document.getElementById('account-menu').innerHTML = S.accountMenu ? accountMenu() : '';

  document.getElementById('tabs').innerHTML = TABS.map(k => {
    const M = MODULES[k];
    const n = M ? M.data().length : (k === 'reports' ? REPORTS.length : null);
    return '<button class="tab' + (S.tab === k ? ' active' : '') + '" onclick="goTab(' + attr(k) + ')">' +
      icon(k === 'home' ? 'home' : k === 'reports' ? 'chart' : M.icon) + esc(t('mod.' + k)) +
      (n !== null ? '<span class="tab-count">' + fmt(n) + '</span>' : '') + '</button>';
  }).join('');

  const rail = document.getElementById('rail');
  const head = document.getElementById('work-head');
  const body = document.getElementById('work-body');

  if (S.record) {
    rail.classList.add('hidden');
    head.innerHTML = '';
    body.innerHTML = recordPage(S.record.mod, S.record.id);
  } else if (S.tab === 'home') {
    rail.classList.add('hidden');
    head.innerHTML = dashHead();
    body.innerHTML = dashBody();
  } else if (S.tab === 'team') {
    rail.classList.add('hidden');

function startEdit(el, path, type) {
  const [mod, id, field] = path.split('.');
  const rec = findRecord(mod, id);
  if (!rec) return;

  let input;
  if (type === 'owner') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      activeStaff().map(s => '<option value="' + s.id + '"' + (rec.owner === s.id ? ' selected' : '') + '>' +
        esc(L(s.name)) + '</option>').join('') + '</select>';
  } else if (type === 'district') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      DISTRICTS.map(d => '<option value="' + d.key + '"' + (rec.district === d.key ? ' selected' : '') + '>' +
        esc(L(d)) + '</option>').join('') + '</select>';
  } else if (type === 'stage') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      STAGES.map(s => '<option value="' + s.key + '"' + (rec.stage === s.key ? ' selected' : '') + '>' +
        esc(t('st.' + s.key)) + '</option>').join('') + '</select>';
  } else if (type === 'drugForm') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      DRUG_FORMS.map(f => '<option value="' + f + '"' + (rec.form === f ? ' selected' : '') + '>' +
        esc(t('df.' + f)) + '</option>').join('') + '</select>';
  } else if (type === 'priority') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      ['high','normal','low'].map(p => '<option value="' + p + '"' + (rec.priority === p ? ' selected' : '') + '>' +
        esc(t('pr.' + p)) + '</option>').join('') + '</select>';
  } else {
    const raw = typeof rec[field] === 'object' ? L(rec[field]) : rec[field];
    input = '<input type="' + (type === 'number' ? 'number' : type === 'date' ? 'date' : 'text') + '" ' +
      'value="' + attr(raw == null ? '' : raw) + '" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){this.dataset.abort=1;this.blur();}" ' +
      'onblur="commitEdit(this,' + attr(path) + ')">';
  }
  el.innerHTML = input;
  const f = el.querySelector('input,select');
  f.focus();
  if (f.select) f.select();
}

function commitEdit(el, path) {
  if (el.dataset.abort) { render(); return; }
  const [mod, id, field] = path.split('.');
  const rec = findRecord(mod, id);
  if (!rec) { render(); return; }

  let v = el.value;
  if (field === 'value') v = Number(v) || 0;
  // A bilingual field keeps both scripts: overwriting one language's copy with
  // the other's text is how a record ends up Latin-only on an Arabic screen.
  if (typeof rec[field] === 'object' && rec[field] !== null) rec[field] = { ar:v, en:v };
  else rec[field] = v;

  toast(t('rec.saved'));
  render();
}

function setOrderStatus(id, status) {
  const o = DATA.orders.find(r => r.id === id);
  if (!o) return;
  o.status = status;
  // Assigning without a person, or completing an order nobody took, is a state
  // the real database refuses; refuse it here too rather than showing a row
  // that could not exist.
  if (['assigned','in_progress','completed'].includes(status) && !o.assignee) {
    const pool = DATA.users.filter(u => u.verification === 'verified' &&
      u.type === (o.type === 'training' ? 'student' : 'pharmacist'));
    o.assignee = pool.length ? pool[0].id : null;
    if (o.applicants === 0) o.applicants = 1;
  }
  if (status === 'open') o.assignee = null;
  toast(t('d.moveTo', { stage:t('os.' + status) }));
  render();
}

    when:ISO_TODAY, owner:ME,

/* ---------- Catalogue mapping (v0.0012) ----------
   An operator links a product to its ingredients. The result is AUTO-MATCHED,
   never verified: verification is the clinical curator's step (W19), and the
   CRM offers nobody a way round it. An ingredient that matches a reference
   molecule links to it; anything else is kept as outside the reference, so
   the Helper can say plainly what it cannot check rather than drop it. */
function openMapProduct(code) {
  const p = findRecord('catalogue', code);
  if (!p) return;
  const mols = p.molecules.map(m => ({ sci:m.sci, strength:m.strength || '' }));
  while (mols.length < 3) mols.push({ sci:'', strength:'' });
  S.modal = { kind:'mapProduct', code, errors:{}, values:{
    nameEn:p.name ? p.name.en : '', nameAr:p.name ? p.name.ar : '', form:p.form || '',
    strength:p.strength || '', packEn:p.pack ? p.pack.en : '', price:p.price || '', mols
  }};
  renderModal();
}
function captureMap() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const v = S.modal.values;
  v.nameEn = g('m-name-en').trim(); v.nameAr = g('m-name-ar').trim(); v.form = g('m-form');
  v.strength = g('m-strength').trim(); v.packEn = g('m-pack').trim(); v.price = g('m-price').trim();
  v.mols = v.mols.map((_, i) => ({ sci:g('m-mol-' + i).trim(), strength:g('m-molst-' + i).trim() }));
  return v;
}
function addMapRow() { captureMap(); S.modal.values.mols.push({ sci:'', strength:'' }); renderModal(); }
function saveMapProduct(asNonDrug) {
  const v = captureMap();
  const mols = v.mols.filter(m => m.sci);
  const errors = {};
  if (!v.nameEn) errors.nameEn = t('n.required');
  if (!asNonDrug && !v.form) errors.form = t('n.required');
  if (!asNonDrug && !mols.length) errors.mols = t('cat.needIngredient');
  if (Object.keys(errors).length) { S.modal.errors = errors; renderModal(); return; }

  const p = findRecord('catalogue', S.modal.code);
  const known = sci => DRUGS.find(d => d.sci.toLowerCase() === sci.toLowerCase()) || null;
  Object.assign(p, {
    name:{ en:v.nameEn, ar:v.nameAr || v.nameEn },
    form:asNonDrug ? null : v.form,
    strength:asNonDrug ? '' : v.strength,
    pack:v.packEn ? { en:v.packEn, ar:v.packEn } : p.pack,
    price:Number(v.price) || p.price || null,
    mapping:asNonDrug ? 'nondrug' : 'auto',
    molecules:asNonDrug ? [] : mols.map(m => {
      const d = known(m.sci);
      return d ? { sci:d.sci, strength:m.strength } : { sci:m.sci, strength:m.strength, ref:false };
    }),
    mappedBy:ME, mappedOn:ISO_TODAY
  });
  const said = asNonDrug
    ? 'Marked as not a medicine.'
    : 'Ingredients linked: ' + p.molecules.map(m => m.sci).join(' + ') + '. Awaiting a pharmacist’s check.';
  DATA.activity.push({ id:'E' + (DATA.activity.length + 1), kind:'catalogue', id2:p.barcode, type:'note',
    when:ISO_TODAY, owner:ME, text:{ ar:said, en:said } });
  S.modal = null;
  toast(t('rec.saved'));
  render();
}

  if (S.modal.kind === 'brand') {
    root.innerHTML = '<div class="scrim center" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" role="dialog" aria-modal="true">' + brandModal() + '</div></div>';
    return;
  }

  const F = FORMS[S.modal.mod];
  const errs = S.modal.errors || {};
  const vals = S.modal.values || {};

  const body = F.fields.map(f => {
    const id = 'f-' + f.k;
    const v = vals[f.k] == null ? '' : String(vals[f.k]);
    let control;
    if (f.roles) {
      const on = S.modal.roles || [];
      control = '<div class="pill-tags">' + EXTERNAL_ROLES.map(r =>
        '<button type="button" class="pill-pick' + (on.indexOf(r) >= 0 ? ' on' : '') + '" ' +
        'onclick="toggleFormRole(' + attr(r) + ')">' + esc(t('role.' + r)) + '</button>').join('') + '</div>';
    } else if (f.opts) {
      control = '<select id="' + id + '"' + (errs[f.k] ? ' class="bad"' : '') + '>' +
        (f.req ? '' : '<option value=""></option>') +
        f.opts().map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === v ? ' selected' : '') + '>' +
          esc(o.n) + '</option>').join('') + '</select>';
    } else {
      control = '<input id="' + id + '" type="' + (f.date ? 'date' : f.num ? 'number' : 'text') + '"' +
        ' value="' + esc(v) + '"' +
        (f.ltr ? ' dir="ltr" class="figure' + (errs[f.k] ? ' bad' : '') + '"' : (errs[f.k] ? ' class="bad"' : '')) + '>';
    }
    return '<div class="fld"><label for="' + id + '">' + esc(t(f.l)) +
      (f.req ? ' <span class="req">*</span>' : '') + '</label>' + control +
      (f.hint ? '<div class="hint">' + esc(t(f.hint)) + '</div>' : '') +
      (errs[f.k] ? '<div class="err">' + esc(errs[f.k]) + '</div>' : '') + '</div>';
  }).join('');

  root.innerHTML = '<div class="scrim center" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><span class="modal-t">' + esc(t(F.title)) + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
      '<div class="modal-b"><div class="form-grid two">' + body + '</div></div>' +
      '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
        '<button class="btn primary" onclick="submitNew()">' + esc(t('a.save')) + '</button></div>' +
    '</div></div>';
}

function submitNew() {
  captureForm();
  const mod = S.modal.mod;
  const F = FORMS[mod];
  const rec = {};
  const errors = {};

  F.fields.forEach(f => {
    let v = (S.modal.values[f.k] || '').trim();

    if (f.req && !v) { errors[f.k] = t('n.required'); return; }
    if (f.phone && v && !IQ_PHONE.test(v)) { errors[f.k] = t('n.badPhone'); return; }
    if (f.unique && v && DATA[mod].some(r => String(r[f.unique]).toLowerCase() === v.toLowerCase())) {
      errors[f.k] = t('n.duplicate', { v }); return;
    }
    if (f.num) v = Number(v) || 0;
    if (f.list) { rec[f.k] = v ? v.split(/[|;,]/).map(x => x.trim()).filter(Boolean) : []; return; }
    if (f.roles) { rec[f.k] = S.modal.roles ? S.modal.roles.slice() : []; return; }
    // A name typed in one language is stored for both rather than left blank in
    // the other — a record with an empty Arabic name renders as "—" on the
    // screen most of this team actually uses.
    rec[f.k] = f.bi ? { ar:v, en:v } : v;
  });

  if (Object.keys(errors).length) { S.modal.errors = errors; renderModal(); return; }

  const prefix = { users:'U', orders:'O-', pharmacies:'P', companies:'CO', universities:'V' }[mod];
  if (prefix) rec.id = prefix + Date.now().toString().slice(-6);
  if (!rec.owner) rec.owner = ME;

  if (mod === 'users') Object.assign(rec, {
    verification:'pending', joined:ISO_TODAY, orders:0, rating:null, reliability:null,
    gradYear:null, pharmacy:null, university:null,
    syndicateNo: rec.syndicateNo || null
  });
  if (mod === 'pharmacies') Object.assign(rec, {
    user:null, verification:'pending', signedUp:ISO_TODAY, trialDays:30, trialUsed:0,
    orders:0, filled:0, lastOrder:null, commission:0
  });
  if (mod === 'companies') { rec.status = 'review'; rec.represents = []; }
  if (mod === 'universities') rec.students = 0;
  if (mod === 'orders') {
    const ph = pharmacyOf(rec.pharmacy);
    Object.assign(rec, {
      district: ph ? ph.district : 'karrada',
      status:'open', assignee:null, applicants:0, controlled:false,
      hours: (rec.start && rec.end) ? shiftHours(rec.start, rec.end) : 0,
      rateType:'hourly'
    });
    // The total is derived from the rate and the hours, never typed. A CRM that
    // lets someone key a total that disagrees with the rate has invented a
    // second source of truth for money.
    rec.total = rec.type === 'training' ? 0 : Math.round((rec.rate || 0) * rec.hours);
  }
  if (mod === 'drugs') {
    rec.interactions = [];
    rec.contraindications = [];
    rec.doses = rec.doses || [];
  }

  DATA[mod].push(rec);
  S.modal = null;
  toast(t('n.created'));
  render();
}

    (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') + '</div>';
  return '<div class="modal-h"><span class="modal-t">' +
      esc(t(p && p.mapping === 'auto' ? 'cat.remap' : 'cat.map')) + ' — <span class="figure" dir="ltr">' +
      esc(S.modal.code) + '</span></span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b">' +
      '<div class="form-grid two">' +
        fld('m-name-en', t('cat.nameEn'), '<input id="m-name-en" dir="ltr"' + (e.nameEn ? ' class="bad"' : '') +
          ' value="' + esc(v.nameEn) + '">', e.nameEn) +
        fld('m-name-ar', t('c.nameAr'), '<input id="m-name-ar" dir="rtl" value="' + esc(v.nameAr) + '">') +
        fld('m-form', t('c.form'), '<select id="m-form"' + (e.form ? ' class="bad"' : '') + '><option value=""></option>' +
          DRUG_FORMS.map(f => '<option value="' + esc(f) + '"' + (v.form === f ? ' selected' : '') + '>' +
            esc(t('df.' + f)) + '</option>').join('') + '</select>', e.form) +
        fld('m-strength', t('cat.strength'), '<input id="m-strength" dir="ltr" class="figure" value="' + esc(v.strength) + '">') +
        fld('m-pack', t('c.pack'), '<input id="m-pack" value="' + esc(v.packEn) + '">') +
        fld('m-price', t('c.price'), '<input id="m-price" type="number" dir="ltr" class="figure" value="' + esc(v.price) + '">') +
      '</div>' +
      '<div class="fld" style="margin-top:12px;"><label>' + esc(t('cat.ingredients')) + '</label>' +
        v.mols.map((m, i) =>
          '<div class="mol-line">' +
            '<input id="m-mol-' + i + '" list="mol-list" dir="ltr" value="' + esc(m.sci) + '" placeholder="' + esc(t('cat.molPh')) + '">' +
            '<input id="m-molst-' + i + '" dir="ltr" class="figure" value="' + esc(m.strength) + '" placeholder="' + esc(t('cat.strength')) + '">' +
          '</div>').join('') +
        '<datalist id="mol-list">' + DRUGS.map(d => '<option value="' + esc(d.sci) + '">').join('') + '</datalist>' +
        '<button type="button" class="btn" style="margin-top:4px;" onclick="addMapRow()">' + icon('plus') +
          esc(t('cat.addIngredient')) + '</button>' +
        '<div class="hint">' + esc(t('cat.ingredientHint')) + '</div>' +
        (e.mols ? '<div class="err">' + esc(e.mols) + '</div>' : '') +
      '</div>' +
      '<div class="mod-note" style="margin-top:12px;">' + icon('badge') + '<span>' + esc(t('cat.autoNote')) + '</span></div>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn" onclick="saveMapProduct(true)">' + esc(t('cat.markNonDrug')) + '</button>' +
      '<button class="btn primary" onclick="saveMapProduct(false)">' + esc(t('cat.saveAuto')) + '</button></div>';
}

function brandModal() {
  const v = S.modal.values || {};
  const e = S.modal.errors || {};
  const drug = drugOf(S.modal.sci);
  const fld = (id, label, control, err, hint) =>
    '<div class="fld"><label for="' + id + '">' + esc(label) + '</label>' + control +
    (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') + '</div>';

  return '<div class="modal-h"><span class="modal-t">' +
      esc(S.modal.editing ? t('a.edit') : t('dr.addBrand')) + ' — ' + esc(S.modal.sci) + '</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
    '<div class="modal-b"><div class="form-grid two">' +
      fld('b-brand', t('c.brand'),
        '<input id="b-brand" dir="ltr"' + (e.brand ? ' class="bad"' : '') + ' value="' + esc(v.brand || '') + '">', e.brand) +
      fld('b-company', t('c.company'),
        '<select id="b-company"' + (e.company ? ' class="bad"' : '') + '>' +
        DATA.companies.map(c => '<option value="' + esc(c.id) + '"' +
          (v.company === c.id ? ' selected' : '') + '>' + esc(L(c.name)) + '</option>').join('') + '</select>', e.company) +
      fld('b-reg', t('c.registrationHolder'),
        '<select id="b-reg"><option value="">—</option>' +
        DATA.companies.map(c => '<option value="' + esc(c.id) + '"' +
          (v.registrationHolder === c.id ? ' selected' : '') + '>' + esc(L(c.name)) + '</option>').join('') +
        '</select>', null, t('c.regHint')) +
      fld('b-bureau', t('role.bureau'),
        '<select id="b-bureau"><option value="">—</option>' +
        DATA.companies.filter(c => hasRole(c, 'bureau')).map(c => '<option value="' + esc(c.id) + '"' +
          (v.bureau === c.id ? ' selected' : '') + '>' + esc(L(c.name)) + '</option>').join('') +
        '</select>', null, t('c.bureauHint')) +
      fld('b-doses', t('c.override'),
        '<input id="b-doses" dir="ltr" class="figure" value="' + esc(v.doses || '') + '" placeholder="' +
          esc((drug ? drug.doses : []).join(' | ')) + '">', null,
        t('dr.hintOverride')) +
      fld('b-notes', t('c.notesF'),
        '<textarea id="b-notes">' + esc(v.notes || '') + '</textarea>', null) +
    '</div></div>' +
    '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
      '<button class="btn primary" onclick="saveBrand()">' + esc(t('a.save')) + '</button></div>';
}

/* The shift-hours rule, ported from src/lib/time.ts, so an overnight order
   here reads 8 hours rather than minus sixteen. */
function shiftHours(startTime, endTime) {
  const m = x => { const [h, mi] = String(x).split(':').map(Number); return h * 60 + mi; };
  let mins = m(endTime) - m(startTime);
  if (mins <= 0) mins += 24 * 60;
  return Math.round(mins / 60 * 100) / 100;
}

render();
