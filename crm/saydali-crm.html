/* ==========================================================================
   8. STATE & RENDER
   ========================================================================== */

const TABS = ['home', 'leads', 'accounts', 'contacts', 'deals', 'activities', 'reports'];

const S = {
  tab:'home',
  record:null,              // { mod, id }
  view:{ leads:'all', accounts:'all', contacts:'all', deals:'all', activities:'mine' },
  filters:{ leads:{}, accounts:{}, contacts:{}, deals:{}, activities:{} },
  sort:{},
  picked:{ leads:[], accounts:[], contacts:[], deals:[], activities:[] },
  viewMenu:null,
  dealsMode:'board',
  modal:null,
  query:'',
  drag:null
};

function render() {
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('tb-suite').textContent = t('suite');
  document.getElementById('btn-lang').textContent = t('lang');
  document.querySelector('#btn-app span').textContent = t('openApp');
  document.getElementById('q').placeholder = t('search');
  document.getElementById('me-avatar').textContent = L(USERS[ME].initials);

  document.getElementById('tabs').innerHTML = TABS.map(k => {
    const M = MODULES[k];
    const n = M ? M.data().length : null;
    return '<button class="tab' + (S.tab === k ? ' active' : '') + '" onclick="goTab(' + attr(k) + ')">' +
      icon(k === 'home' ? 'home' : k === 'reports' ? 'chart' : M.icon) +
      esc(t('mod.' + k)) +
      (n !== null ? '<span class="tab-count">' + fmt(n) + '</span>' : '') + '</button>';
  }).join('');

  const rail = document.getElementById('rail');
  const head = document.getElementById('work-head');
  const body = document.getElementById('work-body');

  if (S.record) {
    rail.classList.add('hidden');
    head.innerHTML = '';
    body.innerHTML = recordPage(S.record.mod, S.record.id);
  } else if (S.tab === 'home') {
    rail.classList.add('hidden');
    head.innerHTML = '<div class="work-head"><span class="view-select">' +
      esc(t('h.greeting', { name:L(USERS[ME].name) })) + '</span></div>';
    body.innerHTML = homeView();
  } else if (S.tab === 'reports') {
    rail.classList.add('hidden');
    head.innerHTML = '<div class="work-head"><span class="view-select">' + esc(t('r.title')) + '</span></div>';
    body.innerHTML = reportsView();
  } else if (S.tab === 'deals' && S.dealsMode === 'board') {
    rail.classList.remove('hidden');
    rail.innerHTML = listRail('deals');
    head.innerHTML = dealsHead();
    body.innerHTML = dealsBoard();
  } else {
    rail.classList.remove('hidden');
    rail.innerHTML = listRail(S.tab);
    head.innerHTML = S.tab === 'deals' ? dealsHead() + listHead(S.tab).replace(/^<div class="work-head">[\s\S]*?<\/div>/, '') : listHead(S.tab);
    body.innerHTML = listBody(S.tab);
  }

  renderModal();
  bindTips(document.body);
}

/* ==========================================================================
   9. NAVIGATION
   ========================================================================== */

function goTab(k) {
  S.tab = k; S.record = null; S.viewMenu = null; hideTip();
  render();
  document.getElementById('work-body').scrollTop = 0;
}
function openRecord(mod, id) {
  S.record = { mod, id }; S.viewMenu = null; hideTip();
  if (TABS.includes(mod)) S.tab = mod;
  render();
  document.getElementById('work-body').scrollTop = 0;
}
function closeRecord() { S.record = null; hideTip(); render(); }
function setLang(l) { lang = l; hideTip(); render(); }
function setDealsMode(m) { S.dealsMode = m; render(); }

/* The two halves are one product: this hands off to the app, and an account
   row hands off to that pharmacy's own account inside it. */
function openApp(asEmail) {
  const url = '../demo/saydali-plus.html' + (asEmail ? '#as=' + encodeURIComponent(asEmail) : '');
  window.open(url, '_blank', 'noopener');
}

function toggleViewMenu(mod) { S.viewMenu = S.viewMenu === mod ? null : mod; render(); }
function pickView(mod, k) { S.view[mod] = k; S.viewMenu = null; S.picked[mod] = []; render(); }
function setFilter(mod, facet, v) {
  S.filters[mod] = S.filters[mod] || {};
  if (v === null) delete S.filters[mod][facet]; else S.filters[mod][facet] = v;
  S.picked[mod] = [];
  render();
}
function resetFilters(mod) { S.filters[mod] = {}; S.picked[mod] = []; render(); }
function sortBy(mod, key) {
  const cur = S.sort[mod];
  S.sort[mod] = (cur && cur.key === key)
    ? { key, dir: cur.dir === 'asc' ? 'desc' : 'asc' }
    : { key, dir:'asc' };
  render();
}
function pickOne(mod, id, on) {
  const set = new Set(S.picked[mod] || []);
  if (on) set.add(id); else set.delete(id);
  S.picked[mod] = [...set];
  render();
}
function pickAll(mod, on) {
  S.picked[mod] = on ? visibleRows(mod).map(r => r.id) : [];
  render();
}
function clearPicked(mod) { S.picked[mod] = []; render(); }

function bulkDelete(mod) {
  const ids = S.picked[mod] || [];
  DATA[mod] = DATA[mod].filter(r => !ids.includes(r.id));
  S.picked[mod] = [];
  toast(t('rec.deleted'));
  render();
}
function bulkAssign(mod) {
  // Round-robins through the team. A real assignment rule is a decision for
  // the founder, not something to invent here.
  const ids = S.picked[mod] || [];
  const users = Object.keys(USERS);
  DATA[mod].forEach((r, i) => { if (ids.includes(r.id)) r.owner = users[i % users.length]; });
  S.picked[mod] = [];
  toast(t('rec.saved'));
  render();
}

/* ==========================================================================
   10. SEARCH — one box, every module
   ========================================================================== */

function search(q) {
  S.query = q;
  const box = document.getElementById('q-results');
  const term = q.trim().toLowerCase();
  if (!term) { box.innerHTML = ''; return; }

  const hits = [];
  ['leads', 'accounts', 'contacts', 'deals', 'activities'].forEach(mod => {
    MODULES[mod].data().forEach(r => {
      const hay = [L(r.name || r.subject), L(r.contact || ''), r.phone || '', r.email || '', r.licence || '']
        .join(' ').toLowerCase();
      if (hay.includes(term)) hits.push({ mod, r });
    });
  });

  box.innerHTML = '<div class="tb-results">' + (hits.length
    ? hits.slice(0, 8).map(h =>
        '<button class="tb-result" onclick="pickSearch(' + attr(h.mod) + ',' + attr(h.r.id) + ')">' +
          icon(MODULES[h.mod].icon) +
          '<span style="flex:1;min-width:0;text-align:start;"><span style="display:block;font-weight:600;font-size:12.5px;">' +
            esc(L(h.r.name || h.r.subject)) + '</span>' +
          '<span class="tb-result-sub" style="display:block;">' + esc(t('mod.' + h.mod)) + '</span></span></button>').join('')
    : '<div class="tb-empty">' + esc(t('searchEmpty')) + '</div>') + '</div>';
}
function pickSearch(mod, id) {
  document.getElementById('q').value = '';
  document.getElementById('q-results').innerHTML = '';
  openRecord(mod, id);
}

/* ==========================================================================
   11. RECORD EDITING
   ========================================================================== */

function startEdit(el, path, type) {
  const [mod, id, field] = path.split('.');
  const rec = DATA[mod].find(r => r.id === id);
  if (!rec) return;

  let input;
  if (type === 'owner') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      Object.keys(USERS).map(u => '<option value="' + u + '"' + (rec.owner === u ? ' selected' : '') + '>' +
        esc(L(USERS[u].name)) + '</option>').join('') + '</select>';
  } else if (type === 'district') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      DISTRICTS.map(d => '<option value="' + d.key + '"' + (rec.district === d.key ? ' selected' : '') + '>' +
        esc(L(d)) + '</option>').join('') + '</select>';
  } else if (type === 'stage') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      STAGES.map(s => '<option value="' + s.key + '"' + (rec.stage === s.key ? ' selected' : '') + '>' +
        esc(t('st.' + s.key)) + '</option>').join('') + '</select>';
  } else if (type === 'priority') {
    input = '<select onchange="commitEdit(this,' + attr(path) + ')" onblur="render()">' +
      ['high','normal','low'].map(p => '<option value="' + p + '"' + (rec.priority === p ? ' selected' : '') + '>' +
        esc(t('pr.' + p)) + '</option>').join('') + '</select>';
  } else {
    const raw = typeof rec[field] === 'object' ? L(rec[field]) : rec[field];
    input = '<input type="' + (type === 'number' ? 'number' : type === 'date' ? 'date' : 'text') + '" ' +
      'value="' + attr(raw == null ? '' : raw) + '" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){this.dataset.abort=1;this.blur();}" ' +
      'onblur="commitEdit(this,' + attr(path) + ')">';
  }
  el.innerHTML = input;
  const f = el.querySelector('input,select');
  f.focus();
  if (f.select) f.select();
}

function commitEdit(el, path) {
  if (el.dataset.abort) { render(); return; }
  const [mod, id, field] = path.split('.');
  const rec = DATA[mod].find(r => r.id === id);
  if (!rec) { render(); return; }

  let v = el.value;
  if (field === 'value') v = Number(v) || 0;
  // A bilingual field keeps both scripts: overwriting one language's copy with
  // the other's text is how a record ends up Latin-only on an Arabic screen.
  if (typeof rec[field] === 'object' && rec[field] !== null) rec[field] = { ar:v, en:v };
  else rec[field] = v;

  toast(t('rec.saved'));
  render();
}

function addNote(kind, id) {
  const box = document.getElementById('note-input');
  const text = (box.value || '').trim();
  if (!text) return;
  DATA.activity.push({ id:'E' + (DATA.activity.length + 1), kind, id2:id, type:'note',
    when:ISO_TODAY, owner:ME, text:{ ar:text, en:text } });
  touch(kind, id);
  toast(t('rec.noteAdded'));
  render();
}
function logCall(kind, id) {
  DATA.activity.push({ id:'E' + (DATA.activity.length + 1), kind, id2:id, type:'call',
    when:ISO_TODAY, owner:ME,
    text:{ ar:'مكالمة مسجّلة من قبل ' + L(USERS[ME].name) + '.', en:'Call logged by ' + L(USERS[ME].name) + '.' } });
  touch(kind, id);
  toast(t('rec.saved'));
  render();
}
function touch(kind, id) {
  if (kind !== 'leads') return;
  const l = DATA.leads.find(r => r.id === id);
  if (l) l.lastTouch = ISO_TODAY;
}

function toggleTask(id) {
  const x = DATA.tasks.find(r => r.id === id);
  if (x) x.done = !x.done;
  render();
}
function moveDeal(id, stage) {
  const d = DATA.deals.find(r => r.id === id);
  if (!d) return;
  d.stage = stage;
  toast(t('d.moveTo', { stage:t('st.' + stage) }));
  render();
}

/* Converting a lead creates the pharmacy record and carries the deal, the
   contact and the whole timeline across — losing the history at conversion is
   the classic CRM own-goal. */
function convertLead(id) {
  const l = DATA.leads.find(r => r.id === id);
  if (!l) return;
  const newId = 'A' + (DATA.accounts.length + 1) + Date.now().toString().slice(-3);

  DATA.accounts.push({
    id:newId, name:l.name, licence:'—', district:l.district, owner:l.owner,
    signedUp:ISO_TODAY, appEmail:l.email, verification:'pending',
    trialDays:30, trialUsed:0, shifts:0, filled:0, lastShift:null, commission:0, pharmacists:0
  });
  DATA.contacts.push({
    id:'C' + (DATA.contacts.length + 1) + Date.now().toString().slice(-3),
    name:l.contact, role:{ ar:'مالك', en:'Owner' }, account:newId,
    phone:l.phone, email:l.email, district:l.district, owner:l.owner
  });
  DATA.deals.filter(d => d.lead === id).forEach(d => { d.lead = null; d.account = newId; d.stage = 'trial'; });
  DATA.activity.filter(e => e.kind === 'leads' && e.id2 === id).forEach(e => { e.kind = 'accounts'; e.id2 = newId; });
  DATA.tasks.filter(x => x.related && x.related.kind === 'leads' && x.related.id === id)
            .forEach(x => { x.related = { kind:'accounts', id:newId }; });
  DATA.leads = DATA.leads.filter(r => r.id !== id);

  toast(t('rec.converted'));
  openRecord('accounts', newId);
}

/* ---------- Drag and drop on the board ---------- */

function dragDeal(e, id) {
  S.drag = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  e.currentTarget.classList.add('dragging');
}
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); S.drag = null; }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
function dragLeave(e) { e.currentTarget.classList.remove('over'); }
function dropDeal(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  const id = S.drag || e.dataTransfer.getData('text/plain');
  if (id) moveDeal(id, stage);
}

/* ---------- Toast ---------- */

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
}

document.addEventListener('click', e => {
  if (S.viewMenu && !e.target.closest('.view-select') && !e.target.closest('.view-menu')) {
    S.viewMenu = null; render();
  }
  if (!e.target.closest('.tb-search')) {
    const box = document.getElementById('q-results');
    if (box) box.innerHTML = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.modal) closeModal();
    else if (S.record) closeRecord();
  }
});

/* ==========================================================================
   12. CREATE FORMS
   Validation is real: required fields, an Iraqi phone shape, and a licence
   number that has to be unique — the same rule the database enforces, because
   two pharmacies sharing a licence is a data problem you only find later.
   ========================================================================== */

const IQ_PHONE = /^07[3-9]\d{8}$/;

const FORMS = {
  leads: { title:'n.newLead', fields:[
    { k:'name',     l:'c.name',     req:true, bi:true },
    { k:'contact',  l:'c.company',  req:true, bi:true },
    { k:'phone',    l:'c.phone',    req:true, phone:true, ltr:true },
    { k:'email',    l:'c.email',    ltr:true },
    { k:'district', l:'c.district', req:true, opts:() => DISTRICTS.map(d => ({ v:d.key, n:L(d) })) },
    { k:'source',   l:'c.source',   req:true, opts:() => SOURCES.map(s => ({ v:s, n:t('src.' + s) })) },
    { k:'rating',   l:'c.rating',   opts:() => ['hot','warm','cold'].map(r => ({ v:r, n:t('rt.' + r) })) },
    { k:'owner',    l:'c.owner',    opts:() => Object.keys(USERS).map(u => ({ v:u, n:L(USERS[u].name) })) }
  ]},
  accounts: { title:'n.newAccount', fields:[
    { k:'name',     l:'c.name',     req:true, bi:true },
    { k:'licence',  l:'c.licence',  req:true, unique:'licence', ltr:true },
    { k:'district', l:'c.district', req:true, opts:() => DISTRICTS.map(d => ({ v:d.key, n:L(d) })) },
    { k:'appEmail', l:'c.email',    req:true, ltr:true },
    { k:'owner',    l:'c.owner',    opts:() => Object.keys(USERS).map(u => ({ v:u, n:L(USERS[u].name) })) }
  ]},
  contacts: { title:'n.newContact', fields:[
    { k:'name',     l:'c.name',     req:true, bi:true },
    { k:'role',     l:'c.role',     bi:true },
    { k:'account',  l:'c.account',  req:true, opts:() => DATA.accounts.map(a => ({ v:a.id, n:L(a.name) })) },
    { k:'phone',    l:'c.phone',    req:true, phone:true, ltr:true },
    { k:'email',    l:'c.email',    ltr:true },
    { k:'owner',    l:'c.owner',    opts:() => Object.keys(USERS).map(u => ({ v:u, n:L(USERS[u].name) })) }
  ]},
  deals: { title:'n.newDeal', fields:[
    { k:'name',     l:'c.deal',      req:true, bi:true },
    { k:'stage',    l:'c.stage',     req:true, opts:() => STAGES.map(s => ({ v:s.key, n:t('st.' + s.key) })) },
    { k:'value',    l:'c.value',     req:true, num:true, hint:'iqd' },
    { k:'close',    l:'c.closeDate', req:true, date:true },
    { k:'district', l:'c.district',  req:true, opts:() => DISTRICTS.map(d => ({ v:d.key, n:L(d) })) },
    { k:'owner',    l:'c.owner',     opts:() => Object.keys(USERS).map(u => ({ v:u, n:L(USERS[u].name) })) }
  ]},
  activities: { title:'n.newTask', fields:[
    { k:'subject',  l:'c.subject',  req:true, bi:true },
    { k:'type',     l:'c.type',     req:true, opts:() => ['call','visit','followup','demo'].map(v => ({ v, n:t('ty.' + v) })) },
    { k:'due',      l:'c.due',      req:true, date:true },
    { k:'priority', l:'c.priority', opts:() => ['high','normal','low'].map(v => ({ v, n:t('pr.' + v) })) },
    { k:'owner',    l:'c.owner',    opts:() => Object.keys(USERS).map(u => ({ v:u, n:L(USERS[u].name) })) }
  ]}
};

function openNew(mod, preset) {
  S.modal = { kind:'new', mod, errors:{}, values:{}, preset:preset || null };
  renderModal();
}
function openNewTask(kind, id) {
  S.modal = { kind:'new', mod:'activities', errors:{}, values:{}, preset:{ related:{ kind, id } } };
  renderModal();
}

/* Read every control into S.modal.values before anything can re-render. A form
   that empties itself because one field was wrong is the fastest way to make
   someone stop using a CRM. */
function captureForm() {
  const F = FORMS[S.modal.mod];
  S.modal.values = S.modal.values || {};
  F.fields.forEach(f => {
    const el = document.getElementById('f-' + f.k);
    if (el) S.modal.values[f.k] = el.value;
  });
}
function closeModal() { S.modal = null; renderModal(); }

function renderModal() {
  const root = document.getElementById('overlay');
  if (!S.modal) { root.innerHTML = ''; return; }

  const F = FORMS[S.modal.mod];
  const errs = S.modal.errors || {};
  const vals = S.modal.values || {};

  const body = F.fields.map(f => {
    const id = 'f-' + f.k;
    const v = vals[f.k] == null ? '' : String(vals[f.k]);
    let control;
    if (f.opts) {
      control = '<select id="' + id + '"' + (errs[f.k] ? ' class="bad"' : '') + '>' +
        (f.req ? '' : '<option value=""></option>') +
        f.opts().map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === v ? ' selected' : '') + '>' +
          esc(o.n) + '</option>').join('') + '</select>';
    } else {
      control = '<input id="' + id + '" type="' + (f.date ? 'date' : f.num ? 'number' : 'text') + '"' +
        ' value="' + esc(v) + '"' +
        (f.ltr ? ' dir="ltr" class="figure' + (errs[f.k] ? ' bad' : '') + '"' : (errs[f.k] ? ' class="bad"' : '')) + '>';
    }
    return '<div class="fld"><label for="' + id + '">' + esc(t(f.l)) +
      (f.req ? ' <span class="req">*</span>' : '') + '</label>' + control +
      (f.hint ? '<div class="hint">' + esc(t(f.hint)) + '</div>' : '') +
      (errs[f.k] ? '<div class="err">' + esc(errs[f.k]) + '</div>' : '') + '</div>';
  }).join('');

  root.innerHTML = '<div class="scrim center" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><span class="modal-t">' + esc(t(F.title)) + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn-icon" onclick="closeModal()" aria-label="' + esc(t('a.close')) + '">' + icon('x') + '</button></div>' +
      '<div class="modal-b"><div class="form-grid two">' + body + '</div></div>' +
      '<div class="modal-f"><button class="btn" onclick="closeModal()">' + esc(t('a.cancel')) + '</button>' +
        '<button class="btn primary" onclick="submitNew()">' + esc(t('a.save')) + '</button></div>' +
    '</div></div>';
}

function submitNew() {
  captureForm();
  const mod = S.modal.mod;
  const F = FORMS[mod];
  const rec = {};
  const errors = {};

  F.fields.forEach(f => {
    let v = (S.modal.values[f.k] || '').trim();

    if (f.req && !v) { errors[f.k] = t('n.required'); return; }
    if (f.phone && v && !IQ_PHONE.test(v)) { errors[f.k] = t('n.badPhone'); return; }
    if (f.unique && v && DATA[mod].some(r => String(r[f.unique]).toLowerCase() === v.toLowerCase())) {
      errors[f.k] = t('n.dupLicence'); return;
    }
    if (f.num) v = Number(v) || 0;
    // A name typed in one language is stored for both rather than left blank in
    // the other — a record with an empty Arabic name renders as "—" on the
    // screen most of this team actually uses.
    rec[f.k] = f.bi ? { ar:v, en:v } : v;
  });

  if (Object.keys(errors).length) { S.modal.errors = errors; renderModal(); return; }

  const prefix = { leads:'L', accounts:'A', contacts:'C', deals:'D', activities:'T' }[mod];
  rec.id = prefix + Date.now().toString().slice(-6);
  if (!rec.owner) rec.owner = ME;

  if (mod === 'leads') { rec.created = ISO_TODAY; rec.lastTouch = ISO_TODAY; rec.rating = rec.rating || 'warm'; }
  if (mod === 'accounts') Object.assign(rec, {
    signedUp:ISO_TODAY, verification:'pending', trialDays:30, trialUsed:0,
    shifts:0, filled:0, lastShift:null, commission:0, pharmacists:0
  });
  if (mod === 'deals') { rec.lead = null; rec.account = null; }
  if (mod === 'activities') {
    rec.done = false;
    rec.priority = rec.priority || 'normal';
    if (S.modal.preset && S.modal.preset.related) rec.related = S.modal.preset.related;
  }

  DATA[mod].push(rec);
  S.modal = null;
  toast(t('n.created'));
  render();
}

render();
</script>
