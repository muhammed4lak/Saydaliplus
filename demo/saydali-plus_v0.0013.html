/* ==========================================================================
   THE DRUG REFERENCE — a lookup, not a catalogue

   Everything on the counter side of the app is about finding and doing work.
   This is the one screen used DURING the work: somebody is standing at the
   counter holding a box, and the pharmacist has ten seconds.

   So: one search box that matches either script and the ATC code, form chips
   to narrow, and a record whose first line is the sentence you actually say
   out loud. The interactions are ranked worst-first, because the reason to
   open this at all is usually "can they take this with what they are on".
   ========================================================================== */

/* Arabic search has to survive how people actually type. A pharmacist keying a
   name in a hurry writes ا for أ, ي for ى and ه for ة, and skips the
   diacritics entirely — so both the query and the data are flattened the same
   way before they are compared. Ported from src/lib/arabic-script.ts. */
function drugNorm(x) {
  return String(x || '')
    .toLowerCase()
    .replace(/[ً-ْٰـ]/g, '')
    .replace(/[آأإٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim();
}

const SEVERITY_ORDER = { critical:3, serious:2, warning:1 };
const drugBySci = sci => DRUGS.find(d => d.sci === sci) || null;

/* The worst interaction a drug carries, or '' for one that carries none. The
   seed has to be a key the rank table knows: seeding with '' and comparing
   against undefined makes every comparison false and every drug look clean. */
function drugWorst(d) {
  return (d.interactions || []).reduce(
    (w, i) => ((SEVERITY_ORDER[i.severity] || 0) > (SEVERITY_ORDER[w] || 0) ? i.severity : w), '');
}

function drugName(d) { return lang === 'ar' ? d.ar : d.sci; }
function drugSub(d)  { return lang === 'ar' ? d.sci : d.ar; }

function sevChip(sev) {
  if (!sev) return '';
  return '<span class="sev sev-' + sev + '">' + icon('alert') + esc(t('dx.sev.' + sev)) + '</span>';
}

function drugMatches(d, q) {
  if (!q) return true;
  const hay = drugNorm([d.sci, d.ar, d.atc, ...(d.doses || [])].join(' '));
  return hay.includes(q);
}

/* ==========================================================================
   THE DISPENSING CHECK

   The reference answers "tell me about this drug". This answers the question a
   pharmacist actually has, which is "can they take these together" — and it
   answers it without being asked twice.

   Three findings, in the order they matter:
     1. interactions between any two drugs in the basket
     2. therapeutic duplication, from the curated rules rather than the codes
     3. the contraindications, turned into questions to ask the patient

   And one thing that is not a finding and is shown as loudly as if it were:
   how much of the basket could be checked at all.
   ========================================================================== */

/* THE BIDIRECTIONAL INDEX, and the reason it exists.

   Interactions in the reference are written from one side. Warfarin's record
   lists ibuprofen; ibuprofen's record happens to list warfarin too, but most
   pairs are written once — 109 of the 138 internal pairs, when this was built.
   So the obvious check, "does drug A's list contain drug B", finds the pair
   only if the pharmacist happens to add the two drugs in the order the data
   was written. Same two boxes, opposite order, silence.

   That failure is invisible: no error, no empty state, just a check that
   quietly passes. So the pairs are normalised ONCE into an undirected index
   keyed on the two names sorted, and every lookup reads from that.

   Where a pair is written from both sides and the two disagree on severity —
   bisoprolol and salbutamol do — the worse one wins. A checker that downgrades
   a warning depending on which box was scanned first is worse than none. */
const INTERACTION_INDEX = (() => {
  const ix = new Map();
  const key = (a, b) => [a, b].sort().join('\u0000');
  const known = new Set(DRUGS.map(d => d.sci));
  DRUGS.forEach(d => (d.interactions || []).forEach(i => {
    if (!known.has(i.with)) return;      // partners outside the reference are coverage, not pairs
    const k = key(d.sci, i.with);
    const prev = ix.get(k);
    if (!prev || (SEVERITY_ORDER[i.severity] || 0) > (SEVERITY_ORDER[prev.severity] || 0)) {
      ix.set(k, { a:d.sci, b:i.with, severity:i.severity, note:i.note });
    }
  }));
  return { size:ix.size, get:(a, b) => ix.get(key(a, b)) || null };
})();

/* Every unordered pair in the basket, worst first. */
function basketInteractions(scis) {
  const out = [];
  for (let i = 0; i < scis.length; i++) {
    for (let j = i + 1; j < scis.length; j++) {
      const hit = INTERACTION_INDEX.get(scis[i], scis[j]);
      if (hit) out.push({ a:scis[i], b:scis[j], severity:hit.severity, note:hit.note });
    }
  }
  return out.sort((x, y) => (SEVERITY_ORDER[y.severity] || 0) - (SEVERITY_ORDER[x.severity] || 0));
}

function basketDuplicates(scis) {
  const drugs = scis.map(drugBySci).filter(Boolean);
  return DUPLICATE_RULES
    .map(r => ({ rule:r, members:drugs.filter(d => r.codes.some(c => d.atc.startsWith(c))).map(d => d.sci) }))
    .filter(x => x.members.length > 1)
    .sort((x, y) => (SEVERITY_ORDER[y.rule.severity] || 0) - (SEVERITY_ORDER[x.rule.severity] || 0));
}

/* Contraindications become ONE list of questions rather than one list per drug.
   Three drugs contraindicated in pregnancy is one question, not three, and a
   pharmacist who has to read the same line three times stops reading. Matched
   on the exact text, which merges the identical ones and leaves near misses
   ("Pregnancy" / "Pregnancy and breastfeeding") separate — the safe way round,
   since merging two things that are not the same would drop a drug from the
   list of what the question is about. */
function basketQuestions(scis) {
  const byText = new Map();
  scis.map(drugBySci).filter(Boolean).forEach(d => {
    (d.contraindications || []).forEach(c => {
      if (!byText.has(c.en)) byText.set(c.en, { text:c, drugs:[] });
      byText.get(c.en).drugs.push(d.sci);
    });
  });
  // The ones touching several drugs first: those are the questions worth asking.
  return [...byText.values()].sort((a, b) => b.drugs.length - a.drugs.length);
}

/* What could NOT be checked. Partners named by a drug in the basket but absent
   from the reference are the honest limit of the tool — contrast media is named
   by metformin and will never be in any formulary — and the screen carries them
   with the same weight as a finding rather than in a footnote. */
function basketCoverage(scis) {
  const known = new Set(DRUGS.map(d => d.sci));
  const missing = [];
  scis.map(drugBySci).filter(Boolean).forEach(d =>
    (d.interactions || []).forEach(i => {
      if (!known.has(i.with) && missing.indexOf(i.with) < 0) missing.push(i.with);
    }));
  const n = scis.length;
  return { drugs:n, pairs:(n * (n - 1)) / 2, namedOutside:missing };
}

/* ---------- Who may record, and against which pharmacy ---------- */

function dispensePharmacy() {
  const acct = ACCOUNTS[S.email];
  if (!acct) return null;
  // An owner records against their own pharmacy; a relief pharmacist against
  // the pharmacy whose shift they are working. No shift, no pharmacy: the log
  // belongs to a business, and a pharmacist not standing in one has nowhere to
  // put it.
  if (ownedIds(acct).length) {
    const ph = currentPharmacy() || myPharmacies()[0];
    return { id:ph.id, name:L(ph.name) };
  }
  /* The relief shift is part of the marketplace; with it switched off there
     is no shift and so no pharmacy to record against. */
  if (acct.type === 'pharmacist' && FLAGS.marketplace && S.onShiftToday) return { id:'P2', name:L(DATA.listings[1].pharmacy) };
  return null;
}
/* A student on placement does not dispense, so a student does not record — but
   they get the check itself, which is the half that teaches. */
const canRecord = () => S.role !== 'student' && !!dispensePharmacy();

function addToBasket(sci) {
  if (S.basket.indexOf(sci) < 0) S.basket.push(sci);
  S.drugQuery = '';
  S.drugTab = 'check';
  render();
  /* Put the cursor back. Without this the field loses focus on every add, so
     building a four-drug basket costs three interactions per drug instead of
     two: tap the field, type, tap the result, tap the field again. On the most
     used screen in the app, with somebody waiting. */
  focusDrugSearch();
}
function focusDrugSearch() {
  const el = document.getElementById('drug-q');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/* Enter adds the top hit, so a prescription can be entered without the hands
   leaving the keyboard: type, Enter, type, Enter. */
function drugSearchKey(ev) {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  if (S.drugTab !== 'check') return;
  const q = drugNorm(S.drugQuery);
  if (!q) return;
  const hit = clinicalOnly(DRUGS).filter(d => drugMatches(d, q)).filter(d => S.basket.indexOf(d.sci) < 0)[0];
  if (hit) addToBasket(hit.sci);
}
function removeFromBasket(sci) { S.basket = S.basket.filter(x => x !== sci); render(); }
function clearBasket() { S.basket = []; render(); }
function setDrugTab(k) { S.drugTab = k; S.drugQuery = ''; render(); }

/* Recording keeps COUNTS, never the basket.

   This is the decision that makes a log defensible at all. Each drug increments
   its own tally for (pharmacy, pharmacist, day) and the basket is thrown away.
   No patient, no name, and no record that these particular drugs went out
   together — because a basket is a fingerprint. In a small district there may
   be one person on methotrexate, and "methotrexate + folic acid at 14:20"
   identifies them to anyone who knows the neighbourhood, with no name stored
   anywhere. A day's tally does not: a pharmacy dispenses enough in a day to
   dissolve the co-occurrence.

   Which is also why the day is the finest grain kept. An hour would put the
   basket back together. */
function recordDispense() {
  if (!canRecord()) return;
  const ph = dispensePharmacy();
  S.basket.forEach(sci => {
    const row = S.dispensing.find(r => r.pharmacy === ph.id && r.pharmacist === S.email &&
                                       r.date === TODAY_ISO && r.sci === sci);
    if (row) row.n++;
    else S.dispensing.push({ pharmacy:ph.id, pharmacist:S.email, date:TODAY_ISO, sci, n:1 });
  });
  const n = S.basket.length;
  S.basket = [];
  toast(t('dc.recorded', { n }));
  render();
}

/* The pharmacist's own shift window: what THEY recorded, at THIS pharmacy,
   today. Not the pharmacy's history — a locum who worked one Thursday has no
   business reading two years of somebody else's dispensing. */
function myShiftTallies() {
  const ph = dispensePharmacy();
  if (!ph) return [];
  return S.dispensing
    .filter(r => r.pharmacy === ph.id && r.pharmacist === S.email && r.date === TODAY_ISO)
    .sort((a, b) => b.n - a.n || a.sci.localeCompare(b.sci));
}

/* Reference and check are two tabs of one screen rather than two places. They
   are the same hundred rows doing two jobs, and a pharmacist who has just
   looked something up is one tap from putting it in a basket. */
function drugTabs() {
  const tab = (k, label) => '<button class="seg' + (S.drugTab === k ? ' on' : '') + '" onclick="setDrugTab(' +
    attr(k) + ')">' + esc(label) +
    (k === 'check' && S.basket.length ? '<span class="seg-n">' + fmt(S.basket.length) + '</span>' : '') +
    '</button>';
  return '<div class="segbar">' + tab('reference', t('dx.tabReference')) + tab('check', t('dc.tabCheck')) + '</div>';
}

function screenDrugs() {
  return '<div class="screen-body">' +
    '<div class="constrain stack">' + drugTabs() + '</div>' +
    (S.drugTab === 'check' ? screenCheck() : screenReference()) +
  '</div>';
}

function screenReference() {
  const q = drugNorm(S.drugQuery);
  /* Only the forms actually present, so the chip row never offers a filter
     that returns nothing. */
  const forms = DRUG_FORMS.filter(f => DRUGS.some(d => d.form === f));
  /* W6d — the reference is a clinical surface, so it renders only what nobody
     paid to put there. */
  const list = clinicalOnly(DRUGS)
    .filter(d => S.drugForm === 'all' || d.form === S.drugForm)
    .filter(d => drugMatches(d, q))
    .sort((a, b) => drugName(a).localeCompare(drugName(b), lang === 'ar' ? 'ar' : 'en'));

  const chips = ['all'].concat(forms).map(f =>
    '<button class="chip' + (S.drugForm === f ? ' active' : '') + '" onclick="setDrugForm(' + attr(f) + ')">' +
    esc(f === 'all' ? t('dx.allForms') : t('df.' + f)) + '</button>').join('');

  return '' +
    '<div class="constrain stack">' +
      '<div class="searchbox">' + icon('search') +
        '<input id="drug-q" type="search" autocomplete="off" value="' + esc(S.drugQuery) + '" ' +
          'placeholder="' + esc(t('dx.searchPlaceholder')) + '" oninput="setDrugQuery(this.value)">' +
        (S.drugQuery ? '<button class="searchbox-x" onclick="setDrugQuery(\'\')" aria-label="' +
          esc(t('common.clear')) + '">&times;</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="chip-row">' + chips + '</div>' +
    '<div class="constrain stack">' +
      '<p class="section-eyebrow">' +
        esc(list.length === 1 ? t('dx.count1') : t('dx.count', { n:list.length })) + '</p>' +
      (list.length
        ? '<div class="card">' + list.map(d =>
            '<button class="row drug-row" onclick="openDrug(' + attr(d.sci) + ')">' +
              '<span class="row-body">' +
                '<span class="row-title" style="display:block;" dir="' + (lang === 'ar' ? 'rtl' : 'ltr') + '">' +
                  esc(drugName(d)) + '</span>' +
                '<span class="row-sub" style="display:block;" dir="' + (lang === 'ar' ? 'ltr' : 'rtl') + '">' +
                  esc(drugSub(d)) + '</span>' +
              '</span>' +
              '<span class="drug-tags">' + sevChip(drugWorst(d)) +
                '<span class="pill-tag">' + esc(t('df.' + d.form)) + '</span></span>' +
              icon('chevron', 'more-chevron') +
            '</button>').join('') + '</div>'
        : '<div class="card card-pad" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
          esc(t('dx.noMatch')) + '</div>') +
      drugDisclaimer() +
    '</div>';
}

/* ---------- Jobs ----------

   one of the three permitted surfaces: somebody reading job adverts is not
   making a clinical decision. */
function screenJobs(tabs) {

  return '<div class="screen-body">' +

    '<div class="constrain stack">' +

      (list.length

            '<div class="row job-row">' +
              '<span class="row-body">' +
                '<span class="row-title" style="display:block;">' + esc(L(j.title)) + '</span>' +

                  ' · ' + esc(L(j.where)) + '</span>' +
                '<span class="job-body">' + esc(L(j.body)) + '</span>' +

}

function setBrowseTab(k) { S.browseTab = k; render(); scrollTop(); }

/* ==========================================================================
   THE PARTNER'S OWN SCREENS (W15)

   A partner sees their own listings and can submit a new one. They cannot
   publish: submitting raises a DRAFT and an operator phones to finish it. The
   partner does the typing, the human check stays where P1 needs it.
   ========================================================================== */

function screenPartner() {
  const mine = myListings();
  const state = x => '<span class="state state-' + x.state + '">' + esc(t('ls.' + x.state)) + '</span>';
  const acct = ACCOUNTS[S.email];

  return '<div class="screen-body"><div class="constrain stack">' +
    '<button class="check-card" onclick="goto(\'partnerNew\')">' +
      '<span class="check-card-ico">' + icon('plus') + '</span>' +
      '<span class="check-card-body">' +
        '<span class="check-card-t">' + esc(t('pt.submit')) + '</span>' +
        '<span class="check-card-s">' + esc(t('pt.submitSub')) + '</span></span>' +
      icon('chevron', 'more-chevron') +
    '</button>' +

    '<p class="section-eyebrow">' + esc(t('pt.yours', { n:mine.length })) + '</p>' +
    (mine.length
      ? '<div class="card">' + mine.map(x =>
          '<div class="row">' +
            '<span class="row-body">' +
              '<span class="row-title" style="display:block;">' +
                esc(L(x.title) || t('pt.untitled')) + '</span>' +
              '<span class="row-sub" style="display:block;">' +
                esc(t(x.kind === 'job' ? 'ls.job' : 'ls.banner')) +
                (x.kind === 'banner' ? ' · ' + esc(x.from) + ' → ' + esc(x.to) : '') + '</span>' +
            '</span>' + state(x) + '</div>').join('') + '</div>'
      : '<div class="card card-pad" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
        esc(t('pt.none')) + '</div>') +

    /* Impressions, counted without identity. This is the number a partner
       wants and the most a partner may ever have: how many times, on which
       day. Never who. */
    (Object.keys(S.impressions).length
      ? '<p class="section-eyebrow">' + esc(t('pt.impressions')) + '</p>' +
        '<div class="card card-pad"><div class="tally">' +
          Object.entries(S.impressions).map(([k, n]) =>
            '<div class="tally-row"><span>' + esc(k.split('|')[0]) + ' · ' + esc(k.split('|')[1]) + '</span>' +
            '<span class="figure">' + fmt(n) + '</span></div>').join('') +
        '</div><p class="inline-note" style="margin-top:9px;">' + esc(t('pt.impressionsNote')) + '</p></div>'
      : '') +

    '<p class="inline-note">' + esc(t('pt.reviewNote')) + '</p>' +
  '</div></div>';
}

/* The form asks only for what a listing cannot exist without. Everything
   negotiable — wording, artwork, slot, price — is what the call is for, which
   keeps it short enough that a partner finishes it. */
function screenPartnerNew() {
  const f = S.partnerForm;
  const field = (k, label, placeholder) =>
    '<div class="field"><label>' + esc(label) + '</label>' +
      '<input value="' + esc(f[k] || '') + '" placeholder="' + esc(placeholder || '') + '" ' +
      'oninput="setPartnerField(' + attr(k) + ', this.value)"></div>';

  return '<div class="screen-body"><div class="constrain stack">' +
    '<button class="btn-ghost" onclick="goto(\'partner\')">' + esc(t('common.back')) + '</button>' +
    '<div class="segmented">' +
      ['job', 'banner'].map(k =>
        '<button class="' + (f.kind === k ? 'active' : '') + '" onclick="setPartnerField(\'kind\', ' +
          attr(k) + ')">' + esc(t('ls.' + k)) + '</button>').join('') + '</div>' +

    field('title', t(f.kind === 'job' ? 'pt.role' : 'pt.campaign'), '') +
    (f.kind === 'job' ? field('where', t('pt.where'), '') : '') +
    field('from', t('pt.from'), 'YYYY-MM-DD') +
    field('contact', t('pt.contact'), '07XX XXX XXXX') +

    (f.error ? '<div class="auth-error">' + esc(t(f.error)) + '</div>' : '') +
    '<button class="btn-primary" onclick="submitPartnerListing()">' + esc(t('pt.send')) + '</button>' +
    '<p class="inline-note">' + esc(t('pt.callNote')) + '</p>' +
  '</div></div>';
}

function setPartnerField(k, v) { S.partnerForm[k] = v; S.partnerForm.error = null; render(); }

function submitPartnerListing() {
  const f = S.partnerForm;
  // Only the fields a listing cannot exist without are required here. The rest
  // is what the phone call collects.
  if (!f.title || !f.from || !f.contact) { f.error = 'pt.needFields'; render(); return; }
  const acct = ACCOUNTS[S.email];
  LISTINGS.push({
    id:(f.kind === 'job' ? 'J' : 'B') + Date.now().toString().slice(-5),
    kind:f.kind, company:acct.company, state:'draft',
    title:{ ar:f.title, en:f.title },
    where:{ ar:f.where || '', en:f.where || '' },
    body:{ ar:'', en:'' },
    from:f.from, to:f.from, posted:TODAY_ISO, contact:f.contact,
    surface:f.kind === 'banner' ? 'browse' : null
  });
  S.partnerForm = { kind:'job' };
  S.screen = 'partner';
  toast(t('pt.sent'));
  render();
}

function drugDisclaimer() {
  return '<p class="inline-note" style="margin-top:4px;">' + esc(t('dx.disclaimer')) + '</p>';
}

/* ---------- The check ---------- */

function screenCheck() {
  const q = drugNorm(S.drugQuery);
  const inBasket = sci => S.basket.indexOf(sci) >= 0;
  const results = q
    ? clinicalOnly(DRUGS).filter(d => drugMatches(d, q)).slice(0, 8)
    : [];

  const picker =
    '<div class="searchbox">' + icon('search') +
      '<input id="drug-q" type="search" autocomplete="off" value="' + esc(S.drugQuery) + '" ' +
        'placeholder="' + esc(t('dc.addPlaceholder')) + '" oninput="setDrugQuery(this.value)" ' +
        'onkeydown="drugSearchKey(event)">' +
      (S.drugQuery ? '<button class="searchbox-x" onclick="setDrugQuery(\'\')" aria-label="' +
        esc(t('common.clear')) + '">&times;</button>' : '') +
    '</div>' +
    (q && !results.length
      ? '<p class="inline-note">' + esc(t('dx.noMatch')) + '</p>'
      : results.length
        ? '<div class="card">' + results.map(d =>
            '<button class="row drug-row" onclick="addToBasket(' + attr(d.sci) + ')"' +
              (inBasket(d.sci) ? ' disabled' : '') + '>' +
              '<span class="row-body">' +
                '<span class="row-title" style="display:block;">' + esc(drugName(d)) + '</span>' +
                '<span class="row-sub" style="display:block;" dir="' + (lang === 'ar' ? 'ltr' : 'rtl') + '">' +
                  esc(drugSub(d)) + '</span></span>' +
              (inBasket(d.sci)
                ? '<span class="pill-tag">' + esc(t('dc.added')) + '</span>'
                : '<span class="add-mark">' + icon('plus') + '</span>') +
            '</button>').join('') + '</div>'
        : '');

  /* Shown in BOTH states. Recording empties the basket, and that is exactly
     the moment somebody looks for what they just recorded — the empty state
     used to swallow it. */
  const shiftPanel = () => {
    const mine = myShiftTallies();
    if (!mine.length) return '';
    return '<p class="section-eyebrow">' + esc(t('dc.myShift')) + '</p>' +
      '<div class="card card-pad"><div class="tally">' + mine.map(r =>
        '<div class="tally-row"><span>' + esc((drugBySci(r.sci) && drugName(drugBySci(r.sci))) || r.sci) + '</span>' +
        '<span class="figure">' + fmt(r.n) + '</span></div>').join('') + '</div>' +
        '<p class="inline-note" style="margin-top:9px;">' + esc(t('dc.myShiftNote')) + '</p></div>';
  };

  /* One tap instead of type-and-tap, from the pharmacy's own tallies (W8).
     This is the only place the dispensing log pays back the person who
     generated it, immediately and visibly: log more, and the checks you do
     tomorrow get faster. */
  const frequent = () => {
    const ph = dispensePharmacy();
    if (!ph) return [];
    const byDrug = new Map();
    S.dispensing.filter(r => r.pharmacy === ph.id)
      .forEach(r => byDrug.set(r.sci, (byDrug.get(r.sci) || 0) + r.n));
    return [...byDrug.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(x => x[0])
      .filter(sci => S.basket.indexOf(sci) < 0 && drugBySci(sci))
      .slice(0, 8);
  };
  const frequentRow = () => {
    const list = frequent();
    if (!list.length) return '';
    return '<p class="section-eyebrow" style="margin:14px 0 8px;">' + esc(t('dc.frequent')) + '</p>' +
      '<div class="pill-tags">' + list.map(sci =>
        '<button class="pill-pick" onclick="addToBasket(' + attr(sci) + ')">' +
          esc(drugName(drugBySci(sci))) + '</button>').join('') + '</div>';
  };

  if (!S.basket.length) {
    return '<div class="constrain stack">' + picker + frequentRow() +
      '<div class="card card-pad empty-check">' + icon('pill') +
        '<p class="empty-check-t">' + esc(t('dc.emptyTitle')) + '</p>' +
        '<p class="empty-check-s">' + esc(t('dc.emptyBody')) + '</p>' +
        '<button class="btn-ghost" onclick="backToReference()">' +
          esc(t('dc.orLookUp')) + '</button></div>' +
      shiftPanel() +
      drugDisclaimer() +
    '</div>';
  }

  const inter = basketInteractions(S.basket);
  const dupes = basketDuplicates(S.basket);
  const questions = basketQuestions(S.basket);
  const cov = basketCoverage(S.basket);
  const worst = inter.concat(dupes.map(d => ({ severity:d.rule.severity })))
    .reduce((w, x) => ((SEVERITY_ORDER[x.severity] || 0) > (SEVERITY_ORDER[w] || 0) ? x.severity : w), '');

  const chips = S.basket.map(sci => {
    const d = drugBySci(sci);
    return '<span class="basket-chip">' + esc(d ? drugName(d) : sci) +
      '<button onclick="removeFromBasket(' + attr(sci) + ')" aria-label="' + esc(t('common.remove')) + '">&times;</button></span>';
  }).join('');

  /* The verdict line. It reports WHAT WAS CHECKED and never claims safety:
     the system knows that no pair in its table matched, which is not the same
     statement as "this combination is safe", and the gap between those two is
     exactly where a missed interaction stops being a limitation of a reference
     and starts being a promise that was broken. */
  const verdict = (inter.length || dupes.length)
    ? '<div class="verdict verdict-' + (worst || 'warning') + '">' + icon('alert') +
        '<span><strong>' + esc(t('dc.found', { n:inter.length + dupes.length })) + '</strong>' +
        '<span class="verdict-sub">' + esc(t('dc.checkedLine', { d:fmt(cov.drugs), p:fmt(cov.pairs) })) + '</span></span></div>'
    : '<div class="verdict verdict-clear">' + icon('check') +
        '<span><strong>' + esc(t('dc.nothingFound')) + '</strong>' +
        '<span class="verdict-sub">' + esc(t('dc.checkedLine', { d:fmt(cov.drugs), p:fmt(cov.pairs) })) + ' ' +
          esc(t('dc.notComplete')) + '</span></span></div>';

  const pairRow = i => {
    const A = drugBySci(i.a), B = drugBySci(i.b);
    return '<div class="row drug-inter">' +
      '<span class="row-body">' +
        '<span class="drug-inter-h">' + sevChip(i.severity) +
          '<span class="drug-inter-w">' + esc(drugName(A)) + '  +  ' + esc(drugName(B)) + '</span></span>' +
        '<span class="row-sub" style="display:block;">' + esc(L(i.note)) + '</span>' +
      '</span></div>';
  };

  const dupeRow = x =>
    '<div class="row drug-inter">' +
      '<span class="row-body">' +
        '<span class="drug-inter-h">' + sevChip(x.rule.severity) +
          '<span class="drug-inter-w">' + esc(L(x.rule.label)) + '</span>' +
          (x.rule.oftenIntended ? '<span class="pill-tag">' + esc(t('dc.oftenIntended')) + '</span>' : '') +
        '</span>' +
        '<span class="row-sub" style="display:block;">' +
          esc(x.members.map(m => drugName(drugBySci(m))).join('  +  ')) + ' — ' + esc(L(x.rule.note)) +
        '</span>' +
      '</span></div>';

  const ph = dispensePharmacy();

  return '<div class="constrain stack">' +
    picker +
    frequentRow() +
    '<div class="basket">' + chips +
      '<button class="btn-ghost basket-clear" onclick="clearBasket()">' + esc(t('dc.clear')) + '</button></div>' +
    verdict +

    (inter.length
      ? '<p class="section-eyebrow">' + esc(t('dx.interactions')) + ' (' + fmt(inter.length) + ')</p>' +
        '<div class="card">' + inter.map(pairRow).join('') + '</div>'
      : '') +

    (dupes.length
      ? '<p class="section-eyebrow">' + esc(t('dc.duplication')) + ' (' + fmt(dupes.length) + ')</p>' +
        '<div class="card">' + dupes.map(dupeRow).join('') + '</div>'
      : '') +

    /* Not warnings. The app does not know the patient, so a contraindication
       list is a list of things to ASK — and asking is the part that turns a
       screen into a conversation. */
    (questions.length
      ? '<p class="section-eyebrow">' + esc(t('dc.askTitle')) + '</p>' +
        '<div class="card card-pad"><ul class="ask-list">' + questions.map(qn =>
          '<li><span class="ask-q">' + esc(L(qn.text)) + '</span>' +
          '<span class="ask-for">' + esc(qn.drugs.map(m => drugName(drugBySci(m))).join(', ')) + '</span></li>').join('') +
        '</ul></div>'
      : '') +

    /* Coverage, at the same size as everything else. */
    (cov.namedOutside.length
      ? '<div class="card card-pad coverage">' + icon('alert') +
        '<div><p class="coverage-t">' + esc(t('dc.coverageTitle')) + '</p>' +
        '<p class="coverage-b">' + esc(t('dc.coverageBody', { list:cov.namedOutside.join(', ') })) + '</p></div></div>'
      : '') +

    /* Recording. Counts only — see recordDispense(). */
    (canRecord()
      ? '<button class="btn-primary" onclick="recordDispense()">' +
          esc(t('dc.record', { pharmacy:ph.name })) + '</button>' +
        '<p class="inline-note">' + esc(t('dc.recordNote')) + '</p>' +
        '<p class="inline-note register-note">' + icon('alert') + ' ' + esc(t('dc.notRegister')) + '</p>'
      : '<p class="inline-note">' + esc(t(S.role === 'student' ? 'dc.studentNote' : 'dc.noShiftNote')) + '</p>') +

    shiftPanel() +

    drugDisclaimer() +
  '</div>';
}

/* ---------- The owner's consumption view ----------
   The pharmacy's own analytics, and the first thing built out of this data on
   purpose: whoever generates it should get value from it before anybody else
   does. */
function screenConsumption() {
  const acct = ACCOUNTS[S.email];
  /* The pharmacy on screen, or all of an owner's pharmacies when they are
     looking at all of them. */
  const scope = currentPharmacy();
  const rows = S.dispensing.filter(r => scope ? r.pharmacy === scope.id : ownedIds(acct).includes(r.pharmacy));
  const byDrug = new Map();
  rows.forEach(r => byDrug.set(r.sci, (byDrug.get(r.sci) || 0) + r.n));
  const list = [...byDrug.entries()].sort((a, b) => b[1] - a[1]);
  const total = list.reduce((n, x) => n + x[1], 0);
  const max = Math.max(1, ...list.map(x => x[1]));

  return '<div class="screen-body"><div class="constrain stack">' +
    '<div class="stat-grid">' +
      '<div class="stat-card"><span class="stat-num">' + fmt(total) + '</span>' +
        '<span class="stat-label">' + esc(t('cn.units')) + '</span></div>' +
      '<div class="stat-card"><span class="stat-num">' + fmt(list.length) + '</span>' +
        '<span class="stat-label">' + esc(t('cn.distinct')) + '</span></div>' +
    '</div>' +
    (list.length
      ? '<p class="section-eyebrow">' + esc(t('cn.byDrug')) + '</p>' +
        '<div class="card card-pad">' + list.map(([sci, n]) => {
          const d = drugBySci(sci);
          return '<div class="cn-row">' +
            '<span class="cn-name">' + esc(d ? drugName(d) : sci) + '</span>' +
            '<span class="cn-track"><span class="cn-bar" style="width:' +
              Math.max(3, n / max * 100) + '%;"></span></span>' +
            '<span class="cn-n figure">' + fmt(n) + '</span></div>';
        }).join('') + '</div>'
      : '<div class="card card-pad" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
        esc(t('cn.empty')) + '</div>') +
    '<p class="inline-note">' + esc(t('cn.note')) + '</p>' +
    '<p class="inline-note register-note">' + icon('alert') + ' ' + esc(t('dc.notRegister')) + '</p>' +
  '</div></div>';
}

function screenDrug() {
  const d = drugBySci(S.openDrug);
  if (!d) return screenDrugs();

  const kv = (ic, label, value) =>
    '<div class="kv">' + icon(ic) + '<div><div class="kv-label">' + esc(label) + '</div>' +
    '<div class="kv-value">' + value + '</div></div></div>';

  /* Worst first. Someone scanning this screen reads the top two lines, so the
     one that changes what they do has to be one of them. */
  const inter = (d.interactions || []).slice()
    .sort((a, b) => (SEVERITY_ORDER[b.severity] || 0) - (SEVERITY_ORDER[a.severity] || 0));

  return '<div class="screen-body"><div class="constrain stack">' +
    '<div class="rec-actions">' +
      '<button class="btn-ghost" onclick="backToReference()">' + esc(t('common.back')) + '</button>' +

/* ==========================================================================
   OWNERS OF MORE THAN ONE PHARMACY (W7, revised v0.0010)

   An owner of several sees a tab per pharmacy, and an "All" tab that answers
   the question they open the app with: which of my pharmacies needs me? Its
   order is the answer — a pharmacy with no responsible pharmacist first,
   because it cannot legally open; then, while the marketplace is on, by what
   is outstanding there. A pharmacy that is fine sorts to the bottom and can be
   ignored, which is the point.

   An owner of one sees no tabs at all. One pharmacy is not a list.
   ========================================================================== */

function pharmacyBoard() {
  const market = FLAGS.marketplace;
  return myPharmacies().slice().sort((a, b) =>
    (!!b.responsible === !!a.responsible
      ? (market ? (b.uncovered - a.uncovered) || (b.applicants - a.applicants) : 0)
      : (a.responsible ? 1 : -1)));
}

function setPharmacy(id) {
  /* A cart belongs to the pharmacy it was rung up in. Switching tabs does not
     carry it to another pharmacy's till; it is set aside, and that is recorded. */
  if ((id || null) !== S.pharmacyTab && S.till.lines.length) {
    tillLog('cleared', { lines:S.till.lines.length });
    S.till = tillReset();
  }
  /* A count in progress belongs to its shelf in its pharmacy: switching tabs
     saves it, to be continued there. */
  const open = typeof openCountSession === 'function' && openCountSession();
  if (open && (id || null) !== open.pharmacy) { open.state = 'saved'; open.savedAt = nowIso(); S.openCount = null; saveDrafts(); }
  S.pharmacyTab = id || null;
  S.receiptFor = null;
  S.screen = S.screen === 'till' ? 'till' : ['stock', 'count', 'import', 'orders', 'suppliers', 'register'].includes(S.screen) ? S.screen
           : S.screen === 'order' ? 'orders' : 'dashboard';
  S.modal = null; render(); scrollTop();
}

/* The tab strip. It scrolls sideways inside itself rather than widening the
   page, so four pharmacy names still fit a 320px phone. A pharmacy nobody can
   sign for carries a mark on its tab, so it is visible from any of them. */
function pharmacyTabs() {
  const mine = myPharmacies();
  if (mine.length < 2) return '';
  const cur = currentPharmacy();
  const on = id => (cur ? cur.id : null) === id;
  const tab = (id, label, flag, pending) =>
    '<button class="ptab' + (on(id) ? ' on' : '') + '" role="tab" aria-selected="' + on(id) + '" ' +
      'onclick="setPharmacy(' + (id ? attr(id) : 'null') + ')">' + esc(label) +
      (flag ? '<span class="ptab-dot" title="' + esc(t('g.noResponsible')) + '"></span>' : '') +
      (pending ? '<span class="ptab-dot pending" title="' + esc(t('ap.pendingT')) + '"></span>' : '') +
    '</button>';
  return '<div class="constrain"><div class="ptabs" role="tablist">' +
    tab(null, t('g.allPharmacies')) +
    mine.map(p => tab(p.id, L(p.short || p.name), !p.responsible, p.verification === 'pending')).join('') +
    /* The way to a further pharmacy, at the end of the strip it would join. */
    '<button class="ptab ptab-add" onclick="goto(\'addPharmacy\')" aria-label="' + esc(t('ap.title')) + '">+</button>' +
  '</div></div>';
}

/* ==========================================================================
   ADDING A PHARMACY (v0.0011)

   How a pharmacist becomes an owner, and how an owner becomes an owner of
   several. The owner gives what verification needs — the licence and its
   document, the name, where it is, and who the responsible pharmacist is — and
   the pharmacy joins their tabs straight away, marked as under review. A
   human checks it against the Syndicate (the same admin queue as every other
   account); until then it is not billed, and from the till onward it cannot
   sell or post. There is no automated check to design around, because the
   Syndicate has none.
   ========================================================================== */
function setAddPh(k, v) { S.addPh[k] = v; }

function screenAddPharmacy() {
  const f = S.addPh, e = f.errors || {};
  const fld = (k, label, input, hint) =>
    '<div class="field"><label for="ap-' + k + '">' + esc(label) + '</label>' + input +
      (hint ? '<p class="inline-note" style="margin-top:5px;">' + esc(hint) + '</p>' : '') +
      (e[k] ? '<p class="auth-error" style="margin:6px 0 0;">' + esc(e[k]) + '</p>' : '') + '</div>';
  const inp = (k, extra) => '<input id="ap-' + k + '" value="' + esc(f[k]) + '" ' + (extra || '') +
    ' oninput="setAddPh(' + attr(k) + ', this.value)">';
  return '<div class="screen-body"><div class="constrain">' +
    '<p class="inline-note" style="margin-bottom:14px;">' + esc(t('ap.intro')) + '</p>' +
    fld('nameAr', t('ap.nameAr'), inp('nameAr', 'dir="rtl"')) +
    fld('nameEn', t('ap.nameEn'), inp('nameEn', 'dir="ltr"'), t('ap.nameHint')) +
    fld('licence', t('pr.licence'), inp('licence', 'dir="ltr" class="figure"')) +
    fld('district', t('f.district'), inp('district')) +
    fld('address', t('pr.address'), inp('address')) +
    fld('responsible', t('pr.responsible'), inp('responsible'), t('ap.responsibleHint')) +
    fld('doc', t('ap.doc'), '<input id="ap-doc" type="file" accept="image/*,application/pdf" ' +
      'onchange="setAddPh(\'doc\', this.files && this.files[0] ? this.files[0].name : \'\')">' +
      (f.doc ? '<p class="inline-note" style="margin-top:5px;">' + esc(f.doc) + '</p>' : ''), t('ap.docHint')) +
    '<button class="btn-primary" onclick="submitAddPharmacy()">' + esc(t('ap.submit')) + '</button>' +
    '<p class="inline-note" style="margin-top:10px;text-align:center;">' + esc(t('ap.after')) + '</p>' +
    '</div></div>';
}

function submitAddPharmacy() {
  const f = S.addPh;
  const errors = {};
  const licence = f.licence.trim();
  if (!f.nameAr.trim() && !f.nameEn.trim()) errors.nameEn = t('ap.needName');
  if (!licence) errors.licence = t('ap.needLicence');
  /* A licence belongs to one pharmacy. The same number twice is a typo or a
     problem, and neither is resolved by accepting it. */
  else if (Object.values(PHARMACIES).some(p => p.licence.toLowerCase() === licence.toLowerCase()))
    errors.licence = t('ap.dupLicence');
  if (!f.district.trim()) errors.district = t('ap.needDistrict');
  if (!f.doc) errors.doc = t('ap.needDoc');
  f.errors = errors;
  if (Object.keys(errors).length) { render(); return; }

  const id = 'PN' + (Object.keys(PHARMACIES).length + 1);
  const nm = { ar:f.nameAr.trim() || f.nameEn.trim(), en:f.nameEn.trim() || f.nameAr.trim() };
  PHARMACIES[id] = {
    id, verification:'pending', name:nm, short:nm, licence,

/* ---------- The product catalogue (W17) ----------
   The clinical rules are keyed on molecules; a till scans products. This is the
   lookup between them, and every product says how far we know what is in it.
   The one thing it must never do is let a product the Helper cannot check look
   like one it can. */

const productByCode = code => PRODUCTS.find(p => p.barcode === code) || null;

/* The same arithmetic as src/lib/barcode.ts, which is unit-tested. A barcode
   whose check digit is wrong is a MISREAD, not a new product — sending it for
   mapping would have somebody chase a box that does not exist. */
function ean13Valid(code) {
  if (!/^\d{13}$/.test(code)) return false;
  const sum = [...code.slice(0, 12)].reduce((n, c, i) => n + Number(c) * (i % 2 ? 3 : 1), 0);
  return (10 - sum % 10) % 10 === Number(code[12]);
}

/* How much of a product the Helper can actually check. Two separate questions
   are folded together here on purpose, because the pharmacist at the counter
   only cares about the answer: do we know what is in it (the mapping), and is
   what is in it in the reference (coverage)? */
function productCoverage(p) {
  if (p.mapping === 'nondrug')  return { kind:'nondrug',  outside:[] };
  if (p.mapping === 'unmapped') return { kind:'unmapped', outside:[] };
  const outside = p.molecules.filter(m => m.ref === false);
  const inside  = p.molecules.filter(m => m.ref !== false);
  return { kind: !outside.length ? 'full' : inside.length ? 'partial' : 'none', outside };
}

function catalogueSummary() {
  const by = k => PRODUCTS.filter(p => p.mapping === k).length;
  const medicines = PRODUCTS.filter(p => p.mapping !== 'nondrug');
  return {
    total: PRODUCTS.length, verified: by('verified'), auto: by('auto'),
    unmapped: by('unmapped'), nondrug: by('nondrug'),
    uncheckable: medicines.filter(p => productCoverage(p).kind !== 'full').length
  };
}

const MAPPING_BADGE = { verified:'badge-verified', auto:'badge-pending', unmapped:'badge-alert', nondrug:'badge-muted' };
const mappingChip = m => '<span class="badge ' + MAPPING_BADGE[m] + '">' + esc(t('map.' + m)) + '</span>';

function coverageBanner(p) {
  const c = productCoverage(p);
  const names = c.outside.map(m => m.sci).join(', ');
  const tone = c.kind === 'full' ? 'banner-mist' : c.kind === 'nondrug' ? 'banner-mist' : 'banner-amber';
  return '<div class="banner ' + tone + ' cov-' + c.kind + '">' + icon(c.kind === 'full' ? 'pill' : 'alert') +
    '<p>' + esc(t('cov.' + c.kind, { names })) + '</p></div>';
}

function setProductQuery(v) {

  if (!v) S.scanNote = null;
  render();
  const el = document.getElementById('prod-q');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

function setProductFilter(f) { S.productFilter = f; render(); }
function openProduct(code) { S.openProduct = code; S.screen = 'product'; S.modal = null; render(); scrollTop(); }

/* Enter in the box is what a wedge scanner sends after the digits, so a scan
   and a typed code arrive the same way. Anything with letters in it is a name
   search and is left to the filter. */
function productKey(ev) {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  scanProduct(ev.target.value);
}

function scanProduct(raw) {
  const code = String(raw || '').replace(/[\s-]/g, '');
  if (!/^\d+$/.test(code)) return;
  if (!ean13Valid(code)) { S.scanNote = { kind:'misread', code }; render(); return; }
  if (productByCode(code)) { S.scanNote = null; S.productQuery = ''; openProduct(code); return; }
  const known = S.mappingRequests.find(r => r.barcode === code);
  if (known) known.times++;
  else S.mappingRequests.push({ barcode:code, times:1, first:TODAY_ISO });
  S.scanNote = { kind:'unknown', code };
  S.productQuery = '';
  render();

/* ==========================================================================
   THE TILL (v0.0012, W17)

   Scan, sell, print. Every rule below was decided before a line of it was
   written, and each one is here because getting it wrong costs money or trust
   at a counter:

   - Each PHARMACY sets its own price. The reference is the average market
     price, derived from what pharmacies charge and never typed in. It is the
     default for a product the pharmacy has not priced, and it is only ever
     SHOWN to an owner (or, from v0.0017, staff they allow), and only from five
     pharmacies up (P6) — fewer, and an "average" is somebody's price.
   - The price is written onto the SALE LINE when it is sold. Changing a price
     afterwards changes the next sale, never a past one.
   - The total is the exact sum. No rounding, in either direction.
   - Tenders — cash, ZainCash, Qi Card — are RECORDED, not processed. The
     platform holds no money (no wallet, by principle).
   - Discounts are the owner's alone until permissions arrive (v0.0017), need a
     reason, and are on the record.
   - The Dispensing Helper checks the WHOLE BASKET as it fills, says how much of
     it it could check, and never stops a sale (P9). A warning is one tap to
     acknowledge; whether it was is recorded.
   - Nothing on this screen can show a banner. It is a dispensing surface, so
     it never calls bannerFor() (P1).
   ========================================================================== */

const tillReset = () => ({ lines:[], discount:0, discountReason:'', discountOpen:false, tender:'cash',
  given:'', ref:'', ack:{}, unknown:null, needPrice:null, note:null, query:'',
  cashManual:false, cashConfirmed:false });

/* ---------- Prices ---------- */

/* What other pharmacies charge. In production this is computed from real
   sales; here it is a deterministic fixture, spread around the catalogue's
   illustrative price, with a different number of pharmacies per product so
   the five-pharmacy floor is visible in both directions. */
function marketPrices(code) {
  const p = productByCode(code);
  if (!p || !p.price) return [];
  let h = 0;
  for (const c of code) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const n = 3 + (h % 7);
  const out = [];
  for (let i = 0; i < n; i++) {
    h = (h * 1103515245 + 12345) >>> 0;
    out.push(Math.round(p.price * (0.9 + ((h % 1000) / 1000) * 0.2) / 250) * 250);
  }
  return out;
}
const MARKET_FLOOR = 5;
/* The average, or null below the floor. Rounded to 250 IQD because it becomes a
   price somebody charges; a sale's TOTAL is never rounded. */
function marketAverage(code) {
  const xs = marketPrices(code);
  if (xs.length < MARKET_FLOOR) return null;
  return Math.round(xs.reduce((a, b) => a + b, 0) / xs.length / 250) * 250;
}
/* The pharmacy's own price, or the market reference as its default, or null —
   in which case somebody who may set prices has to set one. */
function pharmacyPrice(phId, code) {
  const own = (S.prices[phId] || {})[code];
  if (own != null) return own;
  return marketAverage(code);
}
const canSetPrices = () => S.role === 'owner';
const canSeeMarket = () => S.role === 'owner';
const canDiscount  = () => S.role === 'owner';
const canRefund    = () => S.role === 'owner';

/* The record every later version builds on: who did what, where, when. The
   shift timeline (W23) reads it; the CRM never does. */
function tillLog(kind, detail) {
  S.tillLog.push(Object.assign({ kind, at:new Date().toISOString(), by:S.email,
    pharmacy:(currentPharmacy() || {}).id || null }, detail || {}));
}

function setPrice(phId, code, v) {
  if (!canSetPrices()) return false;
  const price = Math.round(Number(v));
  if (!isFinite(price) || price <= 0) return false;
  const from = pharmacyPrice(phId, code);
  (S.prices[phId] = S.prices[phId] || {})[code] = price;
  S.tillLog.push({ kind:'price', at:new Date().toISOString(), by:S.email, pharmacy:phId, code, from, to:price });
  return true;
}

/* ---------- Which pharmacy's till ---------- */

/* A till belongs to one pharmacy: the one on screen. An owner of several on
   All is asked which. A pharmacy under review, or with nobody to sign for it,
   cannot sell — the second is the law, not the software being cautious. */
function tillPharmacy() { return currentPharmacy(); }
function tillBlock(ph) {
  if (!ph) return 'choose';
  if (ph.verification !== 'verified') return 'pending';
  if (!ph.responsible) return 'noResponsible';
  return null;
}

/* ---------- Lines ---------- */

function tillLineFromProduct(p, price) {
  return { barcode:p.barcode, name:p.name, qty:1, unit:price, mapping:p.mapping,
           molecules:p.molecules.map(m => Object.assign({}, m)), form:p.form,
           dose:'', take:p.mapping === 'nondrug' ? [] : defaultTake(p), note:'', open:false };
}

function tillAdd(code) {
  const ph = tillPharmacy();
  if (tillBlock(ph)) return;
  const T = S.till;
  const line = T.lines.find(l => l.barcode === code);
  if (line) { line.qty++; render(); return; }
  const p = productByCode(code);
  if (!p) return;
  const price = pharmacyPrice(ph.id, code);
  /* No price and no reference: the till does not guess. Somebody who may set
     prices sets one, and it is the pharmacy's price from then on. */
  if (price == null) { T.needPrice = code; render(); return; }
  const line2 = tillLineFromProduct(p, price);
  /* Never a block (S1): a line whose recorded stock is only expired says so. */
  const st = stockOf(ph.id, code);
  if (st.available <= 0 && st.expired > 0) line2.onlyExpired = true;
  T.lines.push(line2);
  T.needPrice = null; T.note = null;
  render();
}

function tillSetPriceAndAdd(code) {
  const ph = tillPharmacy();
  const el = document.getElementById('till-price');
  if (!ph || !el || !setPrice(ph.id, code, el.value)) { S.till.note = { kind:'badPrice' }; render(); return; }
  S.till.needPrice = null;
  tillAdd(code);
}

/* The scan box: digits then Enter (a wedge scanner), or a name to search. */
function tillKey(ev) {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  tillScan(ev.target.value);
}
function tillScan(raw) {
  const T = S.till;
  const code = String(raw || '').replace(/[\s-]/g, '');
  if (!/^\d+$/.test(code)) return;
  T.query = '';
  if (!ean13Valid(code)) { T.note = { kind:'misread', code }; render(); return; }
  if (productByCode(code)) { tillAdd(code); return; }
  /* Unknown: still sellable, by name and price, and sent for mapping. */
  const known = S.mappingRequests.find(r => r.barcode === code);
  if (known) known.times++; else S.mappingRequests.push({ barcode:code, times:1, first:TODAY_ISO });
  T.unknown = code; T.note = null;
  render();
}
function tillQuery(v) {
  S.till.query = v;
  render();
  const el = document.getElementById('till-q');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function tillAddUnknown() {
  const T = S.till;
  const name = (document.getElementById('unk-name') || {}).value || '';
  const price = Math.round(Number((document.getElementById('unk-price') || {}).value));
  if (!name.trim() || !isFinite(price) || price <= 0) { T.note = { kind:'unknownIncomplete' }; render(); return; }
  T.lines.push({ barcode:T.unknown, name:{ ar:name.trim(), en:name.trim() }, qty:1, unit:price, mapping:'unmapped',
                 molecules:[], form:null, dose:'', usage:null, open:false, unknown:true });
  T.unknown = null; T.note = null;
  render();
}

function tillQty(i, d) {
  const l = S.till.lines[i];
  if (!l) return;
  if (l.qty + d < 1) return tillVoid(i);
  l.qty += d;
  render();
}
/* Taking a line off is a void, and a void is on the record — voids are where
   shrinkage shows (W17), and a record kept only of the ones that mattered is
   not a record. */
function tillVoid(i) {
  const l = S.till.lines[i];
  if (!l) return;
  tillLog('void', { code:l.barcode, qty:l.qty, unit:l.unit });
  S.till.lines.splice(i, 1);
  render();
}
function tillToggleLine(i) { const l = S.till.lines[i]; if (l) { l.open = !l.open; render(); } }
function tillSetDose(i, v) { const l = S.till.lines[i]; if (l) l.dose = v; }
function tillSetNote(i, v) { const l = S.till.lines[i]; if (l) l.note = v; }
function tillTake(i, k) {
  const l = S.till.lines[i];
  if (!l || !TAKE[k]) return;
  l.take = l.take.includes(k) ? l.take.filter(x => x !== k) : l.take.concat(k);
  render();
}

/* ---------- Instructions (v0.0012.1) ----------

   Only what changes how a medicine works: food, time of day, once a week.
   v0.0012 printed a line by dosage form — "swallow with water" under every
   tablet — and a patient learns nothing from that, so it is gone. The defaults
   come from the molecule (the `take` field of the drug reference), from a
   fixed list that exists in both languages; a medicine with nothing worth
   saying prints nothing. The dose is typed by the pharmacist, every time.
   Placeholder content until the clinical curator reviews it (W19). */
function defaultTake(p) {
  const out = [];
  p.molecules.forEach(m => {
    const d = m.ref === false ? null : drugBySci(m.sci);
    ((d && d.take) || []).forEach(k => { if (!out.includes(k)) out.push(k); });
  });
  return out;
}
/* What prints under a line, in the language asked for: the dose, then how to
   take it. A note the pharmacist typed prints as typed, in either language. */
function instructionText(l, rl) {
  const how = (l.take || []).map(k => TAKE[k] && TAKE[k][rl]).filter(Boolean);
  if (l.note) how.push(l.note);
  const rest = how.join(' · ');
  return [l.dose, rest].filter(Boolean).join(' — ');
}

/* ---------- The Helper, on the basket ---------- */

/* The molecules the Helper can check: linked, and in the reference. */
function tillScis(lines) {
  const out = [];
  lines.forEach(l => l.molecules.forEach(m => {
    if (m.ref !== false && drugBySci(m.sci) && out.indexOf(m.sci) < 0) out.push(m.sci);
  }));
  return out;
}

/* Two tiers render, as P9 set them: WARN (serious or critical — shown on the
   basket, one tap to acknowledge) and NOTE (the rest — there if looked for).
   The Stop tier exists and is empty until the curator fills it (v0.0015). */
const tierOf = sev => (sev === 'critical' || sev === 'serious') ? 'warn' : 'note';

function tillFindings(lines) {
  const scis = tillScis(lines);
  const pairs = basketInteractions(scis).map(x => ({ key:[x.a, x.b].sort().join('|'), kind:'interaction',
    a:x.a, b:x.b, severity:x.severity, tier:tierOf(x.severity), note:x.note }));
  const dupes = basketDuplicates(scis).map(x => ({ key:'dup|' + x.rule.id, kind:'duplicate',
    members:x.members, severity:x.rule.severity, tier:tierOf(x.rule.severity), label:x.rule.label }));
  return { findings:pairs.concat(dupes), questions:basketQuestions(scis) };
}

/* How much of the basket was checked. A line is checked in full, in part, or
   not at all, and a non-medicine is not counted as a medicine. */
function lineCoverage(l) {
  if (l.mapping === 'nondrug') return 'nondrug';
  if (l.mapping === 'unmapped' || !l.molecules.length) return 'none';
  const inside = l.molecules.filter(m => m.ref !== false && drugBySci(m.sci)).length;
  return inside === l.molecules.length ? 'full' : inside ? 'partial' : 'none';
}
function tillCoverage(lines) {
  const c = { medicines:0, full:0, partial:0, unchecked:0, nondrug:0 };
  lines.forEach(l => {
    const k = lineCoverage(l);
    if (k === 'nondrug') { c.nondrug++; return; }
    c.medicines++;
    c[k === 'none' ? 'unchecked' : k]++;
  });
  return c;
}
function coverageSentence(c) {
  const parts = [t('till.cov', { n:c.full, total:c.medicines })];
  if (c.partial) parts.push(t('till.covPartial', { n:c.partial }));
  if (c.unchecked) parts.push(t('till.covNone', { n:c.unchecked }));
  if (c.nondrug) parts.push(t('till.covNondrug', { n:c.nondrug }));
  return parts.join(' · ');
}

function tillAck(key) { S.till.ack[key] = true; render(); }

/* ---------- Totals, discount, tender ---------- */

/* Integers in, integers out: IQD has no subunit, and the total is the exact
   sum of what was sold minus any discount. Nothing here rounds. */
function tillTotals() {
  const T = S.till;
  const subtotal = T.lines.reduce((n, l) => n + l.qty * l.unit, 0);
  const discount = Math.min(T.discount || 0, subtotal);
  return { subtotal, discount, total:subtotal - discount };
}

function tillOpenDiscount() { if (canDiscount()) { S.till.discountOpen = !S.till.discountOpen; render(); } }
function tillApplyDiscount() {
  if (!canDiscount()) return;
  const T = S.till;
  const amount = Math.round(Number((document.getElementById('disc-amount') || {}).value));
  const reason = ((document.getElementById('disc-reason') || {}).value || '').trim();
  /* Kept, so a refusal does not throw away what was typed. */
  T.discDraft = { amount:(document.getElementById('disc-amount') || {}).value || '', reason };
  const { subtotal } = tillTotals();
  if (!isFinite(amount) || amount <= 0 || amount > subtotal || !reason) { T.note = { kind:'badDiscount' }; render(); return; }
  T.discount = amount; T.discountReason = reason; T.discountOpen = false; T.note = null; T.discDraft = null;
  tillLog('discount', { amount, reason });
  render();
}
function tillTender(k) { S.till.tender = k; S.till.note = null; render(); }
function tillGiven(v) {
  S.till.given = v;
  const el = document.getElementById('till-change');
  if (el) el.textContent = changeText(v, tillTotals().total);
}
function changeText(v, total) {
  const n = Math.round(Number(v));
  if (v === '' || !isFinite(n)) return '';
  return n >= total ? t('till.changeIs', { change:iqd(n - total) }) : t('till.shortBy', { short:iqd(total - n) });
}
function tillCashManual(on) { S.till.cashManual = !!on; if (!on) S.till.given = ''; S.till.note = null; render(); }
/* The exact total, confirmed in one tap. Recorded as confirmed rather than
   typed, so the drawer count (v0.0014) can tell the two apart. */
function confirmCash() {
  const T = S.till;
  if (T.tender !== 'cash' || !T.lines.length) return;
  T.given = String(tillTotals().total);
  T.cashConfirmed = true;
  completeSale();
}
function tillRef(v) { S.till.ref = v; }

/* ---------- Completing, and after ---------- */

function completeSale() {
  const T = S.till;
  const ph = tillPharmacy();
  if (tillBlock(ph) || !T.lines.length) return;
  const { subtotal, discount, total } = tillTotals();
  let given = null, change = null;
  if (T.tender === 'cash') {
    given = Math.round(Number(T.given));
    if (!isFinite(given) || given < total) { T.note = { kind:'shortCash', total }; T.cashManual = true; T.cashConfirmed = false; render(); return; }
    change = given - total;
  }
  const f = tillFindings(T.lines);
  const sale = {
    id:'S' + String(S.sales.length + 1).padStart(4, '0'), pharmacy:ph.id, at:new Date().toISOString(),
    by:S.email, lines:T.lines.map(l => ({ barcode:l.barcode, name:l.name, qty:l.qty, unit:l.unit,
      total:l.qty * l.unit, mapping:l.mapping, molecules:l.molecules, form:l.form,
      dose:l.dose, take:l.take.slice(), note:l.note, unknown:!!l.unknown })),
    subtotal, discount, discountReason:T.discountReason || null, total,
    tender:T.tender, given, change, ref:T.tender === 'cash' ? null : (T.ref || null),
    cashConfirmed:T.tender === 'cash' ? !!T.cashConfirmed : null,
    /* Every warning shown, and whether it was acknowledged. The sale went
       ahead either way — the till never refuses a pharmacist (P9) — and the
       record is what the curator's override report is built from. */
    findings:f.findings.map(x => ({ kind:x.kind, a:x.a, b:x.b, members:x.members, severity:x.severity,
      tier:x.tier, acknowledged:!!T.ack[x.key] })),
    coverage:tillCoverage(T.lines), refunded:null
  };
  S.sales.unshift(sale);
  stockSale(sale);
  tillLog('sale', { sale:sale.id, total });

/* What goes on it, in the receipt's own language — which is not necessarily the
   pharmacist's interface language. A list of lines first, so the content can
   be checked; then drawn. */
function receiptLines(sale, rl) {
  const ph = PHARMACIES[sale.pharmacy];
  const T = (k, v) => { const keep = lang; lang = rl; const s = t(k, v); lang = keep; return s; };
  const LL = o => (o && (o[rl] || o.en)) || '';
  const money = n => fmt(n) + ' ' + (rl === 'ar' ? 'د.ع' : 'IQD');
  const d = new Date(sale.at);
  const pad = n => String(n).padStart(2, '0');
  const when = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '  ' +
               pad(d.getHours()) + ':' + pad(d.getMinutes());
  const out = [];
  out.push({ kind:'title', text:LL(ph.name) });
  out.push({ kind:'small', text:T('rc.licence') + ' ' + ph.licence });
  out.push({ kind:'small', text:when + '  ·  ' + sale.id });
  out.push({ kind:'rule' });
  sale.lines.forEach(l => {
    out.push({ kind:'item', text:LL(l.name), amount:l.qty + ' × ' + fmt(l.unit) + ' = ' + fmt(l.total) });
    if (l.mapping !== 'nondrug') {
      const text = instructionText(l, rl);
      if (text) out.push({ kind:'instr', text });
    }
  });
  out.push({ kind:'rule' });
  if (sale.discount) out.push({ kind:'line', text:T('rc.discount'), amount:'− ' + money(sale.discount) });
  out.push({ kind:'total', text:T('rc.total'), amount:money(sale.total) });
  out.push({ kind:'line', text:T('rc.paid') + ' ' + T('tender.' + sale.tender),
             amount:sale.tender === 'cash' ? money(sale.given) : (sale.ref || '') });
  if (sale.tender === 'cash') out.push({ kind:'line', text:T('rc.change'), amount:money(sale.change) });
  out.push({ kind:'rule' });
  out.push({ kind:'small', text:T('rc.pharmacist') + ' ' + LL(accountName(sale.by)) });
  if (sale.refunded) out.push({ kind:'title', text:T('rc.refunded') });
  return out;
}
const accountName = mail => { const a = ACCOUNTS[mail]; if (!a) return { ar:mail, en:mail };
  const keep = lang; lang = 'ar'; const ar = t(a.nameKey); lang = 'en'; const en = t(a.nameKey); lang = keep; return { ar, en }; };

/* Drawn to a bitmap 384 dots wide — a 58 mm thermal printer at 203 dpi — so
   Arabic prints shaped and joined, which printer code pages do not manage.
   Printing itself arrives with the certified printers; this is exactly what
   will be sent to one. */
const RECEIPT_WIDTH = 384;
/* Type sizes in dots. v0.0012.1: an item's figures (12) sit below its name
   (15), and the total (19) is the largest thing on the paper. */
const RECEIPT_TYPE = { item:15, itemAmount:12, instr:13, small:13, line:13, total:19 };
const LOGO_IMG = {};
function renderReceipt(sale, rl) {
  const lines = receiptLines(sale, rl);
  const ph = PHARMACIES[sale.pharmacy];
  const logo = LOGO_IMG[ph.id];
  const rtl = rl === 'ar';
  const font = rtl ? "'Noto Kufi Arabic', 'IBM Plex Sans', sans-serif" : "'IBM Plex Sans', sans-serif";
  const H = { title:34, small:20, rule:14, item:24, instr:20, line:22, total:32 };
  const TYPE = RECEIPT_TYPE;
  const logoH = logo ? Math.min(90, Math.round(logo.height * Math.min(1, 200 / logo.width))) + 14 : 0;
  const height = 24 + logoH + lines.reduce((n, l) => n + H[l.kind], 0) + 20;
  const c = document.createElement('canvas');
  c.width = RECEIPT_WIDTH; c.height = height;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#000';
  g.direction = rtl ? 'rtl' : 'ltr';
  let y = 16;
  if (logo) {
    const w = Math.min(200, logo.width), h = Math.round(logo.height * (w / logo.width));
    g.filter = 'grayscale(1)';
    g.drawImage(logo, (c.width - w) / 2, y, w, Math.min(90, h));
    g.filter = 'none';
    y += logoH;
  }
  const start = rtl ? c.width - 14 : 14, end = rtl ? 14 : c.width - 14;
  lines.forEach(l => {
    const h = H[l.kind];
    if (l.kind === 'rule') {
      g.fillRect(14, y + h / 2, c.width - 28, 1);
    } else if (l.kind === 'title') {
      g.font = '600 20px ' + font; g.textAlign = 'center'; g.fillText(l.text, c.width / 2, y + 24);
    } else {
      const bold = l.kind === 'total' || l.kind === 'item';
      g.font = (bold ? '600 ' : '400 ') + TYPE[l.kind] + 'px ' + font;
      g.textAlign = rtl ? 'right' : 'left';
      g.fillText(l.kind === 'instr' ? '   ' + l.text : l.text, start, y + h - 7, l.amount ? 230 : c.width - 28);
      /* Figures read left to right in both languages; drawn RTL, "2 × 3,500 =
         7,000" comes out backwards. An item's figures are smaller than its
         name (v0.0012.1); the total's are not. */
      if (l.amount) {
        g.font = (bold ? '600 ' : '400 ') + (l.kind === 'item' ? TYPE.itemAmount : TYPE[l.kind]) + 'px ' + font;
        g.direction = 'ltr'; g.textAlign = rtl ? 'left' : 'right'; g.fillText(l.amount, end, y + h - 7);
        g.direction = rtl ? 'rtl' : 'ltr';
      }
    }
    y += h;
  });
  return { url:c.toDataURL('image/png'), width:c.width, height:c.height, lines, hasLogo:!!logo };
}

/* The logo, uploaded from the owner's view, per pharmacy. Kept small — it is
   printed in black on a 58 mm roll — and remembered on this device. */
function setLogo(phId, dataUrl) {
  if (!canSetPrices() || !PHARMACIES[phId]) return;
  const img = new Image();
  img.onload = () => { LOGO_IMG[phId] = img; PHARMACIES[phId].logo = true; render(); };
  img.src = dataUrl;

  tillLog('logo', { pharmacy:phId });
}
function uploadLogo(phId, input) {
  const f = input.files && input.files[0];
  if (!f) return;

}
function restoreLogos() {
  Object.keys(PHARMACIES).forEach(id => {

/* ---------- Camera scanning (v0.0012.1) ----------

   The scan button is always there. v0.0012 hid it wherever the browser had no
   built-in barcode detector, which meant a phone's file viewer, every iPhone,
   and most browsers — so the feature looked as if it did not exist.

   Now: the built-in detector when there is one, and otherwise the small EAN-13
   reader below, written into this file rather than pulled from a library, so
   the app stays one light file. Where the camera cannot be opened at all, the
   button says why and what to do instead of doing nothing. */

/* EAN-13, read off a single line of pixels. Widths of the four elements of
   each digit, in modules: L (odd parity) and R share a table; G is R reversed. */
const EAN_L = ['3211','2221','2122','1411','1132','1231','1114','1312','1213','3112'].map(s => [...s].map(Number));
const EAN_G = EAN_L.map(p => p.slice().reverse());
const EAN_FIRST = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

function eanBest(widths, table) {
  const sum = widths.reduce((a, b) => a + b, 0);
  const w = widths.map(x => x * 7 / sum);
  let best = -1, bestErr = Infinity;
  table.forEach((p, d) => {
    const err = p.reduce((e, m, k) => e + Math.abs(m - w[k]), 0);
    if (err < bestErr) { bestErr = err; best = d; }
  });
  return { digit:best, err:bestErr };
}

/* Runs of dark and light along a line of luminance values. */
function eanRuns(lum) {
  let lo = 255, hi = 0;
  for (const v of lum) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (hi - lo < 40) return null;              // no contrast: nothing to read
  const th = (lo + hi) / 2;
  const runs = [];
  let dark = lum[0] < th, len = 0;
  for (const v of lum) {
    const d = v < th;
    if (d === dark) len++;
    else { runs.push({ dark, len }); dark = d; len = 1; }
  }
  runs.push({ dark, len });
  return runs;
}

function eanFromRuns(runs) {
  for (let i = 0; i + 59 <= runs.length; i++) {
    if (!runs[i].dark) continue;
    const r = runs.slice(i, i + 59).map(x => x.len);
    const mod = r.reduce((a, b) => a + b, 0) / 95;
    const near1 = k => Math.abs(r[k] / mod - 1) < 0.7;
    if (![0, 1, 2, 27, 28, 29, 30, 31, 56, 57, 58].every(near1)) continue;
    /* A quiet zone before the start guard: at least a few modules of light. */
    if (i > 0 && runs[i - 1].len < mod * 3) continue;
    let parity = '', left = [], ok = true;
    for (let d = 0; d < 6 && ok; d++) {
      const w = r.slice(3 + d * 4, 7 + d * 4);
      const l = eanBest(w, EAN_L), g = eanBest(w, EAN_G);
      const pick = l.err <= g.err ? l : g;
      if (pick.err > 2.2) ok = false;
      parity += l.err <= g.err ? 'L' : 'G';
      left.push(pick.digit);
    }
    const right = [];
    for (let d = 0; d < 6 && ok; d++) {
      const x = eanBest(r.slice(32 + d * 4, 36 + d * 4), EAN_L);
      if (x.err > 2.2) ok = false;
      right.push(x.digit);
    }
    const first = EAN_FIRST.indexOf(parity);
    if (!ok || first < 0) continue;
    const code = String(first) + left.join('') + right.join('');
    if (ean13Valid(code)) return code;          // the check digit is the last word
  }
  return null;
}

/* A frame: several horizontal lines through the middle, then several vertical
   ones for a box held on its side, each read both ways round. Two lines
   agreeing is a read; one is not enough. */
function decodeEan13(img) {
  const { width:W, height:H, data } = img;
  const lumAt = (x, y) => { const i = (y * W + x) * 4; return data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114; };
  const seen = {};
  const tryLine = lum => {
    const runs = eanRuns(lum);
    if (!runs) return null;
    let code = eanFromRuns(runs);
    if (!code) code = eanFromRuns(runs.slice().reverse());
    if (code) seen[code] = (seen[code] || 0) + 1;
    return code && seen[code] >= 2 ? code : null;
  };
  for (let k = -6; k <= 6; k++) {
    const y = Math.round(H / 2 + k * H / 28);
    const lum = new Array(W); for (let x = 0; x < W; x++) lum[x] = lumAt(x, y);
    const c = tryLine(lum); if (c) return c;
  }
  for (let k = -6; k <= 6; k++) {
    const x = Math.round(W / 2 + k * W / 28);
    const lum = new Array(H); for (let y = 0; y < H; y++) lum[y] = lumAt(x, y);
    const c = tryLine(lum); if (c) return c;
  }
  return null;
}

/* One beep and one buzz on a read, so the pharmacist can look at the patient
   rather than the screen. Either may be unavailable; neither is required. */
function scanFeedback() {
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) { /* no vibration */ }
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    const a = scanFeedback.ctx || (scanFeedback.ctx = new A());
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 1800; g.gain.value = 0.08;
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.09);
  } catch (e) { /* no sound */ }
}

const cameraAvailable = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

function cameraErrorKind(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') return 'denied';
  if (n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError') return 'nocamera';
  return 'failed';
}

async function cameraScan() {
  S.modal = { kind:'camera', status:'starting', last:null };
  if (!cameraAvailable()) { S.modal.error = 'unsupported'; renderModal(); return; }
  renderModal();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
  } catch (e) {
    if (S.modal && S.modal.kind === 'camera') { S.modal.error = cameraErrorKind(e); renderModal(); }
    return;
  }
  const m = S.modal;
  const stop = () => stream.getTracks().forEach(x => x.stop());
  if (!m || m.kind !== 'camera') { stop(); return; }
  const v = document.getElementById('cam');
  try { v.srcObject = stream; await v.play(); } catch (e) { stop(); m.error = 'failed'; renderModal(); return; }
  m.status = 'looking'; cameraStatus();

  let det = null;
  if (typeof window.BarcodeDetector === 'function') {
    try { det = new window.BarcodeDetector({ formats:['ean_13'] }); } catch (e) { det = null; }
  }
  const work = document.createElement('canvas');
  let lastCode = null, lastAt = 0;
  const tick = async () => {
    if (S.modal !== m) { stop(); return; }
    let code = null;
    if (v.videoWidth) {
      if (det) {
        const found = await det.detect(v).catch(() => []);
        code = found.length ? found[0].rawValue : null;
      } else {
        const scale = Math.min(1, 1280 / v.videoWidth);
        work.width = Math.round(v.videoWidth * scale); work.height = Math.round(v.videoHeight * scale);
        const g = work.getContext('2d', { willReadFrequently:true });
        g.drawImage(v, 0, 0, work.width, work.height);
        code = decodeEan13(g.getImageData(0, 0, work.width, work.height));
      }
    }
    /* The camera keeps seeing the box it just read. The same code counts
       again only once it has been out of view for a second — a second box,
       not the first one still being held up. */
    const now = Date.now();
    if (code && code === lastCode && now - lastAt < 1000) lastAt = now;
    else if (code) {
      lastCode = code; lastAt = now;
      scanFeedback();
      const deliver = S.scanTarget === 'count' ? countScan : tillScan;
      if (S.scanKeep) {
        deliver(code);
        const p = productByCode(code);
        m.last = p ? L(p.name) : code; m.status = 'added'; cameraStatus();
      } else {
        stop(); S.modal = null; renderModal(); deliver(code); return;
      }
    }
    setTimeout(tick, det ? 150 : 120);
  };
  tick();
}

function setScanKeep(on) { S.scanKeep = !!on; }
function cameraStatus() {
  const el = document.getElementById('cam-status');
  if (!el || !S.modal) return;
  el.textContent = S.modal.status === 'added' ? t('scan.added', { name:S.modal.last }) :
                   S.modal.status === 'looking' ? t('scan.looking') : t('scan.starting');
