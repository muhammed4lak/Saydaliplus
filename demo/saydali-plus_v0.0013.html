/* ==========================================================================
   STOCK (v0.0013, W17) — a ledger of movements

   Stock is never a number somebody types. It is the sum of MOVEMENTS — a
   count, an import, a receipt, a sale, a refund, a write-off, an undo — each
   one appended and never edited, and every level on every screen is worked out
   from them. Two phones selling the last box offline both append "−1"; they
   never both write "9" (v0.0014 proves it). addMovement() is the only writer.

   What was decided, and where it lives here:
   - Held BY BATCH, each with its expiry, and linked to the SHELF it was
     counted on. Available = unexpired batches only; an expired batch is
     quarantined — counted, never available — and leaves only by a write-off
     with a reason (W17).
   - The till sells FIRST-EXPIRING FIRST. A sale is never refused over a stock
     figure (S1): past what is recorded it goes below zero, and the product
     joins "Count this".
   - Every batch carries what it cost (owner-only); a distributor's bonus
     units arrive at zero cost (S3).
   - A whole count or a whole import can be undone until the end of the next
     day, and never once a later count or import has touched the same
     products (Q3). An undo is itself movements: nothing is deleted.
   ========================================================================== */

/* The clock, shiftable so the check can walk past the undo window. */
const nowMs = () => Date.now() + (S.clockShift || 0);
const nowIso = () => new Date(nowMs()).toISOString();

/* Expiry is a month, 'YYYY-MM': medicines are dated to the month and good to
   its last day. */
const ymNum = ym => Number(ym.slice(0, 4)) * 100 + Number(ym.slice(5, 7));
const monthNow = () => { const d = new Date(nowMs()); return d.getFullYear() * 100 + d.getMonth() + 1; };
const isExpired = ym => !!ym && ymNum(ym) < monthNow();
const expiryEnd = ym => new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0, 23, 59, 59).getTime();
const NEAR_EXPIRY_DAYS = 90;
const isNearExpiry = ym => !!ym && !isExpired(ym) && expiryEnd(ym) - nowMs() <= NEAR_EXPIRY_DAYS * 864e5;
const fmtExpiry = ym => ym ? ym.slice(5, 7) + '/' + ym.slice(0, 4) : '—';

/* "03/27", "3/2027", "2027-03", "2027-03-31", "31/03/2027", Arabic-Indic
   digits, an Excel date serial — to 'YYYY-MM', or null. */
function parseExpiry(v) {
  if (v == null) return null;
  let s = String(v).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  if (!s) return null;
  const mk = (y, m) => { y = Number(y); m = Number(m); if (y < 100) y += 2000;
    return (m >= 1 && m <= 12 && y >= 2000 && y <= 2099) ? y + '-' + String(m).padStart(2, '0') : null; };
  let m;
  if (/^\d{5}(\.\d+)?$/.test(s)) {                          // an Excel serial date
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 864e5);
    return mk(d.getUTCFullYear(), d.getUTCMonth() + 1);
  }
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})(?:[-/.]\d{1,2})?(?:[T ].*)?$/))) return mk(m[1], m[2]);
  if ((m = s.match(/^\d{1,2}[-/.](\d{1,2})[-/.](\d{2,4})$/))) return mk(m[2], m[1]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{2,4})$/))) return mk(m[2], m[1]);
  return null;
}

let MOVE_SEQ = 0, BATCH_SEQ = 0;
/* THE ONLY WRITER. Nothing anywhere assigns a stock level. */
function addMovement(m) {
  const mv = Object.assign({ id:'M' + String(++MOVE_SEQ).padStart(5, '0'), at:nowIso(), by:S.email }, m);
  S.movements.push(mv);
  return mv;
}
function newBatch(ph, code, props) {
  const b = Object.assign({ id:'B' + String(++BATCH_SEQ).padStart(4, '0'), pharmacy:ph, code,
    kind:'stock', expiry:null, shelf:null }, props || {});
  S.batches.push(b);
  return b;
}
/* One batch per product for what was sold past the record (negative until a
   count settles it), and one for returns set aside. */
function specialBatch(ph, code, kind) {
  return S.batches.find(b => b.pharmacy === ph && b.code === code && b.kind === kind) || newBatch(ph, code, { kind });
}
const batchQty = id => S.movements.reduce((n, m) => m.batch === id ? n + m.qty : n, 0);

/* The level, always derived. */
function stockOf(ph, code) {
  const batches = S.batches.filter(b => b.pharmacy === ph && b.code === code)
    .map(b => Object.assign({}, b, { qty:batchQty(b.id), expired:b.kind === 'stock' && isExpired(b.expiry) }));
  const sum = f => batches.filter(f).reduce((n, b) => n + b.qty, 0);
  const stock = sum(b => b.kind === 'stock' && !b.expired);
  const unbatched = sum(b => b.kind === 'unbatched');
  return {
    batches, unbatched,
    available: stock + unbatched,
    expired: sum(b => b.expired),
    quarantine: sum(b => b.kind === 'quarantine'),
    onHand: sum(() => true),
    recorded: batches.some(b => b.kind === 'stock')
  };
}
const stockCodes = ph => [...new Set(S.batches.filter(b => b.pharmacy === ph).map(b => b.code))];
const productName = code => { const p = productByCode(code); return p ? L(p.name) : ((S.unknownNames || {})[code] || code); };

/* Average cost of a batch: what came in, over how many units came in. Bonus
   units come in at zero, which is exactly how they lower it. */
function batchCost(id) {
  const ins = S.movements.filter(m => m.batch === id && m.qty > 0 && m.unitCost != null);
  const units = ins.reduce((n, m) => n + m.qty, 0);
  return units ? ins.reduce((n, m) => n + m.qty * m.unitCost, 0) / units : null;
}
function stockValue(ph) {
  return S.batches.filter(b => b.pharmacy === ph && b.kind === 'stock' && !isExpired(b.expiry))
    .reduce((n, b) => { const q = batchQty(b.id), c = batchCost(b.id); return q > 0 && c != null ? n + q * c : n; }, 0);
}

/* ---------- Selling, and refunds ---------- */

/* First-expiring first, from unexpired stock only. Past what is recorded the
   sale still goes through (S1) and the shortfall lands on the product's
   unbatched line, below zero. */
function stockSale(sale) {
  sale.lines.forEach(l => {
    let left = l.qty;
    const st = stockOf(sale.pharmacy, l.barcode);
    st.batches.filter(b => b.kind === 'stock' && !b.expired && b.qty > 0)
      .sort((a, b) => ymNum(a.expiry) - ymNum(b.expiry))
      .forEach(b => {
        if (!left) return;
        const take = Math.min(left, b.qty);
        addMovement({ pharmacy:sale.pharmacy, code:l.barcode, batch:b.id, qty:-take, kind:'sale', ref:sale.id });
        left -= take;
      });
    if (left) addMovement({ pharmacy:sale.pharmacy, code:l.barcode, batch:specialBatch(sale.pharmacy, l.barcode, 'unbatched').id,
                            qty:-left, kind:'sale', ref:sale.id });
  });
}
/* S5: back to stock (the default) returns each unit to the batch it left;
   quarantine sets it aside. */
function stockRefund(sale, dest, reason) {
  S.movements.filter(m => m.ref === sale.id && m.kind === 'sale').forEach(m => {
    const batch = dest === 'quarantine' ? specialBatch(sale.pharmacy, m.code, 'quarantine').id : m.batch;
    addMovement({ pharmacy:sale.pharmacy, code:m.code, batch, qty:-m.qty, kind:'refund', ref:sale.id, reason, dest });
  });
}

/* ---------- Counts and imports: committing, and undoing ---------- */

/* A sale made before a product was counted is already off the shelf the count
   saw. So a count or an import settles the product's below-zero line. */
function settleUnbatched(ph, code, ref) {
  const u = S.batches.find(b => b.pharmacy === ph && b.code === code && b.kind === 'unbatched');
  const q = u ? batchQty(u.id) : 0;
  if (q < 0) addMovement({ pharmacy:ph, code, batch:u.id, qty:-q, kind:'settle', ref, reason:'soldBeforeCounted' });
}

/* A count is the truth about ONE shelf: per product, what is on it now, by
   expiry. The difference from what was recorded on that shelf is what moves. */
function commitCount(sess) {
  const ph = sess.pharmacy, by = {};
  sess.items.forEach(it => { (by[it.code] = by[it.code] || {})[it.expiry] = (by[it.code][it.expiry] || 0) + it.qty; });
  Object.keys(by).forEach(code => {
    const shelfBatches = S.batches.filter(b => b.pharmacy === ph && b.code === code && b.kind === 'stock' && b.shelf === sess.shelf);
    Object.entries(by[code]).forEach(([expiry, qty]) => {
      const b = shelfBatches.find(x => x.expiry === expiry) || newBatch(ph, code, { expiry, shelf:sess.shelf });
      const delta = qty - batchQty(b.id);
      if (delta) addMovement({ pharmacy:ph, code, batch:b.id, qty:delta, kind:'count', ref:sess.id });
    });
    shelfBatches.filter(b => !(b.expiry in by[code])).forEach(b => {
      const q = batchQty(b.id);
      if (q) addMovement({ pharmacy:ph, code, batch:b.id, qty:-q, kind:'count', ref:sess.id });
    });
    settleUnbatched(ph, code, sess.id);
    if (!(S.shelfOf[ph] = S.shelfOf[ph] || {})[code]) S.shelfOf[ph][code] = [];
    if (!S.shelfOf[ph][code].includes(sess.shelf)) S.shelfOf[ph][code].push(sess.shelf);
  });
  /* Recorded on this shelf and not found on it now: it has left the shelf.
     The count screen lists these before confirming, so nothing leaves by
     surprise. */
  const gone = notYetCounted(sess);
  gone.forEach(code => S.batches.filter(b => b.pharmacy === ph && b.code === code && b.kind === 'stock' && b.shelf === sess.shelf)
    .forEach(b => { const q = batchQty(b.id); if (q) addMovement({ pharmacy:ph, code, batch:b.id, qty:-q, kind:'count', ref:sess.id }); }));
  sess.codes = Object.keys(by).concat(gone);
  sess.state = 'committed'; sess.committedAt = nowIso(); sess.committedBy = S.email;
}

/* What the record says is on this shelf that this count has not reached yet —
   a checklist while counting, and what leaves the shelf if confirmed as is. */
function notYetCounted(sess) {
  const seen = new Set(sess.items.map(it => it.code));
  return [...new Set(S.batches.filter(b => b.pharmacy === sess.pharmacy && b.kind === 'stock' && b.shelf === sess.shelf && batchQty(b.id) > 0)
    .map(b => b.code))].filter(c => !seen.has(c));
}

/* Until the end of the day after, and never once a later count or import has
   touched the same products — after that a correction is an adjustment with
   a reason, not an undo. */
function undoState(rec) {
  if (rec.state !== 'committed') return { ok:false, why:rec.state === 'undone' ? 'undone' : 'notCommitted' };
  const d = new Date(rec.committedAt);
  const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 23, 59, 59, 999).getTime();
  if (nowMs() > end) return { ok:false, why:'window' };
  const later = stockOps().find(o => o !== rec && o.state === 'committed' && o.pharmacy === rec.pharmacy &&
    o.committedAt > rec.committedAt && o.codes.some(c => rec.codes.includes(c)));
  if (later) return { ok:false, why:'later', by:later.id };
  return { ok:true, until:end };
}
function undoOp(id) {
  const rec = stockOps().find(o => o.id === id);
  if (!rec || !canManageStock() || !undoState(rec).ok) return;
  S.movements.filter(m => m.ref === rec.id && m.kind !== 'undo').forEach(m =>
    addMovement({ pharmacy:m.pharmacy, code:m.code, batch:m.batch, qty:-m.qty, kind:'undo', ref:rec.id }));
  rec.state = 'undone'; rec.undoneAt = nowIso(); rec.undoneBy = S.email;
  tillLog(rec.id[0] === 'C' ? 'countUndone' : 'importUndone', { op:rec.id, pharmacy:rec.pharmacy });
  toast(t('st.undone'));
  render();
}

/* ---------- The controlled register — a view, not a log ---------- */

const isControlled = code => { const p = productByCode(code);
  return !!p && p.molecules.some(m => m.ref !== false && (drugBySci(m.sci) || {}).controlled); };
/* Every movement of a controlled product, in order, with its running balance.
   It is the ledger filtered, so it cannot disagree with the ledger. */
function controlledRegister(ph) {

    .map(m => { bal[m.code] = (bal[m.code] || 0) + m.qty; return Object.assign({}, m, { balance:bal[m.code] }); });
}

/* ---------- What needs the owner ---------- */

function stockPrompts(ph) {

  const countThis = codes.map(c => ({ code:c, short:-stockOf(ph, c).unbatched })).filter(x => x.short > 0)
    .sort((a, b) => b.short - a.short);

  const quarantined = codes.map(c => ({ code:c, q:stockOf(ph, c).quarantine })).filter(x => x.q > 0);

}
/* Products counted, by distinct product — the honest measure of progress,

function countedSummary(ph) {

/* ---------- Reading a spreadsheet: CSV and Excel (.xlsx) ----------

   A placeholder reader, written into the file rather than pulled from a
   library. CSV in any of the usual shapes (comma, semicolon or tab; quoted;
   with or without a byte-order mark). An .xlsx is a zip of XML files: it is
   unzipped with the browser's own decompressor and its first sheet read. The
   older binary .xls is not read — the owner is told to save it as .xlsx or
   CSV. Karmasoft-specific recognition follows once a real export is seen. */

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const count = ch => (first.match(new RegExp('\\' + ch, 'g')) || []).length;
  const sep = [',', ';', '\t'].sort((a, b) => count(b) - count(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

async function unzipEntries(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('notZip');
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  const dec = new TextDecoder('utf-8');
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('badZip');
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extra = dv.getUint16(p + 30, true), comment = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    const lName = dv.getUint16(local + 26, true), lExtra = dv.getUint16(local + 28, true);
    const data = u8.subarray(local + 30 + lName + lExtra, local + 30 + lName + lExtra + size);
    out[name] = { method, data };
    p += 46 + nameLen + extra + comment;
  }
  const read = async name => {
    const e = out[name];
    if (!e) return null;
    if (e.method === 0) return dec.decode(e.data);
    if (e.method !== 8 || typeof DecompressionStream !== 'function') throw new Error('noInflate');
    const s = new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return dec.decode(await new Response(s).arrayBuffer());
  };
  return { names:Object.keys(out), read };
}

async function parseXlsx(buf) {
  const z = await unzipEntries(buf);
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const shared = [];
  const ss = await z.read('xl/sharedStrings.xml');
  if (ss) xml(ss).querySelectorAll('si').forEach(si => shared.push([...si.querySelectorAll('t')].map(t => t.textContent).join('')));
  /* The first sheet in the workbook's order, found through its relationship. */
  let sheetPath = 'xl/worksheets/sheet1.xml';
  const wb = await z.read('xl/workbook.xml'), rels = await z.read('xl/_rels/workbook.xml.rels');
  if (wb && rels) {
    const first = xml(wb).querySelector('sheet');
    const rid = first && (first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'));
    const rel = rid && [...xml(rels).querySelectorAll('Relationship')].find(r => r.getAttribute('Id') === rid);
    if (rel) { const tgt = rel.getAttribute('Target'); sheetPath = tgt.startsWith('/') ? tgt.slice(1) : 'xl/' + tgt.replace(/^\.\//, ''); }
  }
  const sheet = await z.read(sheetPath);
  if (!sheet) throw new Error('noSheet');
  const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const rows = [];
  xml(sheet).querySelectorAll('sheetData > row').forEach(r => {
    const row = [];
    r.querySelectorAll('c').forEach(c => {
      const ref = c.getAttribute('r'), type = c.getAttribute('t');
      const v = c.querySelector('v'), is = c.querySelector('is');
      let val = '';
      if (type === 's' && v) val = shared[Number(v.textContent)] || '';
      else if (type === 'inlineStr' && is) val = [...is.querySelectorAll('t')].map(t => t.textContent).join('');
      else if (v) val = v.textContent;
      row[ref ? colIdx(ref) : row.length] = val;
    });
    for (let i = 0; i < row.length; i++) if (row[i] == null) row[i] = '';
    rows.push(row);
  });
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

/* Which column is which, by its heading first (Arabic or English), and by
   what is in it when the heading says nothing. */
const COLUMN_WORDS = {
  barcode:['barcode', 'bar code', 'ean', 'gtin', 'باركود', 'الباركود', 'رمز', 'كود'],
  name:   ['name', 'item', 'product', 'description', 'drug', 'اسم', 'الاسم', 'المادة', 'الصنف', 'المنتج', 'الدواء'],
  qty:    ['qty', 'quantity', 'stock', 'balance', 'count', 'units', 'الكمية', 'كمية', 'العدد', 'الرصيد', 'رصيد'],
  expiry: ['expiry', 'expiration', 'exp', 'expire', 'انتهاء', 'الانتهاء', 'الصلاحية', 'صلاحية', 'تاريخ الانتهاء'],
  cost:   ['cost', 'purchase', 'buy', 'price', 'الكلفة', 'التكلفة', 'كلفة', 'سعر الشراء', 'الشراء', 'السعر', 'سعر']
};
const IMPORT_FIELDS = ['barcode', 'name', 'qty', 'expiry', 'cost'];
function detectColumns(header, rows) {
  const norm = s => String(s || '').toLowerCase().trim();
  const cols = {};
  const taken = new Set();
  /* Headings: expiry before cost, because "تاريخ الانتهاء" and "سعر" never
     collide but "price" and "purchase date" could. */
  ['barcode', 'expiry', 'qty', 'cost', 'name'].forEach(f => {
    const i = header.findIndex((h, k) => !taken.has(k) && COLUMN_WORDS[f].some(w => norm(h) === w || norm(h).includes(w)));
    if (i >= 0) { cols[f] = i; taken.add(i); }
  });
  /* Content, for whatever the headings did not settle. */
  const sample = rows.slice(0, 30);
  const share = (k, test) => { const xs = sample.map(r => String(r[k] == null ? '' : r[k]).trim()).filter(Boolean);
    return xs.length ? xs.filter(test).length / xs.length : 0; };
  const width = Math.max(header.length, ...sample.map(r => r.length));
  const free = () => [...Array(width).keys()].filter(k => !taken.has(k));
  const pick = (f, test, min) => {
    if (cols[f] != null) return;
    const best = free().map(k => ({ k, s:share(k, test) })).sort((a, b) => b.s - a.s)[0];
    if (best && best.s >= min) { cols[f] = best.k; taken.add(best.k); }
  };
  pick('barcode', x => /^\d{8,14}$/.test(x), 0.6);
  pick('expiry', x => !!parseExpiry(x) && !/^\d{1,4}$/.test(x), 0.6);
  pick('qty', x => /^\d{1,4}$/.test(x), 0.6);
  pick('cost', x => /^\d+(\.\d+)?$/.test(x) && Number(x) >= 50, 0.6);
  pick('name', x => /[A-Za-z؀-ۿ]{3,}/.test(x), 0.5);
  return cols;
}

/* ---------- The import: read, review, confirm — or save and come back ----------

   Nothing from a file is in stock until the owner has seen it and confirmed.
   Every row lands in one of five piles: matched (its barcode is known),
   probably matched (no barcode match, but its name is close to one product —
   the owner says yes or no), not found, duplicates (merged into the first
   row with the same product and expiry), and errors (no quantity, or no
   expiry — an expiry is required, as it is at the count). */

/* Names compared as words: Arabic letter forms folded, strengths kept. */
function nameTokens(s) {
  return String(s || '').toLowerCase()
    .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/(\d)\s*(mg|ملغ|mcg|g|غ|ml|مل)\b/g, '$1')
    .split(/[^a-z0-9؀-ۿ.]+/).filter(w => w && !['mg', 'ملغ', 'tab', 'tabs', 'tablets', 'caps', 'capsules', 'قرص', 'اقراص', 'كبسول'].includes(w));
}
function matchByName(name) {
  const a = nameTokens(name);
  if (!a.length) return null;
  const scored = PRODUCTS.map(p => {
    const best = [p.name.en, p.name.ar].map(n => {
      const b = nameTokens(n); const inter = a.filter(w => b.includes(w)).length;
      /* A strength that disagrees is a different product, whatever the rest says. */
      const numsA = a.filter(w => /^\d/.test(w)), numsB = b.filter(w => /^\d/.test(w));
      if (numsA.length && numsB.length && !numsA.some(x => numsB.includes(x))) return 0;
      return inter / new Set(a.concat(b)).size;
    }).sort((x, y) => y - x)[0];
    return { p, s:best };
  }).sort((x, y) => y.s - x.s);
  if (!scored[0] || scored[0].s < 0.34) return null;
  if (scored[1] && scored[1].s === scored[0].s) return null;      // a tie is not a match
  return scored[0].p;
}

function isHeaderRow(row) {
  return row.some(c => Object.values(COLUMN_WORDS).some(ws => ws.some(w => String(c || '').toLowerCase().includes(w)))) ||
    row.filter(c => /^[\d.\s/-]*$/.test(String(c || ''))).length < row.length / 2;
}

async function readImportFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const ph = currentPharmacy();
  if (!ph || !canManageStock()) return;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  let rows;
  try {
    if (ext === 'xls') throw new Error('xls');
    if (ext === 'xlsx') rows = await parseXlsx(await f.arrayBuffer());
    else if (ext === 'csv' || ext === 'txt') rows = parseCsv(await f.text());
    else throw new Error('type');
  } catch (e) {
    S.importNote = { kind:e.message === 'xls' ? 'xls' : e.message === 'type' ? 'type' : 'unreadable', file:f.name };
    render(); return;
  }
  if (!rows.length) { S.importNote = { kind:'empty', file:f.name }; render(); return; }
  const hasHeader = isHeaderRow(rows[0]);
  const header = hasHeader ? rows[0].map(String) : rows[0].map((_, i) => t('im.column', { n:i + 1 }));
  const body = hasHeader ? rows.slice(1) : rows;
  const imp = {
    id:nextOpId('I', S.imports), pharmacy:ph.id, file:f.name, state:'review',
    header, rows:body, cols:detectColumns(header, body), decide:{}, startedAt:nowIso(), startedBy:S.email
  };
  S.imports.push(imp);
  S.importNote = null;
  tillLog('importStarted', { op:imp.id, file:f.name, rows:body.length });
  S.openImport = imp.id; S.screen = 'import';
  saveDrafts(); render(); scrollTop();
}

/* Every row, classified. Recomputed from the raw rows each time, so a column
   the owner re-points changes the piles at once. */
function classifyImport(imp) {
  const c = imp.cols, cell = (r, f) => c[f] == null ? '' : String(r[c[f]] == null ? '' : r[c[f]]).trim();
  const seen = {};
  return imp.rows.map((r, i) => {
    const raw = { barcode:cell(r, 'barcode').replace(/\s/g, ''), name:cell(r, 'name'), qty:cell(r, 'qty'),
                  expiry:cell(r, 'expiry'), cost:cell(r, 'cost') };
    const qty = Math.round(Number(raw.qty.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))));
    const expiry = parseExpiry(raw.expiry);
    const cost = raw.cost === '' ? null : Number(raw.cost.replace(/,/g, ''));
    const row = { i, raw, qty, expiry, cost:isFinite(cost) ? cost : null };
    if (!raw.qty || !isFinite(qty) || qty <= 0) return Object.assign(row, { pile:'error', why:'qty' });
    if (!expiry) return Object.assign(row, { pile:'error', why:'expiry' });
    let p = raw.barcode && productByCode(raw.barcode);
    if (p) row.code = p.barcode, row.pile = 'matched';
    else {
      const guess = raw.name && matchByName(raw.name);
      if (guess) {
        const d = imp.decide[i];
        row.guess = guess.barcode;
        if (d === 'yes') row.code = guess.barcode, row.pile = 'matched', row.confirmed = true;
        else if (d === 'no') row.pile = 'notFound';
        else row.pile = 'probable';
      } else row.pile = 'notFound';
      /* Not in the catalogue but with a real barcode: it can still come in by
         its name, and goes for mapping — the owner decides. */
      if (row.pile === 'notFound' && ean13Valid(raw.barcode)) row.code = raw.barcode, row.unknown = true;
    }
    if (row.code) {
      const k = row.code + '|' + expiry;
      if (seen[k] != null) return Object.assign(row, { pile:'duplicate', into:seen[k] });
      seen[k] = i;
      row.expired = isExpired(expiry);
      row.already = stockOf(imp.pharmacy, row.code).recorded;
    }
    return row;
  });
}
const importIncluded = (imp, row) =>
  row.pile === 'matched' ? imp.decide['x' + row.i] !== 'exclude' :
  row.pile === 'notFound' && row.unknown ? imp.decide['x' + row.i] === 'include' : false;

function importDecide(id, key, v) {
  const imp = S.imports.find(x => x.id === id);
  if (!imp || imp.state === 'committed' || imp.state === 'undone') return;
  imp.decide[key] = v; saveDrafts(); render();
}
function importColumn(id, field, v) {
  const imp = S.imports.find(x => x.id === id);
  if (!imp) return;
  if (v === '') delete imp.cols[field]; else imp.cols[field] = Number(v);
  saveDrafts(); render();
}

function commitImport(id) {
  const imp = S.imports.find(x => x.id === id);
  if (!imp || !canManageStock() || (imp.state !== 'review' && imp.state !== 'saved')) return;
  const rows = classifyImport(imp);
  const take = rows.filter(r => importIncluded(imp, r));
  if (!take.length) { S.importNote = { kind:'nothing' }; render(); return; }
  if (rows.some(r => r.pile === 'probable')) { S.importNote = { kind:'probableLeft' }; render(); return; }
  const qtyFor = r => r.qty + rows.filter(d => d.pile === 'duplicate' && d.into === r.i).reduce((n, d) => n + d.qty, 0);
  const codes = new Set();
  take.forEach(r => {
    const b = newBatch(imp.pharmacy, r.code, { expiry:r.expiry, shelf:null });
    addMovement({ pharmacy:imp.pharmacy, code:r.code, batch:b.id, qty:qtyFor(r), kind:'import', ref:imp.id, unitCost:r.cost });
    if (r.unknown) {
      (S.unknownNames = S.unknownNames || {})[r.code] = r.raw.name || r.code;
      if (!S.mappingRequests.some(m => m.barcode === r.code)) S.mappingRequests.push({ barcode:r.code, times:1, first:TODAY_ISO });
    }
    codes.add(r.code);

/* Saved counts and imports survive closing the app — on this device in the
   prototype, on the owner's account in production. */
function saveDrafts() {
  try {
    const keep = x => x.state === 'saved' || x.state === 'open' || x.state === 'review';
    localStorage.setItem('saydali.drafts.' + S.email, JSON.stringify({
      counts:S.countSessions.filter(keep), imports:S.imports.filter(keep) }));
  } catch (e) { /* storage full or blocked: the session still holds them */ }
}
function restoreDrafts() {
  try {
    const d = JSON.parse(localStorage.getItem('saydali.drafts.' + S.email) || 'null');
    if (!d) return;
    (d.counts || []).forEach(c => { if (!S.countSessions.some(x => x.id === c.id)) { c.state = 'saved'; S.countSessions.push(c); } });
    (d.imports || []).forEach(c => { if (!S.imports.some(x => x.id === c.id)) { c.state = 'saved'; S.imports.push(c); } });
  } catch (e) { /* nothing remembered */ }
}

/* A new id past every id already used — including ones restored from a
   saved draft. */
const nextOpId = (p, list) => p + String(list.reduce((n, x) => Math.max(n, Number(x.id.slice(1)) || 0), 0) + 1).padStart(3, '0');

/* ---------- Counting, shelf by shelf ----------

   The app cannot know where anything sits, so a count starts by naming the
   shelf — typed once, then offered from the pharmacy's own list. Every box
   counted is linked to that shelf, and the product remembers where it lives.
   Scanning with keep-scanning on adds a box per scan; a quantity can be typed
   instead; expiry is a month and year, with the last box's one tap away. */

function startCount(shelfArg) {
  const ph = currentPharmacy();
  if (!ph || !canManageStock()) return;
  const typed = document.getElementById('shelf-new');
  const shelf = String(shelfArg != null ? shelfArg : (typed ? typed.value : '')).trim();
  if (!shelf) { S.stockNote = { kind:'needShelf' }; render(); return; }
  const list = S.shelves[ph.id] = S.shelves[ph.id] || [];
  if (!list.includes(shelf)) list.push(shelf);
  const sess = { id:nextOpId('C', S.countSessions), pharmacy:ph.id, shelf, state:'open', items:[],
                 lastExpiry:'', startedAt:nowIso(), startedBy:S.email };
  S.countSessions.push(sess);
  S.openCount = sess.id; S.stockNote = null; S.screen = 'count';
  tillLog('countStarted', { op:sess.id, shelf });
  saveDrafts(); render(); scrollTop();
}
const openCountSession = () => S.countSessions.find(x => x.id === S.openCount && x.state === 'open' && (!currentPharmacy() || x.pharmacy === currentPharmacy().id));

function countKey(ev) { if (ev.key === 'Enter') { ev.preventDefault(); countScan(ev.target.value); } }
function countScan(raw) {
  const sess = openCountSession();
  if (!sess) return;
  const code = String(raw || '').replace(/[\s-]/g, '');
  S.countQuery = '';
  if (!/^\d+$/.test(code) || !ean13Valid(code)) { S.stockNote = { kind:'misread', code }; render(); return; }
  if (!productByCode(code)) {
    if (!S.mappingRequests.some(r => r.barcode === code)) S.mappingRequests.push({ barcode:code, times:1, first:TODAY_ISO });
  }
  S.stockNote = null;
  /* The same product and the same expiry as a line already open adds a box to
     it; a product not seen yet in this session takes the expiry last typed
     for it, or none — and a line with no expiry cannot be confirmed. */
  const mine = sess.items.filter(it => it.code === code);
  const expiry = mine.length ? mine[mine.length - 1].expiry : '';
  const line = mine.find(it => it.expiry === expiry);
  if (line) { line.qty++; sess.focus = sess.items.indexOf(line); }
  else { sess.items.push({ code, expiry, qty:1 }); sess.focus = sess.items.length - 1; }
  saveDrafts(); render();
}
function countQty(i, v) {
  const sess = openCountSession(); const it = sess && sess.items[i];
  if (!it) return;
  const n = Math.round(Number(v));
  if (!isFinite(n) || n < 0) return;
  if (n === 0) sess.items.splice(i, 1); else it.qty = n;
  saveDrafts(); render();
}
function countStep(i, d) { const sess = openCountSession(); const it = sess && sess.items[i]; if (it) countQty(i, it.qty + d); }
function countExpiry(i, v) {
  const sess = openCountSession(); const it = sess && sess.items[i];
  if (!it) return;
  const ym = parseExpiry(v);
  if (!ym) { S.stockNote = { kind:'badExpiry' }; render(); return; }
  /* A second expiry for the same product is a second line, not a rewrite. */
  const twin = sess.items.find((x, k) => k !== i && x.code === it.code && x.expiry === ym);
  if (twin) { twin.qty += it.qty; sess.items.splice(i, 1); }
  else it.expiry = ym;
  sess.lastExpiry = ym; S.stockNote = null;
  saveDrafts(); render();
}
function countSameAsLast(i) { const sess = openCountSession(); if (sess && sess.lastExpiry) countExpiry(i, sess.lastExpiry); }
/* Another box of the same product with a different date. */
function countSplit(i) {
  const sess = openCountSession(); const it = sess && sess.items[i];
  if (!it) return;
  sess.items.splice(i + 1, 0, { code:it.code, expiry:'', qty:1 }); sess.focus = i + 1;
  saveDrafts(); render();
}
function saveCount() {
  const sess = openCountSession();
  if (!sess) return;
  sess.state = 'saved'; sess.savedAt = nowIso();
  tillLog('countSaved', { op:sess.id, shelf:sess.shelf, lines:sess.items.length });
  saveDrafts(); S.openCount = null; S.screen = 'stock'; render(); scrollTop();
}
function resumeCount(id) {
  const sess = S.countSessions.find(x => x.id === id && x.state === 'saved');
  if (!sess) return;
  sess.state = 'open'; S.openCount = id; S.screen = 'count'; render(); scrollTop();
}
function discardCount(id) {
  const i = S.countSessions.findIndex(x => x.id === id && (x.state === 'open' || x.state === 'saved'));
  if (i < 0) return;
  tillLog('countDiscarded', { op:id });
  S.countSessions.splice(i, 1); saveDrafts(); S.screen = 'stock'; render();
}
function confirmCount() {
  const sess = openCountSession();
  if (!sess || !canManageStock()) return;
  if (!sess.items.length) { S.stockNote = { kind:'emptyCount' }; render(); return; }
  if (sess.items.some(it => !it.expiry)) { S.stockNote = { kind:'needExpiry' }; render(); return; }
  commitCount(sess);
  tillLog('count', { op:sess.id, shelf:sess.shelf, products:sess.codes.length });
  S.openCount = null; S.stockNote = null;
  saveDrafts(); toast(t('ct.done', { n:sess.codes.length, shelf:sess.shelf })); S.screen = 'stock'; render(); scrollTop();
}

/* ---------- Write-offs ---------- */

/* An expired batch, or a return set aside, leaves stock only this way: a
   movement with a reason, a date and a name — what an inspector or the
   supplier will ask for. */
function writeOff(batchId) {
  if (!canManageStock()) return;
  const b = S.batches.find(x => x.id === batchId);
  const sel = document.getElementById('wo-' + batchId);
  const reason = sel ? sel.value : '';
  if (!b || !reason) { S.stockNote = { kind:'needReason' }; render(); return; }
  const q = batchQty(b.id);
  if (q <= 0) return;
  addMovement({ pharmacy:b.pharmacy, code:b.code, batch:b.id, qty:-q, kind:'writeoff', reason });

}
function setMinLevel(code) {

/* ---------- Suppliers ---------- */

/* The CRM's distributors and storage houses (the Externals with those
   licences). A supplier an owner adds that is not here stays private to their
   pharmacy and goes to the CRM's queue; it is never linked without them. */
const CRM_SUPPLIERS = [
  { id:'CO1', name:{ ar:'سامراء لصناعة الأدوية', en:'Samarra Drug Industries' } },
  { id:'CO4', name:{ ar:'الوكيل العراقي للأدوية', en:'Iraqi Drug Agency Co.' } },
  { id:'CO5', name:{ ar:'الرافدين للتوزيع الدوائي', en:'Rafidain Pharma Distribution' } },
  { id:'CO7', name:{ ar:'مخازن بغداد الدوائية', en:'Baghdad Pharmaceutical Stores' } },
  { id:'CO8', name:{ ar:'مذخر الشفاء للأدوية', en:'Al-Shifa Drug Store' } }
];
/* Words that say what a supplier IS rather than which one it is: a match on
   "store" alone is no match. The Arabic ones cover the ways one storage house
   gets written — مذخر، مخزن، مستودع. */
const SUPPLIER_GENERIC = new Set(['store', 'stores', 'storage', 'house', 'warehouse', 'drugstore', 'drug', 'drugs', 'pharma',
  'pharmaceutical', 'pharmaceuticals', 'distribution', 'distributor', 'company', 'co', 'for', 'of', 'the', 'and', 'industries',
  'مذخر', 'مخزن', 'مخازن', 'مستودع', 'ادويه', 'للادويه', 'الادويه', 'دوائيه', 'الدوائيه', 'شركه', 'الشركه', 'للتوزيع', 'توزيع',
  'الدوائي', 'دوائي', 'لصناعه', 'صناعه']);
/* The same name, spelt the two usual ways. */
const SUPPLIER_ALIAS = { shifa:'شفا', 'شفاء':'شفا', 'الشفاء':'شفا', 'الشفا':'شفا', rafidain:'رافدين', 'الرافدين':'رافدين',
  baghdad:'بغداد', samarra:'سامراء', iraqi:'عراقي', 'العراقي':'عراقي', agency:'وكيل', 'الوكيل':'وكيل' };
function supplierTokens(s) {
  return String(s || '').toLowerCase()
    .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/\bal[- ]/g, ' ').split(/[^a-z0-9؀-ۿ]+/).filter(Boolean)
    .map(w => SUPPLIER_ALIAS[w] || (w.length > 3 && w.startsWith('ال') ? (SUPPLIER_ALIAS[w.slice(2)] || w.slice(2)) : w))
    .map(w => SUPPLIER_ALIAS[w] || w)
    .filter(w => !SUPPLIER_GENERIC.has(w));
}
function supplierMatches(name) {
  const a = supplierTokens(name);
  if (!a.length) return [];
  return CRM_SUPPLIERS.map(c => {
    const s = Math.max(...[c.name.ar, c.name.en].map(n => { const b = supplierTokens(n); return a.filter(w => b.includes(w)).length; }));
    return { c, s };
  }).filter(x => x.s > 0).sort((x, y) => y.s - x.s).slice(0, 3).map(x => x.c);
}
const suppliersOf = ph => S.suppliers.filter(s => s.pharmacy === ph);
const supplierLabel = s => s.linked ? L((CRM_SUPPLIERS.find(c => c.id === s.linked) || {}).name || { ar:s.name, en:s.name }) : s.name;

function supplierQuery(v) {
  S.supplierQuery = v; render();
  const el = document.getElementById('sup-q');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function addSupplier(linkTo) {
  const ph = currentPharmacy();
  const name = String(S.supplierQuery || '').trim();
  if (!ph || !canManageStock() || (!name && !linkTo)) return;
  if (linkTo && suppliersOf(ph.id).some(s => s.linked === linkTo)) { S.supplierQuery = ''; render(); return; }
  const sup = { id:'SP' + (S.suppliers.length + 1), pharmacy:ph.id, name:name || L(CRM_SUPPLIERS.find(c => c.id === linkTo).name),
                linked:linkTo || null, suggest:null, addedAt:nowIso(), addedBy:S.email };
  S.suppliers.push(sup);
  /* Not in the CRM: private, and a task for the team. */
  if (!linkTo) S.supplierRequests.push({ name, pharmacy:ph.id, at:nowIso() });
  tillLog(linkTo ? 'supplierLinked' : 'supplierAdded', { supplier:sup.id, crm:linkTo || null, name:sup.name });
  S.supplierQuery = ''; render();
}
/* The CRM team found the record: the owner is asked, never told. */
function answerSupplierLink(id, yes) {
  const s = S.suppliers.find(x => x.id === id);
  if (!s || !s.suggest || !canManageStock()) return;
  tillLog(yes ? 'supplierLinked' : 'supplierLinkRefused', { supplier:id, crm:s.suggest });
  if (yes) s.linked = s.suggest;
  s.suggest = null; s.refused = !yes;
  render();
}

/* ---------- Purchase orders ----------

   Draft → sent → received, with partial receipt. "Sent" records that it was
   sent — the order text can be copied into WhatsApp — and nothing passes
   through the platform. Receiving writes the batches: quantity, bonus units
   at zero cost, expiry, and what each unit cost. */

function newOrder() {
  const ph = currentPharmacy();
  if (!ph || !canManageStock()) return;
  const o = { id:nextOpId('P', S.orders), pharmacy:ph.id, supplier:(suppliersOf(ph.id)[0] || {}).id || null,
              state:'draft', lines:[], createdAt:nowIso(), createdBy:S.email, receipts:[] };
  S.orders.push(o);
  tillLog('orderCreated', { order:o.id });
  S.openOrder = o.id; S.screen = 'order'; render(); scrollTop();
}
const openOrderRec = () => S.orders.find(o => o.id === S.openOrder);
function openOrder(id) { S.openOrder = id; S.screen = 'order'; render(); scrollTop(); }
function orderSupplier(v) { const o = openOrderRec(); if (o && o.state === 'draft') { o.supplier = v || null; render(); } }
function orderKey(ev) { if (ev.key === 'Enter') { ev.preventDefault(); orderAdd(ev.target.value); } }
function orderAdd(raw) {
  const o = openOrderRec();
  if (!o || o.state !== 'draft') return;
  const v = String(raw || '').trim();
  const p = productByCode(v.replace(/\s/g, '')) || matchByName(v);
  if (!p) { S.stockNote = { kind:'notFound', code:v }; render(); return; }
  const l = o.lines.find(x => x.code === p.barcode);
  if (l) l.qty++; else o.lines.push({ code:p.barcode, qty:1, bonus:0, cost:null, received:0, bonusReceived:0 });
  S.stockNote = null; S.orderQuery = ''; render();
}
function orderLine(i, field, v) {
  const o = openOrderRec(); const l = o && o.lines[i];
  if (!l || o.state !== 'draft') return;
  const n = v === '' ? (field === 'cost' ? null : 0) : Math.round(Number(v));
  if (n != null && (!isFinite(n) || n < 0)) return;
  if (field === 'qty' && n === 0) o.lines.splice(i, 1); else l[field] = n;
  render();
}
function sendOrder() {
  const o = openOrderRec();
  if (!o || o.state !== 'draft') return;
  if (!o.supplier) { S.stockNote = { kind:'needSupplier' }; render(); return; }
  if (!o.lines.length) { S.stockNote = { kind:'emptyOrder' }; render(); return; }
  o.state = 'sent'; o.sentAt = nowIso(); o.sentBy = S.email;
  o.lines.forEach(l => { l.recv = { qty:l.qty, bonus:l.bonus, expiry:'', cost:l.cost == null ? '' : l.cost }; });
  tillLog('orderSent', { order:o.id, supplier:o.supplier });
  S.stockNote = null; render();
}
function orderText(o) {
  const s = S.suppliers.find(x => x.id === o.supplier);
  return [t('po.textHead', { id:o.id, ph:L(PHARMACIES[o.pharmacy].name) }), s ? supplierLabel(s) : '']
    .concat(o.lines.map(l => '• ' + productName(l.code) + ' × ' + l.qty + (l.bonus ? ' (+' + l.bonus + ' ' + t('po.bonus') + ')' : '')))
    .filter(Boolean).join('\n');
}
function copyOrder() {
  const o = openOrderRec(); if (!o) return;
  try { navigator.clipboard.writeText(orderText(o)); toast(t('po.copied')); } catch (e) { toast(t('po.copyFailed')); }
}
function orderRecv(i, field, v) { const o = openOrderRec(); const l = o && o.lines[i]; if (l && l.recv) l.recv[field] = v; }
function receiveOrder() {
  const o = openOrderRec();
  if (!o || !canManageStock() || (o.state !== 'sent' && o.state !== 'partial')) return;
  const got = [];
  for (const l of o.lines) {
    const r = l.recv || {};
    const qty = Math.round(Number(r.qty || 0)), bonus = Math.round(Number(r.bonus || 0));
    if (!qty && !bonus) continue;
    if (!isFinite(qty) || !isFinite(bonus) || qty < 0 || bonus < 0) { S.stockNote = { kind:'badReceive' }; render(); return; }
    const expiry = parseExpiry(r.expiry);
    if (!expiry) { S.stockNote = { kind:'needExpiry' }; render(); return; }
    const cost = r.cost === '' || r.cost == null ? null : Math.round(Number(r.cost));
    got.push({ l, qty, bonus, expiry, cost:isFinite(cost) ? cost : null });
  }
  if (!got.length) { S.stockNote = { kind:'nothingReceived' }; render(); return; }
  const rec = { at:nowIso(), by:S.email, lines:[] };
  got.forEach(g => {
    const b = newBatch(o.pharmacy, g.l.code, { expiry:g.expiry, shelf:null });
    if (g.qty) addMovement({ pharmacy:o.pharmacy, code:g.l.code, batch:b.id, qty:g.qty, kind:'receipt', ref:o.id, unitCost:g.cost });
    /* Bonus units: received, at nothing. */
    if (g.bonus) addMovement({ pharmacy:o.pharmacy, code:g.l.code, batch:b.id, qty:g.bonus, kind:'bonus', ref:o.id, unitCost:0 });
    g.l.received += g.qty; g.l.bonusReceived += g.bonus;
    g.l.recv = { qty:Math.max(0, g.l.qty - g.l.received), bonus:Math.max(0, g.l.bonus - g.l.bonusReceived), expiry:'', cost:g.l.recv.cost };
    rec.lines.push({ code:g.l.code, qty:g.qty, bonus:g.bonus, expiry:g.expiry, cost:g.cost, batch:b.id });
  });
  o.receipts.push(rec);
  o.state = o.lines.every(l => l.received >= l.qty && l.bonusReceived >= l.bonus) ? 'received' : 'partial';
  tillLog('orderReceived', { order:o.id, lines:rec.lines.length, state:o.state });
  S.stockNote = null; toast(t('po.receivedToast')); render();
}
function closeOrder() {
  const o = openOrderRec();
  if (!o || o.state !== 'partial') return;
  o.state = 'closed'; o.closedAt = nowIso();
  tillLog('orderClosed', { order:o.id });
  render();
}

    prompt('st-near', 'st.near', pr.near.length,
      pr.near.map(x => listRow(x.b.code, t('st.nearRow', { n:x.q, exp:fmtExpiry(x.b.expiry) }))).join('')) +
    prompt('st-low', 'st.low', pr.low.length,
      pr.low.map(x => listRow(x.code, t('st.lowRow', { have:x.have, min:x.min }))).join('')) +
    prompt('st-quar', 'st.quarantined', pr.quarantined.length,
      pr.quarantined.map(x => listRow(x.code, t('st.quarRow', { n:x.q }))).join(''));

  const drafts = S.countSessions.filter(o => o.pharmacy === ph.id && (o.state === 'saved' || o.state === 'open'))
    .map(o => '<div class="row st-draft"><span class="row-body"><span class="row-title" style="display:block;">' +
      esc(t('st.draftCount', { shelf:o.shelf })) + '</span><span class="row-sub" style="display:block;">' +
      esc(t('st.draftCountSub', { n:o.items.reduce((a, it) => a + it.qty, 0), when:fmtWhen(o.savedAt || o.startedAt) })) + '</span></span>' +
      '<button class="btn-small" onclick="resumeCount(' + attr(o.id) + ')">' + esc(t('st.resume')) + '</button></div>')
    .concat(S.imports.filter(o => o.pharmacy === ph.id && (o.state === 'saved' || o.state === 'review'))
    .map(o => '<div class="row st-draft"><span class="row-body"><span class="row-title" style="display:block;">' +
      esc(t('st.draftImport', { file:o.file })) + '</span><span class="row-sub" style="display:block;">' +
      esc(t('st.draftImportSub', { n:o.rows.length, when:fmtWhen(o.savedAt || o.startedAt) })) + '</span></span>' +
      '<button class="btn-small" onclick="resumeImport(' + attr(o.id) + ')">' + esc(t('st.resume')) + '</button></div>')).join('');

  const ops = stockOps().filter(o => o.pharmacy === ph.id && (o.state === 'committed' || o.state === 'undone'))
    .sort((a, b) => (b.committedAt || '').localeCompare(a.committedAt || ''));
  const opRow = o => {
    const u = undoState(o);
    return '<div class="row st-op" data-op="' + esc(o.id) + '"><span class="row-body">' +
      '<span class="row-title" style="display:block;">' + esc(o.id[0] === 'C' ? t('st.opCount', { shelf:o.shelf }) : t('st.opImport', { file:o.file })) + '</span>' +
      '<span class="row-sub" style="display:block;">' + esc(t('st.opSub', { n:o.codes.length, who:personName(o.committedBy), when:fmtWhen(o.committedAt) })) +
        (o.state === 'undone' ? ' · ' + esc(t('st.opUndone', { who:personName(o.undoneBy) })) :
         !u.ok ? ' · ' + esc(t('st.noUndo.' + u.why)) : ' · ' + esc(t('st.undoUntil', { when:fmtWhen(new Date(u.until).toISOString()) }))) +
      '</span></span>' +
      (u.ok ? '<button class="btn-ghost st-undo" onclick="undoOp(' + attr(o.id) + ')">' + esc(t('st.undo')) + '</button>' : '') +
    '</div>';
  };
  const openOrders = S.orders.filter(o => o.pharmacy === ph.id && ['draft', 'sent', 'partial'].includes(o.state)).length;
  const toConfirm = suppliersOf(ph.id).filter(s => s.suggest).length;
  const shelves = Object.entries(sum.shelves);

  return '<div class="screen-body">' + tabs + '<div class="constrain stack">' +
    '<div class="st-summary card card-pad"><p class="st-big">' + esc(t('st.drugsCounted', { n:countedCodes.size })) + '</p>' +
      (importedCodes.size ? '<p class="st-small">' + esc(t('st.drugsImported', { n:importedCodes.size })) + '</p>' : '') +
      (shelves.length ? '<div class="st-shelves">' + shelves.map(([s, v]) =>
        '<span class="chip st-shelf">' + esc(s) + ' · ' + esc(t('st.shelfCount', { n:v.codes.size, boxes:v.boxes })) + '</span>').join('') + '</div>' : '') +
      /* Only once something has a cost: purchases carry it, a count does not. */
      (canManageStock() && stockValue(ph.id) > 0 ? '<p class="st-small st-value">' + esc(t('st.value', { v:iqd(stockValue(ph.id)) })) + '</p>' : '') +
    '</div>' +
    prompts +
    '<div class="st-actions">' +
      '<button class="btn-primary st-count-btn" onclick="goto(\'count\')">' + icon('barcode') + esc(t('st.countShelf')) + '</button>' +
      '<button class="btn-secondary st-import-btn" onclick="goto(\'import\')">' + esc(t('st.importSheet')) + '</button>' +
    '</div>' +
    (drafts ? '<p class="section-eyebrow">' + esc(t('st.saved')) + '</p><div class="card">' + drafts + '</div>' : '') +
    '<div class="card">' +
      linkRow('st.orders', openOrders ? t('st.ordersOpen', { n:openOrders }) : '', "goto('orders')") +
      linkRow('st.suppliers', toConfirm ? t('st.suppliersConfirm', { n:toConfirm }) : '', "goto('suppliers')") +
      linkRow('st.register', '', "goto('register')") +
      linkRow('st.catalogue', '', "goto('products')") +
    '</div>' +
    (ops.length ? '<p class="section-eyebrow">' + esc(t('st.history')) + '</p><div class="card st-ops">' + ops.map(opRow).join('') + '</div>' : '') +
    '</div></div>';
}
const linkRow = (key, sub, go) =>
  '<button class="row" style="width:100%;text-align:start;" onclick="' + go + '"><span class="row-body">' +
    '<span class="row-title" style="display:block;">' + esc(t(key)) + '</span>' +
    (sub ? '<span class="row-sub" style="display:block;">' + esc(sub) + '</span>' : '') + '</span>' +
    icon('chevron', 'more-chevron') + '</button>';

/* ---------- The count ---------- */

function screenCount() {
  const ph = currentPharmacy(), tabs = pharmacyTabs();
  if (!ph) return stockChooser(tabs);
  const sess = openCountSession();
  if (!sess) {
    const shelves = S.shelves[ph.id] || [];
    return '<div class="screen-body">' + tabs + '<div class="constrain stack">' + stockNoteHtml() +
      '<div class="card card-pad"><p class="urgent-t">' + esc(t('ct.whichShelf')) + '</p>' +
        '<p class="urgent-s" style="margin-bottom:10px;">' + esc(t('ct.whichShelfS')) + '</p>' +
        (shelves.length ? '<div class="take-chips" style="margin-bottom:10px;">' + shelves.map(s =>
          '<button class="chip st-shelf-pick" onclick="startCount(' + attr(s) + ')">' + esc(s) + '</button>').join('') + '</div>' : '') +
        '<div class="till-inline"><input id="shelf-new" placeholder="' + esc(t('ct.shelfPh')) + '">' +
        '<button class="btn-small" onclick="startCount()">' + esc(t('ct.start')) + '</button></div>' +
      '</div></div></div>';
  }
  const boxes = sess.items.reduce((a, it) => a + it.qty, 0);
  const codes = new Set(sess.items.map(it => it.code)).size;
  const itemRow = (it, i) =>
    '<div class="till-line ct-line' + (sess.focus === i ? ' ct-focus' : '') + (it.expiry ? '' : ' ct-noexp') + '">' +
      '<div class="till-line-top"><span class="till-line-name">' + esc(productName(it.code)) +
        (productByCode(it.code) ? '' : ' <span class="badge badge-alert">' + esc(t('ct.unknown')) + '</span>') + '</span></div>' +
      '<div class="till-line-bottom">' +
        '<span class="qty"><button class="qty-btn" onclick="countStep(' + i + ',-1)">−</button>' +
          '<input class="ct-qty figure" type="number" inputmode="numeric" value="' + it.qty + '" onchange="countQty(' + i + ', this.value)">' +
          '<button class="qty-btn" onclick="countStep(' + i + ',1)">+</button></span>' +
        '<input class="ct-exp" dir="ltr" inputmode="numeric" placeholder="MM/YY" value="' + esc(it.expiry ? fmtExpiry(it.expiry).replace(/\/20(\d\d)$/, '/$1') : '') + '" ' +
          'onchange="countExpiry(' + i + ', this.value)">' +
        (!it.expiry && sess.lastExpiry
          ? '<button class="btn-ghost ct-same" onclick="countSameAsLast(' + i + ')">' + esc(t('ct.same', { exp:fmtExpiry(sess.lastExpiry) })) + '</button>' : '') +
        '<button class="link-btn" onclick="countSplit(' + i + ')">' + esc(t('ct.otherDate')) + '</button>' +
      '</div></div>';
  return '<div class="screen-body">' + tabs + '<div class="constrain stack">' +
    '<div class="till-head"><span class="till-ph">' + esc(t('ct.counting', { shelf:sess.shelf })) + '</span>' +
      '<span class="till-by ct-progress">' + esc(t('ct.progress', { n:codes, boxes })) + '</span></div>' +
    '<div class="till-scanrow"><div class="searchbox">' + icon('barcode') +
      '<input id="count-q" type="search" autocomplete="off" inputmode="numeric" placeholder="' + esc(t('ct.scan')) + '" onkeydown="countKey(event)"></div>' +
      '<button class="btn-scan" onclick="cameraScanFor(\'count\')">' + icon('camera') + '<span>' + esc(t('scan.button')) + '</span></button></div>' +
    stockNoteHtml() +
    (sess.items.length ? '<div class="card till-cart">' + sess.items.map(itemRow).join('') + '</div>'
      : '<div class="card card-pad till-empty">' + esc(t('ct.empty')) + '</div>') +
    (notYetCounted(sess).length
      ? '<details class="card ct-left" open><summary>' + esc(t('ct.notYet', { n:notYetCounted(sess).length })) + '</summary>' +
          notYetCounted(sess).map(c => '<div class="row"><span class="row-body"><span class="row-title" style="display:block;">' + esc(productName(c)) + '</span></span></div>').join('') +
          '<p class="inline-note ct-leave" style="padding:0 14px 12px;">' + esc(t('ct.willLeave')) + '</p></details>' : '') +
    '<p class="inline-note">' + esc(t('ct.howto')) + '</p>' +
    '<button class="btn-primary ct-confirm" onclick="confirmCount()">' + esc(t('ct.confirm', { n:codes })) + '</button>' +
    '<div class="till-receipt-bar"><button class="btn-secondary ct-save" onclick="saveCount()">' + esc(t('ct.save')) + '</button>' +
      '<button class="btn-secondary" onclick="discardCount(' + attr(sess.id) + ')">' + esc(t('ct.discard')) + '</button></div>' +
    '</div></div>';
}

/* ---------- The import ---------- */

function screenImport() {
  const ph = currentPharmacy(), tabs = pharmacyTabs();
  if (!ph) return stockChooser(tabs);
  const imp = S.imports.find(x => x.id === S.openImport && x.state === 'review');
  const note = !S.importNote ? '' :
    '<div class="banner banner-amber im-note">' + icon('alert') + '<p>' + esc(t('im.note.' + S.importNote.kind, { file:S.importNote.file || '' })) + '</p></div>';
  if (!imp) {
    return '<div class="screen-body">' + tabs + '<div class="constrain stack">' + note +
      '<div class="card card-pad"><p class="urgent-t">' + esc(t('im.title')) + '</p>' +
        '<p class="urgent-s" style="margin-bottom:12px;">' + esc(t('im.sub')) + '</p>' +
        '<label class="btn-primary im-pick">' + esc(t('im.pick')) +
          '<input id="im-file" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" ' +
          'onchange="readImportFile(this)" hidden></label>' +
        '<button class="link-btn im-template" style="display:block;margin:12px auto 0;" onclick="downloadTemplate()">' + esc(t('im.template')) + '</button>' +
      '</div>' +
      '<p class="inline-note">' + esc(t('im.karmasoft')) + '</p>' +
      '</div></div>';
  }
  const rows = classifyImport(imp);
  const piles = ['matched', 'probable', 'notFound', 'duplicate', 'error'];
  const count = k => rows.filter(r => r.pile === k).length;
  const included = rows.filter(r => importIncluded(imp, r)).length;
  const colSel = f => '<label class="im-col"><span>' + esc(t('im.f.' + f)) + '</span><select onchange="importColumn(' + attr(imp.id) + ',' + attr(f) + ', this.value)">' +
    '<option value="">' + esc(t('im.none')) + '</option>' +
    imp.header.map((h, k) => '<option value="' + k + '"' + (imp.cols[f] === k ? ' selected' : '') + '>' + esc(h || t('im.column', { n:k + 1 })) + '</option>').join('') +
    '</select></label>';
  const rowHtml = r => {
    const label = r.code && productByCode(r.code) ? L(productByCode(r.code).name) : (r.raw.name || r.raw.barcode || '—');
    const bits = [r.qty > 0 ? t('im.qty', { n:r.qty }) : '', r.expiry ? fmtExpiry(r.expiry) : r.raw.expiry, r.cost != null ? iqd(r.cost) : ''].filter(Boolean).join(' · ');
    const flags = (r.expired ? ' <span class="badge badge-alert">' + esc(t('im.expired')) + '</span>' : '') +
                  (r.already ? ' <span class="badge badge-pending">' + esc(t('im.already')) + '</span>' : '');
    let act = '';
    if (r.pile === 'matched') act = '<label class="im-inc"><input type="checkbox" ' + (importIncluded(imp, r) ? 'checked ' : '') +
      'onchange="importDecide(' + attr(imp.id) + ',' + attr('x' + r.i) + ', this.checked ? \'include\' : \'exclude\')"></label>';
    if (r.pile === 'probable') act = '<span class="im-yn"><button class="btn-small im-yes" onclick="importDecide(' + attr(imp.id) + ',' + r.i + ',\'yes\')">' +
      esc(t('im.yes')) + '</button><button class="btn-ghost im-no" onclick="importDecide(' + attr(imp.id) + ',' + r.i + ',\'no\')">' + esc(t('im.no')) + '</button></span>';
    if (r.pile === 'notFound' && r.unknown) act = '<label class="im-inc"><input type="checkbox" ' + (importIncluded(imp, r) ? 'checked ' : '') +
      'onchange="importDecide(' + attr(imp.id) + ',' + attr('x' + r.i) + ', this.checked ? \'include\' : \'exclude\')"></label>';
    const sub = r.pile === 'probable' ? t('im.isIt', { name:L(productByCode(r.guess).name) }) :
                r.pile === 'duplicate' ? t('im.mergedInto', { n:r.into + 1 }) :
                r.pile === 'error' ? t('im.err.' + r.why) :
                r.pile === 'notFound' ? (r.unknown ? t('im.byName') : t('im.noBarcode')) : bits;
    return '<div class="row im-row" data-pile="' + r.pile + '" data-row="' + r.i + '"><span class="row-body">' +
      '<span class="row-title" style="display:block;">' + esc(t('im.rowN', { n:r.i + 1 })) + ' · ' + esc(label) + flags + '</span>' +
      '<span class="row-sub" style="display:block;">' + esc(sub) + (r.pile !== 'matched' && bits && r.pile !== 'error' ? ' · ' + esc(bits) : '') + '</span></span>' + act + '</div>';
  };
  return '<div class="screen-body">' + tabs + '<div class="constrain stack">' + note +
    '<div class="till-head"><span class="till-ph">' + esc(imp.file) + '</span><span class="till-by">' + esc(t('im.rows', { n:rows.length })) + '</span></div>' +
    '<details class="card card-pad im-cols"><summary>' + esc(t('im.columns')) + '</summary><div class="im-colgrid">' +
      IMPORT_FIELDS.map(colSel).join('') + '</div></details>' +
    piles.map(k => !count(k) ? '' :
      '<details class="card im-pile im-' + k + '"' + (k === 'probable' || k === 'error' ? ' open' : '') + '><summary>' +
        '<span class="st-prompt-n figure">' + count(k) + '</span><span>' + esc(t('im.pile.' + k)) + '</span></summary>' +
        rows.filter(r => r.pile === k).map(rowHtml).join('') + '</details>').join('') +
    '<button class="btn-primary im-confirm" onclick="commitImport(' + attr(imp.id) + ')">' + esc(t('im.confirm', { n:included })) + '</button>' +
    '<div class="till-receipt-bar"><button class="btn-secondary im-save" onclick="saveImport(' + attr(imp.id) + ')">' + esc(t('im.save')) + '</button>' +
      '<button class="btn-secondary" onclick="discardImport(' + attr(imp.id) + ')">' + esc(t('im.discard')) + '</button></div>' +
    '<p class="inline-note">' + esc(t('im.undoNote')) + '</p>' +
    '</div></div>';
}

/* ---------- Orders ---------- */

const orderStateChip = s => '<span class="badge ' + (s === 'received' ? 'badge-verified' : s === 'draft' ? 'badge-stage' : 'badge-pending') +
  ' po-state">' + esc(t('po.s.' + s)) + '</span>';
function screenOrders() {
  const ph = currentPharmacy(), tabs = pharmacyTabs();
  if (!ph) return stockChooser(tabs);
  const list = S.orders.filter(o => o.pharmacy === ph.id).slice().reverse();
  return '<div class="screen-body">' + tabs + '<div class="constrain stack">' +
    '<button class="btn-primary po-new" onclick="newOrder()">' + esc(t('po.new')) + '</button>' +
    (list.length ? '<div class="card">' + list.map(o => {
      const s = S.suppliers.find(x => x.id === o.supplier);
      return '<button class="row" style="width:100%;text-align:start;" onclick="openOrder(' + attr(o.id) + ')"><span class="row-body">' +
        '<span class="row-title" style="display:block;">' + esc(o.id) + ' · ' + esc(s ? supplierLabel(s) : t('po.noSupplier')) + '</span>' +
        '<span class="row-sub" style="display:block;">' + esc(t('po.lines', { n:o.lines.length })) + '</span></span>' +
        orderStateChip(o.state) + icon('chevron', 'more-chevron') + '</button>'; }).join('') + '</div>'
      : '<div class="card card-pad till-empty">' + esc(t('po.none')) + '</div>') +
    '</div></div>';
}
function screenOrder() {
  const ph = currentPharmacy(), tabs = pharmacyTabs();
  const o = openOrderRec();
  if (!ph || !o || o.pharmacy !== ph.id) return screenOrders();
  const sups = suppliersOf(ph.id);
  const draft = o.state === 'draft', receiving = o.state === 'sent' || o.state === 'partial';
  const num = (i, f, v, ph2) => '<input class="po-in po-' + f + '" type="number" inputmode="numeric" dir="ltr" value="' + (v == null ? '' : v) +
    '" placeholder="' + esc(ph2) + '" onchange="orderLine(' + i + ',' + attr(f) + ', this.value)">';
  const line = (l, i) => '<div class="till-line po-line">' +
    '<div class="till-line-top"><span class="till-line-name">' + esc(productName(l.code)) + '</span>' +
      (!draft ? '<span class="till-line-unit figure">' + esc(t('po.got', { n:l.received, of:l.qty, b:l.bonusReceived, bof:l.bonus })) + '</span>' : '') + '</div>' +
    (draft
      ? '<div class="po-grid"><label>' + esc(t('po.qty')) + num(i, 'qty', l.qty, '') + '</label>' +
          '<label>' + esc(t('po.bonus')) + num(i, 'bonus', l.bonus, '0') + '</label>' +
          '<label>' + esc(t('po.cost')) + num(i, 'cost', l.cost, t('po.costPh')) + '</label></div>'
      : receiving && l.recv
        ? '<div class="po-grid po-recv"><label>' + esc(t('po.recvQty')) +
            '<input class="po-in po-rq" type="number" inputmode="numeric" dir="ltr" value="' + esc(l.recv.qty) + '" oninput="orderRecv(' + i + ',\'qty\', this.value)"></label>' +
            '<label>' + esc(t('po.bonus')) + '<input class="po-in po-rb" type="number" inputmode="numeric" dir="ltr" value="' + esc(l.recv.bonus) + '" oninput="orderRecv(' + i + ',\'bonus\', this.value)"></label>' +
            '<label>' + esc(t('po.expiry')) + '<input class="po-in po-re" dir="ltr" placeholder="MM/YY" value="' + esc(l.recv.expiry) + '" oninput="orderRecv(' + i + ',\'expiry\', this.value)"></label>' +
            '<label>' + esc(t('po.cost')) + '<input class="po-in po-rc" type="number" inputmode="numeric" dir="ltr" value="' + esc(l.recv.cost) + '" oninput="orderRecv(' + i + ',\'cost\', this.value)"></label></div>'
        : '') +
    '</div>';
  return '<div class="screen-body">' + tabs + '<div class="constrain stack">' +
    '<div class="till-head"><span class="till-ph">' + esc(o.id) + '</span>' + orderStateChip(o.state) + '</div>' +
    stockNoteHtml() +
    '<div class="field"><label>' + esc(t('po.supplier')) + '</label>' +
      (draft
        ? '<select class="po-supplier" onchange="orderSupplier(this.value)"><option value="">' + esc(t('po.pickSupplier')) + '</option>' +
            sups.map(s => '<option value="' + esc(s.id) + '"' + (o.supplier === s.id ? ' selected' : '') + '>' + esc(supplierLabel(s)) + '</option>').join('') + '</select>' +
          '<button class="link-btn" style="margin-top:6px;" onclick="goto(\'suppliers\')">' + esc(t('po.addSupplier')) + '</button>'
        : '<p class="row-title">' + esc(supplierLabel(S.suppliers.find(x => x.id === o.supplier))) + '</p>') + '</div>' +
    (draft ? '<div class="searchbox">' + icon('barcode') + '<input id="po-q" type="search" autocomplete="off" placeholder="' + esc(t('po.addLine')) + '" onkeydown="orderKey(event)"></div>' : '') +
    (o.lines.length ? '<div class="card till-cart">' + o.lines.map(line).join('') + '</div>' : '<div class="card card-pad till-empty">' + esc(t('po.empty')) + '</div>') +
    (draft ? '<button class="btn-primary po-send" onclick="sendOrder()">' + esc(t('po.send')) + '</button>' +
             '<p class="inline-note">' + esc(t('po.sendNote')) + '</p>' : '') +
    (receiving ? '<button class="btn-primary po-receive" onclick="receiveOrder()">' + esc(t('po.receive')) + '</button>' +
                 '<p class="inline-note">' + esc(t('po.receiveNote')) + '</p>' +
                 '<button class="btn-secondary" onclick="copyOrder()">' + esc(t('po.copy')) + '</button>' : '') +
    (o.state === 'partial' ? '<button class="btn-secondary po-close" onclick="closeOrder()">' + esc(t('po.close')) + '</button>' : '') +
    '<button class="link-btn" onclick="goto(\'orders\')">' + esc(t('po.back')) + '</button>' +
    '</div></div>';
}

/* ---------- Suppliers ---------- */

function screenSuppliers() {
  const ph = currentPharmacy(), tabs = pharmacyTabs();
  if (!ph) return stockChooser(tabs);
  const mine = suppliersOf(ph.id);
  const q = S.supplierQuery || '';
  const sugg = q.trim() ? supplierMatches(q) : [];
  return '<div class="screen-body">' + tabs + '<div class="constrain stack">' +
    mine.filter(s => s.suggest).map(s => {
      const c = CRM_SUPPLIERS.find(x => x.id === s.suggest);
      return '<div class="card card-pad sp-confirm" data-sp="' + esc(s.id) + '"><p class="urgent-t">' +
        esc(t('sp.same', { mine:s.name, crm:L(c.name) })) + '</p><p class="urgent-s" style="margin:4px 0 10px;">' + esc(t('sp.sameS')) + '</p>' +
        '<div class="till-inline"><button class="btn-small sp-yes" onclick="answerSupplierLink(' + attr(s.id) + ', true)">' + esc(t('sp.yes')) + '</button>' +
        '<button class="btn-ghost sp-no" onclick="answerSupplierLink(' + attr(s.id) + ', false)">' + esc(t('sp.no')) + '</button></div></div>';
    }).join('') +

        (st.quarantine ? '<span><b class="figure">' + st.quarantine + '</b> ' + esc(t('sk.quarantineQ')) + '</span>' : '') + '</div>' +

      '<div class="till-inline" style="margin-top:10px;"><input id="min-level" type="number" inputmode="numeric" dir="ltr" value="' + (min || '') + '" placeholder="' +
        esc(t('sk.minPh')) + '"><button class="btn-small" onclick="setMinLevel(' + attr(p.barcode) + ')">' + esc(t('sk.minSave')) + '</button></div>' +

    (hist.length ? '<details class="card sk-hist"><summary>' + esc(t('sk.history', { n:S.movements.filter(m => m.pharmacy === ph.id && m.code === p.barcode).length })) + '</summary>' +

/* ---------- Billing: what the PHARMACY is charged ----------
   The owner previously reached "Earnings", which is the pharmacist payout view.
   A pharmacy is charged, not paid, so gating the pharmacist half left an owner
   with no way to see what they owe. Priced by the same fee engine, so this and
   the listing preview cannot disagree. */

/* ---------- Billing: the plan, the allowance, and every charge ----------

   Rebuilt in v0.0006 around W14. Three things an owner needs and could not see
   before: which plan they are on, how much of its shift allowance is left, and
   — the one that decides whether they renew — what the same month would have
   cost on commission. A subscriber who cannot see what they saved churns at the
   first quiet month. */

function billingLedger() {
  /* Charge rows, in the shape the real ledger will hold: one row per chargeable
     event, each carrying WHY it cost what it did. A zero with no reason is
     indistinguishable from a bug six months later, which is why the fee engine
     returns `coveredByPlan` and the row keeps it. */
  const shifts = [
    { who:DATA.listings[0].pharmacy, when:{en:'10 September', ar:'10 أيلول'}, gross:20000 },
    { who:DATA.listings[1].pharmacy, when:{en:'8 September',  ar:'8 أيلول'},  gross:45000 },
    { who:DATA.listings[2].pharmacy, when:{en:'2 September',  ar:'2 أيلول'},  gross:40000 }
  ];
  return shifts.map((r, n) => {
    const f = calculateFees({ grossAmount:r.gross, pharmacyInTrial:S.trial, pharmacistInTrial:false,
                              plan:S.plan, shiftsFilledThisMonth:n });
    // What the same shift would have cost with no plan at all — the comparison
    // the renewal decision actually turns on.
    const asCommission = calculateFees({ grossAmount:r.gross, pharmacyInTrial:S.trial,
                                         pharmacistInTrial:false });
    return { kind:'shift', ref:r, fees:f, wouldHaveBeen:asCommission.pharmacyFee };
  });
}

function screenBilling() {
  /* W7 — one source for the plan, so an owner of several cannot drift from an
     independent pharmacy's. `myPlan()` returns the plan itself for an owner and
     the per-pharmacy multiple for an owner of several; every figure below reads it. */
  const plan = myPlan();
  const several = plan.pharmacies > 1;
  const ledger = billingLedger();
  const used = ledger.filter(x => x.fees.coveredByPlan).length;
  const left = Math.max(0, plan.includedShifts - used);

  const shiftCharges = ledger.reduce((n, x) => n + x.fees.pharmacyCharge, 0);
  const commissionPaid = ledger.reduce((n, x) => n + x.fees.pharmacyFee, 0);
  const subscription = S.trial ? 0 : plan.monthlyFeeIQD;
  const total = shiftCharges + subscription;
  const wouldHaveBeen = ledger.reduce((n, x) => n + x.wouldHaveBeen, 0);
  const saved = wouldHaveBeen - (commissionPaid + subscription);

  const line = (x, i) =>
    '<button class="txn" onclick="openBillingLine(' + i + ')">' +
      '<span class="txn-icon txn-out">' + icon('wallet') + '</span>' +
      '<span class="txn-body"><span class="txn-title">' + esc(L(x.ref.who)) + '</span>' +
        '<span class="txn-sub">' + esc(L(x.ref.when)) + ' · ' +
          esc(x.fees.coveredByPlan ? t('bill.onPlan') : t('bill.shiftCovered')) + '</span></span>' +
      '<span class="txn-amount">' + iqd(x.fees.pharmacyCharge) + '</span></button>';

  return '<div class="screen-body"><div class="constrain stack">' +
    '<div class="balance-card">' +
      '<svg class="header-pattern" style="opacity:.4"><rect width="100%" height="100%" fill="url(#starTile)"/></svg>' +
      '<div class="balance-label">' + esc(t('bill.thisMonth')) + '</div>' +
      '<div class="balance-amount">' + esc(iqd(total)) + '</div>' +
      '<div class="balance-sub">' + esc(plan.monthlyFeeIQD
        ? t('bill.ofWhichPlan', { plan:t('plan.' + plan.id), amount:iqd(subscription) })
        : t('bill.ofWhich', { amount:iqd(commissionPaid) })) + '</div>' +
    '</div>' +

    (S.trial
      ? '<div class="banner banner-green">' + icon('badge') + '<p>' +
        esc(t('bill.trialNote', { n:22 })) + '</p></div>'
      : '') +

    /* The plan card. The allowance is the upgrade prompt as much as the
       entitlement: "5 of 5 used" is the best Premium pitch there is. */
    (plan.monthlyFeeIQD
      ? '<p class="section-eyebrow">' + esc(t('bill.yourPlan')) + '</p>' +
        '<div class="card card-pad plan-card">' +
          '<div class="plan-top">' +
            '<span class="plan-name">' + esc(t('plan.' + plan.id)) + '</span>' +
            '<span class="plan-fee figure">' + esc(iqd(plan.monthlyFeeIQD)) + esc(t('bill.perMonth')) + '</span>' +
          '</div>' +
          (several
            ? '<p class="inline-note" style="margin-top:6px;">' +
              esc(t('bill.perPharmacy', { amount:iqd(plan.perPharmacyIQD), n:plan.pharmacies })) + ' \u00b7 ' +
              esc(t('bill.oneInvoice')) + '</p>'
            : '') +
          '<div class="allowance">' +
            '<div class="allowance-head"><span>' + esc(t('bill.allowance')) + '</span>' +
              '<span class="figure">' + fmt(used) + ' / ' + fmt(plan.includedShifts) + '</span></div>' +
            '<div class="allowance-track">' + Array.from({ length:plan.includedShifts }, (_, k) =>
              '<span class="allowance-pip' + (k < used ? ' spent' : '') + '"></span>').join('') + '</div>' +
            '<p class="inline-note" style="margin-top:8px;">' +
              esc(left ? t('bill.allowanceLeft', { n:left }) : t('bill.allowanceSpent')) +
              (several ? ' \u00b7 ' + esc(t('bill.pooled')) : '') + '</p>' +
          '</div>' +
        '</div>' +
        (saved > 0
          ? '<div class="banner banner-green">' + icon('badge') + '<p>' +
            esc(t('bill.saved', { amount:iqd(saved) })) + '</p></div>'
          : '<p class="inline-note">' + esc(t('bill.wouldHaveBeen', { amount:iqd(wouldHaveBeen) })) + '</p>')
      : '') +

    '<p class="section-eyebrow">' + esc(t('bill.history')) + '</p>' +
    '<div class="card">' +
      (subscription
        ? '<div class="txn" style="cursor:default;">' +
            '<span class="txn-icon txn-out">' + icon('badge') + '</span>' +
            '<span class="txn-body"><span class="txn-title">' + esc(t('plan.' + plan.id)) + '</span>' +
              '<span class="txn-sub">' + esc(t('bill.monthlyFee')) + '</span></span>' +
            '<span class="txn-amount">' + iqd(subscription) + '</span></div>'
        : '') +
      ledger.map(line).join('') + '</div>' +
    '<p class="inline-note">' + esc(t('bill.explainer')) + '</p>' +
    '</div></div>';
}
