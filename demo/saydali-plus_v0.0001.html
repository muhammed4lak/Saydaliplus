<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2D2A6E">
<title>Saydali+ — صيدلي+</title>
<meta name="version" content="App_v0.0001">
<!--
  Saydali+ — a single-file working front end.

  This is the product's interface, not a slide of it: it fills the window,
  you sign in as a real account to get that account's app, and every screen in
  every navigation is a screen rather than a placeholder. Open it from disk,
  no server and no build.

  What it is not is the whole product. The real thing is the Next.js + Supabase
  app in this repository, and its security model is Postgres row-level
  security — which cannot exist in a file you open from disk. So treat this as
  the front end with its data stubbed: what you can see and do here, you can
  see and do there; what stops you doing it to someone ELSE'S data lives in the
  database, and is tested there.

  Two things are real rather than mocked, because they are the things worth
  checking against a pharmacy's own arithmetic: the fee engine is a port of
  src/config/fees.ts, and the shift-hours function a port of src/lib/time.ts.
  The numbers on these screens are the numbers the product charges.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1826; --ink-soft:#57536E; --ink-faint:#8B87A3;
    --indigo:#2D2A6E; --indigo-dark:#191735; --indigo-tint:#E7E6F4;
    --amber:#B8791F; --amber-tint:#F5E6C8;
    --palm:#4F7A47; --palm-tint:#E7EFE3;
    --mist:#EFEEF7; --card:#FFFFFF; --border:#E1DFEC;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --font-ar:'Noto Kufi Arabic','IBM Plex Sans',sans-serif;
    --sidebar:250px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{ height:100%; }
  body{
    font-family:var(--font-body); background:var(--mist); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  html[dir="rtl"] body{ font-family:var(--font-ar); }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:none; }
  :focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; border-radius:4px; }
  .figure{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .ico{ width:16px; height:16px; flex:none; }
  .hidden{ display:none !important; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#D5D2E4; border-radius:10px; border:3px solid var(--mist); }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ==========================================================================
     THE SHELL
     One shell, not two. The phone and desktop layouts are the same DOM under
     different CSS, so a screen cannot be right in one and wrong in the other —
     which is exactly what happens when they are maintained as separate views.
     ========================================================================== */

  #app{ display:flex; height:100%; }

  .sidebar{
    width:var(--sidebar); flex:none; color:#fff; display:flex; flex-direction:column;
    position:relative; overflow:hidden;
    background:linear-gradient(180deg,var(--indigo-dark) 0%,var(--indigo) 100%);
  }
  /* The star tile is a regional cue, not wallpaper. Down a tall sidebar it
     reads much heavier than in a short header band, so it is dialled back. */
  .sidebar .header-pattern{ opacity:.4; }
  .sidebar-head{ position:relative; padding:22px 20px 16px; }
  .sidebar-brand{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; }
  .sidebar-brand-sub{ font-size:11.5px; color:rgba(255,255,255,.6); margin-top:3px; line-height:1.5; }
  .build-tag{ font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,.4); margin-top:5px; letter-spacing:.04em; }
  .side-nav{ position:relative; flex:1; overflow-y:auto; padding:4px 12px; display:flex; flex-direction:column; gap:2px; }
  .side-nav::-webkit-scrollbar{ width:0; }
  .side-nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    font-size:13.5px; font-weight:500; color:rgba(255,255,255,.74); text-align:start; width:100%;
    transition:background .12s,color .12s;
  }
  .side-nav-item svg{ width:18px; height:18px; flex:none; }
  .side-nav-item:hover{ background:rgba(255,255,255,.09); color:#fff; }
  .side-nav-item.active{ background:rgba(255,255,255,.16); color:#fff; font-weight:600; }
  .side-nav-count{
    margin-inline-start:auto; font-family:var(--font-mono); font-size:11px; font-weight:600;
    background:var(--amber); color:#2A1C05; border-radius:100px; padding:1px 7px;
  }
  .sidebar-foot{ position:relative; border-top:1px solid rgba(255,255,255,.14); padding:12px; }
  .side-account{
    display:flex; align-items:center; gap:10px; width:100%; text-align:start;
    padding:8px 10px; border-radius:11px; color:#fff; transition:background .12s;
  }
  .side-account:hover{ background:rgba(255,255,255,.09); }
  .side-account .avatar{ width:32px; height:32px; border-radius:10px; font-size:12px;
    background:rgba(255,255,255,.18); color:#fff; }
  .side-account-name{ display:block; font-size:13px; font-weight:600; line-height:1.3; }
  .side-account-role{ display:block; font-size:11px; color:rgba(255,255,255,.62); margin-top:1px; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .app-body{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }

  /* ---------- Topbar (mobile only: the sidebar carries this on desktop) ---------- */
  .topbar{
    flex:none; display:none; align-items:center; gap:10px; padding:10px 14px;
    background:var(--indigo-dark); color:#fff; position:relative; overflow:hidden;
  }
  .topbar-brand{ font-family:var(--font-display); font-weight:700; font-size:16px; position:relative; }
  .topbar-spacer{ flex:1; }

  /* ---------- Bottom nav (mobile only) ---------- */
  .bottom-nav{
    flex:none; display:none; border-top:1px solid var(--border); background:#fff;
    padding:7px 6px calc(7px + var(--safe-b));
  }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; color:var(--ink-faint); position:relative; }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item span{ display:block; font-size:10px; font-weight:500; }
  .nav-item.active{ color:var(--indigo); }
  .nav-dot{ position:absolute; top:2px; inset-inline-end:22%; width:7px; height:7px; border-radius:50%; background:var(--amber); }

  @media (max-width:900px){
    .sidebar{ display:none; }
    .topbar{ display:flex; }
    .bottom-nav{ display:flex; }
  }

  /* ---------- Header ---------- */
  .app-header{
    flex:none; position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(135deg,var(--indigo) 0%,var(--indigo-dark) 100%);
    padding:22px 26px 20px;
  }
  @media (min-width:901px){ .app-header{ padding:26px 34px; } }
  .header-pattern{ position:absolute; inset:0; width:100%; height:100%; }
  .header-row{ position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .header-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em;
    text-transform:uppercase; color:rgba(255,255,255,.68); margin-bottom:5px;
  }
  .header-title{ font-family:var(--font-display); font-size:22px; font-weight:700; line-height:1.15; }
  html[dir="rtl"] .header-title{ font-family:var(--font-ar); }
  .header-actions{ display:flex; gap:8px; flex:none; }
  .icon-btn{
    flex:none; width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; position:relative; transition:background .12s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.24); }
  .icon-btn svg{ width:18px; height:18px; color:#fff; }
  .icon-btn .dot{ position:absolute; top:7px; inset-inline-end:7px; width:7px; height:7px; border-radius:50%; background:var(--amber); }
  .lang-btn{
    flex:none; height:36px; padding:0 13px; border-radius:12px; background:rgba(255,255,255,.14);
    color:#fff; font-family:var(--font-display); font-weight:600; font-size:12.5px; transition:background .12s;
  }
  .lang-btn:hover{ background:rgba(255,255,255,.24); }

  /* ---------- Content ---------- */
  .screen-body{ padding:20px 22px calc(30px + var(--safe-b)); }
  @media (min-width:901px){ .screen-body{ padding:26px 34px 44px; } }
  .constrain{ max-width:660px; }
  .wide{ max-width:1060px; }
  .section-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); margin:22px 0 10px;
  }
  .section-eyebrow:first-child{ margin-top:0; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:22px 0 10px; }
  .section-head:first-child{ margin-top:0; }
  .section-head .section-eyebrow{ margin:0; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .card-pad{ padding:16px 17px; }
  .stack > * + *{ margin-top:12px; }

  .grid-cards{ display:grid; gap:12px; }
  @media (min-width:640px){ .grid-cards{ grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); } }
  .two-col{ display:grid; gap:22px; align-items:start; }
  @media (min-width:1000px){ .two-col{ grid-template-columns:1.55fr 1fr; } }
  .empty{ text-align:center; color:var(--ink-faint); font-size:13px; padding:26px 18px; line-height:1.7; }
  /* ---------- Chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip-row::-webkit-scrollbar{ height:0; }
  .chip{
    flex:none; font-size:13px; font-weight:500; padding:7px 14px; border-radius:100px;
    border:1px solid var(--border); background:var(--card); color:var(--ink-soft);
  }
  .chip.active{ background:var(--indigo); border-color:var(--indigo); color:#fff; }

  /* ---------- Listing card ---------- */
  .listing-card{
    width:100%; text-align:start; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:15px 16px; display:block; transition:border-color .12s, box-shadow .12s;
  }
  .listing-card:hover{ border-color:rgba(45,42,110,.4); box-shadow:0 6px 16px -8px rgba(20,30,28,.18); }
  .listing-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:9px; }
  .pharmacy-name{ font-family:var(--font-display); font-weight:600; font-size:15.5px; }
  html[dir="rtl"] .pharmacy-name{ font-family:var(--font-ar); font-size:14.5px; }
  .pay-amount{ font-family:var(--font-mono); font-weight:600; font-size:14.5px; color:var(--indigo); white-space:nowrap; }
  .pay-basis{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .meta-line{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .meta-line svg{ width:13px; height:13px; color:var(--ink-faint); flex:none; }
  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:500; padding:4px 9px; border-radius:100px; }
  .badge svg{ width:12px; height:12px; }
  .badge-otc{ background:var(--indigo-tint); color:var(--indigo-dark); }
  .badge-controlled{ background:var(--amber-tint); color:var(--amber); }
  .badge-verified{ background:var(--palm-tint); color:var(--palm); }
  .badge-pending{ background:var(--amber-tint); color:#8A5610; }
  .badge-stage{ background:var(--amber-tint); color:#8A5610; }
  .badge-muted{ background:var(--mist); color:var(--ink-faint); }

  /* ---------- Buttons ---------- */
  .btn-primary{
    width:100%; background:var(--indigo); color:#fff; font-family:var(--font-display);
    font-weight:600; font-size:14.5px; padding:13px; border-radius:13px; text-align:center; transition:background .12s;
  }
  html[dir="rtl"] .btn-primary, html[dir="rtl"] .btn-secondary{ font-family:var(--font-ar); }
  .btn-primary:hover{ background:var(--indigo-dark); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-secondary{
    width:100%; background:var(--card); color:var(--indigo); border:1.4px solid var(--indigo);
    font-family:var(--font-display); font-weight:600; font-size:14px; padding:11.5px;
    border-radius:13px; text-align:center;
  }
  .btn-secondary:hover{ background:var(--indigo-tint); }
  .btn-small{
    font-size:12.5px; font-weight:600; font-family:var(--font-display); padding:7px 14px;
    border-radius:9px; background:var(--indigo); color:#fff; flex:none;
  }
  .btn-small.green{ background:var(--palm); }
  .btn-ghost{
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px;
    border:1px solid var(--border); color:var(--ink-soft);
  }
  .link-btn{ font-size:12.5px; font-weight:500; color:var(--indigo); text-decoration:underline; text-underline-offset:2px; }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:15px; }
  .field label, .field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1.4px solid var(--border); border-radius:11px;
    padding:11px 13px; font-size:14px; background:var(--card); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--indigo); }
  .field textarea{ resize:none; min-height:74px; }
  .field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; line-height:1.5; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .checkbox-row{
    display:flex; align-items:center; gap:10px; padding:12px 13px;
    border:1.4px solid var(--border); border-radius:11px; margin-bottom:15px;
  }
  .checkbox-row input{ width:18px; height:18px; accent-color:var(--amber); }
  .checkbox-row label{ font-size:13.5px; margin:0; font-weight:400; color:var(--ink); }

  .segmented{ display:flex; background:var(--indigo-tint); border-radius:11px; padding:3px; margin-bottom:15px; }
  .segmented button{ flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--indigo-dark); }
  .segmented button.active{ background:#fff; box-shadow:0 1px 3px rgba(20,30,28,.12); }

  /* ---------- Banners ---------- */
  .banner{ display:flex; align-items:flex-start; gap:10px; border-radius:14px; padding:12px 14px; }
  .banner svg{ width:18px; height:18px; flex:none; margin-top:1px; }
  .banner p{ font-size:12.5px; line-height:1.55; }
  .banner-amber{ background:var(--amber-tint); border:1px solid #E3CE9E; color:#8A5610; }
  .banner-amber svg{ color:var(--amber); }
  .banner-green{ background:var(--palm-tint); border:1px solid #CFE0C9; color:var(--ink-soft); }
  .banner-green svg{ color:var(--palm); }
  .banner-indigo{ background:var(--indigo-tint); border:1px solid #D6D4EC; color:var(--indigo-dark); }
  .banner-indigo svg{ color:var(--indigo); }

  /* ---------- Stats ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .stat-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; }
  .stat-num{ font-family:var(--font-mono); font-weight:600; font-size:17px; color:var(--indigo); display:block; }
  .stat-label{ font-size:10.5px; color:var(--ink-faint); margin-top:3px; line-height:1.35; display:block; }

  /* ---------- Rows ---------- */
  .row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); }
  .row:last-child{ border-bottom:none; }
  .row-body{ flex:1; min-width:0; }
  .row-title{ font-size:13.5px; font-weight:500; }
  .row-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .row-value{ font-family:var(--font-mono); font-size:13px; font-weight:600; flex:none; }

  .kv{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .kv:last-child{ border-bottom:none; }
  .kv svg{ width:16px; height:16px; color:var(--indigo); margin-top:2px; flex:none; }
  .kv-label{ font-size:11.5px; color:var(--ink-faint); }
  .kv-value{ font-size:13.5px; font-weight:500; margin-top:2px; }

  .rating{ display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  .rating svg{ width:13px; height:13px; color:var(--amber); }

  /* ---------- Fee breakdown ---------- */
  .fee-line{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0; font-size:13px; }
  .fee-line dt{ color:var(--ink-soft); }
  .fee-line dd{ font-family:var(--font-mono); font-weight:600; }
  .fee-total{ border-top:1px solid var(--border); margin-top:4px; padding-top:10px; }
  .fee-total dt{ color:var(--ink); font-weight:600; }
  .fee-total dd{ font-size:15px; color:var(--indigo); }
  .fee-foot{ font-size:11.5px; color:var(--ink-faint); line-height:1.6; margin-top:12px; border-top:1px solid var(--border); padding-top:10px; }
  .fee-trial{ color:var(--palm); font-weight:600; }

  /* ---------- Handoff ---------- */
  .check-item{ display:flex; align-items:flex-start; gap:12px; padding:14px 16px; width:100%; text-align:start; border-bottom:1px solid var(--border); }
  .check-item:last-child{ border-bottom:none; }
  .check-item:hover{ background:var(--mist); }
  .check-item:disabled{ cursor:default; }
  .check-item:disabled:hover{ background:transparent; }
  .check-box{
    margin-top:1px; width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; transition:.12s;
  }
  .check-box svg{ width:13px; height:13px; color:#fff; opacity:0; }
  .check-item.done .check-box{ background:var(--palm); border-color:var(--palm); }
  .check-item.done .check-box svg{ opacity:1; }
  .check-text{ font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
  .check-item.done .check-text{ color:var(--ink); }

  /* ---------- Applicant ---------- */
  .applicant-top{ display:flex; gap:11px; align-items:flex-start; margin-bottom:10px; }
  .avatar{
    width:40px; height:40px; border-radius:12px; background:var(--indigo-tint); color:var(--indigo-dark);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-ar);
    font-weight:700; font-size:14px; flex:none;
  }
  .avatar.amber{ background:var(--amber-tint); color:#8A5610; }
  .no-record{ font-size:12.5px; color:var(--ink-faint); font-style:normal; }

  /* ---------- Not built ---------- */
  .not-built{ text-align:center; padding:44px 20px; max-width:460px; margin:0 auto; }
  .not-built-icon{
    width:48px; height:48px; border-radius:16px; background:var(--indigo-tint);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .not-built-icon svg{ width:20px; height:20px; color:var(--indigo); }
  .not-built h3{ font-family:var(--font-display); font-size:16px; }
  html[dir="rtl"] .not-built h3{ font-family:var(--font-ar); }
  .not-built p{ font-size:13px; line-height:1.65; color:var(--ink-soft); margin-top:8px; }
  .not-built .phase{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-top:14px;
  }

  /* ---------- Auth ---------- */
  #auth-stage{ width:100%; max-width:520px; }
  .auth-card{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:30px 30px 32px; box-shadow:0 20px 50px -24px rgba(25,23,53,.28);
  }
  .auth-brand{ font-family:var(--font-display); font-weight:700; font-size:27px; color:var(--indigo); text-align:center; }
  .auth-brand-ar{ font-family:var(--font-ar); font-size:15px; color:var(--ink-faint); text-align:center; margin-top:2px; }
  .auth-tagline{ font-size:13.5px; color:var(--ink-soft); text-align:center; margin-top:12px; line-height:1.6; }
  .auth-divider{ height:1px; background:var(--border); margin:22px 0; }
  .auth-heading{ font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:5px; }
  html[dir="rtl"] .auth-heading{ font-family:var(--font-ar); }
  .auth-sub{ font-size:13px; color:var(--ink-faint); margin-bottom:20px; line-height:1.6; }
  .auth-foot{ font-size:13px; color:var(--ink-soft); text-align:center; margin-top:16px; }
  .auth-back{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-bottom:16px; }
  .auth-back svg{ width:14px; height:14px; transform:scaleX(-1); }

  /* The demo's account list. It is the honest way to offer four roles without

    color:var(--ink-faint); margin-bottom:10px;

    display:flex; align-items:center; gap:10px; width:100%; text-align:start;

  .role-option{
    display:flex; align-items:center; gap:13px; width:100%; text-align:start;

    background:var(--card); transition:.12s; margin-bottom:10px;

<script>
"use strict";
/* ==========================================================================
   1. THE FEE ENGINE
   A port of src/config/fees.ts. Kept identical on purpose: the whole point of
   showing a pharmacy a fee breakdown is that the number is the real number.
   ========================================================================== */

const FEES = {
  TOTAL_COMMISSION_RATE: 0.10,
  PHARMACY_SHARE: 0.70,      // 7% of shift value, added ON TOP
  PHARMACIST_SHARE: 0.30,    // 3% of shift value, deducted FROM payout
  MINIMUM_COMMISSION_IQD: 2500,
  TRIAL_DAYS: 30,
  PROCESSOR_FEE_RATE: 0.02
};

function calculateFees({ grossAmount, pharmacyInTrial, pharmacistInTrial }) {
  if (!isFinite(grossAmount) || grossAmount < 0) throw new Error('Invalid gross amount');

  const percentage = grossAmount * FEES.TOTAL_COMMISSION_RATE;
  const floorApplied = grossAmount > 0 && percentage < FEES.MINIMUM_COMMISSION_IQD;
  const chargeable = grossAmount === 0 ? 0 : Math.max(percentage, FEES.MINIMUM_COMMISSION_IQD);

  // Off the percentage, never off the floored commission: the pharmacist pays
  // exactly 3% of the shift value whether the floor bites or not.
  const fullPharmacistFee = Math.round(percentage * FEES.PHARMACIST_SHARE);
  // Derived by subtraction so the two sides always reconcile to the commission
  // exactly — rounding each independently can lose or invent a dinar. The
  // floor's whole excess lands here, on the pharmacy.
  const fullPharmacyFee = Math.round(chargeable) - fullPharmacistFee;

  const pharmacyFee = pharmacyInTrial ? 0 : fullPharmacyFee;
  const pharmacistFee = pharmacistInTrial ? 0 : fullPharmacistFee;

  const platformGross = pharmacyFee + pharmacistFee;
  const pharmacistNet = grossAmount - pharmacistFee;
  const processorFee = Math.round(pharmacistNet * FEES.PROCESSOR_FEE_RATE);

  return {
    grossAmount, pharmacyFee, pharmacistFee,
    pharmacyCharge: grossAmount + pharmacyFee,
    pharmacistNet, platformGross, processorFee,
    platformNet: platformGross - processorFee,
    floorApplied: floorApplied && !(pharmacyInTrial && pharmacistInTrial)
  };
}

/* A port of src/lib/time.ts. 22:00–06:00 is eight hours, not minus sixteen. */
function shiftHours(startTime, endTime) {
  const m = t => { const [h, mi] = t.split(':').map(Number); return h * 60 + mi; };
  let mins = m(endTime) - m(startTime);
  if (mins <= 0) mins += 24 * 60;
  return Math.round(mins / 60 * 100) / 100;
}

/* Western numerals in both languages — 40,000, never ٤٠٬٠٠٠. */

const fmt = n => nf.format(Math.round(n));

/* The student's twelve weeks. Weeks 1-5 are done, 6 is in hand, the rest are
   locked — forward-fill, exactly as submit_log_week() enforces it in SQL. */
function seedWeeks() {
  const w = [];
  for (let i = 1; i <= 12; i++) {
    w.push({
      no: i,
      days: i <= 5 ? [true,true,true,true,i % 2 === 1] : [false,false,false,false,false],
      text: i <= 5
        ? { en:'Dispensed against prescriptions under supervision, including two paediatric antibiotic courses I had to check the weight-based dose for. Sat in on the Thursday narcotics count. Asked about the fridge log and was shown how the twice-daily temperature check is recorded.',
            ar:'صرفت وصفات تحت الإشراف، منها جرعتا مضاد حيوي لطفلين اضطررت لمراجعة الجرعة حسب الوزن. حضرت جرد المخدرات يوم الخميس. سألت عن سجل الثلاجة وشُرح لي كيف يُسجَّل قياس الحرارة مرتين يومياً.' }
        : { en:'', ar:'' },
      status: i <= 4 ? 'approved' : (i === 5 ? 'submitted' : (i === 6 ? 'draft' : 'locked'))
    });
  }
  return w;
}

function feeBreakdown(gross) {
  const now   = calculateFees({ grossAmount: gross, pharmacyInTrial:false, pharmacistInTrial: S.trial });
  const later = calculateFees({ grossAmount: gross, pharmacyInTrial:false, pharmacistInTrial:false });

  let html = '<div class="card card-pad">' +

      '<div class="fee-line"><dt>' + esc(t('fee.yourRate')) + '</dt><dd>' + iqd(gross) + '</dd></div>' +
      '<div class="fee-line"><dt>' + esc(t('fee.platformFee')) + '</dt><dd' +
        (S.trial ? ' class="fee-trial"' : '') + '>' +
        (S.trial ? esc(t('fee.trialActive')) : '− ' + iqd(now.pharmacistFee)) + '</dd></div>' +
      '<div class="fee-line fee-total"><dt>' + esc(t('fee.youReceive')) + '</dt>' +
        '<dd>' + iqd(now.pharmacistNet) + '</dd></div>' +
    '</dl>';

  // Both numbers, always. Showing only the trial figure would make the first
  // month feel cheaper than the product is.
  if (S.trial) {
    html += '<p class="fee-foot">' + esc(t('fee.afterTrial')) + ' <strong class="figure">' +
      iqd(later.pharmacistNet) + '</strong> (− ' + iqd(later.pharmacistFee) + ')</p>';
  }
  html += '<p class="fee-foot" style="border-top:none;padding-top:6px;">' + esc(t('fee.explainer')) +
    (later.floorApplied ? ' ' + esc(t('fee.floorNote')) : '') + '</p>';

  return html + '</div>';
}

/* ---------- Handoff ---------- */

function screenHandoff() {
  const keys = ['i1','i2','i3','i4','i5'];
  const all = keys.every(k => S.handoff[k]);
  const locked = S.handoffConfirmedByMe;

  const items = keys.map(k =>
    '<button class="check-item' + (S.handoff[k] ? ' done' : '') + '"' +
      (locked ? ' disabled' : '') + ' onclick="toggleHandoff(\'' + k + '\')" aria-pressed="' + !!S.handoff[k] + '">' +
      '<span class="check-box">' + icon('check') + '</span>' +
      '<span class="check-text">' + esc(t('h.' + k)) + '</span></button>').join('');

  let footer;
  if (S.handoffConfirmedByMe && S.handoffConfirmedByOther) {
    footer = '<div class="banner banner-green" style="justify-content:center;">' + icon('badge') +
      '<p style="font-weight:600;color:var(--palm);">' + esc(t('h.both')) + '</p></div>';
  } else if (S.handoffConfirmedByMe) {
    footer = '<div class="banner banner-amber" style="justify-content:center;"><p>' + esc(t('h.waiting')) + '</p></div>';
  } else {
    footer = '<button class="btn-primary" onclick="confirmHandoff()"' + (all ? '' : ' disabled') + '>' +
      esc(t('h.confirm')) + '</button>' +
      '<p style="font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.6;">' +
      esc(all ? t('h.cannotUndo') : t('h.allRequired')) + '</p>';
  }

  return '<div class="screen-body"><div class="constrain stack">' +
    '<button class="btn-ghost" onclick="goto(\'shifts\')">' + esc(t('common.back')) + '</button>' +
    '<div class="banner banner-indigo">' + icon('clipboard') + '<p>' + esc(t('h.intro')) + '</p></div>' +
    '<div class="card">' + items + '</div>' +
    (S.handoffConfirmedByOther && !S.handoffConfirmedByMe
      ? '<p style="font-size:12px;color:var(--ink-faint);text-align:center;">' + esc(t('h.otherConfirmed')) + '</p>'
      : '') +
    footer +
    '</div></div>';
}

    ? '<span>' + esc(t('app.shifts', {n:a.shifts})) + '</span>' +

    '<div class="applicant-top">' +

      '<span class="txn-amount">− ' + iqd(x.amount) + '</span></div>';

  // Every shift row is priced by the real engine, so the statement and the

    entry(T('صيدلي', 'Pharmacist'), T('صيدلية الرشيد', 'Al-Rasheed Pharmacy'), '2018 — 2024',
          T('صرف الوصفات وإرشاد المرضى ومتابعة المخزون والصلاحية.',
            'Dispensing, patient counselling, inventory and expiry control.')) +

    '<div class="cv-sec">' + esc(T('التعليم', 'Education')) + '</div>' +
    entry(T('بكالوريوس صيدلة', 'BSc Pharmacy'), T('جامعة بغداد', 'University of Baghdad'), '2016', '') +

    /* Two headed sections rather than one pile: the reader who came for the
       clinical half should not have to sift the commercial half out of it. An
       empty group is omitted entirely — a heading over nothing reads as a gap

    SKILL_GROUPS.map(g => (cv.skills[g] && cv.skills[g].length)
      ? '<div class="cv-sec">' + esc(cvl === 'ar' ? SKILL_HEAD.ar[g] : SKILL_HEAD.en[g]) + '</div>' +

    '<div>' + cv.languages.map(l => esc(l.name) + ' — ' + esc(CV_LEVELS[cvl][l.level]))
      .join(cvl === 'ar' ? '، ' : ', ') + '</div>' +
    '</div>';
}

function screenCv() {
  const cv = S.cv[S.cvLang];

  function skillCard(group) {
    const mine = cv.skills[group] || [];
    const chosen = new Set(mine);
    const picks = SKILL_PRESETS[group].map(sk => {
      const label = S.cvLang === 'ar' ? sk.ar : sk.en;
      const on = chosen.has(label);
      return '<button class="pill-pick' + (on ? ' on' : '') + '" onclick="toggleSkill(' +
        JSON.stringify(group) + ',' + JSON.stringify(label).replace(/"/g, '&quot;') + ')">' +
        esc(label) + '</button>';
    }).join('');

    return '<div class="card card-pad">' +
      '<span class="field-label">' + esc(t('cv.skills.' + group)) + '</span>' +
      '<p class="inline-note" style="margin:-2px 0 10px;">' + esc(t('cv.skillsHint.' + group)) + '</p>' +
      '<div class="pill-tags" style="margin-bottom:12px;">' +
        (mine.length
          ? mine.map(sk => '<span class="pill-tag">' + esc(sk) +
              '<button onclick="toggleSkill(' + JSON.stringify(group) + ',' +
              JSON.stringify(sk).replace(/"/g,'&quot;') + ')" aria-label="remove">×</button></span>').join('')
          : '<span class="inline-note">' + esc(t('cv.addSkill')) + '</span>') +
      '</div>' +
      '<span class="field-label">' + esc(t('cv.pickSkills')) + '</span>' +
      '<div class="pill-tags">' + picks + '</div>' +
    '</div>';
  }

  const suggestion = S.cvSuggestion
    ? '<div class="card card-pad" style="border-color:var(--indigo);">' +
        '<div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--indigo);margin-bottom:10px;">' +
          icon('sparkle') + esc(t('cv.suggestion')) + '</div>' +
        '<p style="font-size:12.5px;line-height:1.7;">' + esc(S.cvSuggestion) + '</p>' +
        '<p class="inline-note" style="margin-top:10px;">' + esc(t('cv.reviewNote')) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="btn-ghost" onclick="discardSuggestion()">' + esc(t('cv.discard')) + '</button>' +
          '<button class="btn-small" onclick="applySuggestion()">' + esc(t('cv.apply')) + '</button></div>' +
      '</div>'
    : '';

  const editor = '<div class="stack">' +
    '<div class="card card-pad">' +
      '<span class="field-label">' + esc(t('cv.language')) + '</span>' +
      '<div class="segmented" style="margin-bottom:8px;">' +
        '<button class="' + (S.cvLang==='ar'?'active':'') + '" onclick="setCvLang(\'ar\')">العربية</button>' +
        '<button class="' + (S.cvLang==='en'?'active':'') + '" onclick="setCvLang(\'en\')">English</button>' +
      '</div>' +
      '<p class="inline-note">' + esc(t('cv.langNote')) + '</p>' +
    '</div>' +

    '<div class="card card-pad">' +
      '<div class="field" style="margin-bottom:0;">' +
        '<label>' + esc(t('cv.summary')) + '</label>' +
        '<textarea dir="' + (S.cvLang==='ar'?'rtl':'ltr') + '" placeholder="' + esc(t('cv.summaryPlaceholder')) +
          '" oninput="setCvSummary(this.value)" style="min-height:96px;">' + esc(cv.summary) + '</textarea>' +
      '</div>' +
      '<button class="btn-ghost" style="margin-top:10px;display:flex;align-items:center;gap:6px;" onclick="improveCv()">' +
        icon('sparkle') + esc(t('cv.improve')) + '</button>' +
      '<p class="inline-note" style="margin-top:7px;">' + esc(t('cv.improveSub')) + '</p>' +
    '</div>' +

    suggestion +

    SKILL_GROUPS.map(skillCard).join('') +

    '<div class="card card-pad">' +
      '<span class="field-label">' + esc(t('cv.verified')) + '</span>' +
      cvVerifiedBlock() +
      '<p class="inline-note" style="margin-top:10px;">' + esc(t('cv.verifiedNote')) + '</p>' +
    '</div>' +

    '<button class="btn-primary no-print" onclick="exportCv()" style="display:flex;align-items:center;justify-content:center;gap:8px;">' +
      icon('download') + esc(t('common.print')) + '</button>' +
    '<p class="inline-note" style="text-align:center;">' + esc(t('cv.exportNote')) + '</p>' +
  '</div>';

  return '<div class="screen-body"><div class="wide two-col">' +
    editor +
    '<div><p class="section-eyebrow no-print">' + esc(t('cv.preview')) + '</p>' + cvSheet() + '</div>' +
  '</div></div>';
}

/* ---------- Student: logbook ---------- */

const MIN_LOG_CHARS = 80;

function weekStrip(onClick) {
  return '<div class="week-strip">' + S.weeks.map(w =>
    '<' + (onClick ? 'button' : 'div') + ' class="week-pip ' + w.status +
      (w.no === S.openWeek ? ' current' : '') + '"' +
      (onClick ? ' onclick="openWeekNo(' + w.no + ')"' : '') +
      ' title="' + esc(t('common.week') + ' ' + w.no) + '">' + w.no +
    '</' + (onClick ? 'button' : 'div') + '>').join('') + '</div>';
}

function screenLogbook() {
  const w = S.weeks.find(x => x.no === S.openWeek) || S.weeks[0];
  const text = L(w.text);
  const chars = text.trim().length;
  const days = w.days.filter(Boolean).length;
  const editable = w.status === 'draft';
  const canSubmit = editable && days > 0 && chars >= MIN_LOG_CHARS;

  const dayBtns = DAYS.map((d, i) =>
    '<button class="day-btn' + (w.days[i] ? ' on' : '') + '"' + (editable ? '' : ' disabled') +
      ' onclick="toggleDay(' + i + ')" aria-pressed="' + !!w.days[i] + '">' +
      '<span>' + esc(L(d)) + '</span><strong>' + (w.days[i] ? '✓' : '—') + '</strong></button>').join('');

  const statusBadge = {
    approved:  '<span class="badge badge-verified">' + esc(t('lb.approved')) + '</span>',
    submitted: '<span class="badge badge-pending">' + esc(t('lb.submitted')) + '</span>',
    draft:     '<span class="badge badge-stage">' + esc(t('lb.draft')) + '</span>',
    locked:    '<span class="badge badge-muted">' + esc(t('lb.locked')) + '</span>'
  }[w.status];

  const monthCards = [1,2,3].map(m => {
    const st = S.months[m];
    const label = { approved:t('lb.monthApproved'), ready:t('lb.monthReady'),
                    pending:t('lb.monthPending'), returned:t('lb.monthReturned') }[st];
    const colour = { approved:'var(--palm)', ready:'var(--amber)', returned:'var(--amber)', pending:'var(--ink-faint)' }[st];
    return '<div class="month-card"><div class="m-label">' + esc(t('lb.month', {n:m})) + '</div>' +
      '<div class="m-status" style="color:' + colour + ';">' + esc(label) + '</div></div>';
  }).join('');

  return '<div class="screen-body"><div class="constrain stack">' +
    '<div class="card card-pad">' +
      '<div class="section-head" style="margin:0 0 8px;">' +
        '<p class="section-eyebrow">' + esc(t('pl.progress')) + '</p>' +
        '<span class="inline-note">' + esc(t('pl.weeksApproved', {n:4})) + '</span></div>' +
      weekStrip(true) +
      '<p class="inline-note" style="margin-top:8px;">' + esc(t('lb.lockedNote')) + '</p>' +
    '</div>' +

    '<div class="card card-pad">' +
      '<div class="section-head" style="margin:0 0 12px;">' +
        '<p class="section-eyebrow">' + esc(t('lb.week', {n:w.no})) + '</p>' + statusBadge + '</div>' +

      '<span class="field-label">' + esc(t('lb.attendance')) + '</span>' +
      '<div class="day-row">' + dayBtns + '</div>' +
      '<p class="inline-note" style="margin:7px 0 16px;">' + esc(t('lb.workingWeek')) + '</p>' +

      '<div class="field" style="margin-bottom:8px;"><label>' + esc(t('lb.entry')) + '</label>' +
        '<textarea style="min-height:130px;"' + (editable ? '' : ' disabled') +
          ' placeholder="' + esc(t('lb.entryPlaceholder')) + '" oninput="setWeekText(this.value)">' +
          esc(text) + '</textarea></div>' +

      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;">' +
        '<span class="char-count ' + (chars >= MIN_LOG_CHARS ? 'ok' : 'short') + '">' +
          esc(t('lb.charsSoFar', {n:chars})) + '</span>' +
        '<span class="inline-note">' + esc(t('lb.minChars', {n:MIN_LOG_CHARS})) + '</span></div>' +

      (editable
        ? '<button class="btn-primary" onclick="submitWeek()"' + (canSubmit ? '' : ' disabled') + '>' +
            esc(t('lb.submit')) + '</button>' +
          (days === 0 ? '<p class="inline-note" style="text-align:center;margin-top:8px;">' +
            esc(t('lb.needsDay')) + '</p>' : '')
        : '') +
    '</div>' +

    '<p class="section-eyebrow">' + esc(t('lb.months')) + '</p>' +
    '<div class="month-track">' + monthCards + '</div>' +
    '</div></div>';
}

                   title:()=>{const l=DATA.listings.find(x=>x.id===S.openListing);return l?L(l.pharmacy):'';}, body:screenListing },

  handoff:       { eyebrow:()=>t('nav.shifts'), title:()=>t('h.title'), body:screenHandoff },

  cv:            { eyebrow:()=>currentName(), title:()=>t('cv.title'), body:screenCv },

/* The bottom bar gets five at most — more than five targets on a phone is a
   menu pretending to be a nav. The sidebar can carry the rest. */
const NAV = {
  pharmacist: [['browse','home','nav.browse'],['shifts','calendar','nav.shifts'],['earnings','wallet','nav.earnings'],
               ['cv','clipboard','nav.cv'],['profile','user','nav.profile']],

  admin:      [['queue','badge','nav.queue'],['profile','user','nav.profile']]
};

/* Sidebar-only extras: real enough to reach, not important enough to spend one
   of five thumb-sized targets on. */
const NAV_EXTRA = {
  pharmacist: [['notifications','bell','nav.notifications'],['incidents','alert','nav.incidents']],
  pharmacy:   [['notifications','bell','nav.notifications'],['incidents','alert','nav.incidents']],

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return lang==='ar' ? 'صباح الخير' : 'Good morning';
  if (h < 18) return lang==='ar' ? 'مساء الخير' : 'Good afternoon';
  return lang==='ar' ? 'مساء الخير' : 'Good evening';
}

function currentName() {
  const a = ACCOUNTS[S.email];
  return a ? t(a.nameKey) : '';
}

function unreadCount() {
  return S.notifs.filter(n => n.roles.includes(S.role) && !n.read).length;
}

/* ==========================================================================
   RENDER
   ========================================================================== */

function render() {
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('auth').classList.toggle('hidden', S.signedIn);
  document.getElementById('app').classList.toggle('hidden', !S.signedIn);

  if (!S.signedIn) { renderAuth(); renderModal(); return; }

  // Tear the sign-in page out of the DOM rather than just hiding it. A hidden
  // copy keeps stale content and a second #email/#password around, and the
  // first thing that goes looking for one of those ids finds the wrong one.
  document.getElementById('auth').innerHTML = '';

  const screen = SCREENS[S.screen] || SCREENS.browse;
  const unread = unreadCount();

  document.getElementById('app-header').innerHTML = headerHtml(screen.eyebrow(), screen.title());
  document.getElementById('app-body').innerHTML = verificationBanner() + screen.body();

  const nav = NAV[S.role] || NAV.pharmacist;
  const extra = NAV_EXTRA[S.role] || [];

  document.getElementById('bottom-nav').innerHTML = nav.map(([id, ic, key]) =>
    '<button class="nav-item' + (S.screen === id ? ' active' : '') + '" onclick="goto(\'' + id + '\')">' +
    icon(ic) + '<span>' + esc(t(key)) + '</span></button>').join('');

  document.getElementById('side-nav').innerHTML = nav.concat(extra).map(([id, ic, key]) =>
    '<button class="side-nav-item' + (S.screen === id ? ' active' : '') + '" onclick="goto(\'' + id + '\')">' +
    icon(ic) + '<span>' + esc(t(key)) + '</span>' +
    (id === 'notifications' && unread ? '<span class="side-nav-count">' + unread + '</span>' : '') +
    '</button>').join('');

  const acct = ACCOUNTS[S.email];
  document.getElementById('side-account').innerHTML = acct
    ? '<span class="avatar">' + esc(L(acct.initials)) + '</span>' +
      '<span style="flex:1;min-width:0;"><span class="side-account-name">' + esc(t(acct.nameKey)) + '</span>' +
      '<span class="side-account-role">' + esc(t(acct.tagKey)) + '</span></span>'
    : '';

  document.getElementById('sidebar-sub').textContent = t('brand.short');
  document.getElementById('build-tag').textContent = VERSION;
  document.getElementById('sidebar-brand').textContent = 'Saydali+';
  document.getElementById('topbar-brand').textContent = 'Saydali+';

  renderModal();
}

function headerActions() {
  const unread = unreadCount();
  return '<div class="header-actions">' +
    /* The operator's half of the product. Only the platform's own reviewer
       sees it — a pharmacy has no business in the CRM that tracks it. */
    (S.role === 'admin'
      ? '<button class="lang-btn" onclick="openCrm()" title="CRM">CRM</button>'
      : '') +
    '<button class="lang-btn" onclick="setLang(\'' + (lang === 'ar' ? 'en' : 'ar') + '\')">' +
      (lang === 'ar' ? 'EN' : 'ع') + '</button>' +
    '<button class="icon-btn" onclick="goto(\'notifications\')" aria-label="' + esc(t('n.title')) + '">' +
      icon('bell') + (unread ? '<span class="dot"></span>' : '') + '</button>' +
  '</div>';
}

/* ==========================================================================

function renderModal() {
  const root = document.getElementById('modal-root');
  if (!S.modal) { root.innerHTML = ''; return; }

  let inner = '';
  if (S.modal.kind === 'txn') {
    const x = TXNS.find(y => y.id === S.modal.id);
    inner = x ? txnModal(x) : '';
  } else if (S.modal.kind === 'destination') {
    inner = destinationModal();
  } else if (S.modal.kind === 'payout') {
    inner = payoutModal();
  } else if (S.modal.kind === 'return') {
    inner = returnModal(S.modal.month);
  }

  root.innerHTML = '<div class="modal-back" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal" role="dialog" aria-modal="true">' + inner + '</div></div>';
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */

function setLang(l){ lang = l; render(); }
/* The sibling build. Files carry their version in the name, so this is the one
   thing a version bump can silently break — which is why demo/check.mjs
   asserts the file named here exists on disk. Bump the CRM, change this line. */
const PEER_CRM = '../crm/saydali-crm_v0.0001.html';
function openCrm(){ window.open(PEER_CRM, '_blank', 'noopener'); }
function setAuth(s){ authScreen = s; authError = null; render(); }
function chooseRole(r){ signupRole = r; authScreen = 'signup'; render(); }

function useAccount(mail){
  S.email = mail;
  authError = null;
  render();
  const p = document.getElementById('password');
  if (p) { p.value = 'password123'; p.focus(); }
}

function attemptSignIn(){
  const mail = (document.getElementById('email').value || '').trim().toLowerCase();
  const pass = document.getElementById('password').value || '';

  if (!mail || !pass) { authError = 'auth.needEmail'; render(); return; }
  if (!ACCOUNTS[mail]) { authError = 'auth.noAccount'; S.email = mail; render(); return; }
  signInAs(mail);
}

function signInAs(mail){
  const a = ACCOUNTS[mail];
  S.email = mail;
  S.role = a.role;
  S.verified = a.verified;
  S.trial = a.trial;
  S.signedIn = true;
  S.screen = (NAV[a.role] || NAV.pharmacist)[0][0];
  authError = null;
  render();
}

function signOut(){
  S.signedIn = false;
  S.modal = null;
  authScreen = 'signin';
  authError = null;
  render();
}

function goto(s){ S.screen = s; S.modal = null; render(); scrollTop(); }
function scrollTop(){ const b = document.getElementById('app-body'); if (b) b.scrollTop = 0; }
function setDistrict(d){ S.district = d; render(); }
function openListing(id){ S.openListing = id; S.screen = 'listing'; render(); scrollTop(); }
function applyTo(id){ S.applied[id] = true; toast(S.verified ? t('l.applied') : t('ver.queued')); render(); }
function accept(id){ S.accepted[id] = true; toast(t('app.acceptedToast')); render(); }
function review(id){ S.reviewed[id] = true; toast(t('q.verifiedToast')); render(); }

function toggleHandoff(k){
  if (S.handoffConfirmedByMe) return;
  S.handoff[k] = !S.handoff[k];
  render();
}
function confirmHandoff(){
  if (!['i1','i2','i3','i4','i5'].every(k => S.handoff[k])) return;
  S.handoffConfirmedByMe = true;
  toast(t('h.both'));
  render();
}

function setPostType(v){ S.postType = v; render(); }
function setRateType(v){ S.rateType = v; S.rate = v === 'hourly' ? 5000 : 40000; render(); }
function setRate(v){ S.rate = Number(v) || 0; render(); }
function setTime(which, v){ if (!v) return; S[which] = v; render(); }

/* ---------- Earnings ---------- */

function closeModal(){ S.modal = null; renderModal(); }
function openTxn(id){ S.modal = { kind:'txn', id:id }; renderModal(); }
function openDestination(){ S.modal = { kind:'destination' }; renderModal(); }
function openPayout(){
  if (!S.payoutDestination.trim()) { openDestination(); return; }
  S.modal = { kind:'payout' };
  renderModal();
}
function setPayoutMethod(m){
  // Keep whatever is typed before re-rendering the modal, or switching method
  // silently discards the number the user just entered.
  const input = document.getElementById('dest-input');
  if (input) S.payoutDestination = input.value;
  S.payoutMethod = m;
  renderModal();
}
function saveDestination(){
  const v = (document.getElementById('dest-input').value || '').trim();
  if (!v) { toast(t('e.noDestination')); return; }
  S.payoutDestination = v;
  S.modal = null;
  toast(t('e.destSaved'));
  render();
}
function requestPayout(){
  // Mirrors request_payout(): refuses without a destination rather than
  // "succeeding" and stranding the money somewhere nobody can collect it.
  if (!S.payoutDestination.trim()) { openDestination(); return; }
  S.modal = null;
  toast(t('e.payoutRequested'));
  render();
}

/* ---------- CV ---------- */

function setCvLang(l){ S.cvLang = l; S.cvSuggestion = null; render(); }
function setCvSummary(v){ S.cv[S.cvLang].summary = v; }
function toggleSkill(group, label){
  const arr = S.cv[S.cvLang].skills[group];
  const i = arr.indexOf(label);
  if (i >= 0) arr.splice(i, 1); else arr.push(label);
  render();
}
function improveCv(){
  const cur = S.cv[S.cvLang].summary.trim();
  if (!cur) { toast(t('cv.summaryPlaceholder')); return; }
  /* The real assistant calls the Anthropic API server-side under a prompt that
     forbids invention. What matters for the interface is the rule it enforces:
     a suggestion is shown, never applied. */
  S.cvSuggestion = S.cvLang === 'ar'
    ? 'صيدلي مجاز بخبرة سبع سنوات في صيدليات المجتمع ببغداد، متخصص في مناوبات الإسناد المسائية والليلية، بما فيها المناوبات التي تشمل سجل المواد الخاضعة للرقابة.'
    : 'Licensed pharmacist with seven years in Baghdad community pharmacy, specialising in evening and overnight relief cover, including shifts involving the controlled substances register.';
  render();
}
function applySuggestion(){
  S.cv[S.cvLang].summary = S.cvSuggestion;
  S.cvSuggestion = null;
  toast(t('cv.saved'));
  render();
}
function discardSuggestion(){ S.cvSuggestion = null; render(); }
function exportCv(){ window.print(); }
function exportCertificate(){ window.print(); }

/* ---------- Logbook ---------- */

function openWeekNo(n){
  const w = S.weeks.find(x => x.no === n);
  if (!w || w.status === 'locked') { toast(t('lb.locked')); return; }
  S.openWeek = n;
  render();
}
function toggleDay(i){
  const w = S.weeks.find(x => x.no === S.openWeek);
  if (!w || w.status !== 'draft') return;
  w.days[i] = !w.days[i];
  render();
}
function setWeekText(v){
  const w = S.weeks.find(x => x.no === S.openWeek);
  if (!w || w.status !== 'draft') return;
  w.text = { en:v, ar:v };
  // Re-render only the counter: re-rendering the screen would steal the caret.
  const el = document.querySelector('.char-count');
  if (el) {
    const n = v.trim().length;
    el.textContent = t('lb.charsSoFar', {n:n});
    el.className = 'char-count ' + (n >= MIN_LOG_CHARS ? 'ok' : 'short');
  }
  const btn = document.querySelector('.card .btn-primary');
  if (btn) btn.disabled = !(v.trim().length >= MIN_LOG_CHARS && w.days.some(Boolean));
}
function submitWeek(){
  const w = S.weeks.find(x => x.no === S.openWeek);
  if (!w || w.status !== 'draft') return;
  if (!w.days.some(Boolean) || L(w.text).trim().length < MIN_LOG_CHARS) return;
  w.status = 'submitted';
  // Forward-fill: the next week opens only once this one is in.
  const next = S.weeks.find(x => x.no === w.no + 1);
  if (next && next.status === 'locked') { next.status = 'draft'; S.openWeek = next.no; }
  toast(t('lb.weekSubmitted', {n:w.no}));
  render();
}

/* ---------- Trainees ---------- */

function openReturn(m){ S.modal = { kind:'return', month:Number(m) }; renderModal(); }
function approveMonth(m){
  S.months[m] = 'approved';
  S.weeks.filter(w => w.no > (m - 1) * 4 && w.no <= m * 4)
         .forEach(w => { if (w.status === 'submitted') w.status = 'approved'; });
  toast(t('tr.approved', {n:m}));
  render();
}
function returnMonth(m){
  S.months[m] = 'returned';
  S.modal = null;
  toast(t('tr.returned', {n:m}));
  render();
}

/* ---------- Notifications ---------- */

function readNotif(id){
  const n = S.notifs.find(x => x.id === id);
  if (n) n.read = true;
  render();
}
function markAllRead(){
  S.notifs.forEach(n => { if (n.roles.includes(S.role)) n.read = true; });
  render();
}

/* ---------- Toast ---------- */

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });

render();
</script>
