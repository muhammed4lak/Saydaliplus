<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Saydali+ — صيدلي+</title>
<!--
  A single-file demo of Saydali+ as actually built.

  This is NOT the application. The real thing is a Next.js + Supabase app in
  this repository; its security model is Postgres row-level security, and none
  of that can exist in a file you open from disk. What this is: a faithful
  reproduction of the screens, the design system and the arithmetic, so the
  product can be shown to a pharmacy or an investor without standing anything up.

  Two things are real here rather than mocked, because they are the things worth
  checking: the fee engine below is a line-for-line port of src/config/fees.ts,
  and the shift-hours function is a port of src/lib/time.ts. The numbers this
  demo shows are the numbers the product charges.

  Everything behind them — accounts, listings, applicants — is fixture data.
  Screens that are not built in the real app say so here too, rather than
  showing a convincing mock of something that does not exist.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1826; --ink-soft:#57536E; --ink-faint:#8B87A3;
    --indigo:#2D2A6E; --indigo-dark:#191735; --indigo-tint:#E7E6F4;
    --amber:#B8791F; --amber-tint:#F5E6C8;
    --palm:#4F7A47; --palm-tint:#E7EFE3;
    --mist:#EFEEF7; --card:#FFFFFF; --border:#E1DFEC;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --font-ar:'Noto Kufi Arabic','IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:linear-gradient(180deg,#F0EFF9 0%,var(--mist) 100%);
    color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:22px 14px 48px; -webkit-font-smoothing:antialiased;
  }
  html[dir="rtl"] body{ font-family:var(--font-ar); }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:none; }
  :focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; border-radius:4px; }
  .figure{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .hidden{ display:none !important; }

  /* ---------- Demo chrome ---------- */
  .demo-bar{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    margin-bottom:8px;
  }
  .pill-group{
    display:flex; gap:2px; background:var(--card); border:1px solid var(--border);
    border-radius:100px; padding:4px; box-shadow:0 1px 2px rgba(20,30,28,.04);
  }
  .pill{
    font-family:var(--font-display); font-weight:600; font-size:13.5px;
    padding:8px 16px; border-radius:100px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .pill svg{ width:15px; height:15px; }
  .pill.active{ background:var(--indigo); color:#fff; }
  .pill-group.dark .pill.active{ background:var(--ink); }
  .demo-note{
    font-size:12px; color:var(--ink-faint); text-align:center; line-height:1.6;
    max-width:640px; margin:0 auto 20px;
  }
  .demo-note strong{ color:var(--indigo); font-weight:600; }

  /* ---------- Phone frame ---------- */
  .phone-frame{
    width:min(390px,100%); height:min(800px,86vh);
    background:var(--card); border-radius:42px; border:9px solid var(--ink);
    box-shadow:0 24px 60px -18px rgba(13,30,28,.35);
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .phone-statusbar{
    flex:none; display:flex; justify-content:space-between; align-items:center;
    padding:14px 26px 4px; font-family:var(--font-mono); font-size:13px; font-weight:600;
  }
  .statusbar-icons{ display:flex; align-items:center; gap:6px; }
  .signal-bars{ display:flex; align-items:flex-end; gap:2px; height:9px; }
  .signal-bars span{ width:3px; background:var(--ink); border-radius:1px; display:block; }
  .signal-bars span:nth-child(1){height:4px;} .signal-bars span:nth-child(2){height:6px;}
  .signal-bars span:nth-child(3){height:7.5px;} .signal-bars span:nth-child(4){height:9px;}
  .battery{ width:21px; height:10px; border:1.4px solid var(--ink); border-radius:2.5px; padding:1.5px; position:relative; }
  .battery::after{ content:''; position:absolute; inset-inline-end:-3.5px; top:3px; width:2px; height:4px; background:var(--ink); border-radius:1px; }
  .battery-fill{ width:78%; height:100%; background:var(--ink); border-radius:1px; }
  .phone-viewport{ flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
  .phone-body{ flex:1; min-height:0; overflow-y:auto; }
  .phone-body::-webkit-scrollbar{ width:0; }

  /* ---------- Web shell ---------- */
  #web-stage{ width:100%; max-width:1180px; }
  .web-shell{
    display:flex; background:var(--card); border:1px solid var(--border);
    border-radius:20px; overflow:hidden;
    box-shadow:0 24px 60px -24px rgba(13,30,28,.25); min-height:700px;
  }
  .web-sidebar{
    width:236px; flex:none; color:#fff; padding:24px 18px;
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  /* The star tile is a regional cue, not wallpaper. Across the sidebar's tall
     empty column it reads much heavier than it does in a short header band, so
     it is dialled back here rather than given a second opacity value. */
  .web-sidebar .header-pattern{ opacity:.45; }
  .web-brand{ font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:22px; position:relative; }
  .web-nav{ display:flex; flex-direction:column; gap:2px; flex:1; position:relative; }
  .web-nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    color:rgba(255,255,255,.72); font-size:13.5px; font-weight:500; text-align:start; width:100%;
  }
  .web-nav-item svg{ width:17px; height:17px; flex:none; }
  .web-nav-item.active{ background:rgba(255,255,255,.16); color:#fff; font-weight:600; }
  .web-nav-item:hover{ background:rgba(255,255,255,.09); }
  .web-sidebar-foot{
    font-size:11px; color:rgba(255,255,255,.55); line-height:1.6;
    padding-top:16px; margin-top:12px; border-top:1px solid rgba(255,255,255,.15); position:relative;
  }
  .web-main{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--mist); }
  .web-body{ flex:1; min-height:0; overflow-y:auto; }

  /* ---------- Header with the star tile ---------- */
  .app-header{
    flex:none; position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(135deg,var(--indigo) 0%,var(--indigo-dark) 100%);
    padding:20px 22px 18px;
  }
  .web-main .app-header{ padding:26px 34px; }
  .header-pattern{ position:absolute; inset:0; width:100%; height:100%; }
  .header-row{ position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .header-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em;
    text-transform:uppercase; color:rgba(255,255,255,.68); margin-bottom:5px;
  }
  .header-title{ font-family:var(--font-display); font-size:22px; font-weight:700; line-height:1.15; }
  .icon-btn{
    flex:none; width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn svg{ width:18px; height:18px; color:#fff; }

  /* ---------- Content ---------- */
  .screen-body{ padding:18px 20px 28px; }
  .web-body .screen-body{ padding:26px 34px 40px; }
  .constrain{ max-width:640px; }
  .section-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); margin:20px 0 10px;
  }
  .section-eyebrow:first-child{ margin-top:0; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .card-pad{ padding:16px 17px; }
  .stack > * + *{ margin-top:12px; }

  .grid-cards{ display:grid; gap:12px; }
  .web-body .grid-cards{ grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
  .two-col{ display:grid; gap:22px; align-items:start; }
  .web-body .two-col{ grid-template-columns:1.5fr 1fr; }

  /* ---------- Chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip-row::-webkit-scrollbar{ height:0; }
  .chip{
    flex:none; font-size:13px; font-weight:500; padding:7px 14px; border-radius:100px;
    border:1px solid var(--border); background:var(--card); color:var(--ink-soft);
  }
  .chip.active{ background:var(--indigo); border-color:var(--indigo); color:#fff; }

  /* ---------- Listing card ---------- */
  .listing-card{
    width:100%; text-align:start; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:15px 16px; display:block; transition:border-color .12s, box-shadow .12s;
  }
  .listing-card:hover{ border-color:rgba(45,42,110,.4); box-shadow:0 6px 16px -8px rgba(20,30,28,.18); }
  .listing-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:9px; }
  .pharmacy-name{ font-family:var(--font-display); font-weight:600; font-size:15.5px; }
  html[dir="rtl"] .pharmacy-name{ font-family:var(--font-ar); font-size:14.5px; }
  .pay-amount{ font-family:var(--font-mono); font-weight:600; font-size:14.5px; color:var(--indigo); white-space:nowrap; }
  .pay-basis{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .meta-line{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .meta-line svg{ width:13px; height:13px; color:var(--ink-faint); flex:none; }
  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:500; padding:4px 9px; border-radius:100px; }
  .badge svg{ width:12px; height:12px; }
  .badge-otc{ background:var(--indigo-tint); color:var(--indigo-dark); }
  .badge-controlled{ background:var(--amber-tint); color:var(--amber); }
  .badge-verified{ background:var(--palm-tint); color:var(--palm); }
  .badge-pending{ background:var(--amber-tint); color:#8A5610; }
  .badge-stage{ background:var(--amber-tint); color:#8A5610; }
  .badge-muted{ background:var(--mist); color:var(--ink-faint); }

  /* ---------- Buttons ---------- */
  .btn-primary{
    width:100%; background:var(--indigo); color:#fff; font-family:var(--font-display);
    font-weight:600; font-size:14.5px; padding:13px; border-radius:13px; text-align:center; transition:background .12s;
  }
  html[dir="rtl"] .btn-primary, html[dir="rtl"] .btn-secondary{ font-family:var(--font-ar); }
  .btn-primary:hover{ background:var(--indigo-dark); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-secondary{
    width:100%; background:var(--card); color:var(--indigo); border:1.4px solid var(--indigo);
    font-family:var(--font-display); font-weight:600; font-size:14px; padding:11.5px;
    border-radius:13px; text-align:center;
  }
  .btn-secondary:hover{ background:var(--indigo-tint); }
  .btn-small{
    font-size:12.5px; font-weight:600; font-family:var(--font-display); padding:7px 14px;
    border-radius:9px; background:var(--indigo); color:#fff; flex:none;
  }
  .btn-small.green{ background:var(--palm); }
  .btn-ghost{
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px;
    border:1px solid var(--border); color:var(--ink-soft);
  }
  .link-btn{ font-size:12.5px; font-weight:500; color:var(--indigo); text-decoration:underline; text-underline-offset:2px; }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:15px; }
  .field label, .field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1.4px solid var(--border); border-radius:11px;
    padding:11px 13px; font-size:14px; background:var(--card); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--indigo); }
  .field textarea{ resize:none; min-height:74px; }
  .field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; line-height:1.5; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .checkbox-row{
    display:flex; align-items:center; gap:10px; padding:12px 13px;
    border:1.4px solid var(--border); border-radius:11px; margin-bottom:15px;
  }
  .checkbox-row input{ width:18px; height:18px; accent-color:var(--amber); }
  .checkbox-row label{ font-size:13.5px; margin:0; font-weight:400; color:var(--ink); }

  .segmented{ display:flex; background:var(--indigo-tint); border-radius:11px; padding:3px; margin-bottom:15px; }
  .segmented button{ flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--indigo-dark); }
  .segmented button.active{ background:#fff; box-shadow:0 1px 3px rgba(20,30,28,.12); }

  /* ---------- Banners ---------- */
  .banner{ display:flex; align-items:flex-start; gap:10px; border-radius:14px; padding:12px 14px; }
  .banner svg{ width:18px; height:18px; flex:none; margin-top:1px; }
  .banner p{ font-size:12.5px; line-height:1.55; }
  .banner-amber{ background:var(--amber-tint); border:1px solid #E3CE9E; color:#8A5610; }
  .banner-amber svg{ color:var(--amber); }
  .banner-green{ background:var(--palm-tint); border:1px solid #CFE0C9; color:var(--ink-soft); }
  .banner-green svg{ color:var(--palm); }
  .banner-indigo{ background:var(--indigo-tint); border:1px solid #D6D4EC; color:var(--indigo-dark); }
  .banner-indigo svg{ color:var(--indigo); }

  /* ---------- Stats ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .stat-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; }
  .stat-num{ font-family:var(--font-mono); font-weight:600; font-size:17px; color:var(--indigo); display:block; }
  .stat-label{ font-size:10.5px; color:var(--ink-faint); margin-top:3px; line-height:1.35; display:block; }

  /* ---------- Rows ---------- */
  .row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); }
  .row:last-child{ border-bottom:none; }
  .row-body{ flex:1; min-width:0; }
  .row-title{ font-size:13.5px; font-weight:500; }
  .row-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .row-value{ font-family:var(--font-mono); font-size:13px; font-weight:600; flex:none; }

  .kv{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .kv:last-child{ border-bottom:none; }
  .kv svg{ width:16px; height:16px; color:var(--indigo); margin-top:2px; flex:none; }
  .kv-label{ font-size:11.5px; color:var(--ink-faint); }
  .kv-value{ font-size:13.5px; font-weight:500; margin-top:2px; }

  .rating{ display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  .rating svg{ width:13px; height:13px; color:var(--amber); }

  /* ---------- Fee breakdown ---------- */
  .fee-line{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0; font-size:13px; }
  .fee-line dt{ color:var(--ink-soft); }
  .fee-line dd{ font-family:var(--font-mono); font-weight:600; }
  .fee-total{ border-top:1px solid var(--border); margin-top:4px; padding-top:10px; }
  .fee-total dt{ color:var(--ink); font-weight:600; }
  .fee-total dd{ font-size:15px; color:var(--indigo); }
  .fee-foot{ font-size:11.5px; color:var(--ink-faint); line-height:1.6; margin-top:12px; border-top:1px solid var(--border); padding-top:10px; }
  .fee-trial{ color:var(--palm); font-weight:600; }

  /* ---------- Handoff ---------- */
  .check-item{ display:flex; align-items:flex-start; gap:12px; padding:14px 16px; width:100%; text-align:start; border-bottom:1px solid var(--border); }
  .check-item:last-child{ border-bottom:none; }
  .check-item:hover{ background:var(--mist); }
  .check-item:disabled{ cursor:default; }
  .check-item:disabled:hover{ background:transparent; }
  .check-box{
    margin-top:1px; width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; transition:.12s;
  }
  .check-box svg{ width:13px; height:13px; color:#fff; opacity:0; }
  .check-item.done .check-box{ background:var(--palm); border-color:var(--palm); }
  .check-item.done .check-box svg{ opacity:1; }
  .check-text{ font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
  .check-item.done .check-text{ color:var(--ink); }

  /* ---------- Applicant ---------- */
  .applicant-top{ display:flex; gap:11px; align-items:flex-start; margin-bottom:10px; }
  .avatar{
    width:40px; height:40px; border-radius:12px; background:var(--indigo-tint); color:var(--indigo-dark);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-ar);
    font-weight:700; font-size:14px; flex:none;
  }
  .avatar.amber{ background:var(--amber-tint); color:#8A5610; }
  .no-record{ font-size:12.5px; color:var(--ink-faint); font-style:normal; }

  /* ---------- Not built ---------- */
  .not-built{ text-align:center; padding:44px 20px; max-width:460px; margin:0 auto; }
  .not-built-icon{
    width:48px; height:48px; border-radius:16px; background:var(--indigo-tint);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .not-built-icon svg{ width:20px; height:20px; color:var(--indigo); }
  .not-built h3{ font-family:var(--font-display); font-size:16px; }
  html[dir="rtl"] .not-built h3{ font-family:var(--font-ar); }
  .not-built p{ font-size:13px; line-height:1.65; color:var(--ink-soft); margin-top:8px; }
  .not-built .phase{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-top:14px;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{ flex:none; display:flex; border-top:1px solid var(--border); background:#fff; padding:8px 8px; }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; color:var(--ink-faint); }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item span{ font-size:10px; font-weight:500; }
  .nav-item.active{ color:var(--indigo); }

  /* ---------- Auth ---------- */
  #auth-stage{ width:100%; max-width:520px; }
  .auth-card{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:30px 30px 32px; box-shadow:0 20px 50px -24px rgba(25,23,53,.28);
  }
  .auth-brand{ font-family:var(--font-display); font-weight:700; font-size:27px; color:var(--indigo); text-align:center; }
  .auth-brand-ar{ font-family:var(--font-ar); font-size:15px; color:var(--ink-faint); text-align:center; margin-top:2px; }
  .auth-tagline{ font-size:13.5px; color:var(--ink-soft); text-align:center; margin-top:12px; line-height:1.6; }
  .auth-divider{ height:1px; background:var(--border); margin:22px 0; }
  .auth-heading{ font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:5px; }
  html[dir="rtl"] .auth-heading{ font-family:var(--font-ar); }
  .auth-sub{ font-size:13px; color:var(--ink-faint); margin-bottom:20px; line-height:1.6; }
  .auth-foot{ font-size:13px; color:var(--ink-soft); text-align:center; margin-top:16px; }
  .auth-back{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-bottom:16px; }
  .auth-back svg{ width:14px; height:14px; transform:scaleX(-1); }
  html[dir="rtl"] .auth-back svg{ transform:none; }

  .role-option{
    display:flex; align-items:center; gap:13px; width:100%; text-align:start;
    border:1.6px solid var(--border); border-radius:14px; padding:15px 16px;
    background:var(--card); transition:.12s; margin-bottom:10px;
  }
  .role-option:hover{ border-color:var(--indigo); background:rgba(231,230,244,.4); }
  .role-icon{ width:40px; height:40px; border-radius:12px; background:var(--indigo-tint); display:flex; align-items:center; justify-content:center; flex:none; }
  .role-icon svg{ width:19px; height:19px; color:var(--indigo-dark); }
  .role-title{ font-size:14px; font-weight:600; }
  .role-sub{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; line-height:1.5; }

  .timeline{ margin:22px 0; }

"use strict";

/* ==========================================================================
   1. THE FEE ENGINE
   A port of src/config/fees.ts. Kept identical on purpose: the whole point of
   showing a pharmacy a fee breakdown is that the number is the real number.
   ========================================================================== */

const FEES = {
  TOTAL_COMMISSION_RATE: 0.10,
  PHARMACY_SHARE: 0.70,      // 7% of shift value, added ON TOP
  PHARMACIST_SHARE: 0.30,    // 3% of shift value, deducted FROM payout
  MINIMUM_COMMISSION_IQD: 2500,
  TRIAL_DAYS: 30,
  PROCESSOR_FEE_RATE: 0.02
};

function calculateFees({ grossAmount, pharmacyInTrial, pharmacistInTrial }) {
  if (!isFinite(grossAmount) || grossAmount < 0) throw new Error('Invalid gross amount');

  const percentage = grossAmount * FEES.TOTAL_COMMISSION_RATE;
  const floorApplied = grossAmount > 0 && percentage < FEES.MINIMUM_COMMISSION_IQD;
  const chargeable = grossAmount === 0 ? 0 : Math.max(percentage, FEES.MINIMUM_COMMISSION_IQD);

  const fullPharmacyFee = Math.round(chargeable * FEES.PHARMACY_SHARE);
  // Derived by subtraction so the two sides always reconcile to the commission
  // exactly — rounding each independently can lose or invent a dinar.
  const fullPharmacistFee = Math.round(chargeable) - fullPharmacyFee;

  const pharmacyFee = pharmacyInTrial ? 0 : fullPharmacyFee;
  const pharmacistFee = pharmacistInTrial ? 0 : fullPharmacistFee;

  const platformGross = pharmacyFee + pharmacistFee;
  const pharmacistNet = grossAmount - pharmacistFee;
  const processorFee = Math.round(pharmacistNet * FEES.PROCESSOR_FEE_RATE);

  return {
    grossAmount, pharmacyFee, pharmacistFee,
    pharmacyCharge: grossAmount + pharmacyFee,
    pharmacistNet, platformGross, processorFee,
    platformNet: platformGross - processorFee,
    floorApplied: floorApplied && !(pharmacyInTrial && pharmacistInTrial)
  };
}

/* A port of src/lib/time.ts. 22:00–06:00 is eight hours, not minus sixteen. */
function shiftHours(startTime, endTime) {
  const m = t => { const [h, mi] = t.split(':').map(Number); return h * 60 + mi; };
  let mins = m(endTime) - m(startTime);
  if (mins <= 0) mins += 24 * 60;
  return Math.round(mins / 60 * 100) / 100;
}

/* ---------- Browse ---------- */

function listingCard(l) {
  const total = l.rateType === 'hourly' ? l.rate * l.hours : l.rate;
  const basis = l.rateType === 'hourly'
    ? fmt(l.rate) + t('l.perHour') + ' × ' + l.hours + 'h'
    : t('l.flat') + ' · ' + l.hours + 'h';

  return '<button class="listing-card" onclick="openListing(\'' + l.id + '\')">' +
    '<div class="listing-top">' +
      '<div class="pharmacy-name">' + esc(L(l.pharmacy)) + '</div>' +
      '<div style="text-align:end;"><div class="pay-amount">' + fmt(total) + '</div>' +
      '<div class="pay-basis figure">' + esc(basis) + '</div></div>' +
    '</div>' +
    '<div class="meta-line">' + icon('pin') + esc(L(l.district)) +
      '<span style="color:var(--ink-faint)">·</span>' + icon('clock') + esc(L(l.short)) + '</div>' +
    '<div class="tag-row">' +
      (l.controlled ? '<span class="badge badge-controlled">' + esc(t('l.controlled')) + '</span>'
                    : '<span class="badge badge-otc">' + esc(t('l.otcOnly')) + '</span>') +
      (S.applied[l.id] ? '<span class="badge badge-verified">' + esc(t('l.applied')) + '</span>' : '') +
    '</div></button>';
}

function screenBrowse() {
  const list = DATA.listings.filter(l => S.district === 'all' || l.key === S.district);
  const chips = DATA.districts.map(d =>
    '<button class="chip' + (S.district === d.key ? ' active' : '') + '" onclick="setDistrict(\'' + d.key + '\')">' +
    esc(L(d)) + '</button>').join('');

  return '<div class="screen-body">' +
    '<div class="chip-row">' + chips + '</div>' +
    '<p class="section-eyebrow">' + list.length + ' ' + esc(t('l.openShifts')) + '</p>' +
    (list.length
      ? '<div class="grid-cards">' + list.map(listingCard).join('') + '</div>'
      : '<div class="card card-pad" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
        esc(t('l.none')) + '</div>') +
    '</div>';
}

/* ---------- Listing detail, with the fee breakdown ---------- */

function feeBreakdown(gross) {
  const now   = calculateFees({ grossAmount: gross, pharmacyInTrial:false, pharmacistInTrial: S.trial });
  const later = calculateFees({ grossAmount: gross, pharmacyInTrial:false, pharmacistInTrial:false });

  let html = '<div class="card card-pad">' +
    '<dl>' +
      '<div class="fee-line"><dt>' + esc(t('fee.yourRate')) + '</dt><dd>' + iqd(gross) + '</dd></div>' +
      '<div class="fee-line"><dt>' + esc(t('fee.platformFee')) + '</dt><dd' +
        (S.trial ? ' class="fee-trial"' : '') + '>' +
        (S.trial ? esc(t('fee.trialActive')) : '− ' + iqd(now.pharmacistFee)) + '</dd></div>' +
      '<div class="fee-line fee-total"><dt>' + esc(t('fee.youReceive')) + '</dt>' +
        '<dd>' + iqd(now.pharmacistNet) + '</dd></div>' +
    '</dl>';

  // Both numbers, always. Showing only the trial figure would make the first
  // month feel cheaper than the product is.
  if (S.trial) {
    html += '<p class="fee-foot">' + esc(t('fee.afterTrial')) + ' <strong class="figure">' +
      iqd(later.pharmacistNet) + '</strong> (− ' + iqd(later.pharmacistFee) + ')</p>';
  }
  html += '<p class="fee-foot" style="border-top:none;padding-top:6px;">' + esc(t('fee.explainer')) +
    (later.floorApplied ? ' ' + esc(t('fee.floorNote')) : '') + '</p>';

  return html + '</div>';
}

/* ---------- Handoff ---------- */

function screenHandoff() {
  const keys = ['i1','i2','i3','i4','i5'];
  const all = keys.every(k => S.handoff[k]);
  const locked = S.handoffConfirmedByMe;

  const items = keys.map(k =>
    '<button class="check-item' + (S.handoff[k] ? ' done' : '') + '"' +
      (locked ? ' disabled' : '') + ' onclick="toggleHandoff(\'' + k + '\')" aria-pressed="' + !!S.handoff[k] + '">' +
      '<span class="check-box">' + icon('check') + '</span>' +
      '<span class="check-text">' + esc(t('h.' + k)) + '</span></button>').join('');

  let footer;
  if (S.handoffConfirmedByMe && S.handoffConfirmedByOther) {
    footer = '<div class="banner banner-green" style="justify-content:center;">' + icon('badge') +
      '<p style="font-weight:600;color:var(--palm);">' + esc(t('h.both')) + '</p></div>';
  } else if (S.handoffConfirmedByMe) {
    footer = '<div class="banner banner-amber" style="justify-content:center;"><p>' + esc(t('h.waiting')) + '</p></div>';
  } else {
    footer = '<button class="btn-primary" onclick="confirmHandoff()"' + (all ? '' : ' disabled') + '>' +
      esc(t('h.confirm')) + '</button>' +
      '<p style="font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.6;">' +
      esc(all ? t('h.cannotUndo') : t('h.allRequired')) + '</p>';
  }

  return '<div class="screen-body"><div class="constrain stack">' +
    '<button class="btn-ghost" onclick="goto(\'shifts\')">' + esc(t('common.back')) + '</button>' +
    '<div class="banner banner-indigo">' + icon('clipboard') + '<p>' + esc(t('h.intro')) + '</p></div>' +
    '<div class="card">' + items + '</div>' +
    (S.handoffConfirmedByOther && !S.handoffConfirmedByMe
      ? '<p style="font-size:12px;color:var(--ink-faint);text-align:center;">' + esc(t('h.otherConfirmed')) + '</p>'
      : '') +
    footer +

}

  const record = (a.shifts > 0 || a.reliability !== null)

    '<div class="applicant-top">' +

/* ==========================================================================
   5. RENDER
   ========================================================================== */

function render() {
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('lang-ar').classList.toggle('active', lang === 'ar');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('view-phone').classList.toggle('active', S.view === 'phone');
  document.getElementById('view-web').classList.toggle('active', S.view === 'web');
  ['pharmacist','pharmacy','student','admin'].forEach(r =>
    document.getElementById('role-' + r).classList.toggle('active', S.role === r));

  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.getElementById('web-brand').textContent = lang === 'ar' ? 'صيدلي+' : 'Saydali+';

  const signedIn = !document.getElementById('app-stage').classList.contains('hidden');
  document.getElementById('demo-note').innerHTML = signedIn ? t('demo.noteApp') : t('demo.noteAuth');

  if (!signedIn) { renderAuth(); return; }

  const screen = SCREENS[S.screen] || SCREENS.browse;
  const header = headerHtml(screen.eyebrow(), screen.title());
  const body = verificationBanner() + screen.body();

  const nav = (NAV[S.role] || NAV.pharmacist);
  const bottomNav = nav.map(([id, ic, key]) =>
    '<button class="nav-item' + (S.screen === id ? ' active' : '') + '" onclick="goto(\'' + id + '\')">' +
    icon(ic) + '<span>' + esc(t(key)) + '</span></button>').join('');
  const sideNav = nav.map(([id, ic, key]) =>
    '<button class="web-nav-item' + (S.screen === id ? ' active' : '') + '" onclick="goto(\'' + id + '\')">' +
    icon(ic) + esc(t(key)) + '</button>').join('');

  document.getElementById('phone-header').innerHTML = header;
  document.getElementById('phone-body').innerHTML = body;
  document.getElementById('phone-nav').innerHTML = bottomNav;
  document.getElementById('web-header').innerHTML = header;
  document.getElementById('web-body').innerHTML = body;
  document.getElementById('web-nav').innerHTML = sideNav;
}

      field(t('auth.email'), 'email') + field(t('auth.password'), 'password') +
      '<button class="btn-primary" onclick="enterApp(\'pharmacist\', true)">' + esc(t('auth.signIn')) + '</button>' +
      '<p class="auth-foot">' + esc(t('auth.newHere')) + ' ' +
        '<button class="link-btn" onclick="setAuth(\'roles\')">' + esc(t('auth.createAccount')) + '</button></p>' +
      '</div>';

  } else if (authScreen === 'roles') {
    const opt = (role, ic) => '<button class="role-option" onclick="chooseRole(\'' + role + '\')">' +
      '<span class="role-icon">' + icon(ic) + '</span><span>' +
      '<span class="role-title">' + esc(t('roles.' + role)) + '</span>' +
      '<span class="role-sub">' + esc(t('roles.' + role + 'Sub')) + '</span></span></button>';

    stage.innerHTML = '<div class="auth-card">' +
      '<button class="auth-back" onclick="setAuth(\'signin\')">' + icon('chevron') + esc(t('common.back')) + '</button>' +
      '<h2 class="auth-heading">' + esc(t('auth.signUp')) + '</h2>' +
      '<p class="auth-sub">' + esc(t('auth.chooseRole')) + '</p>' +
      opt('pharmacist','user') + opt('pharmacy','home') + opt('student','cap') + '</div>';

  } else if (authScreen === 'signup') {
    let fields = '';
    if (signupRole === 'pharmacist') {
      fields = field(t('f.fullName'), 'text', t('f.fullNameHint')) +
        field(t('auth.email'), 'email') + field(t('f.phone'), 'tel') +
        field(t('f.syndicateNo'), 'text', null, true) +
        '<div class="field-row">' +
          '<div class="field"><label>' + esc(t('f.graduationYear')) + '</label><input type="number" class="figure" dir="ltr"></div>' +
          '<div class="field"><label>' + esc(t('f.primaryDistrict')) + '</label><select><option></option>' +
            '<option>' + esc(lang==='ar'?'الكرادة':'Karrada') + '</option></select></div>' +
        '</div>' +
        '<button class="role-option" style="margin-bottom:15px;" onclick="toast(\'—\')">' +
          '<span class="role-icon">' + icon('clipboard') + '</span><span>' +
          '<span class="role-title">' + esc(t('f.upload')) + '</span>' +
          '<span class="role-sub">' + esc(t('f.uploadSub')) + '</span></span></button>';
    } else if (signupRole === 'pharmacy') {
      fields = field(t('f.pharmacyName')) + field(t('f.responsible')) +
        field(t('auth.email'), 'email') + field(t('f.phone'), 'tel') +
        field(t('f.licenceNo'), 'text', null, true) + field(t('f.address'));
    } else {
      fields = field(t('f.fullName')) +
        '<div class="field"><label>' + esc(t('f.university')) + '</label><select><option></option>' +
          '<option>' + esc(lang==='ar'?'جامعة بغداد':'University of Baghdad') + '</option></select></div>' +
        field(t('f.universityEmail'), 'email', t('f.universityEmailHint')) +
        field(t('f.phone'), 'tel');
    }

    const note = signupRole === 'student'
      ? (lang==='ar'
          ? 'التحقق فوري: نتأكد من نطاق بريدك الجامعي ثم ترسل رابط تأكيد.'
          : 'Verification is instant: we check your university email domain, then send a confirmation link.')
      : t('ver.manualNote');

    stage.innerHTML = '<div class="auth-card">' +
      '<button class="auth-back" onclick="setAuth(\'roles\')">' + icon('chevron') + esc(t('auth.changeType')) + '</button>' +
      '<h2 class="auth-heading">' + esc(t('roles.' + signupRole)) + '</h2>' +
      '<p class="auth-sub">' + esc(note) + '</p>' +
      fields + field(t('auth.password'), 'password') + field(t('auth.confirmPassword'), 'password') +
      '<button class="btn-primary" onclick="' +
        (signupRole === 'student' ? 'enterApp(\'student\', true)' : 'setAuth(\'pending\')') + '">' +
        esc(t('auth.signUp')) + '</button>' +
      '<p class="auth-foot">' + esc(t('auth.alreadyRegistered')) + ' ' +
        '<button class="link-btn" onclick="setAuth(\'signin\')">' + esc(t('auth.signIn')) + '</button></p>' +
      '</div>';

  } else if (authScreen === 'pending') {
    const step = (cls, title, sub) => '<div class="timeline-step ' + cls + '">' +
      '<span class="timeline-dot"></span><div><div class="timeline-title">' + esc(title) + '</div>' +
      '<div class="timeline-sub">' + esc(sub) + '</div></div></div>';

    stage.innerHTML = '<div class="auth-card" style="text-align:center;">' +
      '<div class="not-built-icon" style="background:var(--amber-tint);">' +
        '<svg style="color:var(--amber);width:22px;height:22px;"><use href="#i-hourglass"/></svg></div>' +
      '<h2 class="auth-heading">' + esc(t('ver.pendingTitle')) + '</h2>' +
      '<p class="auth-sub">' + esc(t('ver.pendingBody')) + '</p>' +
      '<div class="timeline" style="text-align:start;">' +
        step('done', t('ver.s1'), t('ver.s1sub')) +
        step('current', t('ver.s2'), t('ver.s2sub')) +
        step('', t('ver.s3'), t('ver.s3sub')) +
      '</div>' +
      '<div class="banner banner-indigo" style="text-align:start;margin-bottom:16px;">' + icon('badge') +
        '<p>' + esc(t('ver.manualNote')) + '</p></div>' +
      /* Limited access is the point: browsing and applying keep the account
         alive through a week of waiting. */
      '<button class="btn-primary" onclick="enterApp(\'' + signupRole + '\', false)">' +
        esc(t('ver.continueLimited')) + '</button>' +
      '</div>';
  }
}

/* ==========================================================================
   6. ACTIONS
   ========================================================================== */

function setLang(l){ lang = l; render(); }
function setView(v){
  S.view = v;
  document.getElementById('phone-stage').classList.toggle('hidden', v !== 'phone');
  document.getElementById('web-stage').classList.toggle('hidden', v !== 'web');
  render();
}
function setRole(r){
  S.role = r;
  S.screen = (NAV[r] || NAV.pharmacist)[0][0];
  S.verified = true;
  render();
}
function setAuth(s){ authScreen = s; render(); }
function chooseRole(r){ signupRole = r; authScreen = 'signup'; render(); }

function enterApp(role, verified){
  S.role = role === 'pharmacy' ? 'pharmacy' : role;
  S.verified = verified;
  S.screen = (NAV[S.role] || NAV.pharmacist)[0][0];
  document.getElementById('auth-stage').classList.add('hidden');
  document.getElementById('app-stage').classList.remove('hidden');
  document.getElementById('role-bar').classList.remove('hidden');
  render();
}
function signOut(){
  authScreen = 'signin';
  document.getElementById('auth-stage').classList.remove('hidden');
  document.getElementById('app-stage').classList.add('hidden');
  document.getElementById('role-bar').classList.add('hidden');
  render();
}

function goto(s){ S.screen = s; render(); scrollTop(); }
function scrollTop(){
  const b = S.view === 'phone' ? document.getElementById('phone-body') : document.getElementById('web-body');
  if (b) b.scrollTop = 0;
}
function setDistrict(d){ S.district = d; render(); }
function openListing(id){ S.openListing = id; S.screen = 'listing'; render(); scrollTop(); }
function applyTo(id){
  S.applied[id] = true;
  toast(S.verified ? t('l.applied') : t('ver.queued'));
  render();
}
function accept(id){ S.accepted[id] = true; toast(t('app.acceptedToast')); render(); }
function review(id){ S.reviewed[id] = true; toast(t('q.verifiedToast')); render(); }

function toggleHandoff(k){
  if (S.handoffConfirmedByMe) return;
  S.handoff[k] = !S.handoff[k];
  render();
}
function confirmHandoff(){
  if (!['i1','i2','i3','i4','i5'].every(k => S.handoff[k])) return;
  S.handoffConfirmedByMe = true;
  toast(t('h.both'));
  render();
}

function setPostType(v){ S.postType = v; render(); }
function setRateType(v){ S.rateType = v; S.rate = v === 'hourly' ? 5000 : 40000; render(); }
function setRate(v){ S.rate = Number(v) || 0; render(); }
function setTime(which, v){ if (!v) return; S[which] = v; render(); }

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

render();
</script>
</body>
</html>
