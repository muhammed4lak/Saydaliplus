function setPartnerField(k, v) { S.partnerForm[k] = v; S.partnerForm.error = null; render(); }

function submitPartnerListing() {
  const f = S.partnerForm;
  // Only the fields a listing cannot exist without are required here. The rest
  // is what the phone call collects.
  if (!f.title || !f.from || !f.contact) { f.error = 'pt.needFields'; render(); return; }
  const acct = ACCOUNTS[S.email];
  LISTINGS.push({
    id:(f.kind === 'job' ? 'J' : 'B') + Date.now().toString().slice(-5),
    kind:f.kind, company:acct.company, state:'draft',
    title:{ ar:f.title, en:f.title },
    where:{ ar:f.where || '', en:f.where || '' },
    body:{ ar:'', en:'' },
    from:f.from, to:f.from, posted:TODAY_ISO, contact:f.contact,
    surface:f.kind === 'banner' ? 'browse' : null
  });
  S.partnerForm = { kind:'job' };
  S.screen = 'partner';
  toast(t('pt.sent'));
  render();
}

function drugDisclaimer() {
  return '<p class="inline-note" style="margin-top:4px;">' + esc(t('dx.disclaimer')) + '</p>';
}

/* ---------- The check ---------- */

function screenCheck() {
  const q = drugNorm(S.drugQuery);
  const inBasket = sci => S.basket.indexOf(sci) >= 0;
  const results = q
    ? clinicalOnly(DRUGS).filter(d => drugMatches(d, q)).slice(0, 8)
    : [];

  const picker =
    '<div class="searchbox">' + icon('search') +
      '<input id="drug-q" type="search" autocomplete="off" value="' + esc(S.drugQuery) + '" ' +
        'placeholder="' + esc(t('dc.addPlaceholder')) + '" oninput="setDrugQuery(this.value)" ' +
        'onkeydown="drugSearchKey(event)">' +
      (S.drugQuery ? '<button class="searchbox-x" onclick="setDrugQuery(\'\')" aria-label="' +
        esc(t('common.clear')) + '">&times;</button>' : '') +
    '</div>' +
    (q && !results.length
      ? '<p class="inline-note">' + esc(t('dx.noMatch')) + '</p>'
      : results.length
        ? '<div class="card">' + results.map(d =>
            '<button class="row drug-row" onclick="addToBasket(' + attr(d.sci) + ')"' +
              (inBasket(d.sci) ? ' disabled' : '') + '>' +
              '<span class="row-body">' +
                '<span class="row-title" style="display:block;">' + esc(drugName(d)) + '</span>' +
                '<span class="row-sub" style="display:block;" dir="' + (lang === 'ar' ? 'ltr' : 'rtl') + '">' +
                  esc(drugSub(d)) + '</span></span>' +
              (inBasket(d.sci)
                ? '<span class="pill-tag">' + esc(t('dc.added')) + '</span>'
                : '<span class="add-mark">' + icon('plus') + '</span>') +
            '</button>').join('') + '</div>'
        : '');

  /* Shown in BOTH states. Recording empties the basket, and that is exactly
     the moment somebody looks for what they just recorded — the empty state
     used to swallow it. */
  const shiftPanel = () => {
    const mine = myShiftTallies();
    if (!mine.length) return '';
    return '<p class="section-eyebrow">' + esc(t('dc.myShift')) + '</p>' +
      '<div class="card card-pad"><div class="tally">' + mine.map(r =>
        '<div class="tally-row"><span>' + esc((drugBySci(r.sci) && drugName(drugBySci(r.sci))) || r.sci) + '</span>' +
        '<span class="figure">' + fmt(r.n) + '</span></div>').join('') + '</div>' +
        '<p class="inline-note" style="margin-top:9px;">' + esc(t('dc.myShiftNote')) + '</p></div>';
  };

  /* One tap instead of type-and-tap, from the pharmacy's own tallies (W8).
     This is the only place the dispensing log pays back the person who
     generated it, immediately and visibly: log more, and the checks you do
     tomorrow get faster. */
  const frequent = () => {
    const ph = dispensePharmacy();
    if (!ph) return [];
    const byDrug = new Map();
    S.dispensing.filter(r => r.pharmacy === ph.id)
      .forEach(r => byDrug.set(r.sci, (byDrug.get(r.sci) || 0) + r.n));
    return [...byDrug.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(x => x[0])
      .filter(sci => S.basket.indexOf(sci) < 0 && drugBySci(sci))
      .slice(0, 8);
  };
  const frequentRow = () => {
    const list = frequent();
    if (!list.length) return '';
    return '<p class="section-eyebrow" style="margin:14px 0 8px;">' + esc(t('dc.frequent')) + '</p>' +
      '<div class="pill-tags">' + list.map(sci =>
        '<button class="pill-pick" onclick="addToBasket(' + attr(sci) + ')">' +
          esc(drugName(drugBySci(sci))) + '</button>').join('') + '</div>';
  };

  if (!S.basket.length) {
    return '<div class="constrain stack">' + picker + frequentRow() +
      '<div class="card card-pad empty-check">' + icon('pill') +
        '<p class="empty-check-t">' + esc(t('dc.emptyTitle')) + '</p>' +
        '<p class="empty-check-s">' + esc(t('dc.emptyBody')) + '</p>' +
        '<button class="btn-ghost" onclick="backToReference()">' +
          esc(t('dc.orLookUp')) + '</button></div>' +
      shiftPanel() +
      drugDisclaimer() +
    '</div>';
  }

  const inter = basketInteractions(S.basket);
  const dupes = basketDuplicates(S.basket);
  const questions = basketQuestions(S.basket);
  const cov = basketCoverage(S.basket);
  const worst = inter.concat(dupes.map(d => ({ severity:d.rule.severity })))
    .reduce((w, x) => ((SEVERITY_ORDER[x.severity] || 0) > (SEVERITY_ORDER[w] || 0) ? x.severity : w), '');

  const chips = S.basket.map(sci => {
    const d = drugBySci(sci);
    return '<span class="basket-chip">' + esc(d ? drugName(d) : sci) +
      '<button onclick="removeFromBasket(' + attr(sci) + ')" aria-label="' + esc(t('common.remove')) + '">&times;</button></span>';
  }).join('');

  /* The verdict line. It reports WHAT WAS CHECKED and never claims safety:
     the system knows that no pair in its table matched, which is not the same
     statement as "this combination is safe", and the gap between those two is
     exactly where a missed interaction stops being a limitation of a reference
     and starts being a promise that was broken. */
  const verdict = (inter.length || dupes.length)
    ? '<div class="verdict verdict-' + (worst || 'warning') + '">' + icon('alert') +
        '<span><strong>' + esc(t('dc.found', { n:inter.length + dupes.length })) + '</strong>' +
        '<span class="verdict-sub">' + esc(t('dc.checkedLine', { d:fmt(cov.drugs), p:fmt(cov.pairs) })) + '</span></span></div>'
    : '<div class="verdict verdict-clear">' + icon('check') +
        '<span><strong>' + esc(t('dc.nothingFound')) + '</strong>' +
        '<span class="verdict-sub">' + esc(t('dc.checkedLine', { d:fmt(cov.drugs), p:fmt(cov.pairs) })) + ' ' +
          esc(t('dc.notComplete')) + '</span></span></div>';

  const pairRow = i => {
    const A = drugBySci(i.a), B = drugBySci(i.b);
    return '<div class="row drug-inter">' +
      '<span class="row-body">' +
        '<span class="drug-inter-h">' + sevChip(i.severity) +
          '<span class="drug-inter-w">' + esc(drugName(A)) + '  +  ' + esc(drugName(B)) + '</span></span>' +
        '<span class="row-sub" style="display:block;">' + esc(L(i.note)) + '</span>' +
      '</span></div>';
  };

  const dupeRow = x =>
    '<div class="row drug-inter">' +
      '<span class="row-body">' +
        '<span class="drug-inter-h">' + sevChip(x.rule.severity) +
          '<span class="drug-inter-w">' + esc(L(x.rule.label)) + '</span>' +
          (x.rule.oftenIntended ? '<span class="pill-tag">' + esc(t('dc.oftenIntended')) + '</span>' : '') +
        '</span>' +
        '<span class="row-sub" style="display:block;">' +
          esc(x.members.map(m => drugName(drugBySci(m))).join('  +  ')) + ' — ' + esc(L(x.rule.note)) +
        '</span>' +
      '</span></div>';

  const ph = dispensePharmacy();

  return '<div class="constrain stack">' +
    picker +
    frequentRow() +
    '<div class="basket">' + chips +
      '<button class="btn-ghost basket-clear" onclick="clearBasket()">' + esc(t('dc.clear')) + '</button></div>' +
    verdict +

    (inter.length
      ? '<p class="section-eyebrow">' + esc(t('dx.interactions')) + ' (' + fmt(inter.length) + ')</p>' +
        '<div class="card">' + inter.map(pairRow).join('') + '</div>'
      : '') +

    (dupes.length
      ? '<p class="section-eyebrow">' + esc(t('dc.duplication')) + ' (' + fmt(dupes.length) + ')</p>' +
        '<div class="card">' + dupes.map(dupeRow).join('') + '</div>'
      : '') +

    /* Not warnings. The app does not know the patient, so a contraindication
       list is a list of things to ASK — and asking is the part that turns a
       screen into a conversation. */
    (questions.length
      ? '<p class="section-eyebrow">' + esc(t('dc.askTitle')) + '</p>' +
        '<div class="card card-pad"><ul class="ask-list">' + questions.map(qn =>
          '<li><span class="ask-q">' + esc(L(qn.text)) + '</span>' +
          '<span class="ask-for">' + esc(qn.drugs.map(m => drugName(drugBySci(m))).join(', ')) + '</span></li>').join('') +
        '</ul></div>'
      : '') +

    /* Coverage, at the same size as everything else. */
    (cov.namedOutside.length
      ? '<div class="card card-pad coverage">' + icon('alert') +
        '<div><p class="coverage-t">' + esc(t('dc.coverageTitle')) + '</p>' +
        '<p class="coverage-b">' + esc(t('dc.coverageBody', { list:cov.namedOutside.join(', ') })) + '</p></div></div>'
      : '') +

    /* Recording. Counts only — see recordDispense(). */
    (canRecord()
      ? '<button class="btn-primary" onclick="recordDispense()">' +
          esc(t('dc.record', { pharmacy:ph.name })) + '</button>' +
        '<p class="inline-note">' + esc(t('dc.recordNote')) + '</p>' +
        '<p class="inline-note register-note">' + icon('alert') + ' ' + esc(t('dc.notRegister')) + '</p>'
      : '<p class="inline-note">' + esc(t(S.role === 'student' ? 'dc.studentNote' : 'dc.noShiftNote')) + '</p>') +

    shiftPanel() +

    drugDisclaimer() +
  '</div>';
}

/* ---------- The owner's consumption view ----------
   The pharmacy's own analytics, and the first thing built out of this data on
   purpose: whoever generates it should get value from it before anybody else
   does. */
function screenConsumption() {
  const acct = ACCOUNTS[S.email];
  const rows = S.dispensing.filter(r => r.pharmacy === (acct && acct.pharmacy));
  const byDrug = new Map();
  rows.forEach(r => byDrug.set(r.sci, (byDrug.get(r.sci) || 0) + r.n));
  const list = [...byDrug.entries()].sort((a, b) => b[1] - a[1]);
  const total = list.reduce((n, x) => n + x[1], 0);
  const max = Math.max(1, ...list.map(x => x[1]));

  return '<div class="screen-body"><div class="constrain stack">' +
    '<div class="stat-grid">' +
      '<div class="stat-card"><span class="stat-num">' + fmt(total) + '</span>' +
        '<span class="stat-label">' + esc(t('cn.units')) + '</span></div>' +
      '<div class="stat-card"><span class="stat-num">' + fmt(list.length) + '</span>' +
        '<span class="stat-label">' + esc(t('cn.distinct')) + '</span></div>' +
    '</div>' +
    (list.length
      ? '<p class="section-eyebrow">' + esc(t('cn.byDrug')) + '</p>' +
        '<div class="card card-pad">' + list.map(([sci, n]) => {
          const d = drugBySci(sci);
          return '<div class="cn-row">' +
            '<span class="cn-name">' + esc(d ? drugName(d) : sci) + '</span>' +
            '<span class="cn-track"><span class="cn-bar" style="width:' +
              Math.max(3, n / max * 100) + '%;"></span></span>' +
            '<span class="cn-n figure">' + fmt(n) + '</span></div>';
        }).join('') + '</div>'
      : '<div class="card card-pad" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
        esc(t('cn.empty')) + '</div>') +

}

/* ---------- Handoff ---------- */

function screenHandoff() {
  const keys = ['i1','i2','i3','i4','i5'];
  const all = keys.every(k => S.handoff[k]);
  const locked = S.handoffConfirmedByMe;

  const items = keys.map(k =>
    '<button class="check-item' + (S.handoff[k] ? ' done' : '') + '"' +
      (locked ? ' disabled' : '') + ' onclick="toggleHandoff(\'' + k + '\')" aria-pressed="' + !!S.handoff[k] + '">' +
      '<span class="check-box">' + icon('check') + '</span>' +
      '<span class="check-text">' + esc(t('h.' + k)) + '</span></button>').join('');

  let footer;
  if (S.handoffConfirmedByMe && S.handoffConfirmedByOther) {
    footer = '<div class="banner banner-green" style="justify-content:center;">' + icon('badge') +
      '<p style="font-weight:600;color:var(--palm);">' + esc(t('h.both')) + '</p></div>';
  } else if (S.handoffConfirmedByMe) {
    footer = '<div class="banner banner-amber" style="justify-content:center;"><p>' + esc(t('h.waiting')) + '</p></div>';
  } else {
    footer = '<button class="btn-primary" onclick="confirmHandoff()"' + (all ? '' : ' disabled') + '>' +
      esc(t('h.confirm')) + '</button>' +
      '<p style="font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.6;">' +
      esc(all ? t('h.cannotUndo') : t('h.allRequired')) + '</p>';
  }

  return '<div class="screen-body"><div class="constrain stack">' +
    '<button class="btn-ghost" onclick="goto(\'shifts\')">' + esc(t('common.back')) + '</button>' +
    '<div class="banner banner-indigo">' + icon('clipboard') + '<p>' + esc(t('h.intro')) + '</p></div>' +
    '<div class="card">' + items + '</div>' +
    (S.handoffConfirmedByOther && !S.handoffConfirmedByMe
      ? '<p style="font-size:12px;color:var(--ink-faint);text-align:center;">' + esc(t('h.otherConfirmed')) + '</p>'
      : '') +
    footer +
    '</div></div>';
}

/* ==========================================================================
   THE CHAIN MANAGER'S SCREENS (W7)

   A chain's problem is not "how is my pharmacy doing", it is "which of my
   branches is short this week". So the home screen is a BOARD over branches
   rather than a dashboard for one, and the ordering is the answer: a branch
   with no responsible pharmacist first, then by how many shifts are uncovered.
   A branch that is fine sorts to the bottom and can be ignored, which is the
   whole point.
   ========================================================================== */

/* Branches worst-first. "Worst" is: cannot legally open, then most uncovered
   shifts, then most people waiting on a reply. */
function branchBoard() {
  return myBranches().slice().sort((a, b) =>
    (!!b.responsible === !!a.responsible
      ? (b.uncovered - a.uncovered) || (b.applicants - a.applicants)
      : (a.responsible ? 1 : -1)));
}

function setBranch(id) { S.branch = id; goto(id ? 'branch' : 'group'); }

function screenGroup() {
  const board = branchBoard();
  const short = board.filter(b => b.uncovered > 0 || !b.responsible).length;

  const row = b =>
    '<button class="branch-row" onclick="setBranch(' + attr(b.id) + ')">' +
      '<span class="branch-body">' +
        '<span class="branch-name">' + esc(L(b.name)) + '</span>' +
        /* The responsible pharmacist names the branch's accountable person.
           When there isn't one it is left out rather than spelled out here,
           because the red badge on the same row already says so and saying it
           twice makes the row read as two different problems. */
        '<span class="branch-sub">' +
          esc([b.responsible ? L(b.responsible) : null, t('g.openPosts', { n:b.openPosts })]
                .filter(Boolean).join(' \u00b7 ')) + '</span></span>' +
      '<span class="branch-marks">' +
        (b.responsible ? '' : '<span class="badge badge-alert">' + esc(t('g.noResponsible')) + '</span>') +
        (b.uncovered
          ? '<span class="badge badge-pending">' + esc(t('g.uncovered', { n:b.uncovered })) + '</span>'
          : '<span class="badge badge-verified">' + esc(t('g.covered')) + '</span>') +
        (b.applicants
          ? '<span class="badge badge-stage">' + esc(t('g.waiting', { n:b.applicants })) + '</span>' : '') +
      '</span>' + icon('chevron', 'more-chevron') +
    '</button>';

  /* The prompt, not the count \u2014 same rule as W13's home screens. */
  const lead = short
    ? '<div class="card card-pad urgent-row">' + icon('clock') +
        '<div><p class="urgent-t">' + esc(t('g.needCover', { n:short, total:board.length })) + '</p>' +
        '<p class="urgent-s">' + esc(t('g.needCoverSub')) + '</p></div></div>'
    : '<div class="banner banner-green">' + icon('badge') + '<p>' + esc(t('g.allGood')) + '</p></div>';

  return '<div class="screen-body"><div class="constrain stack">' +
    lead +
    '<p class="section-eyebrow">' + esc(t('g.branchCount', { n:board.length })) + '</p>' +
    '<div class="card">' + board.map(row).join('') + '</div>' +
    /* Said on the screen, not only in the backlog: the group is a management
       layer, and a manager who thinks it replaces the branch licence will make
       a decision no software can walk back. */
    '<p class="inline-note">' + esc(t('g.licenceNote')) + '</p>' +
    '</div></div>';
}

function screenBranch() {
  const b = branchOf(S.branch);
  if (!b) return screenGroup();

  const scope =
    '<button class="branch-scope" onclick="setBranch(null)" style="width:100%;border:none;cursor:pointer;">' +
      icon('grid') + '<span class="branch-scope-name">' + esc(L(b.name)) + '</span>' +
      '<span class="link-btn">' + esc(t('g.allBranches')) + '</span></button>';

  const kv = (label, value) =>
    '<div class="row"><span class="row-body">' +
      '<span class="row-sub" style="display:block;">' + esc(label) + '</span>' +
      '<span class="row-title" style="display:block;">' + esc(value) + '</span></span></div>';

  const needs =
    (b.responsible
      ? ''
      : '<div class="card card-pad urgent-row">' + icon('alert') +
        '<div><p class="urgent-t">' + esc(t('g.noResponsible')) + '</p>' +
        '<p class="urgent-s">' + esc(t('g.noResponsibleSub')) + '</p></div></div>') +
    (b.applicants
      ? '<button class="check-card" onclick="goto(\'applicants\')">' +
          '<span class="check-card-ico">' + icon('users') + '</span>' +
          '<span class="check-card-body">' +
            '<span class="check-card-t">' + esc(t('d.waitingOnYou', { n:b.applicants })) + '</span>' +
            '<span class="check-card-s">' + esc(t('d.waitingSub')) + '</span></span>' +
          '<span class="check-card-n figure">' + fmt(b.applicants) + '</span>' +
        '</button>'
      : '') +
    (b.uncovered

/* ---------- Billing: what the PHARMACY is charged ----------
   The owner previously reached "Earnings", which is the pharmacist payout view.
   A pharmacy is charged, not paid, so gating the pharmacist half left an owner
   with no way to see what they owe. Priced by the same fee engine, so this and
   the listing preview cannot disagree. */

/* ---------- Billing: the plan, the allowance, and every charge ----------

   Rebuilt in v0.0006 around W14. Three things an owner needs and could not see
   before: which plan they are on, how much of its shift allowance is left, and
   — the one that decides whether they renew — what the same month would have
   cost on commission. A subscriber who cannot see what they saved churns at the
   first quiet month. */

function billingLedger() {
  /* Charge rows, in the shape the real ledger will hold: one row per chargeable
     event, each carrying WHY it cost what it did. A zero with no reason is
     indistinguishable from a bug six months later, which is why the fee engine
     returns `coveredByPlan` and the row keeps it. */
  const shifts = [
    { who:DATA.listings[0].pharmacy, when:{en:'10 September', ar:'10 أيلول'}, gross:20000 },
    { who:DATA.listings[1].pharmacy, when:{en:'8 September',  ar:'8 أيلول'},  gross:45000 },
    { who:DATA.listings[2].pharmacy, when:{en:'2 September',  ar:'2 أيلول'},  gross:40000 }
  ];
  return shifts.map((r, n) => {
    const f = calculateFees({ grossAmount:r.gross, pharmacyInTrial:S.trial, pharmacistInTrial:false,
                              plan:S.plan, shiftsFilledThisMonth:n });
    // What the same shift would have cost with no plan at all — the comparison
    // the renewal decision actually turns on.
    const asCommission = calculateFees({ grossAmount:r.gross, pharmacyInTrial:S.trial,
                                         pharmacistInTrial:false });
    return { kind:'shift', ref:r, fees:f, wouldHaveBeen:asCommission.pharmacyFee };
  });
}

function screenBilling() {
  /* W7 — one source for the plan, so a chain's bill cannot drift from an
     independent pharmacy's. `myPlan()` returns the plan itself for an owner and
     the per-branch multiple for a manager; every figure below reads it. */
  const plan = myPlan();
  const chain = plan.branches > 1;
  const ledger = billingLedger();
  const used = ledger.filter(x => x.fees.coveredByPlan).length;
  const left = Math.max(0, plan.includedShifts - used);

  const shiftCharges = ledger.reduce((n, x) => n + x.fees.pharmacyCharge, 0);
  const commissionPaid = ledger.reduce((n, x) => n + x.fees.pharmacyFee, 0);
  const subscription = S.trial ? 0 : plan.monthlyFeeIQD;
  const total = shiftCharges + subscription;
  const wouldHaveBeen = ledger.reduce((n, x) => n + x.wouldHaveBeen, 0);
  const saved = wouldHaveBeen - (commissionPaid + subscription);

  const line = (x, i) =>
    '<button class="txn" onclick="openBillingLine(' + i + ')">' +
      '<span class="txn-icon txn-out">' + icon('wallet') + '</span>' +
      '<span class="txn-body"><span class="txn-title">' + esc(L(x.ref.who)) + '</span>' +
        '<span class="txn-sub">' + esc(L(x.ref.when)) + ' · ' +
          esc(x.fees.coveredByPlan ? t('bill.onPlan') : t('bill.shiftCovered')) + '</span></span>' +
      '<span class="txn-amount">' + iqd(x.fees.pharmacyCharge) + '</span></button>';

  return '<div class="screen-body"><div class="constrain stack">' +
    '<div class="balance-card">' +
      '<svg class="header-pattern" style="opacity:.4"><rect width="100%" height="100%" fill="url(#starTile)"/></svg>' +
      '<div class="balance-label">' + esc(t('bill.thisMonth')) + '</div>' +
      '<div class="balance-amount">' + esc(iqd(total)) + '</div>' +
      '<div class="balance-sub">' + esc(plan.monthlyFeeIQD
        ? t('bill.ofWhichPlan', { plan:t('plan.' + plan.id), amount:iqd(subscription) })
        : t('bill.ofWhich', { amount:iqd(commissionPaid) })) + '</div>' +
    '</div>' +

    (S.trial
      ? '<div class="banner banner-green">' + icon('badge') + '<p>' +
        esc(t('bill.trialNote', { n:22 })) + '</p></div>'
      : '') +

    /* The plan card. The allowance is the upgrade prompt as much as the
       entitlement: "5 of 5 used" is the best Premium pitch there is. */
    (plan.monthlyFeeIQD
      ? '<p class="section-eyebrow">' + esc(t('bill.yourPlan')) + '</p>' +
        '<div class="card card-pad plan-card">' +
          '<div class="plan-top">' +
            '<span class="plan-name">' + esc(t('plan.' + plan.id)) + '</span>' +
            '<span class="plan-fee figure">' + esc(iqd(plan.monthlyFeeIQD)) + esc(t('bill.perMonth')) + '</span>' +
          '</div>' +
          (chain
            ? '<p class="inline-note" style="margin-top:6px;">' +
              esc(t('bill.perBranch', { amount:iqd(plan.perBranchIQD), n:plan.branches })) + ' \u00b7 ' +
              esc(t('bill.oneInvoice')) + '</p>'
            : '') +
          '<div class="allowance">' +
            '<div class="allowance-head"><span>' + esc(t('bill.allowance')) + '</span>' +
              '<span class="figure">' + fmt(used) + ' / ' + fmt(plan.includedShifts) + '</span></div>' +
            '<div class="allowance-track">' + Array.from({ length:plan.includedShifts }, (_, k) =>
              '<span class="allowance-pip' + (k < used ? ' spent' : '') + '"></span>').join('') + '</div>' +
            '<p class="inline-note" style="margin-top:8px;">' +
              esc(left ? t('bill.allowanceLeft', { n:left }) : t('bill.allowanceSpent')) +
              (chain ? ' \u00b7 ' + esc(t('bill.pooled')) : '') + '</p>' +
          '</div>' +
        '</div>' +
        (saved > 0
          ? '<div class="banner banner-green">' + icon('badge') + '<p>' +
            esc(t('bill.saved', { amount:iqd(saved) })) + '</p></div>'
          : '<p class="inline-note">' + esc(t('bill.wouldHaveBeen', { amount:iqd(wouldHaveBeen) })) + '</p>')
      : '') +

    '<p class="section-eyebrow">' + esc(t('bill.history')) + '</p>' +
    '<div class="card">' +
      (subscription
        ? '<div class="txn" style="cursor:default;">' +
            '<span class="txn-icon txn-out">' + icon('badge') + '</span>' +
            '<span class="txn-body"><span class="txn-title">' + esc(t('plan.' + plan.id)) + '</span>' +
              '<span class="txn-sub">' + esc(t('bill.monthlyFee')) + '</span></span>' +
            '<span class="txn-amount">' + iqd(subscription) + '</span></div>'
        : '') +
      ledger.map(line).join('') + '</div>' +
    '<p class="inline-note">' + esc(t('bill.explainer')) + '</p>' +
    '</div></div>';
}

/* ---------- CV ---------- */

function cvVerifiedBlock() {
  const line = (label, value) => '<div class="cv-vline"><span>' + esc(label) + '</span><strong>' + esc(value) + '</strong></div>';
  return '<div class="cv-verified">' +
    '<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--palm);">' +
      icon('badge') + esc(t('ver.verified')) + '</div>' +
    '<div class="cv-verified-grid">' +
      line(t('pr.shifts'), '38') + line(t('pr.hours'), '304') +
      line(t('pr.reliability'), '96%') + line(t('pr.rating'), '4.9') +
      line(t('pr.pharmacies'), '11') + line(t('pr.memberSince'), '2024') +
    '</div></div>';
}

function cvSheet() {
  const cvl = S.cvLang;
  const cv = S.cv[cvl];
  const name = cvl === 'ar' ? 'أحمد الكبيسي' : 'Ahmed Al-Kubaisi';
  const T = (ar, en) => cvl === 'ar' ? ar : en;

  const entry = (role, org, when, detail) =>
    '<div class="cv-entry"><div class="cv-entry-top">' +
      '<span class="cv-role">' + esc(role) + '</span>' +
      '<span class="cv-when" dir="ltr">' + esc(when) + '</span></div>' +
      '<div style="font-size:12px;color:var(--ink-faint);">' + esc(org) + '</div>' +
      '<div style="margin-top:3px;">' + esc(detail) + '</div></div>';

  return '<div class="cv-sheet" dir="' + (cvl === 'ar' ? 'rtl' : 'ltr') + '" lang="' + cvl + '">' +
    '<div class="cv-name">' + esc(name) + '</div>' +
    '<div class="cv-contact figure" dir="ltr">ahmed@example.com · +964 770 000 0000 · ' +
      esc(T('الكرادة، بغداد', 'Karrada, Baghdad')) + '</div>' +
    '<div class="cv-rule"></div>' +

    (cv.summary ? '<div>' + esc(cv.summary) + '</div>' : '') +

    '<div class="cv-sec">' + esc(T('السجل الموثّق', 'Verified record')) + '</div>' +
    cvVerifiedBlock() +

    '<div class="cv-sec">' + esc(T('الخبرة', 'Experience')) + '</div>' +
    entry(T('صيدلي إسناد', 'Relief pharmacist'), T('عبر صيدلي+', 'via Saydali+'),
          T('2024 — الآن', '2024 — present'),
          T('مناوبات إسناد في 11 صيدلية مجتمع في بغداد، منها مناوبات ليلية تشمل سجل المواد الخاضعة للرقابة.',
            'Relief shifts across 11 Baghdad community pharmacies, including overnight cover involving the controlled substances register.')) +
    entry(T('صيدلي', 'Pharmacist'), T('صيدلية الرشيد', 'Al-Rasheed Pharmacy'), '2018 — 2024',
          T('صرف الوصفات وإرشاد المرضى ومتابعة المخزون والصلاحية.',
            'Dispensing, patient counselling, inventory and expiry control.')) +

    '<div class="cv-sec">' + esc(T('التعليم', 'Education')) + '</div>' +
    entry(T('بكالوريوس صيدلة', 'BSc Pharmacy'), T('جامعة بغداد', 'University of Baghdad'), '2016', '') +

    /* Two headed sections rather than one pile: the reader who came for the
       clinical half should not have to sift the commercial half out of it. An
       empty group is omitted entirely — a heading over nothing reads as a gap
       in the candidate, not a gap in the form. */
    SKILL_GROUPS.map(g => (cv.skills[g] && cv.skills[g].length)
      ? '<div class="cv-sec">' + esc(cvl === 'ar' ? SKILL_HEAD.ar[g] : SKILL_HEAD.en[g]) + '</div>' +
        '<div>' + esc(cv.skills[g].join(' · ')) + '</div>'
      : '').join('') +

    '<div class="cv-sec">' + esc(T('اللغات', 'Languages')) + '</div>' +
    '<div>' + cv.languages.map(l => esc(l.name) + ' — ' + esc(CV_LEVELS[cvl][l.level]))
      .join(cvl === 'ar' ? '، ' : ', ') + '</div>' +
    '</div>';
}

function screenCv() {
  const cv = S.cv[S.cvLang];

  function skillCard(group) {
    const mine = cv.skills[group] || [];
    const chosen = new Set(mine);
    const picks = SKILL_PRESETS[group].map(sk => {
      const label = S.cvLang === 'ar' ? sk.ar : sk.en;
      const on = chosen.has(label);
      return '<button class="pill-pick' + (on ? ' on' : '') + '" onclick="toggleSkill(' +
        attr(group) + ',' + attr(label) + ')">' +
        esc(label) + '</button>';
    }).join('');

    return '<div class="card card-pad">' +
      '<span class="field-label">' + esc(t('cv.skills.' + group)) + '</span>' +
      '<p class="inline-note" style="margin:-2px 0 10px;">' + esc(t('cv.skillsHint.' + group)) + '</p>' +
      '<div class="pill-tags" style="margin-bottom:12px;">' +
        (mine.length
          ? mine.map(sk => '<span class="pill-tag">' + esc(sk) +
              '<button onclick="toggleSkill(' + attr(group) + ',' + attr(sk) + ')" aria-label="remove">×</button></span>').join('')
          : '<span class="inline-note">' + esc(t('cv.addSkill')) + '</span>') +
      '</div>' +
      '<span class="field-label">' + esc(t('cv.pickSkills')) + '</span>' +
      '<div class="pill-tags">' + picks + '</div>' +
    '</div>';
  }

  const suggestion = S.cvSuggestion
    ? '<div class="card card-pad" style="border-color:var(--indigo);">' +
        '<div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--indigo);margin-bottom:10px;">' +
          icon('sparkle') + esc(t('cv.suggestion')) + '</div>' +
        '<p style="font-size:12.5px;line-height:1.7;">' + esc(S.cvSuggestion) + '</p>' +
        '<p class="inline-note" style="margin-top:10px;">' + esc(t('cv.reviewNote')) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="btn-ghost" onclick="discardSuggestion()">' + esc(t('cv.discard')) + '</button>' +
          '<button class="btn-small" onclick="applySuggestion()">' + esc(t('cv.apply')) + '</button></div>' +
      '</div>'
    : '';

  const editor = '<div class="stack">' +
    '<div class="card card-pad">' +
      '<span class="field-label">' + esc(t('cv.language')) + '</span>' +
      '<div class="segmented" style="margin-bottom:8px;">' +
        '<button class="' + (S.cvLang==='ar'?'active':'') + '" onclick="setCvLang(\'ar\')">العربية</button>' +
        '<button class="' + (S.cvLang==='en'?'active':'') + '" onclick="setCvLang(\'en\')">English</button>' +
      '</div>' +
      '<p class="inline-note">' + esc(t('cv.langNote')) + '</p>' +
    '</div>' +

    '<div class="card card-pad">' +
      '<div class="field" style="margin-bottom:0;">' +
        '<label>' + esc(t('cv.summary')) + '</label>' +
        '<textarea dir="' + (S.cvLang==='ar'?'rtl':'ltr') + '" placeholder="' + esc(t('cv.summaryPlaceholder')) +
          '" oninput="setCvSummary(this.value)" style="min-height:96px;">' + esc(cv.summary) + '</textarea>' +
      '</div>' +
      '<button class="btn-ghost" style="margin-top:10px;display:flex;align-items:center;gap:6px;" onclick="improveCv()">' +
        icon('sparkle') + esc(t('cv.improve')) + '</button>' +
      '<p class="inline-note" style="margin-top:7px;">' + esc(t('cv.improveSub')) + '</p>' +
    '</div>' +

    suggestion +

    SKILL_GROUPS.map(skillCard).join('') +

    '<div class="card card-pad">' +
      '<span class="field-label">' + esc(t('cv.verified')) + '</span>' +
      cvVerifiedBlock() +
      '<p class="inline-note" style="margin-top:10px;">' + esc(t('cv.verifiedNote')) + '</p>' +
    '</div>' +

    '<button class="btn-primary no-print" onclick="exportCv()" style="display:flex;align-items:center;justify-content:center;gap:8px;">' +
      icon('download') + esc(t('common.print')) + '</button>' +
    '<p class="inline-note" style="text-align:center;">' + esc(t('cv.exportNote')) + '</p>' +
  '</div>';

  return '<div class="screen-body"><div class="wide two-col">' +
    editor +
    '<div><p class="section-eyebrow no-print">' + esc(t('cv.preview')) + '</p>' + cvSheet() + '</div>' +
  '</div></div>';
}

/* ---------- Student: logbook ---------- */

const MIN_LOG_CHARS = 80;

function weekStrip(onClick) {
  return '<div class="week-strip">' + S.weeks.map(w =>
    '<' + (onClick ? 'button' : 'div') + ' class="week-pip ' + w.status +
      (w.no === S.openWeek ? ' current' : '') + '"' +
      (onClick ? ' onclick="openWeekNo(' + w.no + ')"' : '') +
      ' title="' + esc(t('common.week') + ' ' + w.no) + '">' + w.no +
    '</' + (onClick ? 'button' : 'div') + '>').join('') + '</div>';
}

function screenLogbook() {
  const w = S.weeks.find(x => x.no === S.openWeek) || S.weeks[0];
  const text = L(w.text);
  const chars = text.trim().length;
  const days = w.days.filter(Boolean).length;
  const editable = w.status === 'draft';
  const canSubmit = editable && days > 0 && chars >= MIN_LOG_CHARS;

  const dayBtns = DAYS.map((d, i) =>
    '<button class="day-btn' + (w.days[i] ? ' on' : '') + '"' + (editable ? '' : ' disabled') +
      ' onclick="toggleDay(' + i + ')" aria-pressed="' + !!w.days[i] + '">' +
      '<span>' + esc(L(d)) + '</span><strong>' + (w.days[i] ? '✓' : '—') + '</strong></button>').join('');

  const statusBadge = {
    approved:  '<span class="badge badge-verified">' + esc(t('lb.approved')) + '</span>',
    submitted: '<span class="badge badge-pending">' + esc(t('lb.submitted')) + '</span>',
    draft:     '<span class="badge badge-stage">' + esc(t('lb.draft')) + '</span>',
    locked:    '<span class="badge badge-muted">' + esc(t('lb.locked')) + '</span>'
  }[w.status];

  const monthCards = [1,2,3].map(m => {
    const st = S.months[m];
    const label = { approved:t('lb.monthApproved'), ready:t('lb.monthReady'),
                    pending:t('lb.monthPending'), returned:t('lb.monthReturned') }[st];
    const colour = { approved:'var(--palm)', ready:'var(--amber)', returned:'var(--amber)', pending:'var(--ink-faint)' }[st];
    return '<div class="month-card"><div class="m-label">' + esc(t('lb.month', {n:m})) + '</div>' +
      '<div class="m-status" style="color:' + colour + ';">' + esc(label) + '</div></div>';
  }).join('');

  return '<div class="screen-body"><div class="constrain stack">' +
    '<div class="card card-pad">' +
      '<div class="section-head" style="margin:0 0 8px;">' +
        '<p class="section-eyebrow">' + esc(t('pl.progress')) + '</p>' +
        '<span class="inline-note">' + esc(t('pl.weeksApproved', {n:4})) + '</span></div>' +
      weekStrip(true) +
      '<p class="inline-note" style="margin-top:8px;">' + esc(t('lb.lockedNote')) + '</p>' +
    '</div>' +

    '<div class="card card-pad">' +
      '<div class="section-head" style="margin:0 0 12px;">' +
        '<p class="section-eyebrow">' + esc(t('lb.week', {n:w.no})) + '</p>' + statusBadge + '</div>' +

      '<span class="field-label">' + esc(t('lb.attendance')) + '</span>' +
      '<div class="day-row">' + dayBtns + '</div>' +
      '<p class="inline-note" style="margin:7px 0 16px;">' + esc(t('lb.workingWeek')) + '</p>' +

      '<div class="field" style="margin-bottom:8px;"><label>' + esc(t('lb.entry')) + '</label>' +
        '<textarea style="min-height:130px;"' + (editable ? '' : ' disabled') +
          ' placeholder="' + esc(t('lb.entryPlaceholder')) + '" oninput="setWeekText(this.value)">' +
          esc(text) + '</textarea></div>' +

      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;">' +
        '<span class="char-count ' + (chars >= MIN_LOG_CHARS ? 'ok' : 'short') + '">' +
          esc(t('lb.charsSoFar', {n:chars})) + '</span>' +
        '<span class="inline-note">' + esc(t('lb.minChars', {n:MIN_LOG_CHARS})) + '</span></div>' +

      (editable
        ? '<button class="btn-primary" onclick="submitWeek()"' + (canSubmit ? '' : ' disabled') + '>' +
            esc(t('lb.submit')) + '</button>' +
          (days === 0 ? '<p class="inline-note" style="text-align:center;margin-top:8px;">' +
            esc(t('lb.needsDay')) + '</p>' : '')
        : '') +
    '</div>' +

    '<p class="section-eyebrow">' + esc(t('lb.months')) + '</p>' +
    '<div class="month-track">' + monthCards + '</div>' +
    '</div></div>';
}

/* ---------- Student: placement ---------- */

function screenPlacement() {
  const approved = S.weeks.filter(w => w.status === 'approved').length;
  const attended = S.weeks.reduce((n, w) => n + w.days.filter(Boolean).length, 0);
  const unlocked = [1,2,3].every(m => S.months[m] === 'approved');

  const kv = (ic, label, value) =>
    '<div class="kv">' + icon(ic) + '<div><div class="kv-label">' + esc(label) + '</div>' +
    '<div class="kv-value">' + esc(value) + '</div></div></div>';

  /* This screen had nothing on it to press. A placement is twelve weeks of
     logbook entries, so the one thing a student comes here to find out is which
     week is due — and from here they could not get to it. */
  const dueWeek = S.weeks.find(w => w.status === 'draft')
    || S.weeks.find(w => w.status !== 'approved' && w.status !== 'submitted');

  return '<div class="screen-body"><div class="constrain stack">' +
    (dueWeek
      ? '<button class="check-card" onclick="goto(\'logbook\')">' +
          '<span class="check-card-ico">' + icon('book') + '</span>' +
          '<span class="check-card-body">' +
            '<span class="check-card-t">' + esc(t('pl.dueWeek', { n:dueWeek.no })) + '</span>' +
            '<span class="check-card-s">' + esc(t('pl.openLogbook')) + '</span></span>' +
          icon('chevron', 'more-chevron') +
        '</button>'
      : '') +
    '<div class="card card-pad">' +
      kv('home', t('pl.host'), lang==='ar' ? 'صيدلية الرحمة' : 'Al-Rahma Pharmacy') +
      kv('pin', t('l.location'), lang==='ar' ? 'الكرادة، بغداد' : 'Karrada, Baghdad') +
      kv('calendar', t('pl.period'), lang==='ar' ? '15 حزيران – 7 أيلول' : '15 June – 7 September') +
      kv('user', t('pl.supervisor'), lang==='ar' ? 'د. رحمة الجبوري' : 'Dr Rahma Al-Jubouri') +
    '</div>' +

    '<div class="card card-pad">' +
      '<div class="section-head" style="margin:0 0 10px;">' +
        '<p class="section-eyebrow">' + esc(t('pl.progress')) + '</p>' +
        '<span class="inline-note">' + esc(t('pl.weeksApproved', {n:approved})) + '</span></div>' +
      '<div class="progress"><i style="width:' + Math.round(approved / 12 * 100) + '%"></i></div>' +
      '<div style="margin-top:14px;">' + weekStrip(false) + '</div>' +
      '<div class="kv" style="border-bottom:none;padding-bottom:0;margin-top:10px;">' + icon('check') +
        '<div><div class="kv-label">' + esc(t('pl.attendance')) + '</div>' +
        '<div class="kv-value figure">' + esc(t('pl.daysAttended', {a:attended, b:60})) + '</div></div></div>' +
    '</div>' +

    '<p class="section-eyebrow">' + esc(t('pl.certificate')) + '</p>' +
    (unlocked
      ? '<div class="card card-pad">' +
          '<div class="banner banner-green" style="margin-bottom:14px;">' + icon('badge') +
            '<p>' + esc(t('pl.certReady')) + '</p></div>' +
          certificateSheet() +
          '<button class="btn-primary no-print" style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;" onclick="exportCertificate()">' +
            icon('download') + esc(t('pl.certDownload')) + '</button>' +
        '</div>'
      : '<div class="card card-pad" style="display:flex;gap:12px;align-items:flex-start;">' +
          '<span class="role-icon" style="background:var(--mist);">' + icon('lock') + '</span>' +
          '<div><div style="font-size:13.5px;font-weight:600;">' + esc(t('pl.certificate')) + '</div>' +
          '<p class="inline-note" style="margin-top:4px;">' + esc(t('pl.certLocked')) + '</p></div></div>') +

    '<p class="inline-note">' + esc(t('pl.certNote')) + '</p>' +
    '</div></div>';
}

/* The bottom bar gets five at most — more than five targets on a phone is a
   menu pretending to be a nav. The sidebar can carry the rest. */
/* A pharmacy owner is a pharmacist who also owns a pharmacy — one person, one
   licence, two jobs. They get both sets of screens rather than a merged
   compromise, with the pharmacy half leading because that is the half they
   open the app to do. The pharmacist half is how they take a shift at somebody
   else's counter, which owners really do.

   Five thumb-sized targets is the bottom bar's honest limit, so the owner's
   sixth-and-beyond live behind "More" — a screen, not a hidden menu, and the
   desktop sidebar shows the same items under headings instead. */
/* A pharmacy owner is a pharmacist who also owns a pharmacy — one person, one
   licence, two jobs. They get both sets of screens, with the pharmacy half
   leading because that is the half they open the app to do.

   But most owners will never take a locum shift, so the pharmacist half is
   OFF by default and switched on in settings (W2). With it off the bottom bar
   holds the pharmacy screens outright; with it on there are too many for five
   thumb-sized targets, so the rest move behind "More" — a screen, not a hidden
   menu — and the desktop sidebar groups them under headings either way. */
/* The drug reference earns a slot in the pharmacist's bar rather than a place
   behind More, because it is the one screen opened DURING the work — several
   times a shift, with someone waiting. What it displaces is the CV, which is
   opened a handful of times a year; that moves to "More" along with incident
   reporting, which had no route on a phone at all before this.

   The student's bar had four, so theirs simply gains a fifth: a placement is
   twelve weeks of being asked questions at a counter, and this is the thing
   that answers them. The admin is the platform's reviewer and works in the
   CRM, which has the same list with editing on top. */
const NAV = {
  /* W13 — "More" held CV, notifications, incidents and profile. Notifications
     are already on every screen in the header bell and Profile was in the
     sidebar, so More was a two-item menu wearing a five-item coat. Its
     contents moved into Profile, which is an account screen people already
     look in, and the bar got a slot back. */
  pharmacist: [['browse','home','nav.browse'],['shifts','calendar','nav.shifts'],['earnings','wallet','nav.earnings'],
               ['drugs','pill','nav.drugs'],['profile','user','nav.profile']],
  student:    [['browse','home','nav.browse'],['placement','calendar','nav.placement'],
               ['logbook','book','nav.logbook'],['drugs','pill','nav.drugs'],['profile','user','nav.profile']],
  admin:      [['queue','badge','nav.queue'],['profile','user','nav.profile']],
  /* A partner has two things to do here and neither is clinical. */
  partner:    [['partner','clipboard','nav.listings'],['profile','user','nav.profile']],
  /* W7 — a chain manager runs branches, not a counter. Their bar has no
     pharmacist half at all: nothing about their day is a shift they work. */
  manager:    [['group','grid','nav.group'],['post','plus','nav.post'],
               ['applicants','users','nav.applicants'],['billing','wallet','nav.billing'],
               ['profile','user','nav.profile']]
};

/* The owner's bottom bar. Without shift-taking, the pharmacy screens fit on
   their own; with it, Trainees gives up its slot to "More". */
const NAV_OWNER_PHARMACY_ONLY =
  [['dashboard','home','nav.dashboard'],['post','plus','nav.post'],['applicants','users','nav.applicants'],
   ['trainees','cap','nav.trainees'],['profile','user','nav.profile']];
const NAV_OWNER_BOTH =
  [['dashboard','home','nav.dashboard'],['post','plus','nav.post'],['applicants','users','nav.applicants'],
   ['more','grid','nav.more'],['profile','user','nav.profile']];

function navFor(role) {
  if (role !== 'owner') return NAV[role] || NAV.pharmacist;
  return S.takesShifts ? NAV_OWNER_BOTH : NAV_OWNER_PHARMACY_ONLY;
}

/* Which roles get a grouped sidebar rather than a flat list. */
function sidebarGroups() {
  if (S.role === 'owner')   return ownerGroups();
  if (S.role === 'manager') return managerGroups();
  return null;
}

/* The owner's sidebar, and what "More" lists. The pharmacist group appears only
   when they have asked for it. Billing is pharmacy-side and always present: an
   owner is CHARGED whether or not they ever earn anything, and hiding what
   somebody owes is not a simplification. */
/* W7 — the manager's sidebar. Same grouping argument as the owner's: the
   group-wide screens and the account screens are two different jobs, and one
   flat list makes both harder to scan. */
function managerGroups() {
  return [
    { key:'grp.group', items:[['group','grid','nav.group'],['post','plus','nav.post'],
                              ['applicants','users','nav.applicants'],
                              ['consumption','chart','nav.consumption'],
                              ['billing','wallet','nav.billing']] },
    { key:'grp.account', items:[['drugs','pill','nav.drugs'],['cv','clipboard','nav.cv'],
                                ['notifications','bell','nav.notifications'],
                                ['profile','user','nav.profile']] }
  ];
}

function ownerGroups() {
  const groups = [
    { key:'grp.pharmacy', items:[['dashboard','home','nav.dashboard'],['post','plus','nav.post'],
                                 ['applicants','users','nav.applicants'],['trainees','cap','nav.trainees'],
                                 /* The pharmacy's own consumption. Commercial, not
                                    clinical — which is why it sits here and the
                                    check itself sits under Drugs. */
                                 ['consumption','chart','nav.consumption'],
                                 ['billing','wallet','nav.billing']] }
  ];
  if (S.takesShifts) {
    groups.push({ key:'grp.pharmacist', items:[['browse','home','nav.browse'],['shifts','calendar','nav.shifts'],
                                               ['earnings','wallet','nav.earnings']] });
  }
  /* The CV is not shift-specific: an owner uses it for a supplier, a regulator
     or a bank, which is why the clinical / non-clinical split exists. It stays
     whether or not they take shifts. */
  /* An owner is a pharmacist, so the reference is theirs too — and an owner
     supervising a locum needs it as much as the locum does. It sits in the
     account group rather than the pharmacy one because it is not about
     running a business. */
  groups.push({ key:'grp.account', items:[['drugs','pill','nav.drugs'],
                                          ['cv','clipboard','nav.cv'],
                                          ['notifications','bell','nav.notifications'],
                                          ['incidents','alert','nav.incidents'],
                                          ['profile','user','nav.profile']] });
  return groups;
}

/* What "More" lists, for whoever is signed in. It used to be the owner's alone;
   the pharmacist has one now because the bar ran out of slots before the screens
   ran out, which is exactly the situation More exists for. */
function moreGroups() {
  if (S.role === 'owner') return ownerGroups();
  if (S.role === 'manager') return managerGroups();
  if (S.role === 'student') {
    return [{ key:'grp.account', items:[['notifications','bell','nav.notifications'],
                                        ['profile','user','nav.profile']] }];
  }
  return [{ key:'grp.account', items:[['cv','clipboard','nav.cv'],
                                      ['notifications','bell','nav.notifications'],
                                      ['incidents','alert','nav.incidents'],
                                      ['profile','user','nav.profile']] }];
}

/* What Profile now carries for a flat role, since More is gone from the bar.
   The owner keeps More: they have two jobs and genuinely more screens than a
   phone bar holds. */
function profileLinks() {
  if (S.role === 'owner' || S.role === 'manager' || S.role === 'admin') return [];
  if (S.role === 'student') return [['notifications','bell','nav.notifications']];
  return [['cv','clipboard','nav.cv'], ['notifications','bell','nav.notifications'],
          ['incidents','alert','nav.incidents']];
}

/* Sidebar-only extras for the flat roles. */
/* Sidebar-only extras for the flat roles. A wide screen has the room the bottom
   bar does not, so nothing hides behind More there. */
const NAV_EXTRA = {
  pharmacist: [['cv','clipboard','nav.cv'],['notifications','bell','nav.notifications'],
               ['incidents','alert','nav.incidents']],
  student:    [['notifications','bell','nav.notifications']],
  admin:      [],
  partner:    [],
  manager:    []
};

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return lang==='ar' ? 'صباح الخير' : 'Good morning';
  if (h < 18) return lang==='ar' ? 'مساء الخير' : 'Good afternoon';
  return lang==='ar' ? 'مساء الخير' : 'Good evening';
}

function currentName() {
  const a = ACCOUNTS[S.email];
  return a ? t(a.nameKey) : '';
}

function unreadCount() {
  return S.notifs.filter(n => n.roles.includes(S.role) && !n.read).length;
}

/* ==========================================================================
   RENDER
   ========================================================================== */

function render() {
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('auth').classList.toggle('hidden', S.signedIn);
  document.getElementById('app').classList.toggle('hidden', !S.signedIn);

  if (!S.signedIn) { renderAuth(); renderModal(); return; }

  // Tear the sign-in page out of the DOM rather than just hiding it. A hidden
  // copy keeps stale content and a second #email/#password around, and the
  // first thing that goes looking for one of those ids finds the wrong one.
  document.getElementById('auth').innerHTML = '';

  const screen = SCREENS[S.screen] || SCREENS.browse;
  const unread = unreadCount();

  document.getElementById('app-header').innerHTML = headerHtml(screen.eyebrow(), screen.title());
  document.getElementById('app-body').innerHTML = verificationBanner() + screen.body();

  const nav = navFor(S.role);
  const extra = NAV_EXTRA[S.role] || [];

  document.getElementById('bottom-nav').innerHTML = nav.map(([id, ic, key]) =>
    '<button class="nav-item' + (S.screen === id ? ' active' : '') + '" onclick="goto(\'' + id + '\')">' +
    icon(ic) + '<span>' + esc(t(key)) + '</span></button>').join('');

  const sideItem = ([id, ic, key]) =>
    '<button class="side-nav-item' + (S.screen === id ? ' active' : '') + '" onclick="goto(\'' + id + '\')">' +
    icon(ic) + '<span>' + esc(t(key)) + '</span>' +
    (id === 'notifications' && unread ? '<span class="side-nav-count">' + unread + '</span>' : '') +
    '</button>';

  /* The owner's sidebar is grouped under headings. Two jobs in one flat list is
     how both become hard to scan. */
  /* "More" is a bottom-bar item, not a sidebar one: a wide screen has room for
     everything it would have held, so listing it there offers a door to a room
     you are already standing in. */
  const groups = sidebarGroups();
  document.getElementById('side-nav').innerHTML = groups
    ? groups.map(g => '<div class="side-group">' + esc(t(g.key)) + '</div>' +
        g.items.map(sideItem).join('')).join('')
    : nav.filter(x => x[0] !== 'more').concat(extra).map(sideItem).join('');

  const acct = ACCOUNTS[S.email];
  document.getElementById('side-account').innerHTML = acct
    ? '<span class="avatar">' + esc(L(acct.initials)) + '</span>' +
      '<span style="flex:1;min-width:0;"><span class="side-account-name">' + esc(t(acct.nameKey)) + '</span>' +
      '<span class="side-account-role">' + esc(t(acct.tagKey)) + '</span></span>'
    : '';

  document.getElementById('sidebar-sub').textContent = t('brand.short');
  document.getElementById('build-tag').textContent = VERSION;
  document.getElementById('sidebar-brand').textContent = 'Saydali+';
  document.getElementById('topbar-brand').textContent = 'Saydali+';

  renderModal();
}

/* Switching it off governs FINDING new work: Browse and My Shifts go. Earnings

function toggleTakesShifts(){

/* The sibling build. Files carry their version in the name, so this is the one
   thing a version bump can silently break — which is why demo/check.mjs
   asserts the file named here exists on disk. Bump the CRM, change this line. */
const PEER_CRM = '../crm/saydali-crm_v0.0008.html';
function openCrm(){ window.open(PEER_CRM, '_blank', 'noopener'); }
function setAuth(s){ authScreen = s; authError = null; render(); }
function chooseRole(r){ signupRole = r; authScreen = 'signup'; render(); }

/* Remembering the last account. localStorage can throw on a file:// page in a
   private window and comes back empty after cleared site data, so every read
   and write is guarded and the app works without it — it is a convenience, not
   state anything depends on. */
const LAST_ACCOUNT_KEY = 'saydali.lastAccount';
function rememberAccount(mail) {
  try { localStorage.setItem(LAST_ACCOUNT_KEY, mail); } catch (e) { /* private window */ }
}
function lastAccount() {
  try { return localStorage.getItem(LAST_ACCOUNT_KEY) || null; } catch (e) { return null; }
}

function useAccount(mail){
  S.email = mail;
  authError = null;
  render();
  const p = document.getElementById('password');
  if (p) { p.value = 'password123'; p.focus(); }
}

function attemptSignIn(){
  const mail = (document.getElementById('email').value || '').trim().toLowerCase();
  const pass = document.getElementById('password').value || '';

  if (!mail || !pass) { authError = 'auth.needEmail'; render(); return; }
  if (!ACCOUNTS[mail]) { authError = 'auth.noAccount'; S.email = mail; render(); return; }
  signInAs(mail);
}

function signInAs(mail){
  const a = ACCOUNTS[mail];
  rememberAccount(mail);
  S.email = mail;
  S.role = viewRole(a);
  S.verified = a.verified;
  S.trial = a.trial;
  S.takesShifts = isOwner(a) ? !!a.takesShifts : true;
  S.signedIn = true;
  S.screen = navFor(S.role)[0][0];
  authError = null;
  render();
}

function signOut(){
  /* Signing out clears the session, not the memory of who it was. Coming back
     to a filled-in email is three taps saved on the screen everyone sees most. */
  S.signedIn = false;
  S.modal = null;
  authScreen = 'signin';
  authError = null;
  render();
}

/* A calendar entry, generated in the page. No server involved: an .ics file is
   a dozen lines of text, and a Blob URL is enough to hand it to whatever
   calendar the phone already has. */
function addShiftToCalendar() {
  const l = DATA.listings[1];
  const pad = n => String(n).padStart(2, '0');
  const start = new Date(); start.setDate(start.getDate() + 2); start.setHours(16, 0, 0, 0);
  const end = new Date(start); end.setHours(23, 0, 0, 0);
  const stamp = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
    pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Saydali+//EN', 'BEGIN:VEVENT',
    'UID:' + Date.now() + '@saydaliplus', 'DTSTAMP:' + stamp(new Date()),
    'DTSTART:' + stamp(start), 'DTEND:' + stamp(end),
    'SUMMARY:' + L(l.pharmacy), 'LOCATION:' + L(l.district), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar' }));
  a.download = 'shift.ics';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t('b.addCalendar'));
}

/* W12c — repeat a shift.

   Posting is six inputs and pharmacies post the same patterns every week. This
   fills the form from a previous post and stops, for the owner to confirm: the
   rate may have moved, the date certainly has, and a shift posted by accident
   costs a real phone call to undo. Pre-filled and waiting is the version that
   saves the typing without spending anybody's trust. */
const RECENT_POSTS = [
  { label:{ en:'Thursday evening', ar:'مساء الخميس' }, rateType:'hourly', rate:6000, start:'18:00', end:'23:00', type:'shift' },
  { label:{ en:'Saturday cover',   ar:'تغطية السبت' }, rateType:'hourly', rate:5000, start:'08:00', end:'14:00', type:'shift' }
];

function repeatPost(i) {
  const r = RECENT_POSTS[i];
  if (!r) return;
  S.postType = r.type;
  S.rateType = r.rateType;
  S.rate     = r.rate;
  S.start    = r.start;
  S.end      = r.end;
  S.screen   = 'post';
  S.repeatedFrom = L(r.label);
  render();
  scrollTop();
}

function goto(s){
  // Arriving at the form any other way is a fresh post, not a repeat.
  if (s === 'post') S.repeatedFrom = null;
  /* Arriving at the module from anywhere lands on the check. Moving between
     its own tabs does not go through here, so a pharmacist reading the
     reference is not yanked back mid-scroll. */
  if (s === 'drugs') S.drugTab = 'check';
  S.screen = s; S.modal = null; render(); scrollTop();
}

/* The one route into the module that must NOT reset the tab: coming back from
   a drug record you opened out of the reference. */
function backToReference() { S.drugTab = 'reference'; S.screen = 'drugs'; render(); scrollTop(); }

/* The search re-renders on every keystroke, which would move focus to the top
   of a rebuilt screen. So the field is restored and the caret put back at the
   end — a search box that loses the cursor on the second letter is a search

function toggleDay(i){
  const w = S.weeks.find(x => x.no === S.openWeek);
  if (!w || w.status !== 'draft') return;
  w.days[i] = !w.days[i];
  render();
}
function setWeekText(v){
  const w = S.weeks.find(x => x.no === S.openWeek);
  if (!w || w.status !== 'draft') return;
  w.text = { en:v, ar:v };
  // Re-render only the counter: re-rendering the screen would steal the caret.
  const el = document.querySelector('.char-count');
  if (el) {
    const n = v.trim().length;
    el.textContent = t('lb.charsSoFar', {n:n});
    el.className = 'char-count ' + (n >= MIN_LOG_CHARS ? 'ok' : 'short');
  }
  const btn = document.querySelector('.card .btn-primary');
  if (btn) btn.disabled = !(v.trim().length >= MIN_LOG_CHARS && w.days.some(Boolean));
}
function submitWeek(){
  const w = S.weeks.find(x => x.no === S.openWeek);
  if (!w || w.status !== 'draft') return;
  if (!w.days.some(Boolean) || L(w.text).trim().length < MIN_LOG_CHARS) return;
  w.status = 'submitted';
  // Forward-fill: the next week opens only once this one is in.
  const next = S.weeks.find(x => x.no === w.no + 1);
  if (next && next.status === 'locked') { next.status = 'draft'; S.openWeek = next.no; }
  toast(t('lb.weekSubmitted', {n:w.no}));
  render();
}

/* ---------- Trainees ---------- */

function openReturn(m){ S.modal = { kind:'return', month:Number(m) }; renderModal(); }
function approveMonth(m){
  S.months[m] = 'approved';
  S.weeks.filter(w => w.no > (m - 1) * 4 && w.no <= m * 4)
         .forEach(w => { if (w.status === 'submitted') w.status = 'approved'; });
  toast(t('tr.approved', {n:m}));
  render();
}
function returnMonth(m){
  S.months[m] = 'returned';
  S.modal = null;
  toast(t('tr.returned', {n:m}));
  render();
}

/* ---------- Notifications ---------- */

function readNotif(id){
  const n = S.notifs.find(x => x.id === id);
  if (n) n.read = true;
  render();
}
function markAllRead(){
  S.notifs.forEach(n => { if (n.roles.includes(S.role)) n.read = true; });
  render();
}

/* ---------- Toast ---------- */

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });

render();
</script>
