<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2D2A6E">
<title>Saydali+ — صيدلي+</title>
<meta name="version" content="App_v0.0008">
<!--
  Saydali+ — a single-file working front end.

  This is the product's interface, not a slide of it: it fills the window,
  you sign in as a real account to get that account's app, and every screen in
  every navigation is a screen rather than a placeholder. Open it from disk,
  no server and no build.

  What it is not is the whole product. The real thing is the Next.js + Supabase
  app in this repository, and its security model is Postgres row-level
  security — which cannot exist in a file you open from disk. So treat this as
  the front end with its data stubbed: what you can see and do here, you can
  see and do there; what stops you doing it to someone ELSE'S data lives in the
  database, and is tested there.

  Two things are real rather than mocked, because they are the things worth
  checking against a pharmacy's own arithmetic: the fee engine is a port of
  src/config/fees.ts, and the shift-hours function a port of src/lib/time.ts.
  The numbers on these screens are the numbers the product charges.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1826; --ink-soft:#57536E; --ink-faint:#8B87A3;
    --indigo:#2D2A6E; --indigo-dark:#191735; --indigo-tint:#E7E6F4;
    --amber:#B8791F; --amber-tint:#F5E6C8;
    --palm:#4F7A47; --palm-tint:#E7EFE3;
    --clay:#9B3B33; --clay-tint:#F6E2E0;
    --mist:#EFEEF7; --card:#FFFFFF; --border:#E1DFEC;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --font-ar:'Noto Kufi Arabic','IBM Plex Sans',sans-serif;
    --sidebar:250px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{ height:100%; }
  body{
    font-family:var(--font-body); background:var(--mist); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  html[dir="rtl"] body{ font-family:var(--font-ar); }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:none; }
  :focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; border-radius:4px; }
  .figure{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .ico{ width:16px; height:16px; flex:none; }
  .hidden{ display:none !important; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#D5D2E4; border-radius:10px; border:3px solid var(--mist); }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ==========================================================================
     THE SHELL
     One shell, not two. The phone and desktop layouts are the same DOM under
     different CSS, so a screen cannot be right in one and wrong in the other —
     which is exactly what happens when they are maintained as separate views.
     ========================================================================== */

  #app{ display:flex; height:100%; }

  .sidebar{
    width:var(--sidebar); flex:none; color:#fff; display:flex; flex-direction:column;
    position:relative; overflow:hidden;
    background:linear-gradient(180deg,var(--indigo-dark) 0%,var(--indigo) 100%);
  }
  /* The star tile is a regional cue, not wallpaper. Down a tall sidebar it
     reads much heavier than in a short header band, so it is dialled back. */
  .sidebar .header-pattern{ opacity:.4; }
  .sidebar-head{ position:relative; padding:22px 20px 16px; }
  .sidebar-brand{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; }
  .sidebar-brand-sub{ font-size:11.5px; color:rgba(255,255,255,.6); margin-top:3px; line-height:1.5; }
  .build-tag{ font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,.4); margin-top:5px; letter-spacing:.04em; }
  .side-nav{ position:relative; flex:1; overflow-y:auto; padding:4px 12px; display:flex; flex-direction:column; gap:2px; }
  .side-nav::-webkit-scrollbar{ width:0; }
  .side-nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    font-size:13.5px; font-weight:500; color:rgba(255,255,255,.74); text-align:start; width:100%;
    transition:background .12s,color .12s;
  }
  .side-nav-item svg{ width:18px; height:18px; flex:none; }
  .side-nav-item:hover{ background:rgba(255,255,255,.09); color:#fff; }
  .side-nav-item.active{ background:rgba(255,255,255,.16); color:#fff; font-weight:600; }
  .toggle-row{ display:flex; align-items:flex-start; gap:14px; }
  .toggle-title{ font-size:13.5px; font-weight:600; }
  .switch{
    flex:none; width:46px; height:27px; border-radius:100px; background:var(--border);
    position:relative; transition:background .15s; margin-top:2px;
  }
  .switch.on{ background:var(--palm); }
  .switch .knob{
    position:absolute; top:3px; inset-inline-start:3px; width:21px; height:21px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(20,30,28,.3); transition:inset-inline-start .15s;
  }
  .switch.on .knob{ inset-inline-start:22px; }
  .side-group{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    color:rgba(255,255,255,.45); padding:14px 12px 5px;
  }
  .side-group:first-child{ padding-top:2px; }
  .more-chevron{ margin-inline-start:auto; color:var(--ink-faint); width:15px; height:15px; }
  html[dir="rtl"] .more-chevron{ transform:scaleX(-1); }
  .side-nav-count{
    margin-inline-start:auto; font-family:var(--font-mono); font-size:11px; font-weight:600;
    background:var(--amber); color:#2A1C05; border-radius:100px; padding:1px 7px;
  }
  .sidebar-foot{ position:relative; border-top:1px solid rgba(255,255,255,.14); padding:12px; }
  .side-account{
    display:flex; align-items:center; gap:10px; width:100%; text-align:start;
    padding:8px 10px; border-radius:11px; color:#fff; transition:background .12s;
  }
  .side-account:hover{ background:rgba(255,255,255,.09); }
  .side-account .avatar{ width:32px; height:32px; border-radius:10px; font-size:12px;
    background:rgba(255,255,255,.18); color:#fff; }
  .side-account-name{ display:block; font-size:13px; font-weight:600; line-height:1.3; }
  .side-account-role{ display:block; font-size:11px; color:rgba(255,255,255,.62); margin-top:1px; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .app-body{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }

  /* ---------- Topbar (mobile only: the sidebar carries this on desktop) ---------- */
  .topbar{
    flex:none; display:none; align-items:center; gap:10px; padding:10px 14px;
    background:var(--indigo-dark); color:#fff; position:relative; overflow:hidden;
  }
  .topbar-brand{ font-family:var(--font-display); font-weight:700; font-size:16px; position:relative; }
  .topbar-spacer{ flex:1; }

  /* ---------- Bottom nav (mobile only) ---------- */
  .bottom-nav{
    flex:none; display:none; border-top:1px solid var(--border); background:#fff;
    padding:7px 6px calc(7px + var(--safe-b));
  }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; color:var(--ink-faint); position:relative; }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item span{ display:block; font-size:10px; font-weight:500; }
  .nav-item.active{ color:var(--indigo); }
  .nav-dot{ position:absolute; top:2px; inset-inline-end:22%; width:7px; height:7px; border-radius:50%; background:var(--amber); }

  @media (max-width:900px){
    .sidebar{ display:none; }
    .topbar{ display:flex; }
    .bottom-nav{ display:flex; }
  }

  /* ---------- Header ---------- */
  .app-header{
    flex:none; position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(135deg,var(--indigo) 0%,var(--indigo-dark) 100%);
    padding:22px 26px 20px;
  }
  @media (min-width:901px){ .app-header{ padding:26px 34px; } }
  .header-pattern{ position:absolute; inset:0; width:100%; height:100%; }
  .header-row{ position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .header-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em;
    text-transform:uppercase; color:rgba(255,255,255,.68); margin-bottom:5px;
  }
  .header-title{ font-family:var(--font-display); font-size:22px; font-weight:700; line-height:1.15; }
  html[dir="rtl"] .header-title{ font-family:var(--font-ar); }
  .header-actions{ display:flex; gap:8px; flex:none; }
  .icon-btn{
    flex:none; width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; position:relative; transition:background .12s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.24); }
  .icon-btn svg{ width:18px; height:18px; color:#fff; }
  .icon-btn .dot{ position:absolute; top:7px; inset-inline-end:7px; width:7px; height:7px; border-radius:50%; background:var(--amber); }
  .lang-btn{
    flex:none; height:36px; padding:0 13px; border-radius:12px; background:rgba(255,255,255,.14);
    color:#fff; font-family:var(--font-display); font-weight:600; font-size:12.5px; transition:background .12s;
  }
  .lang-btn:hover{ background:rgba(255,255,255,.24); }

  /* ---------- Content ---------- */
  .screen-body{ padding:20px 22px calc(30px + var(--safe-b)); }
  @media (min-width:901px){ .screen-body{ padding:26px 34px 44px; } }
  .constrain{ max-width:660px; }
  .wide{ max-width:1060px; }
  .section-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); margin:22px 0 10px;
  }
  .section-eyebrow:first-child{ margin-top:0; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:22px 0 10px; }
  .section-head:first-child{ margin-top:0; }
  .section-head .section-eyebrow{ margin:0; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .card-pad{ padding:16px 17px; }
  .stack > * + *{ margin-top:12px; }

  .grid-cards{ display:grid; gap:12px; }
  @media (min-width:640px){ .grid-cards{ grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); } }
  .two-col{ display:grid; gap:22px; align-items:start; }
  @media (min-width:1000px){ .two-col{ grid-template-columns:1.55fr 1fr; } }
  .empty{ text-align:center; color:var(--ink-faint); font-size:13px; padding:26px 18px; line-height:1.7; }
  /* ---------- Chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip-row::-webkit-scrollbar{ height:0; }
  .chip{
    flex:none; font-size:13px; font-weight:500; padding:7px 14px; border-radius:100px;
    border:1px solid var(--border); background:var(--card); color:var(--ink-soft);
  }
  .chip.active{ background:var(--indigo); border-color:var(--indigo); color:#fff; }

  /* ---------- Listing card ---------- */
  .listing-card{
    width:100%; text-align:start; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:15px 16px; display:block; transition:border-color .12s, box-shadow .12s;
  }
  .listing-card:hover{ border-color:rgba(45,42,110,.4); box-shadow:0 6px 16px -8px rgba(20,30,28,.18); }
  .listing-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:9px; }
  .pharmacy-name{ font-family:var(--font-display); font-weight:600; font-size:15.5px; }
  html[dir="rtl"] .pharmacy-name{ font-family:var(--font-ar); font-size:14.5px; }
  .pay-amount{ font-family:var(--font-mono); font-weight:600; font-size:14.5px; color:var(--indigo); white-space:nowrap; }
  .pay-basis{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .meta-line{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .meta-line svg{ width:13px; height:13px; color:var(--ink-faint); flex:none; }
  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:500; padding:4px 9px; border-radius:100px; }
  .badge svg{ width:12px; height:12px; }
  .badge-otc{ background:var(--indigo-tint); color:var(--indigo-dark); }
  .badge-controlled{ background:var(--amber-tint); color:var(--amber); }
  .badge-verified{ background:var(--palm-tint); color:var(--palm); }
  .badge-pending{ background:var(--amber-tint); color:#8A5610; }
  .badge-stage{ background:var(--amber-tint); color:#8A5610; }
  .badge-muted{ background:var(--mist); color:var(--ink-faint); }
  /* The one badge that means a branch cannot legally open. It is the only
     red on the board, so it reads before anything else. */
  .badge-alert{ background:var(--clay-tint); color:var(--clay); }

  /* ---------- Buttons ---------- */
  .btn-primary{
    width:100%; background:var(--indigo); color:#fff; font-family:var(--font-display);
    font-weight:600; font-size:14.5px; padding:13px; border-radius:13px; text-align:center; transition:background .12s;
  }
  html[dir="rtl"] .btn-primary, html[dir="rtl"] .btn-secondary{ font-family:var(--font-ar); }
  .btn-primary:hover{ background:var(--indigo-dark); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-secondary{
    width:100%; background:var(--card); color:var(--indigo); border:1.4px solid var(--indigo);
    font-family:var(--font-display); font-weight:600; font-size:14px; padding:11.5px;
    border-radius:13px; text-align:center;
  }
  .btn-secondary:hover{ background:var(--indigo-tint); }
  .btn-small{
    font-size:12.5px; font-weight:600; font-family:var(--font-display); padding:7px 14px;
    border-radius:9px; background:var(--indigo); color:#fff; flex:none;
  }
  .btn-small.green{ background:var(--palm); }
  .btn-ghost{
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px;
    border:1px solid var(--border); color:var(--ink-soft);
  }
  .link-btn{ font-size:12.5px; font-weight:500; color:var(--indigo); text-decoration:underline; text-underline-offset:2px; }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:15px; }
  .field label, .field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1.4px solid var(--border); border-radius:11px;
    padding:11px 13px; font-size:14px; background:var(--card); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--indigo); }
  .field textarea{ resize:none; min-height:74px; }
  .field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; line-height:1.5; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .checkbox-row{
    display:flex; align-items:center; gap:10px; padding:12px 13px;
    border:1.4px solid var(--border); border-radius:11px; margin-bottom:15px;
  }
  .checkbox-row input{ width:18px; height:18px; accent-color:var(--amber); }
  .checkbox-row label{ font-size:13.5px; margin:0; font-weight:400; color:var(--ink); }

  .segmented{ display:flex; background:var(--indigo-tint); border-radius:11px; padding:3px; margin-bottom:15px; }
  .segmented button{ flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--indigo-dark); }
  .segmented button.active{ background:#fff; box-shadow:0 1px 3px rgba(20,30,28,.12); }

  /* ---------- Banners ---------- */
  .banner{ display:flex; align-items:flex-start; gap:10px; border-radius:14px; padding:12px 14px; }
  .banner svg{ width:18px; height:18px; flex:none; margin-top:1px; }
  .banner p{ font-size:12.5px; line-height:1.55; }
  .banner-amber{ background:var(--amber-tint); border:1px solid #E3CE9E; color:#8A5610; }
  .banner-amber svg{ color:var(--amber); }
  .banner-green{ background:var(--palm-tint); border:1px solid #CFE0C9; color:var(--ink-soft); }
  .banner-green svg{ color:var(--palm); }
  .banner-indigo{ background:var(--indigo-tint); border:1px solid #D6D4EC; color:var(--indigo-dark); }
  .banner-indigo svg{ color:var(--indigo); }

  /* ---------- Stats ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .stat-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; }
  .stat-num{ font-family:var(--font-mono); font-weight:600; font-size:17px; color:var(--indigo); display:block; }
  .stat-label{ font-size:10.5px; color:var(--ink-faint); margin-top:3px; line-height:1.35; display:block; }

  /* ---------- Rows ---------- */
  .row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); }
  .row:last-child{ border-bottom:none; }
  .row-body{ flex:1; min-width:0; }
  .row-title{ font-size:13.5px; font-weight:500; }
  .row-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .row-value{ font-family:var(--font-mono); font-size:13px; font-weight:600; flex:none; }

  .kv{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .kv:last-child{ border-bottom:none; }
  .kv svg{ width:16px; height:16px; color:var(--indigo); margin-top:2px; flex:none; }
  .kv-label{ font-size:11.5px; color:var(--ink-faint); }
  .kv-value{ font-size:13.5px; font-weight:500; margin-top:2px; }

  .rating{ display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  .rating svg{ width:13px; height:13px; color:var(--amber); }

  /* ---------- Fee breakdown ---------- */
  .fee-line{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0; font-size:13px; }
  .fee-line dt{ color:var(--ink-soft); }
  .fee-line dd{ font-family:var(--font-mono); font-weight:600; }
  .fee-total{ border-top:1px solid var(--border); margin-top:4px; padding-top:10px; }
  .fee-total dt{ color:var(--ink); font-weight:600; }
  .fee-total dd{ font-size:15px; color:var(--indigo); }
  .fee-foot{ font-size:11.5px; color:var(--ink-faint); line-height:1.6; margin-top:12px; border-top:1px solid var(--border); padding-top:10px; }
  .fee-trial{ color:var(--palm); font-weight:600; }

  /* ---------- Handoff ---------- */
  .check-item{ display:flex; align-items:flex-start; gap:12px; padding:14px 16px; width:100%; text-align:start; border-bottom:1px solid var(--border); }
  .check-item:last-child{ border-bottom:none; }
  .check-item:hover{ background:var(--mist); }
  .check-item:disabled{ cursor:default; }
  .check-item:disabled:hover{ background:transparent; }
  .check-box{
    margin-top:1px; width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; transition:.12s;
  }
  .check-box svg{ width:13px; height:13px; color:#fff; opacity:0; }
  .check-item.done .check-box{ background:var(--palm); border-color:var(--palm); }
  .check-item.done .check-box svg{ opacity:1; }
  .check-text{ font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
  .check-item.done .check-text{ color:var(--ink); }

  /* ---------- Applicant ---------- */
  .applicant-top{ display:flex; gap:11px; align-items:flex-start; margin-bottom:10px; }
  .avatar{
    width:40px; height:40px; border-radius:12px; background:var(--indigo-tint); color:var(--indigo-dark);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-ar);
    font-weight:700; font-size:14px; flex:none;
  }
  .avatar.amber{ background:var(--amber-tint); color:#8A5610; }
  .no-record{ font-size:12.5px; color:var(--ink-faint); font-style:normal; }

  /* ---------- Not built ---------- */
  .not-built{ text-align:center; padding:44px 20px; max-width:460px; margin:0 auto; }
  .not-built-icon{
    width:48px; height:48px; border-radius:16px; background:var(--indigo-tint);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .not-built-icon svg{ width:20px; height:20px; color:var(--indigo); }
  .not-built h3{ font-family:var(--font-display); font-size:16px; }
  html[dir="rtl"] .not-built h3{ font-family:var(--font-ar); }
  .not-built p{ font-size:13px; line-height:1.65; color:var(--ink-soft); margin-top:8px; }
  .not-built .phase{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-top:14px;
  }

  /* ---------- Auth ---------- */
  #auth-stage{ width:100%; max-width:520px; }
  .auth-card{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:30px 30px 32px; box-shadow:0 20px 50px -24px rgba(25,23,53,.28);

  .auth-sub{ font-size:13px; color:var(--ink-faint); margin-bottom:20px; line-height:1.6; }
  .auth-foot{ font-size:13px; color:var(--ink-soft); text-align:center; margin-top:16px; }
  .auth-back{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-bottom:16px; }
  .auth-back svg{ width:14px; height:14px; transform:scaleX(-1); }
  html[dir="rtl"] .auth-back svg{ transform:none; }

  .role-option{
    display:flex; align-items:center; gap:13px; width:100%; text-align:start;
    border:1.6px solid var(--border); border-radius:14px; padding:15px 16px;

  }
  .role-option:hover{ border-color:var(--indigo); background:rgba(231,230,244,.4); }

  .role-title{ font-size:14px; font-weight:600; }
  .role-sub{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; line-height:1.5; }

  .timeline{ margin:22px 0; }
  .timeline-step{ display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
  .timeline-dot{ width:10px; height:10px; border-radius:50%; background:var(--border); flex:none; margin-top:5px; }
  .timeline-step.done .timeline-dot{ background:var(--palm); }
  .timeline-step.current .timeline-dot{ background:var(--amber); }
  .timeline-title{ font-size:13.5px; font-weight:600; }
  .timeline-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:500; text-align:center;
    padding:12px 20px; border-radius:12px; opacity:0; pointer-events:none; z-index:90;
    transition:opacity .18s, transform .18s; max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ==========================================================================
     NEW COMPONENTS — the screens that used to say "not built"
     ========================================================================== */

  /* ---------- Auth: a full-window page, not a card on a backdrop ---------- */
  #auth{ height:100%; display:flex; overflow:hidden; }
  .auth-aside{
    width:44%; max-width:520px; flex:none; position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(150deg,var(--indigo) 0%,var(--indigo-dark) 100%);
    padding:44px 46px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .auth-aside .header-pattern{ opacity:.5; }
  .auth-aside > *:not(.header-pattern){ position:relative; }
  .auth-wordmark{ font-family:var(--font-display); font-weight:700; font-size:32px; letter-spacing:-.02em; }
  .auth-wordmark-ar{ font-family:var(--font-ar); font-size:17px; color:rgba(255,255,255,.72); margin-top:4px; }
  .auth-pitch{ font-size:19px; line-height:1.6; font-weight:500; max-width:19em; }
  html[dir="rtl"] .auth-pitch{ font-family:var(--font-ar); font-size:17.5px; }
  .auth-points{ margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  .auth-point{ display:flex; gap:11px; align-items:flex-start; font-size:13.5px; line-height:1.6; color:rgba(255,255,255,.82); }
  .auth-point svg{ width:17px; height:17px; flex:none; margin-top:2px; color:rgba(255,255,255,.66); }
  .auth-legal{ font-size:11.5px; line-height:1.7; color:rgba(255,255,255,.55); }

  .auth-panel{ flex:1; min-width:0; overflow-y:auto; display:flex; flex-direction:column; background:var(--card); }
  .auth-panel-top{ display:flex; justify-content:flex-end; padding:16px 20px 0; }
  .auth-inner{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px 24px 44px; }
  .auth-form{ width:100%; max-width:392px; }
  .auth-mobile-brand{ display:none; text-align:center; margin-bottom:26px; }
  .auth-mobile-brand .auth-wordmark{ color:var(--indigo); font-size:28px; }
  .auth-mobile-brand .auth-wordmark-ar{ color:var(--ink-faint); }
  @media (max-width:880px){
    .auth-aside{ display:none; }
    .auth-mobile-brand{ display:block; }
  }
  .lang-btn-quiet{
    height:34px; padding:0 13px; border-radius:10px; border:1px solid var(--border);
    color:var(--ink-soft); font-family:var(--font-display); font-weight:600; font-size:12.5px;
  }
  .lang-btn-quiet:hover{ background:var(--mist); }

  .auth-heading{ font-family:var(--font-display); font-weight:700; font-size:22px; margin-bottom:6px; }
  html[dir="rtl"] .auth-heading{ font-family:var(--font-ar); }
  .auth-sub{ font-size:13.5px; color:var(--ink-faint); margin-bottom:22px; line-height:1.65; }
  .auth-foot{ font-size:13px; color:var(--ink-soft); text-align:center; margin-top:18px; }
  .auth-back{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-bottom:18px; }
  .auth-back svg{ width:14px; height:14px; transform:scaleX(-1); }
  html[dir="rtl"] .auth-back svg{ transform:none; }
  .auth-error{
    background:var(--amber-tint); border:1px solid #E3CE9E; color:#8A5610;
    font-size:12.5px; line-height:1.6; border-radius:11px; padding:11px 13px; margin-bottom:16px;
  }

  /* The demo's account list. It is the honest way to offer four roles without
     a role switcher floating over the app: these are the seeded accounts, and
     signing in as one is how you become that person. */
  .accounts{ margin-top:26px; border-top:1px solid var(--border); padding-top:18px; }
  .accounts-label{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:10px;
  }
  .account-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:start;
    border:1px solid var(--border); border-radius:11px; padding:9px 11px; background:var(--card);
    margin-bottom:7px; transition:.12s;
  }
  .account-btn:hover{ border-color:var(--indigo); background:var(--indigo-tint); }
  .account-btn .avatar{ width:30px; height:30px; border-radius:9px; font-size:11px; }
  html[dir="ltr"] .avatar{ font-family:var(--font-display); }
  .account-name{ display:block; font-size:12.5px; font-weight:600; }
  .account-mail{ display:block; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:1px; }
  .account-tag{ margin-inline-start:auto; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:100px; flex:none; }

  .role-option{
    display:flex; align-items:center; gap:13px; width:100%; text-align:start;
    border:1.6px solid var(--border); border-radius:14px; padding:15px 16px;
    background:var(--card); transition:.12s; margin-bottom:10px;
  }
  .role-option:hover{ border-color:var(--indigo); background:rgba(231,230,244,.4); }
  .role-icon{ width:40px; height:40px; border-radius:12px; background:var(--indigo-tint); display:flex; align-items:center; justify-content:center; flex:none; }
  .role-icon svg{ width:19px; height:19px; color:var(--indigo-dark); }
  .role-title{ font-size:14px; font-weight:600; }
  .role-sub{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; line-height:1.5; }

  .timeline{ margin:22px 0; }
  .timeline-step{ display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
  .timeline-dot{ width:10px; height:10px; border-radius:50%; background:var(--border); flex:none; margin-top:5px; }
  .timeline-step.done .timeline-dot{ background:var(--palm); }
  .timeline-step.current .timeline-dot{ background:var(--amber); }
  .timeline-title{ font-size:13.5px; font-weight:600; }
  .timeline-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; }

  /* ---------- Earnings ---------- */
  .balance-card{
    background:linear-gradient(135deg,var(--indigo) 0%,var(--indigo-dark) 100%); color:#fff;
    border-radius:18px; padding:20px 22px; position:relative; overflow:hidden;
  }
  .balance-card > *:not(.header-pattern){ position:relative; }
  .balance-card .header-pattern{ opacity:.22; }
  .balance-label{ font-size:12px; color:rgba(255,255,255,.7); }
  .balance-amount{ font-family:var(--font-mono); font-size:30px; font-weight:600; margin-top:4px; letter-spacing:-.02em; }
  .balance-sub{ font-size:12px; color:rgba(255,255,255,.66); margin-top:6px; line-height:1.6; }
  .balance-actions{ display:flex; gap:8px; margin-top:16px; }
  .btn-on-dark{
    flex:1; background:rgba(255,255,255,.16); color:#fff; font-family:var(--font-display); font-weight:600;
    font-size:13.5px; padding:11px; border-radius:11px; transition:background .12s;
  }
  html[dir="rtl"] .btn-on-dark{ font-family:var(--font-ar); }
  .btn-on-dark:hover{ background:rgba(255,255,255,.26); }
  .btn-on-dark.solid{ background:#fff; color:var(--indigo); }
  .btn-on-dark.solid:hover{ background:rgba(255,255,255,.88); }
  .btn-on-dark:disabled{ opacity:.45; cursor:not-allowed; }

  .txn{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); width:100%; text-align:start; }
  .txn:last-child{ border-bottom:none; }
  .txn:hover{ background:var(--mist); }
  .txn-icon{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }
  .txn-icon svg{ width:16px; height:16px; }
  .txn-in{ background:var(--palm-tint); color:var(--palm); }
  .txn-out{ background:var(--indigo-tint); color:var(--indigo); }
  .txn-body{ flex:1; min-width:0; }
  .txn-title{ display:block; font-size:13.5px; font-weight:500; }
  .txn-sub{ display:block; font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .txn-amount{ font-family:var(--font-mono); font-size:13.5px; font-weight:600; flex:none; text-align:end; }
  .txn-amount.in{ color:var(--palm); }

  /* ---------- Logbook ---------- */
  .week-strip{ display:grid; grid-template-columns:repeat(12,1fr); gap:4px; margin:4px 0 2px; }
  .week-pip{ height:26px; border-radius:6px; background:var(--border); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:10px; font-weight:600; color:var(--ink-faint); }
  .week-pip.approved{ background:var(--palm); color:#fff; }
  .week-pip.submitted{ background:var(--amber); color:#fff; }
  .week-pip.draft{ background:var(--amber-tint); color:#8A5610; }
  .week-pip.current{ outline:2px solid var(--indigo); outline-offset:1px; }
  .month-track{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:9px; }
  .month-card{ border:1px solid var(--border); border-radius:13px; padding:11px 12px; background:var(--card); text-align:start; }
  .month-card .m-label{ font-size:11.5px; color:var(--ink-faint); }
  .month-card .m-status{ font-size:12.5px; font-weight:600; margin-top:3px; }

  .day-row{ display:flex; gap:6px; }
  .day-btn{
    flex:1; border:1.4px solid var(--border); border-radius:10px; padding:9px 2px; text-align:center;
    background:var(--card); transition:.12s;
  }
  .day-btn span{ display:block; font-size:11px; color:var(--ink-faint); }
  .day-btn strong{ display:block; font-family:var(--font-mono); font-size:13px; font-weight:600; margin-top:2px; }
  .day-btn.on{ background:var(--palm-tint); border-color:var(--palm); }
  .day-btn.on span, .day-btn.on strong{ color:var(--palm); }
  .day-btn:disabled{ opacity:.55; cursor:not-allowed; }
  .char-count{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .char-count.short{ color:var(--amber); }
  .char-count.ok{ color:var(--palm); }

  /* ---------- CV ---------- */
  .cv-sheet{
    background:#fff; border:1px solid var(--border); border-radius:14px; padding:26px 28px;
    font-size:12.5px; line-height:1.65; color:var(--ink-soft);
  }
  .cv-name{ font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--ink); }
  html[dir="rtl"] .cv-sheet[dir="rtl"] .cv-name{ font-family:var(--font-ar); }
  .cv-sheet[dir="rtl"] .cv-name{ font-family:var(--font-ar); }
  .cv-contact{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }
  .cv-rule{ height:2px; background:var(--indigo); margin:14px 0 16px; border-radius:2px; }
  .cv-sec{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--indigo); margin:16px 0 7px; }
  .cv-sheet[dir="rtl"] .cv-sec{ font-family:var(--font-ar); letter-spacing:0; }
  .cv-entry{ margin-bottom:10px; }
  .cv-entry-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .cv-role{ font-size:13px; font-weight:600; color:var(--ink); }
  .cv-when{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); flex:none; }
  .cv-verified{ background:var(--palm-tint); border-radius:10px; padding:11px 13px; margin-top:6px; }
  .cv-verified .ico{ width:13px; height:13px; }
  .cv-verified-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px 16px; margin-top:6px; }
  .cv-vline{ display:flex; justify-content:space-between; font-size:12px; }
  .cv-vline strong{ font-family:var(--font-mono); color:var(--ink); }
  .pill-tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .pill-tag{
    font-size:11.5px; padding:4px 10px; border-radius:100px; background:var(--indigo-tint);
    color:var(--indigo-dark); display:inline-flex; align-items:center; gap:5px;
  }
  .pill-tag button{ font-size:13px; line-height:1; color:var(--indigo); opacity:.6; }
  .pill-tag button:hover{ opacity:1; }
  .pill-pick{
    font-size:11.5px; padding:5px 11px; border-radius:100px; border:1px dashed var(--border);
    color:var(--ink-soft); background:var(--card);
  }
  .pill-pick:hover{ border-color:var(--indigo); color:var(--indigo); border-style:solid; }
  .pill-pick.on{ background:var(--indigo); border-color:var(--indigo); color:#fff; border-style:solid; }

  /* ---------- Notifications ---------- */
  .notif{ display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); width:100%; text-align:start; }
  .notif:last-child{ border-bottom:none; }
  .notif:hover{ background:var(--mist); }
  .notif-dot{ width:8px; height:8px; border-radius:50%; background:var(--indigo); flex:none; margin-top:6px; }
  .notif-dot.read{ background:transparent; }
  .notif-title{ display:block; font-size:13.5px; font-weight:500; line-height:1.5; }
  .notif-time{ display:block; font-size:11.5px; color:var(--ink-faint); margin-top:3px; }

  /* ---------- Modal ---------- */
  .modal-back{
    position:fixed; inset:0; background:rgba(20,18,40,.44); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    background:var(--card); border-radius:20px; width:100%; max-width:440px;
    max-height:86vh; overflow-y:auto; padding:24px 24px 22px;
    box-shadow:0 30px 70px -22px rgba(25,23,53,.4);
  }
  .modal-title{ font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:6px; }
  html[dir="rtl"] .modal-title{ font-family:var(--font-ar); }
  .modal-sub{ font-size:13px; color:var(--ink-faint); line-height:1.6; margin-bottom:18px; }
  .modal-actions{ display:flex; gap:9px; margin-top:18px; }
  .modal-actions > *{ flex:1; }

  /* ---------- The drug reference ----------
     Severity is the one place this app uses colour to mean good or bad, so it
     is a reserved scale: three fixed steps, each shipped with an icon and a
     word beside it. Somebody reading this at a counter may be colour-blind,
     and the screen may be a cheap phone in daylight. */
  .searchbox{
    display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--border);
    border-radius:13px; padding:0 13px; height:44px;
  }
  .searchbox:focus-within{ border-color:var(--indigo); box-shadow:0 0 0 3px var(--indigo-tint); }
  .searchbox .ico{ width:16px; height:16px; color:var(--ink-faint); flex:none; }
  .searchbox input{
    flex:1; min-width:0; border:none; outline:none; background:none; font-size:14px; height:100%;
  }
  .searchbox input::-webkit-search-cancel-button{ display:none; }
  .searchbox-x{ font-size:19px; line-height:1; color:var(--ink-faint); padding:0 2px; flex:none; }
  .searchbox-x:hover{ color:var(--ink); }

  .drug-row{ width:100%; text-align:start; }
  .drug-tags{ display:flex; align-items:center; gap:7px; flex:none; margin-inline-start:auto; }
  @media (max-width:420px){ .drug-tags .pill-tag{ display:none; } }

  .sev{
    display:inline-flex; align-items:center; gap:4px; flex:none;
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap;
  }
  .sev .ico{ width:11px; height:11px; }
  .sev-warning{ background:#FBF0D8; color:#845310; }
  .sev-serious{ background:#FBE6DC; color:#9A4A26; }
  .sev-critical{ background:#FBE3E3; color:#9E2B2B; }

  /* The counselling line leads the record, so it is the one card with a tint:
     everything else on the screen is reference, this is the thing to say. */
  .drug-note{ background:var(--indigo-tint); }
  .drug-note-k{
    font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--indigo); margin-bottom:5px;
  }
  html[dir="rtl"] .drug-note-k{ text-transform:none; letter-spacing:0; }
  .drug-note-v{ font-size:14px; line-height:1.7; color:var(--indigo-dark); }

  .drug-inter{ align-items:flex-start; }
  .drug-inter-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .drug-inter-w{ font-size:13.5px; font-weight:500; }
  .link-inline{
    font-size:13.5px; font-weight:500; color:var(--indigo); text-decoration:underline;
    text-underline-offset:2px;
  }
  .link-inline:hover{ color:var(--indigo-dark); }
  .bullets{ margin:0; padding-inline-start:18px; }
  .bullets li{ font-size:13.5px; line-height:1.8; }

  /* ---------- The dispensing check ---------- */
  .segbar{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:4px;
  }
  .seg{
    flex:1; height:36px; border-radius:9px; font-size:13px; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .seg.on{ background:var(--indigo); color:#fff; }
  .seg-n{
    font-family:var(--font-mono); font-size:11px; padding:1px 6px; border-radius:100px;
    background:rgba(255,255,255,.25);
  }
  .seg:not(.on) .seg-n{ background:var(--indigo-tint); color:var(--indigo); }

  .add-mark{
    width:26px; height:26px; border-radius:9px; background:var(--indigo-tint); color:var(--indigo);
    display:inline-flex; align-items:center; justify-content:center; flex:none; margin-inline-start:auto;
  }
  .add-mark .ico{ width:14px; height:14px; }
  .drug-row:disabled{ opacity:.55; cursor:default; }
  .rec-actions{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

  .basket{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .basket-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border);
    border-radius:100px; padding:5px 6px 5px 13px; font-size:12.5px; font-weight:500;
  }
  html[dir="rtl"] .basket-chip{ padding:5px 13px 5px 6px; }
  .basket-chip button{
    width:19px; height:19px; border-radius:50%; background:var(--mist); color:var(--ink-faint);
    font-size:14px; line-height:1; display:inline-flex; align-items:center; justify-content:center; flex:none;
  }
  .basket-chip button:hover{ background:#F6DADA; color:#9E2B2B; }
  .basket-clear{ margin-inline-start:auto; }

  /* The verdict. "Nothing found" is deliberately NOT green-ticked as safe: the
     system knows no pair in its table matched, which is a different statement
     from "this is safe", and the gap between them is where a missed interaction
     stops being a known limit and becomes a broken promise. */
  .verdict{
    display:flex; gap:11px; align-items:flex-start; padding:14px 16px; border-radius:14px;
    border:1px solid transparent;
  }
  .verdict .ico{ width:18px; height:18px; flex:none; margin-top:1px; }
  .verdict strong{ display:block; font-size:14px; font-weight:600; }
  .verdict-sub{ display:block; font-size:12px; line-height:1.65; margin-top:3px; opacity:.85; }
  .verdict-clear{ background:var(--mist); border-color:var(--border); color:var(--ink-soft); }
  .verdict-warning{ background:#FBF0D8; border-color:#EFD9A8; color:#845310; }
  .verdict-serious{ background:#FBE6DC; border-color:#F0CBB8; color:#9A4A26; }
  .verdict-critical{ background:#FBE3E3; border-color:#EFC3C3; color:#9E2B2B; }

  .ask-list{ margin:0; padding:0; list-style:none; }
  .ask-list li{ padding:8px 0; border-bottom:1px solid var(--border); }
  .ask-list li:last-child{ border-bottom:none; }
  .ask-list li:first-child{ padding-top:0; }
  .ask-q{ display:block; font-size:13.5px; font-weight:500; line-height:1.55; }
  .ask-for{ display:block; font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  .coverage{ display:flex; gap:11px; align-items:flex-start; background:var(--mist); }
  .coverage .ico{ width:16px; height:16px; flex:none; margin-top:2px; color:var(--ink-faint); }
  .coverage-t{ font-size:13px; font-weight:600; }
  .coverage-b{ font-size:12px; color:var(--ink-soft); line-height:1.65; margin-top:3px; }
  .register-note{ display:flex; gap:6px; align-items:flex-start; }
  .register-note .ico{ width:13px; height:13px; flex:none; margin-top:2px; }

  .tally{ display:flex; flex-direction:column; gap:7px; }
  .tally-row{ display:flex; justify-content:space-between; gap:12px; font-size:13px; }

  .cn-row{ display:flex; align-items:center; gap:10px; padding:5px 0; }
  .cn-name{ flex:0 0 38%; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cn-track{ display:block; flex:1; height:14px; background:var(--mist); border-radius:100px; overflow:hidden; }
  .cn-bar{ display:block; height:14px; background:var(--series, #574FA3); border-radius:100px; }
  .cn-n{ flex:none; font-size:12px; min-width:34px; text-align:end; }

  /* The check, from the home screen. Deliberately the widest thing on the
     board above it: the listings are something you browse, this is something
     you reach for. */
  .check-card{
    display:flex; align-items:center; gap:13px; width:100%; text-align:start;
    background:var(--indigo); color:#fff; border-radius:16px; padding:15px 17px;
    box-shadow:0 10px 24px -14px rgba(25,23,53,.6);
  }
  .check-card:hover{ background:var(--indigo-dark); }
  .check-card-ico{
    width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.16);
    display:inline-flex; align-items:center; justify-content:center; flex:none;
  }
  .check-card-ico .ico{ width:19px; height:19px; }
  .check-card-body{ flex:1; min-width:0; }
  .check-card-t{ display:block; font-size:14.5px; font-weight:600; }
  html[dir="rtl"] .check-card-t{ font-family:var(--font-ar); }
  .check-card-s{ display:block; font-size:12px; opacity:.78; line-height:1.55; margin-top:2px; }
  .check-card-n{
    flex:none; min-width:28px; height:28px; padding:0 9px; border-radius:100px;
    background:#fff; color:var(--indigo); font-size:13px; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .check-card .more-chevron{ color:rgba(255,255,255,.7); }
  .empty-check .btn-ghost{ margin-top:10px; }
  .browse-lead{ margin-bottom:16px; }

  /* The plan card and its allowance. The pips are the upgrade prompt as much as
     the entitlement — "5 of 5 used" sells Premium better than any copy does. */
  /* W13 — the home screens prompt rather than report. */
  .urgent-row{ display:flex; align-items:center; gap:12px; margin-top:10px; }
  .urgent-row .ico{ width:18px; height:18px; color:var(--amber); flex:none; }
  .urgent-t{ font-size:13.5px; font-weight:600; }
  .urgent-s{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .urgent-row .btn-ghost{ margin-inline-start:auto; flex:none; }
  .repeat-row{ display:flex; gap:8px; flex-wrap:wrap; }

  /* W7 — the branch board. One row per branch, and the row has to answer
     "which branch is short" without being read left to right. */
  .branch-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:start;
    padding:13px 15px; background:none; border:none; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .branch-row:last-child{ border-bottom:none; }
  .branch-row:hover{ background:var(--mist); }
  .branch-body{ flex:1; min-width:0; }
  .branch-name{ display:block; font-size:14px; font-weight:600; }
  html[dir="rtl"] .branch-name{ font-family:var(--font-ar); }
  .branch-sub{ display:block; font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .branch-marks{ display:flex; align-items:center; gap:6px; flex:none; }
  .branch-scope{
    display:flex; align-items:center; gap:10px; padding:11px 14px; margin-bottom:12px;
    background:var(--mist); border-radius:12px;
  }
  .branch-scope .ico{ width:17px; height:17px; color:var(--ink-faint); flex:none; }
  .branch-scope-name{ flex:1; min-width:0; font-size:13.5px; font-weight:600; }
  .repeat-chip{
    display:inline-flex; align-items:center; gap:7px; background:var(--card);
    border:1px solid var(--border); border-radius:12px; padding:10px 13px; font-size:13px;
  }
  .repeat-chip:hover{ border-color:var(--indigo); }
  .repeat-chip .ico{ width:14px; height:14px; color:var(--indigo); }
  .repeat-meta{ font-size:11.5px; color:var(--ink-faint); }
  .next-shift{ display:block; width:100%; text-align:start; margin-top:10px; }
  .next-shift-head{ display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .next-shift-head .pharmacy-name{ flex:1; }

  /* A paid placement, labelled as one. Deliberately quieter than the product
     around it: it sits on a shift board, not inside a clinical screen. */
  .banner-slot{
    display:block; background:var(--card); border:1px dashed var(--border);
    border-radius:14px; padding:13px 15px;
  }
  .banner-tag{
    display:inline-block; font-size:10px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-faint); background:var(--mist);
    padding:2px 8px; border-radius:100px; margin-bottom:7px;
  }
  html[dir="rtl"] .banner-tag{ text-transform:none; letter-spacing:0; }
  .banner-t{ display:block; font-size:14px; font-weight:600; }
  .banner-s{ display:block; font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .job-row{ align-items:flex-start; }
  .job-body{ display:block; font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-top:6px; }
  .state{
    flex:none; font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap;
  }
  .state-draft{ background:var(--mist); color:var(--ink-faint); }
  .state-in_review{ background:var(--amber-tint); color:#845310; }
  .state-live{ background:var(--palm-tint); color:#3D6136; }
  .state-ended{ background:var(--mist); color:var(--ink-faint); }
  .state-refused{ background:#FBE3E3; color:#9E2B2B; }

  .shift-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .shift-actions .btn-secondary{ flex:1; min-width:132px; justify-content:center; }
  .plan-card{ padding:15px 17px; }
  .plan-top{ display:flex; align-items:baseline; gap:10px; }
  .plan-name{ font-size:15px; font-weight:600; }
  html[dir="rtl"] .plan-name{ font-family:var(--font-ar); }
  .plan-fee{ margin-inline-start:auto; font-size:13px; color:var(--ink-faint); }
  .allowance{ margin-top:13px; }
  .allowance-head{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); }
  .allowance-track{ display:flex; gap:4px; margin-top:7px; }
  .allowance-pip{ display:block; flex:1; height:7px; border-radius:100px; background:var(--border); }
  .allowance-pip.spent{ background:var(--indigo); }

  /* ---------- Misc ---------- */
  .progress{ height:7px; border-radius:100px; background:var(--border); overflow:hidden; }
  .progress i{ display:block; height:100%; background:var(--palm); border-radius:100px; }
  .inline-note{ font-size:11.5px; color:var(--ink-faint); line-height:1.7; }
  .print-only{ display:none; }
  @media print{
    .sidebar,.topbar,.bottom-nav,.app-header,.no-print{ display:none !important; }
    body,.app-body{ overflow:visible !important; background:#fff !important; }
    .screen-body{ padding:0 !important; }
  }
</style>

<script>
"use strict";
/* ==========================================================================
   1. THE FEE ENGINE
   A port of src/config/fees.ts. Kept identical on purpose: the whole point of
   showing a pharmacy a fee breakdown is that the number is the real number.
   ========================================================================== */

const FEES = {
  TOTAL_COMMISSION_RATE: 0.10,
  PHARMACY_SHARE: 0.70,      // 7% of shift value, added ON TOP
  PHARMACIST_SHARE: 0.30,    // 3% of shift value, deducted FROM payout
  MINIMUM_COMMISSION_IQD: 2500,
  TRIAL_DAYS: 30,
  PROCESSOR_FEE_RATE: 0.02
};

/* ==========================================================================
   LISTINGS AND BANNERS (W15)

   Two things a Partner buys: a job listing that pharmacists browse, and a
   banner placement on a permitted surface.

   THE STATE MACHINE IS THE POINT. A partner fills a short form carrying only
   what a listing cannot exist without; that raises a DRAFT. An operator phones
   to collect the rest, and only then does it go LIVE. The human check sits
   exactly where P1 needs it — between submission and publication — while the
   partner does the data entry.

     draft → in_review → live → ended        (or refused, at any point before live)

   WHERE A BANNER MAY APPEAR, and this is a commitment rather than a default:
   the shift board, the jobs view, and the home screen below the fold. NEVER
   inside the Dispensing Helper or the drug reference. A placement beside an
   interaction warning is the exact thing P1 exists to prevent, and it is also
   the highest-paying slot anyone will ever offer. */

/* ==========================================================================
   W6d — DISCLOSURE IS A FIELD, NOT A SENTENCE

   Anything on the platform that somebody paid for carries a `sponsor`: the id
   of the Externals record behind it. Two things follow from the field alone,
   and neither depends on an author remembering to do the right thing:

     1. Its disclosure is DERIVED. Nobody types "sponsored by" and nobody can
        forget to; remove the sentence and the label is still there, because it
        is built from the field.
     2. A clinical surface REFUSES it. `clinicalOnly()` drops anything carrying
        a sponsor, so the way to put sponsored content in front of a dispensing
        decision is to defeat a filter rather than to forget a rule.

   Cheap now, and a migration once there is real content — which is why it is
   here before there is anything but banners to put it on.
   ========================================================================== */
const sponsorOf = o => (o && o.sponsor) || null;

/* The disclosure line for anything sponsored, built from the field. */
function disclosure(o) {
  const c = sponsorOf(o);
  return c ? '<span class="banner-tag">' + esc(t('ad.paidBy', { company:L(companyName(c)) })) + '</span>' : '';
}

/* P1's hard edge, as a function a clinical screen calls on its own list. It is
   a filter rather than an assertion because the right behaviour when sponsored
   content reaches a clinical surface is for the surface to render without it,
   not to break. */
const clinicalOnly = list => list.filter(x => !sponsorOf(x));

/* The banner for a surface, or nothing. Called only from the three permitted
   surfaces — the Helper and the reference never call it, which is why the rule
   is enforced by where the function is invoked rather than by a flag somebody
   could flip. */
function bannerFor(surface) {
  if (BANNER_SURFACES.indexOf(surface) < 0) return '';
  const b = LISTINGS.find(x => x.kind === 'banner' && x.state === 'live' && x.surface === surface);
  if (!b) return '';
  countImpression(b.id);
  return '<div class="banner-slot">' +
    /* W6d — derived from `sponsor`, not typed. */
    (disclosure(b) || '<span class="banner-tag">' + esc(t('ad.paid')) + '</span>') +
    '<span class="banner-t">' + esc(L(b.title)) + '</span>' +
    '<span class="banner-s">' + esc(L(b.body)) + '</span>' +
  '</div>';
}

/* Impressions are counted WITHOUT identity: a counter keyed on (placement,
   day) and nothing more. The partner's report can say "shown 1,240 times on
   14 September"; no query can reconstruct who saw it, because the rows to
   reconstruct it from were never written. Same shape as the dispensing
   tallies, for the same reason. */
function countImpression(id) {
  const key = id + '|' + TODAY_ISO;
  S.impressions[key] = (S.impressions[key] || 0) + 1;
}

/* ==========================================================================
   PLANS (W14) — ported from src/config/fees.ts, same as calculateFees()

   A plan replaces the PHARMACY's 7%, never the pharmacist's 3%. Each carries a
   shift allowance; beyond it, ordinary commission. Without the allowance,
   unlimited posting on the cheaper plan is a hole a chain would find in a week.
   ========================================================================== */
const PLANS = {
  commission: { id:'commission', monthlyFeeIQD:0,      includedShifts:0  },
  basic:      { id:'basic',      monthlyFeeIQD:9000,   includedShifts:5  },
  premium:    { id:'premium',    monthlyFeeIQD:19000,  includedShifts:12 }
};

/* W7 — what a pharmacy or a CHAIN is charged monthly, and what it buys.
   Priced per branch, because the cost driver is branches; the allowance is
   POOLED across them, because branches are uneven and an allowance stranded at
   a quiet branch is a bill argued about monthly. Costs us nothing — the total
   is identical either way. Ported from src/config/fees.ts; the unit tests there
   are the authority. */
const billableBranches = n => (isFinite(n) && n > 1) ? Math.floor(n) : 1;
function subscriptionCharge(plan = 'commission', branches = 1) {
  const chosen = PLANS[plan] || PLANS.commission;
  const n = billableBranches(branches);
  return { plan:chosen.id, branches:n, perBranchIQD:chosen.monthlyFeeIQD,
           monthlyFeeIQD:chosen.monthlyFeeIQD * n,
           includedShifts:chosen.includedShifts * n };
}

/* The plan as it applies to whoever is signed in — one branch for an owner,
   the whole group for a manager. Every billing figure reads this rather than
   PLANS directly, so the chain case cannot drift from the independent one. */
function myPlan() {
  const g = myGroup();
  const c = subscriptionCharge(S.plan, g ? g.branches.length : 1);
  /* `plan` is what the TS interface calls the id; the string keys are written
     plan.basic / plan.premium, so it is aliased here rather than the port
     diverging from src/config/fees.ts. */
  c.id = c.plan;
  return c;
}

function calculateFees({ grossAmount, pharmacyInTrial, pharmacistInTrial,
                         plan = 'commission', shiftsFilledThisMonth = 0, branches = 1 }) {
  if (!isFinite(grossAmount) || grossAmount < 0) throw new Error('Invalid gross amount');

  const percentage = grossAmount * FEES.TOTAL_COMMISSION_RATE;
  const floorApplied = grossAmount > 0 && percentage < FEES.MINIMUM_COMMISSION_IQD;
  const chargeable = grossAmount === 0 ? 0 : Math.max(percentage, FEES.MINIMUM_COMMISSION_IQD);

  // Off the percentage, never off the floored commission: the pharmacist pays
  // exactly 3% of the shift value whether the floor bites or not.
  const fullPharmacistFee = Math.round(percentage * FEES.PHARMACIST_SHARE);
  // Derived by subtraction so the two sides always reconcile to the commission
  // exactly — rounding each independently can lose or invent a dinar. The
  // floor's whole excess lands here, on the pharmacy.
  const fullPharmacyFee = Math.round(chargeable) - fullPharmacistFee;

  /* A plan covers this shift only while its allowance lasts; beyond it the
     pharmacy pays ordinary commission. The trial wins over the allowance, and
     does NOT spend it — otherwise a pharmacy that subscribed on day one would
     reach its second month with the allowance quietly eaten. */
  const chosen = PLANS[plan] || PLANS.commission;
  const withinAllowance = !pharmacyInTrial
    && chosen.monthlyFeeIQD > 0
    && shiftsFilledThisMonth < chosen.includedShifts * billableBranches(branches);
  const coveredByPlan = withinAllowance ? chosen.id : null;

  const pharmacyFee = (pharmacyInTrial || withinAllowance) ? 0 : fullPharmacyFee;
  const pharmacistFee = pharmacistInTrial ? 0 : fullPharmacistFee;

  const platformGross = pharmacyFee + pharmacistFee;
  const pharmacistNet = grossAmount - pharmacistFee;
  const processorFee = Math.round(pharmacistNet * FEES.PROCESSOR_FEE_RATE);

  return {
    grossAmount, pharmacyFee, pharmacistFee,
    pharmacyCharge: grossAmount + pharmacyFee,
    pharmacistNet, platformGross, processorFee,
    platformNet: platformGross - processorFee,
    floorApplied: floorApplied && !(pharmacyInTrial && pharmacistInTrial),
    coveredByPlan
  };
}

/* A port of src/lib/time.ts. 22:00–06:00 is eight hours, not minus sixteen. */
function shiftHours(startTime, endTime) {
  const m = t => { const [h, mi] = t.split(':').map(Number); return h * 60 + mi; };
  let mins = m(endTime) - m(startTime);
  if (mins <= 0) mins += 24 * 60;
  return Math.round(mins / 60 * 100) / 100;
}

/* ==========================================================================
   THE DRUG REFERENCE
   A hundred molecules, written into this file from data/drugs.mjs by
   `npm run drugs`. The CRM build gets the same rows from the same command, so
   what an operator edits and what a pharmacist reads at a counter cannot drift.

   It is a reference, not a prescriber. The interactions listed are the ones
   worth stopping a sale for, not the complete set, and every screen that shows
   them says so — a reference that looks exhaustive and is not is worse than no
   reference at all.

  {"sci":"Ferrous sulfate","ar":"كبريتات الحديدوز","atc":"B03AA07","form":"tablet","doses":["200 mg","325 mg","60 mg/5 mL"],"notes":{"ar":"على معدة فارغة مع فيتامين C لأفضل امتصاص، ومع الطعام إذا لم يُحتمل. البراز الأسود متوقّع. بعيداً عن الشاي بساعتين.","en":"Empty stomach with vitamin C absorbs best; with food if that is not tolerated. Black stools are expected. Two hours away from tea."},"interactions":[{"with":"Levothyroxine","severity":"serious","note":{"ar":"يمنع امتصاص الليفوثيروكسين — باعد أربع ساعات.","en":"Blocks levothyroxine absorption — space by four hours."}},{"with":"Doxycycline","severity":"serious","note":{"ar":"يرتبط بالدوكسيسيكلين ويفقد الامتصاص.","en":"Chelates with doxycycline and loses absorption."}},{"with":"Ciprofloxacin","severity":"serious","note":{"ar":"يرتبط بالسيبروفلوكساسين ويفقد الامتصاص.","en":"Chelates with ciprofloxacin and loses absorption."}}],"contraindications":[{"ar":"داء ترسّب الأصبغة الدموية","en":"Haemochromatosis"},{"ar":"فقر دم غير ناجم عن عوز الحديد","en":"Anaemia not due to iron deficiency"}]},

/* PARTNER / شريك (W15) — a company account, not a clinician.

   It links to an Externals record and belongs to a manufacturer, scientific
   bureau, importer, storage house or distributor. It is NOT another clinical
   type: there is no Syndicate roster to verify it against, so it is verified by
   the operator team in the CRM and nobody self-serves into existence. Same
   shape a medical representative will need (W10), which is why it is one model
   rather than two. */
const isPartner = a => !!(a && a.type === 'partner');

const isOwner = a => !!(a && a.type === 'pharmacist' && a.pharmacy);

   GROUP. Neither "owner" nor "manager" is an account type, and nothing stores

   view follows. Manager is checked first: a group link is the wider job, and
   an account carrying both would be managing branches it also stands behind
   the counter of. */
const viewRole = a => isManager(a) ? 'manager'
  : (isOwner(a) ? 'owner' : (a ? a.type : 'pharmacist'));

/* The student's twelve weeks. Weeks 1-5 are done, 6 is in hand, the rest are
   locked — forward-fill, exactly as submit_log_week() enforces it in SQL. */
function seedWeeks() {
  const w = [];
  for (let i = 1; i <= 12; i++) {
    w.push({
      no: i,
      days: i <= 5 ? [true,true,true,true,i % 2 === 1] : [false,false,false,false,false],
      text: i <= 5
        ? { en:'Dispensed against prescriptions under supervision, including two paediatric antibiotic courses I had to check the weight-based dose for. Sat in on the Thursday narcotics count. Asked about the fridge log and was shown how the twice-daily temperature check is recorded.',
            ar:'صرفت وصفات تحت الإشراف، منها جرعتا مضاد حيوي لطفلين اضطررت لمراجعة الجرعة حسب الوزن. حضرت جرد المخدرات يوم الخميس. سألت عن سجل الثلاجة وشُرح لي كيف يُسجَّل قياس الحرارة مرتين يومياً.' }
        : { en:'', ar:'' },
      status: i <= 4 ? 'approved' : (i === 5 ? 'submitted' : (i === 6 ? 'draft' : 'locked'))
    });
  }
  return w;
}

/* ==========================================================================
   THE DRUG REFERENCE — a lookup, not a catalogue

   Everything on the counter side of the app is about finding and doing work.
   This is the one screen used DURING the work: somebody is standing at the
   counter holding a box, and the pharmacist has ten seconds.

   So: one search box that matches either script and the ATC code, form chips
   to narrow, and a record whose first line is the sentence you actually say
   out loud. The interactions are ranked worst-first, because the reason to
   open this at all is usually "can they take this with what they are on".
   ========================================================================== */

/* Arabic search has to survive how people actually type. A pharmacist keying a
   name in a hurry writes ا for أ, ي for ى and ه for ة, and skips the
   diacritics entirely — so both the query and the data are flattened the same
   way before they are compared. Ported from src/lib/arabic-script.ts. */
function drugNorm(x) {
  return String(x || '')
    .toLowerCase()
    .replace(/[ً-ْٰـ]/g, '')
    .replace(/[آأإٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim();
}

const SEVERITY_ORDER = { critical:3, serious:2, warning:1 };
const drugBySci = sci => DRUGS.find(d => d.sci === sci) || null;

/* The worst interaction a drug carries, or '' for one that carries none. The
   seed has to be a key the rank table knows: seeding with '' and comparing
   against undefined makes every comparison false and every drug look clean. */
function drugWorst(d) {
  return (d.interactions || []).reduce(
    (w, i) => ((SEVERITY_ORDER[i.severity] || 0) > (SEVERITY_ORDER[w] || 0) ? i.severity : w), '');
}

function drugName(d) { return lang === 'ar' ? d.ar : d.sci; }
function drugSub(d)  { return lang === 'ar' ? d.sci : d.ar; }

function sevChip(sev) {
  if (!sev) return '';
  return '<span class="sev sev-' + sev + '">' + icon('alert') + esc(t('dx.sev.' + sev)) + '</span>';
}

function drugMatches(d, q) {
  if (!q) return true;
  const hay = drugNorm([d.sci, d.ar, d.atc, ...(d.doses || [])].join(' '));
  return hay.includes(q);
}

/* ==========================================================================
   THE DISPENSING CHECK

   The reference answers "tell me about this drug". This answers the question a
   pharmacist actually has, which is "can they take these together" — and it
   answers it without being asked twice.

   Three findings, in the order they matter:
     1. interactions between any two drugs in the basket
     2. therapeutic duplication, from the curated rules rather than the codes
     3. the contraindications, turned into questions to ask the patient

   And one thing that is not a finding and is shown as loudly as if it were:
   how much of the basket could be checked at all.
   ========================================================================== */

/* THE BIDIRECTIONAL INDEX, and the reason it exists.

   Interactions in the reference are written from one side. Warfarin's record
   lists ibuprofen; ibuprofen's record happens to list warfarin too, but most
   pairs are written once — 109 of the 138 internal pairs, when this was built.
   So the obvious check, "does drug A's list contain drug B", finds the pair
   only if the pharmacist happens to add the two drugs in the order the data
   was written. Same two boxes, opposite order, silence.

   That failure is invisible: no error, no empty state, just a check that
   quietly passes. So the pairs are normalised ONCE into an undirected index
   keyed on the two names sorted, and every lookup reads from that.

   Where a pair is written from both sides and the two disagree on severity —
   bisoprolol and salbutamol do — the worse one wins. A checker that downgrades
   a warning depending on which box was scanned first is worse than none. */
const INTERACTION_INDEX = (() => {
  const ix = new Map();
  const key = (a, b) => [a, b].sort().join('\u0000');
  const known = new Set(DRUGS.map(d => d.sci));
  DRUGS.forEach(d => (d.interactions || []).forEach(i => {
    if (!known.has(i.with)) return;      // partners outside the reference are coverage, not pairs
    const k = key(d.sci, i.with);
    const prev = ix.get(k);
    if (!prev || (SEVERITY_ORDER[i.severity] || 0) > (SEVERITY_ORDER[prev.severity] || 0)) {
      ix.set(k, { a:d.sci, b:i.with, severity:i.severity, note:i.note });
    }
  }));
  return { size:ix.size, get:(a, b) => ix.get(key(a, b)) || null };
})();

/* Every unordered pair in the basket, worst first. */
function basketInteractions(scis) {
  const out = [];
  for (let i = 0; i < scis.length; i++) {
    for (let j = i + 1; j < scis.length; j++) {
      const hit = INTERACTION_INDEX.get(scis[i], scis[j]);
      if (hit) out.push({ a:scis[i], b:scis[j], severity:hit.severity, note:hit.note });
    }
  }
  return out.sort((x, y) => (SEVERITY_ORDER[y.severity] || 0) - (SEVERITY_ORDER[x.severity] || 0));
}

function basketDuplicates(scis) {
  const drugs = scis.map(drugBySci).filter(Boolean);
  return DUPLICATE_RULES
    .map(r => ({ rule:r, members:drugs.filter(d => r.codes.some(c => d.atc.startsWith(c))).map(d => d.sci) }))
    .filter(x => x.members.length > 1)
    .sort((x, y) => (SEVERITY_ORDER[y.rule.severity] || 0) - (SEVERITY_ORDER[x.rule.severity] || 0));
}

/* Contraindications become ONE list of questions rather than one list per drug.
   Three drugs contraindicated in pregnancy is one question, not three, and a
   pharmacist who has to read the same line three times stops reading. Matched
   on the exact text, which merges the identical ones and leaves near misses
   ("Pregnancy" / "Pregnancy and breastfeeding") separate — the safe way round,
   since merging two things that are not the same would drop a drug from the
   list of what the question is about. */
function basketQuestions(scis) {
  const byText = new Map();
  scis.map(drugBySci).filter(Boolean).forEach(d => {
    (d.contraindications || []).forEach(c => {
      if (!byText.has(c.en)) byText.set(c.en, { text:c, drugs:[] });
      byText.get(c.en).drugs.push(d.sci);
    });
  });
  // The ones touching several drugs first: those are the questions worth asking.
  return [...byText.values()].sort((a, b) => b.drugs.length - a.drugs.length);
}

/* What could NOT be checked. Partners named by a drug in the basket but absent
   from the reference are the honest limit of the tool — contrast media is named
   by metformin and will never be in any formulary — and the screen carries them
   with the same weight as a finding rather than in a footnote. */
function basketCoverage(scis) {
  const known = new Set(DRUGS.map(d => d.sci));
  const missing = [];
  scis.map(drugBySci).filter(Boolean).forEach(d =>
    (d.interactions || []).forEach(i => {
      if (!known.has(i.with) && missing.indexOf(i.with) < 0) missing.push(i.with);
    }));
  const n = scis.length;
  return { drugs:n, pairs:(n * (n - 1)) / 2, namedOutside:missing };
}

/* ---------- Who may record, and against which pharmacy ---------- */

function dispensePharmacy() {
  const acct = ACCOUNTS[S.email];
  if (!acct) return null;
  // An owner records against their own pharmacy; a relief pharmacist against
  // the pharmacy whose shift they are working. No shift, no pharmacy: the log
  // belongs to a business, and a pharmacist not standing in one has nowhere to
  // put it.
  if (acct.pharmacy) return { id:acct.pharmacy, name:t('acc.pharmacyRahma') };
  if (acct.type === 'pharmacist' && S.onShiftToday) return { id:'P2', name:L(DATA.listings[1].pharmacy) };
  return null;
}
/* A student on placement does not dispense, so a student does not record — but
   they get the check itself, which is the half that teaches. */
const canRecord = () => S.role !== 'student' && !!dispensePharmacy();

function addToBasket(sci) {
  if (S.basket.indexOf(sci) < 0) S.basket.push(sci);
  S.drugQuery = '';
  S.drugTab = 'check';
  render();
  /* Put the cursor back. Without this the field loses focus on every add, so
     building a four-drug basket costs three interactions per drug instead of
     two: tap the field, type, tap the result, tap the field again. On the most
     used screen in the app, with somebody waiting. */
  focusDrugSearch();
}
function focusDrugSearch() {
  const el = document.getElementById('drug-q');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/* Enter adds the top hit, so a prescription can be entered without the hands
   leaving the keyboard: type, Enter, type, Enter. */
function drugSearchKey(ev) {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  if (S.drugTab !== 'check') return;
  const q = drugNorm(S.drugQuery);
  if (!q) return;
  const hit = clinicalOnly(DRUGS).filter(d => drugMatches(d, q)).filter(d => S.basket.indexOf(d.sci) < 0)[0];
  if (hit) addToBasket(hit.sci);
}
function removeFromBasket(sci) { S.basket = S.basket.filter(x => x !== sci); render(); }
function clearBasket() { S.basket = []; render(); }
function setDrugTab(k) { S.drugTab = k; S.drugQuery = ''; render(); }

/* Recording keeps COUNTS, never the basket.

   This is the decision that makes a log defensible at all. Each drug increments
   its own tally for (pharmacy, pharmacist, day) and the basket is thrown away.
   No patient, no name, and no record that these particular drugs went out
   together — because a basket is a fingerprint. In a small district there may
   be one person on methotrexate, and "methotrexate + folic acid at 14:20"
   identifies them to anyone who knows the neighbourhood, with no name stored
   anywhere. A day's tally does not: a pharmacy dispenses enough in a day to
   dissolve the co-occurrence.

   Which is also why the day is the finest grain kept. An hour would put the
   basket back together. */
function recordDispense() {
  if (!canRecord()) return;
  const ph = dispensePharmacy();
  S.basket.forEach(sci => {
    const row = S.dispensing.find(r => r.pharmacy === ph.id && r.pharmacist === S.email &&
                                       r.date === TODAY_ISO && r.sci === sci);
    if (row) row.n++;
    else S.dispensing.push({ pharmacy:ph.id, pharmacist:S.email, date:TODAY_ISO, sci, n:1 });
  });
  const n = S.basket.length;
  S.basket = [];
  toast(t('dc.recorded', { n }));
  render();
}

/* The pharmacist's own shift window: what THEY recorded, at THIS pharmacy,
   today. Not the pharmacy's history — a locum who worked one Thursday has no
   business reading two years of somebody else's dispensing. */
function myShiftTallies() {
  const ph = dispensePharmacy();
  if (!ph) return [];
  return S.dispensing
    .filter(r => r.pharmacy === ph.id && r.pharmacist === S.email && r.date === TODAY_ISO)
    .sort((a, b) => b.n - a.n || a.sci.localeCompare(b.sci));
}

/* Reference and check are two tabs of one screen rather than two places. They
   are the same hundred rows doing two jobs, and a pharmacist who has just
   looked something up is one tap from putting it in a basket. */
function drugTabs() {
  const tab = (k, label) => '<button class="seg' + (S.drugTab === k ? ' on' : '') + '" onclick="setDrugTab(' +
    attr(k) + ')">' + esc(label) +
    (k === 'check' && S.basket.length ? '<span class="seg-n">' + fmt(S.basket.length) + '</span>' : '') +
    '</button>';
  return '<div class="segbar">' + tab('reference', t('dx.tabReference')) + tab('check', t('dc.tabCheck')) + '</div>';
}

function screenDrugs() {
  return '<div class="screen-body">' +
    '<div class="constrain stack">' + drugTabs() + '</div>' +
    (S.drugTab === 'check' ? screenCheck() : screenReference()) +
  '</div>';
}

function screenReference() {
  const q = drugNorm(S.drugQuery);
  /* Only the forms actually present, so the chip row never offers a filter
     that returns nothing. */
  const forms = DRUG_FORMS.filter(f => DRUGS.some(d => d.form === f));
  /* W6d — the reference is a clinical surface, so it renders only what nobody
     paid to put there. */
  const list = clinicalOnly(DRUGS)
    .filter(d => S.drugForm === 'all' || d.form === S.drugForm)
    .filter(d => drugMatches(d, q))
    .sort((a, b) => drugName(a).localeCompare(drugName(b), lang === 'ar' ? 'ar' : 'en'));

  const chips = ['all'].concat(forms).map(f =>
    '<button class="chip' + (S.drugForm === f ? ' active' : '') + '" onclick="setDrugForm(' + attr(f) + ')">' +
    esc(f === 'all' ? t('dx.allForms') : t('df.' + f)) + '</button>').join('');

  return '' +
    '<div class="constrain stack">' +
      '<div class="searchbox">' + icon('search') +
        '<input id="drug-q" type="search" autocomplete="off" value="' + esc(S.drugQuery) + '" ' +
          'placeholder="' + esc(t('dx.searchPlaceholder')) + '" oninput="setDrugQuery(this.value)">' +
        (S.drugQuery ? '<button class="searchbox-x" onclick="setDrugQuery(\'\')" aria-label="' +
          esc(t('common.clear')) + '">&times;</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="chip-row">' + chips + '</div>' +
    '<div class="constrain stack">' +
      '<p class="section-eyebrow">' +
        esc(list.length === 1 ? t('dx.count1') : t('dx.count', { n:list.length })) + '</p>' +
      (list.length
        ? '<div class="card">' + list.map(d =>
            '<button class="row drug-row" onclick="openDrug(' + attr(d.sci) + ')">' +
              '<span class="row-body">' +
                '<span class="row-title" style="display:block;" dir="' + (lang === 'ar' ? 'rtl' : 'ltr') + '">' +
                  esc(drugName(d)) + '</span>' +
                '<span class="row-sub" style="display:block;" dir="' + (lang === 'ar' ? 'ltr' : 'rtl') + '">' +
                  esc(drugSub(d)) + '</span>' +
              '</span>' +
              '<span class="drug-tags">' + sevChip(drugWorst(d)) +
                '<span class="pill-tag">' + esc(t('df.' + d.form)) + '</span></span>' +
              icon('chevron', 'more-chevron') +
            '</button>').join('') + '</div>'
        : '<div class="card card-pad" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
          esc(t('dx.noMatch')) + '</div>') +
      drugDisclaimer() +
    '</div>';
}

function setBrowseTab(k) { S.browseTab = k; render(); scrollTop(); }

/* ==========================================================================

   A partner sees their own listings and can submit a new one. They cannot

/* The form asks only for what a listing cannot exist without. Everything
   negotiable — wording, artwork, slot, price — is what the call is for, which
   keeps it short enough that a partner finishes it. */
function screenPartnerNew() {
  const f = S.partnerForm;
  const field = (k, label, placeholder) =>
